      - name: Select one CAD drawing space for preview and orientation (v118)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch-v118-space-selection.py" <<'PY'
          from pathlib import Path
          import re, sys
          manual_path, reference_path, index_path = map(Path, sys.argv[1:4])
          manual = manual_path.read_text(encoding='utf-8')
          reference = reference_path.read_text(encoding='utf-8')
          
          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'ERROR: expected one {label} anchor; found {n}')
              return text.replace(old, new, 1)
          
          helpers = r'''
          function entitySpace(rec){
           const pairs=rec&&Array.isArray(rec.pairs)?rec.pairs:[];
           const flag=pairs.find(p=>p.code===67);
           if(flag&&Number(flag.value)===1)return 'PAPER_SPACE';
           const layout=pairs.find(p=>p.code===410);
           if(layout){const name=String(layout.value||'').trim().toUpperCase();if(name&&name!=='MODEL'&&name!=='*MODEL_SPACE'&&name!=='MODEL_SPACE')return 'PAPER_SPACE';}
           return 'MODEL_SPACE';
          }
          function hasDrawingCoordinates(rec){
           const type=String(rec&&rec.type||'').toUpperCase();
           if(!type||['VIEWPORT','SEQEND','ENDBLK','BLOCK','ENDSEC','ENDTAB','VERTEX','DICTIONARY','XRECORD'].includes(type))return false;
           const pairs=rec.pairs||[];
           const isNumeric=code=>pairs.some(p=>p.code===code&&Number.isFinite(Number(p.value)));
           for(let x=10;x<=18;x++)if(isNumeric(x)&&isNumeric(x+10))return true;
           if(['HATCH','DIMENSION','INSERT','POINT','IMAGE','WIPEOUT'].includes(type))return isNumeric(10)&&isNumeric(20);
           return false;
          }
          function spaceWeight(rec){
           if(!hasDrawingCoordinates(rec))return 0;
           const type=String(rec.type||'').toUpperCase();
           if(['LWPOLYLINE','POLYLINE','SPLINE','HATCH','INSERT','MLINE','3DFACE','SOLID','TRACE'].includes(type))return 3;
           if(['LINE','CIRCLE','ARC','ELLIPSE','DIMENSION','IMAGE','WIPEOUT'].includes(type))return 2;
           if(['TEXT','MTEXT','ATTRIB','ATTDEF','POINT','LEADER','MLEADER'].includes(type))return 1;
           return 1;
          }
          function selectDrawingSpace(entities){
           const all=Array.isArray(entities)?entities:[];
           const model=all.filter(e=>entitySpace(e)==='MODEL_SPACE');
           const paper=all.filter(e=>entitySpace(e)==='PAPER_SPACE');
           const modelScore=model.reduce((n,e)=>n+spaceWeight(e),0);
           const modelGeometry=model.filter(e=>spaceWeight(e)>0).length;
           if(modelGeometry>0)return {entities:model,spaceMode:'MODEL_SPACE',modelCount:model.length,paperCount:paper.length,layoutName:'Model'};
           if(!paper.length)return {entities:modelGeometry?model:[],spaceMode:'MODEL_SPACE',modelCount:model.length,paperCount:0,layoutName:'Model'};
           // Do not combine multiple layouts. Choose the single paper layout containing the
           // most actual geometry, excluding viewport boundary entities from the score.
           const layouts=new Map();
           for(const rec of paper){const lp=(rec.pairs||[]).find(p=>p.code===410);const layoutName=lp?String(lp.value||'').trim():'*PAPERSPACE';if(!layouts.has(layoutName))layouts.set(layoutName,[]);layouts.get(layoutName).push(rec);}
           let bestName='',bestEntities=[],bestScore=-1;
           for(const [name,items] of layouts){const score=items.reduce((n,e)=>n+spaceWeight(e),0);if(score>bestScore){bestName=name;bestEntities=items;bestScore=score;}}
           // If no code 410 values were present, all Paper Space entities form one legacy layout.
           if(layouts.size===1&&bestScore===0)bestEntities=paper;
           return {entities:bestEntities,spaceMode:'PAPER_SPACE',modelCount:model.length,paperCount:paper.length,layoutName:bestName||'*PAPERSPACE'};
          }
          // Keep full entity bounds for data fidelity but focus the initial view on the dominant drawing cluster.
          // This viewport-only calculation never deletes or moves an entity.
