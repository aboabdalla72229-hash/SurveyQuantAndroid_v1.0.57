name: Build SurveyQuant v1.0.105 - Two Point CAD Orientation

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_PATCH_PACKAGE.zip"
      - ".github/workflows/build-v105-orientation-two-point.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages and unzip
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -y
          sudo apt-get install -y unzip zip

      - name: Unpack original source, v104 baseline and the two-point module
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_NAME="SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
          BASE_PATCH_NAME="SurveyQuant_v1.0.104_DXF_READ_PROJECTION_RESTORE_PATCH.zip"
          MODULE_PACKAGE="SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_PATCH_PACKAGE.zip"
          test -s "$SOURCE_NAME" || { echo "ERROR: Missing original Android source: $SOURCE_NAME"; exit 1; }
          test -s "$BASE_PATCH_NAME" || { echo "ERROR: Missing v104 baseline patch: $BASE_PATCH_NAME"; exit 1; }
          test -s "$MODULE_PACKAGE" || { echo "ERROR: Upload the v105 orientation patch package to the repository root."; exit 1; }
          rm -rf "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-base-patch" "$RUNNER_TEMP/sq-orientation-patch"
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-base-patch" "$RUNNER_TEMP/sq-orientation-patch"
          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$BASE_PATCH_NAME" -d "$RUNNER_TEMP/sq-base-patch"
          unzip -q "$MODULE_PACKAGE" -d "$RUNNER_TEMP/sq-orientation-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-base-patch" -type f -name 'index.html' -print -quit)"
          MODULE_JS="$(find "$RUNNER_TEMP/sq-orientation-patch" -type f -name 'SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_MODULE.js' -print -quit)"
          TEST_JS="$(find "$RUNNER_TEMP/sq-orientation-patch" -type f -name 'SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_TEST.js' -print -quit)"
          DXF_TEST="$(find "$RUNNER_TEMP/sq-base-patch" -type f -name 'dxf-parser-restoration-test.js' -print -quit)"
          test -n "$PROJECT" && test -d "$PROJECT" || { echo "ERROR: Android project not found in source ZIP."; exit 1; }
          test -s "$PATCH_INDEX" || { echo "ERROR: v104 index.html is missing."; exit 1; }
          test -s "$MODULE_JS" || { echo "ERROR: Two-point orientation module is missing from the package."; exit 1; }
          test -s "$TEST_JS" || { echo "ERROR: Two-point orientation regression test is missing from the package."; exit 1; }
          test -s "$DXF_TEST" || { echo "ERROR: Existing v104 DXF regression test is missing."; exit 1; }
          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/build.gradle"
          test -s "$PROJECT/app/src/main/AndroidManifest.xml"
          mkdir -p "$PROJECT/app/src/main/assets"
          cp "$PATCH_INDEX" "$PROJECT/app/src/main/assets/index.html"
          python3 - "$PROJECT/app/src/main/assets/index.html" "$MODULE_JS" <<'PY'
          from pathlib import Path
          import sys
          html_path, module_path = map(Path, sys.argv[1:])
          html = html_path.read_text(encoding='utf-8')
          module = module_path.read_text(encoding='utf-8')
          marker = '<script id="sq-orientation-module">'
          if marker in html:
              raise SystemExit('ERROR: v105 orientation module appears to have been injected already.')
          if '</body>' not in html:
              raise SystemExit('ERROR: Could not locate body end in index.html.')
          html = html.replace('</body>', marker + '\n' + module + '\n</script>\n</body>', 1)
          html = html.replace('const SQ_APP_VERSION_CODE = 104;', 'const SQ_APP_VERSION_CODE = 105;')
          if 'const SQ_APP_VERSION_CODE = 105;' not in html:
              raise SystemExit('ERROR: Failed to set HTML app version code to 105.')
          html_path.write_text(html, encoding='utf-8')
          PY
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "INDEX_PATH=$PROJECT/app/src/main/assets/index.html" >> "$GITHUB_ENV"
          echo "MODULE_JS=$MODULE_JS" >> "$GITHUB_ENV"
          echo "TEST_JS=$TEST_JS" >> "$GITHUB_ENV"
          echo "DXF_TEST=$DXF_TEST" >> "$GITHUB_ENV"
          echo "PATCH_DIR=$RUNNER_TEMP/sq-orientation-patch" >> "$GITHUB_ENV"

      - name: Verify existing projects and two-point orientation are both present
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$INDEX_PATH" "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re, sys
          index = Path(sys.argv[1]).read_text(encoding='utf-8')
          gradle = Path(sys.argv[2]).read_text(encoding='utf-8')
          required = [
            'function parseDXF(text){',
            'function mergeProjectionDxfPreservingReference(rawBytes, additions)',
            'async function dropFilesMerge(){',
            'id="project1Card"',
            'id="profileCard"',
            'id="roadCard"',
            'id="dropFilesCard"',
            'id="paymentCard"',
            'const SQ_APP_VERSION_CODE = 105;',
            'id="sq-orientation-module"',
            "card.id = 'sqOrientationCard'",
            'window.sqOpenOrientationProject',
            'function sqOriTransformBytes(input, transform)',
            'لم يتم إخراج الملف لأن به عناصر تحتاج محرك CAD أصليًا',
          ]
          missing = [x for x in required if x not in index]
          if missing:
            raise SystemExit('ERROR: Missing required function/project: ' + ', '.join(missing))
          # Do not pin the source ZIP's stale folder/version label to a hard-coded
          # versionCode. The release step below safely bumps whatever baseline is present.
          # The actual reference-preserving projection signature is already checked in
          # the required list above; avoid comparing a call-site string to a definition.
          print('PASS: v104 DXF/projection logic and existing project cards retained; new orientation module injected.')
          PY
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png"
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_background.png"
          cmp -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png" || { echo "ERROR: Logo assets differ."; exit 1; }

      - name: Set Android release version to 1.0.105
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          text, n_code = re.subn(r'(?m)(\bversionCode\s+)\d+\b', r'\g<1>105', text, count=1)
          text, n_name = re.subn(r"(?m)(\bversionName\s+)([\"'])\d+\.\d+\.\d+\2", r"\g<1>'1.0.105'", text, count=1)
          if n_code != 1 or n_name != 1:
            raise SystemExit(f'ERROR: Version edits failed (code={n_code}, name={n_name}).')
          p.write_text(text, encoding='utf-8')
          PY
          grep -Eq 'versionCode[[:space:]]+105([^0-9]|$)' "$PROJECT_DIR/app/build.gradle"
          grep -Eq "versionName[[:space:]]+['\"]1\.0\.105['\"]" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'const SQ_APP_VERSION_CODE = 105;' "$INDEX_PATH"

      - name: Validate JavaScript syntax and orientation regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check "$MODULE_JS"
          node "$TEST_JS" "$MODULE_JS"
          node "$DXF_TEST" "$INDEX_PATH"
          python3 - "$INDEX_PATH" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re, sys
          html = Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.I | re.S)
          if not scripts:
            raise SystemExit('ERROR: No inline JavaScript found.')
          Path(sys.argv[2]).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: Secret SURVEYQUANT_KEY_ALIAS is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEY_PASSWORD is missing."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK and package source patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease --stacktrace
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: Release APK was not generated."; find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true; exit 1; }
          RELEASE="$RUNNER_TEMP/sq-release"
          mkdir -p "$RELEASE/source-patch"
          cp "$APK" "$RELEASE/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT.apk"
          cp "$INDEX_PATH" "$RELEASE/source-patch/index.html"
          cp "$MODULE_JS" "$RELEASE/source-patch/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_MODULE.js"
          cp "$TEST_JS" "$RELEASE/source-patch/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_TEST.js"
          cp "$DXF_TEST" "$RELEASE/source-patch/dxf-parser-restoration-test.js"
          cat > "$RELEASE/source-patch/README_AR.txt" <<'TXT'
          SurveyQuant v1.0.105: Two Point CAD Orientation
          This source patch is based on the repository's v1.0.104 DXF/projection restoration HTML.
          The module adds a separate project card and performs a similarity transform using two matching points.
          It writes a new text-DXF file and keeps the original input and reference untouched.
          To protect data, this implementation stops on unsupported/custom/CAD-native entities.
          The currently bundled LibreDWG module is read-only for this app; native DWG output and full Civil 3D proxy-object preservation are not claimed.
          TXT
          (cd "$RELEASE/source-patch" && zip -qr "$RELEASE/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_SOURCE_PATCH.zip" .)
          sha256sum "$RELEASE/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT.apk" "$RELEASE/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_SOURCE_PATCH.zip" > "$RELEASE/SHA256SUMS.txt"
          cat "$RELEASE/SHA256SUMS.txt"
          echo "RELEASE_DIR=$RELEASE" >> "$GITHUB_ENV"

      - name: Upload APK and source patch
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.105-ORIENTATION-TWO-POINT
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.105_ORIENTATION_TWO_POINT_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
