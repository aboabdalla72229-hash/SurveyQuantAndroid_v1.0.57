name: Build SurveyQuant v1.0.182 Session Reset + Image Underlay PDF + Dual CAD

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V181 signed APK artifact run ID"
        required: true
        type: string
        default: "41589895573"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v182-session-reset-image-underlay-pdf.yml"
      - "SurveyQuant_v1.0.182_FIX_KIT.zip"
      - "SurveyQuant_v1.0.182_GITHUB_UPLOAD_BUNDLE.zip"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v182-session-reset-image-underlay-pdf
  cancel-in-progress: false

jobs:
  build_v182:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41589895573' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract V182 source and regression kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_ARCHIVE=""
          BUNDLE_DIR="$RUNNER_TEMP/v182-upload-bundle"
          if [ -s SurveyQuant_v1.0.182_FIX_KIT.zip ]; then
            KIT_ARCHIVE="$GITHUB_WORKSPACE/SurveyQuant_v1.0.182_FIX_KIT.zip"
            echo "Using standalone V182 FIX_KIT from repository root."
          elif [ -s SurveyQuant_v1.0.182_GITHUB_UPLOAD_BUNDLE.zip ]; then
            rm -rf "$BUNDLE_DIR" && mkdir -p "$BUNDLE_DIR"
            unzip -q SurveyQuant_v1.0.182_GITHUB_UPLOAD_BUNDLE.zip -d "$BUNDLE_DIR"
            KIT_ARCHIVE="$(find "$BUNDLE_DIR" -type f -name 'SurveyQuant_v1.0.182_FIX_KIT.zip' -print -quit)"
            test -n "$KIT_ARCHIVE" && test -s "$KIT_ARCHIVE" || { echo "ERROR: upload bundle does not contain SurveyQuant_v1.0.182_FIX_KIT.zip"; exit 1; }
            echo "Extracted standalone V182 FIX_KIT from uploaded bundle."
          else
            echo "ERROR: upload V182_FIX_KIT.zip OR V182_GITHUB_UPLOAD_BUNDLE.zip in repository root";
            exit 1
          fi
          KIT="$RUNNER_TEMP/v182-kit"
          rm -rf "$KIT" && mkdir -p "$KIT"
          unzip -q "$KIT_ARCHIVE" -d "$KIT"
          for f in index.html SurveyQuant_v1.0.182_CAD_ENGINE.js SurveyQuant_v1.0.182_PACKAGE_FREE_APK.py test_v182_engine_regression.js test_orientation_ui.py test_pdf_modes_ui.py test_v182_dual_cad_ui.py test_v182_dual_dwg_mock_ui.py README_V182_AR.md V182_TEST_REPORT_AR.txt; do
            test -s "$KIT/$f" || { echo "ERROR: missing $f in V182 kit"; exit 1; }
          done
          echo "V182_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Download exact successful V181 signed base APK
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v181-base"
          OUT="$RUNNER_TEMP/v182-release"
          SRC="$RUNNER_TEMP/v182-source"
          rm -rf "$BASE" "$OUT" "$SRC"
          mkdir -p "$BASE" "$OUT" "$SRC"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.181-FREE-LOCAL-FRAME-OLE-PDF-DUAL-CAD" --dir "$BASE"
          APK="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.181_FREE_ANDROID_LOCAL_FRAME_PDF_DUAL_CAD.apk' -print -quit)"
          test -s "$APK" || { echo "ERROR: signed V181 base APK was not found in run $SOURCE_RUN_ID"; exit 1; }
          echo "V182_BASE_APK=$APK" >> "$GITHUB_ENV"
          echo "V182_RELEASE_DIR=$OUT" >> "$GITHUB_ENV"
          echo "V182_SOURCE_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Install CAD and browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 playwright reportlab==4.4.9 pillow
          python3 -m playwright install --with-deps chromium

      - name: Run V182 orientation, session, PDF, and CAD regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$V182_KIT"
          node test_v182_engine_regression.js | tee "$V182_RELEASE_DIR/V182_ENGINE_TEST_LOG.txt"
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js index.html
          python3 test_orientation_ui.py | tee "$V182_RELEASE_DIR/V182_ORIENTATION_TEST_LOG.txt"
          python3 test_pdf_modes_ui.py | tee "$V182_RELEASE_DIR/V182_PDF_TEST_LOG.txt"
          python3 test_v182_dual_cad_ui.py | tee "$V182_RELEASE_DIR/V182_DUAL_DXF_TEST_LOG.txt"
          python3 test_v182_dual_dwg_mock_ui.py | tee "$V182_RELEASE_DIR/V182_DUAL_DWG_MOCK_TEST_LOG.txt"
          for f in V182_ORIENTATION_UI_OUTPUT.dxf V182_MIXED_UI_OUTPUT.dxf V182_RASTER_UI_OUTPUT.dxf V182_VECTOR_UI_OUTPUT.dxf V182_TWO_DXF_MERGE_UI_TEST.dxf V182_TWO_DWG_MOCK_MERGE_UI_TEST.dxf; do
            test -s "$f" && cp "$f" "$V182_RELEASE_DIR/"
          done

      - name: Package V182 APK from signed V181 base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V182_KIT/SurveyQuant_v1.0.182_PACKAGE_FREE_APK.py" \
            --apk-input "$V182_BASE_APK" \
            --apk-output "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_UNSIGNED.apk" \
            --html-to-inject "$V182_KIT/index.html"
          test -s "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_UNSIGNED.apk"
          unzip -t "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_UNSIGNED.apk" | tail -2

      - name: Sign and verify V182 APK with existing release key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_ALIGNED.apk"
          FINAL="$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_ANDROID_SESSION_RESET_IMAGE_PDF_DUAL_CAD.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -F "versionCode='182' versionName='1.0.182'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_UNSIGNED.apk"

      - name: Build V182 source patch and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$V182_KIT/." "$V182_SOURCE_DIR/"
          cp "$V182_KIT/README_V182_AR.md" "$V182_RELEASE_DIR/README_V182_AR.md"
          cp "$V182_KIT/V182_TEST_REPORT_AR.txt" "$V182_RELEASE_DIR/V182_TEST_REPORT_AR.txt"
          (cd "$V182_SOURCE_DIR" && zip -qr "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_ANDROID_SESSION_RESET_IMAGE_PDF_DUAL_CAD.apk" "$V182_RELEASE_DIR/SurveyQuant_v1.0.182_FREE_SOURCE_PATCH.zip" "$V182_RELEASE_DIR"/*.dxf > "$V182_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V182_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed V182 APK, source, logs and CAD outputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.182-FREE-SESSION-RESET-IMAGE-PDF-DUAL-CAD
          path: |
            ${{ runner.temp }}/v182-release/SurveyQuant_v1.0.182_FREE_ANDROID_SESSION_RESET_IMAGE_PDF_DUAL_CAD.apk
            ${{ runner.temp }}/v182-release/SurveyQuant_v1.0.182_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v182-release/README_V182_AR.md
            ${{ runner.temp }}/v182-release/V182_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v182-release/V182_ENGINE_TEST_LOG.txt
            ${{ runner.temp }}/v182-release/V182_ORIENTATION_TEST_LOG.txt
            ${{ runner.temp }}/v182-release/V182_PDF_TEST_LOG.txt
            ${{ runner.temp }}/v182-release/V182_DUAL_DXF_TEST_LOG.txt
            ${{ runner.temp }}/v182-release/V182_DUAL_DWG_MOCK_TEST_LOG.txt
            ${{ runner.temp }}/v182-release/SHA256SUMS.txt
            ${{ runner.temp }}/v182-release/*.dxf
          if-no-files-found: error
          retention-days: 30
