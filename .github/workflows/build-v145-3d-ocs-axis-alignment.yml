name: Build SurveyQuant v1.0.145 - 3D OCS + Axis Labels

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V144 source/base artifact run ID"
        required: true
        type: string
        default: "40087242377"
      reference_run_id:
        description: "Successful V130 DWG/orientation artifact run ID"
        required: true
        type: string
        default: "39560732493"
  push:
    paths:
      - ".github/workflows/build-v145-3d-ocs-axis-alignment.yml"
      - "SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_PATCH_KIT.zip"

permissions:
  actions: read
  contents: read

jobs:
  build_v145:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40087242377' }}
      REFERENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_run_id || '39560732493' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Check out workflow and patch kit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned DXF oracle dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ezdxf==1.4.4"
          python - <<'PY'
          import ezdxf
          assert ezdxf.__version__ == "1.4.4", ezdxf.__version__
          print("PASS: ezdxf 1.4.4 reference oracle is installed.")
          PY

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android build tools configured."

      - name: Download V144 base, V130 reference, and unpack V145 patch kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_PATCH_KIT.zip"
          test -s "$KIT" || { echo "ERROR: Upload SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_PATCH_KIT.zip to the repository root."; exit 1; }
          unzip -t "$KIT"
          KIT_DIR="$RUNNER_TEMP/v145-kit"
          BASE_DIR="$RUNNER_TEMP/v144-base"
          REF_DIR="$RUNNER_TEMP/v130-reference"
          rm -rf "$KIT_DIR" "$BASE_DIR" "$REF_DIR"
          mkdir -p "$KIT_DIR" "$BASE_DIR" "$REF_DIR"
          unzip -q "$KIT" -d "$KIT_DIR"

          for f in \
            SurveyQuant_v1.0.145_APPLY_3D_OCS_AXIS_FIX.py \
            SurveyQuant_v1.0.145_PACKAGE_APK.py \
            SurveyQuant_v1.0.145_ORIENTATION_PRECISION_TEST.js \
            SurveyQuant_v1.0.145_ALIGNMENT_SAFETY_TEST.js \
            SurveyQuant_v1.0.145_MLEADER_ALIGNMENT_TEST.js \
            SurveyQuant_v1.0.145_3D_OCS_AXIS_TEST.js \
            SurveyQuant_v1.0.145_REAL_MLEADER_ORACLE_TEST.py \
            SurveyQuant_v1.0.145_REAL_MLEADER_TRANSFORM_RUNNER.js \
            SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js; do
            test -s "$KIT_DIR/$f" || { echo "ERROR: required patch/test file missing: $f"; exit 1; }
          done

          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.144-MLEADER-ALIGNMENT" --dir "$BASE_DIR"
          gh run download "$REFERENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.130-DWG-AXIS-MULTISELECT" --dir "$REF_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_SOURCE_PATCH.zip' -print -quit)"
          REF_PATCH="$(find "$REF_DIR" -type f -name 'SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V144 signed APK missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V144 source patch missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$REF_PATCH" || { echo "ERROR: V130 reference source patch missing from run $REFERENCE_RUN_ID."; exit 1; }
          unzip -t "$BASE_PATCH"
          unzip -t "$REF_PATCH"
          mkdir -p "$RUNNER_TEMP/v145-source" "$RUNNER_TEMP/v130-source" "$RUNNER_TEMP/sq-release"
          unzip -q "$BASE_PATCH" -d "$RUNNER_TEMP/v145-source"
          unzip -q "$REF_PATCH" -d "$RUNNER_TEMP/v130-source"
          test -s "$RUNNER_TEMP/v145-source/index.html"
          test -s "$RUNNER_TEMP/v130-source/index.html"
          {
            echo "V145_KIT_DIR=$KIT_DIR"
            echo "V145_BASE_APK=$BASE_APK"
            echo "V145_SOURCE_DIR=$RUNNER_TEMP/v145-source"
            echo "V130_SOURCE_DIR=$RUNNER_TEMP/v130-source"
            echo "V145_RELEASE_DIR=$RUNNER_TEMP/sq-release"
          } >> "$GITHUB_ENV"

      - name: Apply 3D/OCS transform, restore axis labels, and run regressions
        shell: bash
        run: |
          set -euo pipefail
          PATCHER="$V145_KIT_DIR/SurveyQuant_v1.0.145_APPLY_3D_OCS_AXIS_FIX.py"
          FINAL_HTML="$V145_SOURCE_DIR/index_v145.html"
          python -m py_compile "$PATCHER" "$V145_KIT_DIR/SurveyQuant_v1.0.145_PACKAGE_APK.py" "$V145_KIT_DIR/SurveyQuant_v1.0.145_REAL_MLEADER_ORACLE_TEST.py"
          for f in \
            "$V145_KIT_DIR/SurveyQuant_v1.0.145_ORIENTATION_PRECISION_TEST.js" \
            "$V145_KIT_DIR/SurveyQuant_v1.0.145_ALIGNMENT_SAFETY_TEST.js" \
            "$V145_KIT_DIR/SurveyQuant_v1.0.145_MLEADER_ALIGNMENT_TEST.js" \
            "$V145_KIT_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_TEST.js" \
            "$V145_KIT_DIR/SurveyQuant_v1.0.145_REAL_MLEADER_TRANSFORM_RUNNER.js" \
            "$V145_KIT_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"; do node --check "$f"; done

          python3 "$PATCHER" --input-html "$V145_SOURCE_DIR/index.html" --output-html "$FINAL_HTML" --report "$V145_RELEASE_DIR/V145_PATCH_REPORT.md"
          node "$V145_KIT_DIR/SurveyQuant_v1.0.145_ORIENTATION_PRECISION_TEST.js" "$FINAL_HTML" "$V130_SOURCE_DIR/index.html"
          node "$V145_KIT_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js" "$FINAL_HTML"
          node "$V145_KIT_DIR/SurveyQuant_v1.0.145_ALIGNMENT_SAFETY_TEST.js" "$FINAL_HTML"
          node "$V145_KIT_DIR/SurveyQuant_v1.0.145_MLEADER_ALIGNMENT_TEST.js" "$FINAL_HTML"
          node "$V145_KIT_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_TEST.js" "$FINAL_HTML"
          python3 "$V145_KIT_DIR/SurveyQuant_v1.0.145_REAL_MLEADER_ORACLE_TEST.py" --html "$FINAL_HTML" --js-runner "$V145_KIT_DIR/SurveyQuant_v1.0.145_REAL_MLEADER_TRANSFORM_RUNNER.js" --work-dir "$RUNNER_TEMP/v145-real-mleader-test"
          node --check "$V145_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"

          python3 - "$FINAL_HTML" "$RUNNER_TEMP/v145-inline-js-check" <<'PY'
          import pathlib, re, subprocess, sys
          html_path, out_dir = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          out_dir.mkdir(parents=True, exist_ok=True)
          source = html_path.read_text(encoding='utf-8')
          found = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', source, re.I)
          checked = 0
          for i, (attrs, body) in enumerate(found):
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/ld\+json|importmap)["\']', attrs, re.I):
                  continue
              path = out_dir / f'script_{i}.js'
              path.write_text(body, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
              checked += 1
          if checked < 8: raise SystemExit(f'Expected at least 8 inline JS blocks, found {checked}')
          print(f'PASS: {checked} inline JavaScript blocks parsed.')
          PY

          if grep -q 'كيانات في OCS غير قياسي لا يمكن تحويل' "$FINAL_HTML"; then
            echo "ERROR: old OCS-blocks-export UI warning is still present."; exit 1
          fi
          grep -q 'تتم معالجة عناصر DXF ثلاثية الأبعاد وOCS القابلة للقراءة' "$FINAL_HTML"
          cp "$FINAL_HTML" "$V145_SOURCE_DIR/index.html"
          rm -f "$FINAL_HTML"
          for f in "$V145_KIT_DIR"/SurveyQuant_v1.0.145_* "$V145_KIT_DIR"/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js "$V145_KIT_DIR"/README_V145_AR.txt "$V145_KIT_DIR"/SurveyQuant_v1.0.145_AUTOMATED_TEST_RESULTS.md; do
            [ -f "$f" ] && cp "$f" "$V145_SOURCE_DIR/"
          done
          cp "$V145_RELEASE_DIR/V145_PATCH_REPORT.md" "$V145_SOURCE_DIR/V145_PATCH_REPORT.md"
          cat > "$V145_RELEASE_DIR/V145_BUILD_RESULT.txt" <<'TXT'
          PASS V145: supported 3D WCS and ordinary non-default OCS transforms; non-default OCS no longer triggers export veto; axis labels restored from nested INSERT/TEXT; MLEADER reference-oracle test; V130 DWG regression; 10 inline JS syntax checks; V144 APK packaging is ready for signing.
          TXT
          rm -f "$V145_RELEASE_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_SOURCE_PATCH.zip"
          (cd "$V145_SOURCE_DIR" && zip -qr "$V145_RELEASE_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_SOURCE_PATCH.zip" .)
          unzip -t "$V145_RELEASE_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_SOURCE_PATCH.zip" | tail -2

      - name: Inject tested HTML into V144 APK, sign, and verify V145
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V145_RELEASE_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_UNSIGNED.apk"
          ALIGNED="$V145_RELEASE_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_ALIGNED.apk"
          FINAL="$V145_RELEASE_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_FIX.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V145_KIT_DIR/SurveyQuant_v1.0.145_PACKAGE_APK.py" --apk-input "$V145_BASE_APK" --apk-output "$RAW" --html-to-inject "$V145_SOURCE_DIR/index.html"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='145'.*versionName='1.0.145'"
          sha256sum "$FINAL" "$V145_RELEASE_DIR/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_SOURCE_PATCH.zip" > "$V145_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V145_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed V145 APK, source and reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.145-3D-OCS-AXIS-ALIGNMENT
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.145_3D_OCS_AXIS_ALIGNMENT_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V145_BUILD_RESULT.txt
            ${{ runner.temp }}/sq-release/V145_PATCH_REPORT.md
          if-no-files-found: error
          retention-days: 14
