          unzip -t "$V201_RELEASE_DIR/SurveyQuant_v1.0.201_FREE_SOURCE_PATCH.zip" | tail -2

          sha256sum \
            "$V201_RELEASE_DIR/SurveyQuant_v1.0.201_FREE_ANDROID_SINGLE_CANVAS_DATA.apk" \
            "$V201_RELEASE_DIR/SurveyQuant_v1.0.201_FREE_SOURCE_PATCH.zip" \
