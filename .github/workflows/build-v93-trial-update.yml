name: Build SurveyQuant v1.0.93 - 3-Day Trial + Required Updates

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
      - ".github/workflows/build-v93-trial-update.yml"

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v1.0.93 source
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_NAME" || { echo "ERROR: Missing source ZIP: $SOURCE_NAME"; exit 1; }
          rm -rf "$RUNNER_TEMP/sq-source"
          mkdir -p "$RUNNER_TEMP/sq-source"
          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$PROJECT" || { echo "ERROR: Android project not found in source ZIP"; exit 1; }
          test -s "$PROJECT/app/src/main/assets/index.html"
          test -s "$PROJECT/app/src/main/java/com/surveyquant/app/MainActivity.java"
          test -s "$PROJECT/backend/server.js"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify trial, pricing, update guard, and unchanged subscription identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionCode 93" "$PROJECT_DIR/app/build.gradle"
          grep -Fq "versionName '1.0.93'" "$PROJECT_DIR/app/build.gradle"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          JAVA="$PROJECT_DIR/app/src/main/java/com/surveyquant/app/MainActivity.java"
          BACKEND="$PROJECT_DIR/backend/server.js"
          grep -Fq 'SQ_APP_VERSION_CODE = 93' "$INDEX"
          grep -Fq "minimumVersionCode" "$INDEX"
          grep -Fq "localStorage.getItem('sq_device_id')" "$INDEX"
          grep -Fq 'value="monthly" selected>شهري - 55 جنيه' "$INDEX"
          grep -Fq 'value="quarterly">3 شهور - 150 جنيه' "$INDEX"
          grep -Fq 'value="yearly">سنوي - 500 جنيه' "$INDEX"
          grep -Fq 'public String getDeviceId()' "$JAVA"
          grep -Fq 'const TRIAL_DAYS = 3;' "$BACKEND"
          grep -Fq 'MINIMUM_APP_VERSION_CODE' "$BACKEND"
          grep -Fq 'activeUntil' "$BACKEND"
          cmp -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png"
          grep -Fq 'surveyquant_background.png' "$INDEX"

      - name: Validate JavaScript and backend syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re, sys
          html = Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No script blocks found')
          Path(sys.argv[2]).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline.js"
          node --check "$PROJECT_DIR/backend/server.js"

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "Missing secret SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "Missing secret SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "Missing secret SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "Missing secret SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.jks"
          test -s "$RUNNER_TEMP/surveyquant-release.jks"
          echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: APK was not produced"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sq-release"
          cp "$APK" "$RUNNER_TEMP/sq-release/SurveyQuant-v1.0.93-trial-update.apk"
          cp "$PROJECT_DIR/backend/server.js" "$RUNNER_TEMP/sq-release/surveyquant-backend-server-v93.js"
          cp "$SOURCE_NAME" "$RUNNER_TEMP/sq-release/SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
          sha256sum "$RUNNER_TEMP/sq-release/SurveyQuant-v1.0.93-trial-update.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.93-trial-update
          path: ${{ runner.temp }}/sq-release/*
          if-no-files-found: error
          retention-days: 90
