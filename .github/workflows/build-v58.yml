name: Build SurveyQuant v1.0.58

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repaired v1.0.58 source
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.58_PATCH4_REPAIRED_SOURCE.zip"

          test -s "$SOURCE_ZIP" || {
            echo "Source ZIP is not the repaired v1.0.58 source: $SOURCE_ZIP"
            exit 1
          }

          echo "Found repaired source: $SOURCE_ZIP"

      - name: Prepare source
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "SurveyQuantAndroid_v1.0.58_PATCH4_REPAIRED_SOURCE.zip" -d extracted

          echo "Source extracted successfully."
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} release/ \;

          echo "Generated files:"
          find release -type f -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.58
          path: release/*
          if-no-files-found: error
