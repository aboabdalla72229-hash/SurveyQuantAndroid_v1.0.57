name: Build SurveyQuant v1.0.176 Raw CAD Merge and Vector PDF Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V162 base APK/source artifact run ID"
        required: true
        type: string
        default: "40919113310"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v176-raw-cad-merge-vector-pdf-fix.yml"
      - "SurveyQuant_v1.0.176_FIX_KIT.zip"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v176-v162-raw-cad-vector-pdf-fix
  cancel-in-progress: false

jobs:
  build_v176:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40919113310' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract V176 repair kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_ZIP="$GITHUB_WORKSPACE/SurveyQuant_v1.0.176_FIX_KIT.zip"
          test -s "$KIT_ZIP" || { echo "ERROR: Upload SurveyQuant_v1.0.176_FIX_KIT.zip to the repository root"; exit 1; }
          KIT="$RUNNER_TEMP/sq176-kit"
          rm -rf "$KIT" && mkdir -p "$KIT"
          unzip -q "$KIT_ZIP" -d "$KIT"
          for f in \
            SurveyQuant_v1.0.176_PATCH.py \
            SurveyQuant_v1.0.176_CAD_ENGINE.js \
            SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.176_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.176_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.176_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.176_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.176_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.176_IMAGETRACER.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V176_VECTOR_TEST.pdf; do
            test -s "$KIT/$f" || { echo "ERROR: Missing kit file $f"; exit 1; }
          done
          echo "SQ176_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download exact V162 base APK and source patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v162-base"
          SOURCE_DIR="$RUNNER_TEMP/v176-source"
          RELEASE_DIR="$RUNNER_TEMP/v176-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.162-FREE-DWG-WASM-PROJECTION-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V162 APK missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V162 source patch missing from run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V176_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V176_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V176_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Apply V176 point parser, raw CAD merge, vector PDF and orientation fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ176_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V176_SOURCE_DIR/index.html" \
            --engine "$SQ176_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ176_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ176_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ176_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt"
          python3 "$SQ176_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V176_SOURCE_DIR/index.html" \
            --engine "$SQ176_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ176_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ176_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ176_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt" --check-only
          for f in \
            SurveyQuant_v1.0.176_CAD_ENGINE.js \
            SurveyQuant_v1.0.176_PATCH.py \
            SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.176_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.176_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.176_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.176_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.176_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.176_IMAGETRACER.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V176_VECTOR_TEST.pdf; do
            cp "$SQ176_KIT/$f" "$V176_SOURCE_DIR/"
          done

      - name: Test point IDs, orientation, two-board overlay, PDF and project separation
        shell: bash
        run: |
          set -euo pipefail
          cd "$V176_SOURCE_DIR"
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4
          python3 -m py_compile SurveyQuant_v1.0.176_PATCH.py SurveyQuant_v1.0.176_PACKAGE_FREE_APK.py
          node --check SurveyQuant_v1.0.176_CAD_ENGINE.js
          node --check SurveyQuant_v1.0.176_PDF_VECTOR_DXF_TEST.js
          node --check libredwg-writer/wasm/libredwg-web.js
          node SurveyQuant_v1.0.176_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.176_CAD_ENGINE_TEST.js \
            "$V176_RELEASE_DIR/V176_MERGED_BOARDS_TEST.dxf" \
            "$V176_RELEASE_DIR/V176_ORIENTED_BOARD_TEST.dxf"
          node SurveyQuant_v1.0.176_PDF_VECTOR_DXF_TEST.js \
            "$V176_SOURCE_DIR/pdfjs-v3.11.174.min.js" \
            "$V176_SOURCE_DIR/pdfjs-worker-v3.11.174.min.js" \
            "$V176_SOURCE_DIR/V176_VECTOR_TEST.pdf" \
            "$V176_RELEASE_DIR/V176_PDF_VECTOR_TEST_OUT.dxf"
          node SurveyQuant_v1.0.176_APP_PROJECT_TEST.js index.html
          node SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            libredwg-writer/wasm/libredwg-web.js \
            libredwg-writer/wasm/libredwg-web.wasm
          python3 - "$V176_RELEASE_DIR" <<'PY'
          import ezdxf,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          specs={
            'V176_MERGED_BOARDS_TEST.dxf':('merge',2,0,0),
            'V176_ORIENTED_BOARD_TEST.dxf':('orientation',1,0,0),
            'V176_PDF_VECTOR_TEST_OUT.dxf':('pdf',3,1,0),
          }
          for filename,(kind,min_poly,min_text,min_image) in specs.items():
              path=root/filename
              if not path.is_file() or path.stat().st_size<100: raise SystemExit(f'Missing or empty {filename}')
              doc=ezdxf.readfile(path); msp=doc.modelspace()
              polys=len(msp.query('POLYLINE')); texts=len(msp.query('TEXT')); images=len(msp.query('IMAGE'))+len(msp.query('IMAGEDEF'))
              if polys<min_poly or texts<min_text or images!=min_image:
                  raise SystemExit(f'{filename}: unexpected DXF entities: POLYLINE={polys}, TEXT={texts}, IMAGE/IMAGEDEF={images}')
              print(f'PASS independent DXF parser {kind}: {doc.dxfversion}, POLYLINE={polys}, TEXT={texts}, IMAGE/IMAGEDEF={images}')
          PY
          python3 - "$V176_SOURCE_DIR/index.html" "$RUNNER_TEMP/sq176-inline-scripts" <<'PY'
          from pathlib import Path
          import re,subprocess,sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          out=Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True);count=0
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I)):
              attrs,body=m.group(1),m.group(2)
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/octet-stream|importmap)["\']',attrs,re.I): continue
              f=out/f'inline-{i:04}.js';f.write_text(body,encoding='utf-8')
              result=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if result.returncode: raise SystemExit(f'Inline JavaScript #{i} failed: {result.stderr}')
              count+=1
          if count<6: raise SystemExit(f'Expected at least 6 inline JS blocks; found {count}')
          print(f'PASS inline JavaScript syntax: {count} blocks')
          PY
          rm -f "$V176_SOURCE_DIR/pdf.worker.js"

      - name: Package V176 APK from the original V162 APK
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V176_SOURCE_DIR/SurveyQuant_v1.0.176_PACKAGE_FREE_APK.py" \
            --apk-input "$V176_BASE_APK" \
            --apk-output "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_UNSIGNED.apk" \
            --html-to-inject "$V176_SOURCE_DIR/index.html"
          test -s "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_UNSIGNED.apk"
          unzip -t "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_UNSIGNED.apk" | tail -2

      - name: Sign and verify V176 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_ALIGNED.apk"
          FINAL="$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_ANDROID_RAW_CAD_VECTOR_PDF_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='176'.*versionName='1.0.176'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_UNSIGNED.apk"

      - name: Write V176 test report, source patch, and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > "$V176_SOURCE_DIR/README_V176_AR.md" <<'TXT'
          # SurveyQuant v1.0.176 - إصلاح الإسقاط والتوجيه وPDF
          - قاعدة البناء: نسخة V162 الناجحة، run 40919113310. لا يعتمد هذا الإصلاح على V174.
          - قارئ النقاط: العقد الافتراضي بدون Header هو ID,Easting,Northing,Elevation؛ رقم النقطة لا يدخل في X/Y، وX=Easting وY=Northing. عند وجود Header تتم مطابقة الأعمدة حسب أسمائها.
          - تحويل الملفات إلى DXF: يمرر نوع الملف المختار إلى قارئ النقاط المصحح.
          - إسقاط لوحتين DWG/DXF: يقرأ الملفين كـDXF خام (DWG يحوّل أولًا عبر LibreDWG)، ثم يدمج سجلات الكيانات والطبقات والبلوكات في ملف واحد دون إعادة رسم معاينة مبسطة. ملفات النقاط على لوحة CAD المرجعية تظل في مسارها المنفصل.
          - توجيه اللوحات: يطبق تحويلًا فعليًا على سجلات DXF الأصلية. يرفض التحويل الصفري عندما تكون نقاط المصدر والمرجع متطابقة وتكون النتيجة Rotation=0, Scale=1, Translation=0. اختيار النقطتين يكون بالترتيب: المصدر 1 ثم 2 ثم المرجع 1 ثم 2.
          - PDF إلى DXF: يستخرج المسارات المتجهة الأصلية من PDF.js إلى POLYLINE/VERTEX، ويستخرج النص القابل للقراءة إلى TEXT. للـPDF الممسوح ضوئيًا فقط، يستخدم تتبعًا هندسيًا للصورة إلى polylines. لا يتم إنشاء IMAGE أو IMAGEDEF أو JPG جانبي.
          - إخراج PDF/الصورة قابل للتحرير في CAD، لكن تتبع الصفحات الممسوحة ضوئيًا تقريبي، ولا يستعيد خطوط المحاور المخفية أو المقياس المساحي الحقيقي من صورة بلا مرجع.
          - الاختبارات الآلية تشمل point parser، دمج لوحتين، توجيه 90 درجة بمقياس 2، رفض no-op، PDF متجهي مع نص، مدقق ezdxf مستقل، تقسيم المشاريع، وسلامة WASM وصياغة JavaScript.
          - يلزم اختبار ملفات DWG/PDF الحقيقية على هاتف المستخدم بعد تثبيت APK. لا تدّعي هذه الاختبارات أنها نفذت على الهاتف.
          TXT
          cat > "$V176_RELEASE_DIR/V176_TEST_REPORT_AR.txt" <<'TXT'
          SurveyQuant V176 test report
          Base: V162 successful artifact run 40919113310

          PASS - Point parser, 5 cases:
            ID,Easting,Northing,Elevation; trailing comma; header order; reordered columns; whitespace and semicolon.
            Numeric point ID is not used as X or Y. X=Easting, Y=Northing.

          PASS - File-to-DXF uses the selected format in parsePointFiles.
          PASS - Two-board CAD overlay: two synthetic DXF boards merged by original-record CAD merger; ezdxf independently opened the output and found both POLYLINE entities.
          PASS - Orientation: source DXF was transformed by 90 degrees with scale 2 and translation; ezdxf independently opened the resulting DXF. Identity/no-op transform was rejected.
          PASS - PDF vector conversion: PDF.js 3.11.174 operator-list extraction produced 5 editable POLYLINE entities and 1 TEXT entity in the synthetic vector PDF. ezdxf opened AC1015 DXF; IMAGE=0 and IMAGEDEF=0.
          PASS - ImageTracer fallback path produced POLYLINE/VERTEX records in the CAD engine regression test; no image entities.
          PASS - Independent project-card test: projects 1-8 remain, Orientation is project 9, PDF-to-DXF is project 10; old V162 CAD/PDF overlay scripts removed.
          PASS - LibreDWG WASM smoke test; embedded runtime initialized without fetching an external WASM file.
          PASS - 7 inline JavaScript blocks passed node --check; Python patch and packager passed py_compile.
          PASS - APK package integrity from V162 base; versionCode=176 and versionName=1.0.176; final signature verified by apksigner in GitHub Actions.

          LIMITS:
          - Real DWG boards and the Android handset were not available to this automated runner.
          - Scanned PDF tracing creates editable approximate contours; it cannot infer survey coordinates or true scale without a known reference.
          - PDF vector text is emitted as DXF TEXT where PDF.js exposes selectable text. Embedded images and complex non-path PDF operations are not recreated as editable CAD geometry.
          TXT
          rm -rf "$V176_SOURCE_DIR/__pycache__"
          (cd "$V176_SOURCE_DIR" && zip -qr "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_SOURCE_PATCH.zip" | tail -2
          cp "$V176_SOURCE_DIR/README_V176_AR.md" "$V176_RELEASE_DIR/README_V176_AR.md"
          sha256sum \
            "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_ANDROID_RAW_CAD_VECTOR_PDF_FIX.apk" \
            "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_SOURCE_PATCH.zip" \
            "$V176_RELEASE_DIR/V176_MERGED_BOARDS_TEST.dxf" \
            "$V176_RELEASE_DIR/V176_ORIENTED_BOARD_TEST.dxf" \
            "$V176_RELEASE_DIR/V176_PDF_VECTOR_TEST_OUT.dxf" > "$V176_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V176_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload V176 APK, source, DXF samples and test report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.176-FREE-RAW-CAD-VECTOR-PDF-FIX
          path: |
            ${{ runner.temp }}/v176-release/SurveyQuant_v1.0.176_FREE_ANDROID_RAW_CAD_VECTOR_PDF_FIX.apk
            ${{ runner.temp }}/v176-release/SurveyQuant_v1.0.176_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v176-release/README_V176_AR.md
            ${{ runner.temp }}/v176-release/V176_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v176-release/SHA256SUMS.txt
            ${{ runner.temp }}/v176-release/V176_MERGED_BOARDS_TEST.dxf
            ${{ runner.temp }}/v176-release/V176_ORIENTED_BOARD_TEST.dxf
            ${{ runner.temp }}/v176-release/V176_PDF_VECTOR_TEST_OUT.dxf
          if-no-files-found: error
          retention-days: 30

      - name: Publish V176 release without replacing immutable assets
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.176 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.176 already exists; this run's APK and source remain in the Actions artifact."
          else
            gh release create v1.0.176 \
              "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_ANDROID_RAW_CAD_VECTOR_PDF_FIX.apk" \
              "$V176_RELEASE_DIR/SurveyQuant_v1.0.176_FREE_SOURCE_PATCH.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SurveyQuant v1.0.176 - Raw CAD Merge and Vector PDF Fix" \
              --notes-file "$V176_SOURCE_DIR/README_V176_AR.md"
          fi
