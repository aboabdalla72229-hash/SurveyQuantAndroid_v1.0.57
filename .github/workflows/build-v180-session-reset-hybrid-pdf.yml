name: Build SurveyQuant v1.0.180 Session Reset + Hybrid PDF

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V179 signed APK/source artifact run ID"
        required: true
        type: string
        default: "41391995879"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v180-session-reset-hybrid-pdf.yml"
      - "SurveyQuant_v1.0.180_FIX_KIT.zip"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v180-session-reset-hybrid-pdf
  cancel-in-progress: false

jobs:
  build_v180:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41391995879' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract V180 test and patch kit
        shell: bash
        run: |
          set -euo pipefail
          test -s SurveyQuant_v1.0.180_FIX_KIT.zip || { echo "ERROR: V180_FIX_KIT is missing from repository root"; exit 1; }
          KIT="$RUNNER_TEMP/v180-kit"
          rm -rf "$KIT" && mkdir -p "$KIT"
          unzip -q SurveyQuant_v1.0.180_FIX_KIT.zip -d "$KIT"
          for f in apply_v180_patch.py create_fixtures.py test_orientation_ui.py test_pdf_modes_ui.py README_V180_AR.md V180_TEST_REPORT_AR.txt; do
            test -s "$KIT/$f" || { echo "ERROR: missing $f in V180 kit"; exit 1; }
          done
          echo "V180_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Download exact successful V179 APK and source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v179-base"
          SRC="$RUNNER_TEMP/v180-source"
          OUT="$RUNNER_TEMP/v180-release"
          rm -rf "$BASE" "$SRC" "$OUT"
          mkdir -p "$BASE" "$SRC" "$OUT"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.179-FREE-ORIENTATION-PDF-FIX" --dir "$BASE"
          APK="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.179_FREE_ANDROID_ORIENTATION_PDF_FIX.apk' -print -quit)"
          PATCH="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.179_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$APK" || { echo "ERROR: signed V179 APK was not found in run $SOURCE_RUN_ID"; exit 1; }
          test -s "$PATCH" || { echo "ERROR: V179 source patch was not found in run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$PATCH" | tail -2
          unzip -q "$PATCH" -d "$SRC"
          test -s "$SRC/index.html"
          test -s "$SRC/SurveyQuant_v1.0.179_PACKAGE_FREE_APK.py"
          test -s "$SRC/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SRC/libredwg-writer/wasm/libredwg-web.wasm"
          cp "$V180_KIT/apply_v180_patch.py" "$SRC/"
          cp "$V180_KIT/create_fixtures.py" "$SRC/"
          cp "$V180_KIT/test_orientation_ui.py" "$SRC/"
          cp "$V180_KIT/test_pdf_modes_ui.py" "$SRC/"
          cp "$V180_KIT/README_V180_AR.md" "$SRC/"
          cp "$V180_KIT/V180_TEST_REPORT_AR.txt" "$OUT/"
          echo "V180_BASE_APK=$APK" >> "$GITHUB_ENV"
          echo "V180_SOURCE_DIR=$SRC" >> "$GITHUB_ENV"
          echo "V180_RELEASE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Install real CAD and browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 playwright reportlab==4.4.9 pillow
          python3 -m playwright install --with-deps chromium

      - name: Apply V180 session reset and hybrid PDF repair to actual V179 source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V180_SOURCE_DIR/apply_v180_patch.py" "$V180_SOURCE_DIR"
          python3 -m py_compile \
            "$V180_SOURCE_DIR/apply_v180_patch.py" \
            "$V180_SOURCE_DIR/SurveyQuant_v1.0.180_PACKAGE_FREE_APK.py" \
            "$V180_SOURCE_DIR/create_fixtures.py" \
            "$V180_SOURCE_DIR/test_orientation_ui.py" \
            "$V180_SOURCE_DIR/test_pdf_modes_ui.py"
          node --check "$V180_SOURCE_DIR/SurveyQuant_v1.0.180_CAD_ENGINE.js"
          node --check "$V180_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          grep -q 'SURVEYQUANT_V180_SESSION_ISOLATION_AND_HYBRID_PDF_TRACE' "$V180_SOURCE_DIR/index.html"
          grep -q 'اسم اللوحة الناتجة قبل الحفظ' "$V180_SOURCE_DIR/index.html"

      - name: Run point parser, real orientation UI, PDF mixed/raster/vector UI, and DXF audits
        shell: bash
        run: |
          set -euo pipefail
          cd "$V180_SOURCE_DIR"
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js index.html
          python3 create_fixtures.py
          python3 test_orientation_ui.py | tee "$V180_RELEASE_DIR/V180_ORIENTATION_TEST_LOG.txt"
          python3 test_pdf_modes_ui.py | tee "$V180_RELEASE_DIR/V180_PDF_TEST_LOG.txt"
          for f in V180_ORIENTATION_UI_OUTPUT.dxf V180_MIXED_UI_OUTPUT.dxf V180_RASTER_UI_OUTPUT.dxf V180_VECTOR_UI_OUTPUT.dxf; do
            test -s "$f"
            cp "$f" "$V180_RELEASE_DIR/"
          done
          for f in V180_MIXED_ARCHITECTURAL_TEST.pdf V180_RASTER_ONLY_TEST.pdf V180_VECTOR_ONLY_TEST.pdf; do
            test -s "$f"
            cp "$f" "$V180_RELEASE_DIR/"
          done
          python3 - "$V180_RELEASE_DIR" <<'PYV180'
          from pathlib import Path
          import ezdxf,sys
          root=Path(sys.argv[1])
          specs={
            'V180_ORIENTATION_UI_OUTPUT.dxf':(1,0),
            'V180_MIXED_UI_OUTPUT.dxf':(45,3),
            'V180_RASTER_UI_OUTPUT.dxf':(40,0),
            'V180_VECTOR_UI_OUTPUT.dxf':(3,2),
          }
          for name,(min_poly,min_text) in specs.items():
              p=root/name; d=ezdxf.readfile(p); m=d.modelspace()
              assert len(m.query('POLYLINE'))>=min_poly,(name,len(m.query('POLYLINE')))
              assert len(m.query('TEXT'))>=min_text,(name,len(m.query('TEXT')))
              assert len(m.query('IMAGE'))==0 and len(m.query('IMAGEDEF'))==0,name
              audit=d.audit(); assert not audit.errors and not audit.fixes,(name,audit.errors,audit.fixes)
              q=root/(p.stem+'_ROUNDTRIP.dxf'); d.saveas(q); again=ezdxf.readfile(q).audit()
              assert not again.errors and not again.fixes,(name,again.errors,again.fixes)
              print(f'PASS {name}: entities={len(m)}, polylines={len(m.query("POLYLINE"))}, text={len(m.query("TEXT"))}, images=0, audit=0, roundtrip=0')
          PYV180

      - name: Package version 1.0.180 APK from signed V179 base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V180_SOURCE_DIR/SurveyQuant_v1.0.180_PACKAGE_FREE_APK.py" \
            --apk-input "$V180_BASE_APK" \
            --apk-output "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_UNSIGNED.apk" \
            --html-to-inject "$V180_SOURCE_DIR/index.html"
          test -s "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_UNSIGNED.apk"
          unzip -t "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_UNSIGNED.apk" | tail -2

      - name: Sign and verify V180 APK with the existing release key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_ALIGNED.apk"
          FINAL="$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_ANDROID_SESSION_HYBRID_PDF_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -F "versionCode='180' versionName='1.0.180'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_UNSIGNED.apk"

      - name: Build source patch, test report and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "$V180_SOURCE_DIR/README_V180_AR.md" "$V180_RELEASE_DIR/README_V180_AR.md"
          rm -rf "$V180_SOURCE_DIR/__pycache__"
          (cd "$V180_SOURCE_DIR" && zip -qr "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_SOURCE_PATCH.zip" | tail -2
          sha256sum \
            "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_ANDROID_SESSION_HYBRID_PDF_FIX.apk" \
            "$V180_RELEASE_DIR/SurveyQuant_v1.0.180_FREE_SOURCE_PATCH.zip" \
            "$V180_RELEASE_DIR/V180_ORIENTATION_UI_OUTPUT.dxf" \
            "$V180_RELEASE_DIR/V180_MIXED_UI_OUTPUT.dxf" \
            "$V180_RELEASE_DIR/V180_RASTER_UI_OUTPUT.dxf" \
            "$V180_RELEASE_DIR/V180_VECTOR_UI_OUTPUT.dxf" > "$V180_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V180_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed V180 APK, source, reports and verified DXF outputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.180-FREE-SESSION-HYBRID-PDF-FIX
          path: |
            ${{ runner.temp }}/v180-release/SurveyQuant_v1.0.180_FREE_ANDROID_SESSION_HYBRID_PDF_FIX.apk
            ${{ runner.temp }}/v180-release/SurveyQuant_v1.0.180_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v180-release/README_V180_AR.md
            ${{ runner.temp }}/v180-release/V180_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v180-release/V180_ORIENTATION_TEST_LOG.txt
            ${{ runner.temp }}/v180-release/V180_PDF_TEST_LOG.txt
            ${{ runner.temp }}/v180-release/SHA256SUMS.txt
            ${{ runner.temp }}/v180-release/V180_ORIENTATION_UI_OUTPUT.dxf
            ${{ runner.temp }}/v180-release/V180_MIXED_UI_OUTPUT.dxf
            ${{ runner.temp }}/v180-release/V180_RASTER_UI_OUTPUT.dxf
            ${{ runner.temp }}/v180-release/V180_VECTOR_UI_OUTPUT.dxf
          if-no-files-found: error
          retention-days: 30
