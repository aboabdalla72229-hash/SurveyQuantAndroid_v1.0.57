           const normalized=String(raw||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
           const m=/0\nTABLE\n2\nLAYER\n70\n(\d+)\n([\s\S]*?)0\nENDTAB/i.exec(normalized);if(!m)return normalized;
           const body=m[2],existing=new Set(),re=/0\nLAYER\n(?:[^\n]*\n)*?2\n([^\n]+)/gi;let x;while((x=re.exec(body)))existing.add(String(x[1]).trim().toUpperCase());
           const missing=names.filter(n=>!existing.has(String(n).toUpperCase()));if(!missing.length)return normalized;
           const recs=missing.map(n=>`0\nLAYER\n2\n${n}\n70\n0\n62\n7\n6\nCONTINUOUS\n`).join(''),count=Number(m[1])+missing.length,start=m.index,end=start+m[0].length;
           return normalized.slice(0,start)+`0\nTABLE\n2\nLAYER\n70\n${count}\n${body}${recs}0\nENDTAB`+normalized.slice(end);
          }
          function preserveOriginalDXFWithAdditions(model,entities){
           if(!model?.rawDXF)return null;
           try{
             const raw=String(model.rawDXF),nl=raw.includes('\r\n')?'\r\n':'\n';let normalized=raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
             const safeEntities=(entities||[]).map(e=>({...e,layer:asciiLayerName(e.layer||'0')})),valid=safeEntities.map(entityToR12).filter(Boolean).join('\n');if(!valid)return raw;
             normalized=ensureDxfLayersInRaw(normalized,safeEntities.map(e=>e.layer));
             const section=/0\nSECTION\n2\nENTITIES(?:\n|$)/i.exec(normalized);
             if(section){const tail=normalized.slice(section.index+section[0].length),endRel=tail.search(/0\nENDSEC(?:\n|$)/i);if(endRel>=0){const endPos=section.index+section[0].length+endRel,work=normalized.slice(0,endPos)+valid+'\n'+normalized.slice(endPos);return nl==='\r\n'?work.replace(/\n/g,'\r\n'):work;}}
             const eof=/0\nEOF\s*$/i.exec(normalized);if(eof){const insert='0\nSECTION\n2\nENTITIES\n'+valid+'\n0\nENDSEC\n',work=normalized.slice(0,eof.index)+insert+normalized.slice(eof.index);return nl==='\r\n'?work.replace(/\n/g,'\r\n'):work;}
