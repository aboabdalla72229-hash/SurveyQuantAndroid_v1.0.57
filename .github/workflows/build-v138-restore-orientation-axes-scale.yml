          unzip -l "$RAW_APK" | grep -F 'assets/libredwg-writer/wasm/libredwg-web.wasm'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RAW_APK" | grep -E "package: name=.*versionCode='138'.*versionName='1.0.138'" || {
            echo "ERROR: APK manifest was not raised to 1.0.138 (138)."; exit 1;
          }

          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: SURVEYQUANT_KEY_ALIAS secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEY_PASSWORD secret is empty."; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW_APK" "$ALIGNED_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL_APK" "$ALIGNED_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL_APK" | grep -E "package: name=.*versionCode='138'.*versionName='1.0.138'"
          sha256sum "$FINAL_APK" "$FINAL_SOURCE" > "$RELEASE/SHA256SUMS.txt"
          printf '%s\n' 'V138 PASS: restored active two-board orientation auto-axis wiring, exposed raw DXF parser, unconstrained positive scale solver, shift/rotation/scale and grid residual report, larger canvases and model-scaled text. Reapplied DWG WebView WASM fix. versionCode 138/versionName 1.0.138; orientation tests and apksigner passed.' > "$RELEASE/V138_BUILD_RESULT.txt"
          cat "$RELEASE/SHA256SUMS.txt"

      - name: Upload V138 signed APK and source patch
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.138-ORIENTATION-RESTORED-AXES-SCALE
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.138_ORIENTATION_RESTORED_AXES_SCALE.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.138_ORIENTATION_RESTORED_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V138_BUILD_RESULT.txt
          if-no-files-found: error
          retention-days: 14
