name: Build SurveyQuant v1.0.63

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract v1.0.63 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/SurveyQuantAndroid_v1.0.63_XY_PROJECTION_QUANT_FIX.zip"

          echo "========================================"
          echo "Using source ZIP:"
          echo "$ZIP"
          echo "========================================"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Source ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"

          echo "========================================"
          echo "Searching for Android project..."
          echo "========================================"

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE_DIR="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE_DIR/build.gradle" ] &&
               [ -f "$CANDIDATE_DIR/app/build.gradle" ]; then
              PROJECT_DIR="$CANDIDATE_DIR"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE/source" \
            -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts")

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project root was not found."
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/source" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "========================================"
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"
          echo "========================================"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected successfully."

      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SURVEYQUANT_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/surveyquant-release.keystore"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Keystore file is empty."
            exit 1
          fi

          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Keystore prepared successfully."

      - name: Generate Gradle Wrapper
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_FILE: ${{ env.SURVEYQUANT_KEYSTORE_FILE }}
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "gradlew is missing."
            echo "Generating Gradle Wrapper..."

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          if [ ! -f gradlew ]; then
            echo "::error::Gradle Wrapper was not generated."
            exit 1
          fi

          echo "Gradle Wrapper ready."

      - name: Verify keystore environment
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_FILE: ${{ env.SURVEYQUANT_KEYSTORE_FILE }}
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SURVEYQUANT_KEYSTORE_FILE" ]; then
            echo "::error::SURVEYQUANT_KEYSTORE_FILE is empty."
            exit 1
          fi

          if [ ! -f "$SURVEYQUANT_KEYSTORE_FILE" ]; then
            echo "::error::Keystore file does not exist."
            exit 1
          fi

          echo "Keystore environment verified."

      - name: Build v1.0.63
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_FILE: ${{ env.SURVEYQUANT_KEYSTORE_FILE }}
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Building SurveyQuant v1.0.63"
          echo "$PROJECT_DIR"
          echo "========================================"

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."

            echo "==== BUILD OUTPUT FILES ===="
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print

            exit 1
          fi

          echo "========================================"
          echo "APK GENERATED:"
          echo "$APK"
          echo "========================================"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" \
            "$GITHUB_WORKSPACE/dist/SurveyQuant-v1.0.63-XY-PROJECTION-QUANT-FIX.apk"

          echo "FINAL_APK=$GITHUB_WORKSPACE/dist/SurveyQuant-v1.0.63-XY-PROJECTION-QUANT-FIX.apk" >> "$GITHUB_ENV"

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$FINAL_APK" ]; then
            echo "::error::Final APK file does not exist."
            exit 1
          fi

          if [ ! -s "$FINAL_APK" ]; then
            echo "::error::Final APK file is empty."
            exit 1
          fi

          echo "========================================"
          echo "FINAL APK:"
          ls -lh "$FINAL_APK"
          echo "========================================"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.63-XY-PROJECTION-QUANT-FIX
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 14
