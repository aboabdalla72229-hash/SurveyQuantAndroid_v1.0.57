name: Build SurveyQuant v1.0.94 - OPEN TEST Concrete 2D 3D

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
      - "SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF_PATCH.zip"
      - ".github/workflows/build-v94-open-test-concrete.yml"

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip
  BASE_PATCH_NAME: SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF_PATCH.zip

