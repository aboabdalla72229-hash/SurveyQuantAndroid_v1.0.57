          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'const SQ_APP_VERSION_CODE = \d+;', 'const SQ_APP_VERSION_CODE = 104;', s, count=1)
          if n!=1:
            raise SystemExit('ERROR: Could not create the isolated v104 DXF regression fixture.')
          p.write_text(s,encoding='utf-8')
          PY

          node "$DXF_TEST" "$RUNNER_TEMP/dxf-parser-restoration-test.html"
          node --check "$PRESERVE_MODULE"
          echo "The old v113 hard-veto test is intentionally replaced by the v115 nonblocking-export test."
          node --check "$V115_MODULE"
          python3 - "$V115_TEST" "$RUNNER_TEMP/surveyquant-v116-orientation-regression.js" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text(encoding='utf-8')
          replacements=[
            ("const SQ_APP_VERSION_CODE = 115;", "const SQ_APP_VERSION_CODE = 117;"),
            ("height:520px", "height:230px;min-height:230px;max-height:230px"),
          ]
          for old,new in replacements:
            count=source.count(old)
            if count != 1:
              raise SystemExit(f"ERROR: Expected exactly one v115-to-v116 assertion update for {old!r}; found {count}.")
            source=source.replace(old,new,1)
          if 'window.__sqOrientation115Tools' not in source:
            raise SystemExit('ERROR: The historical v115 integration assertions are incomplete.')
          Path(sys.argv[2]).write_text(source,encoding='utf-8')
          PY
          node "$RUNNER_TEMP/surveyquant-v116-orientation-regression.js" "$REFERENCE_MODULE" "$PRESERVE_MODULE" "$V115_MODULE" "$INDEX_PATH"
          # The v116 exporter deliberately updates known CAD view/extents HEADER variables and
          # the geometry inside anonymous BLOCKS referenced by DIMENSION entities. The old
          # v115 audit mislabeled those valid fidelity-preserving edits as unrelated data loss.
          python3 - "$STORM_TRANSFORM_TEST" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old_sectioned = """function sectioned(pairs) {
            let section = '', afterSection = false;
            return pairs.map((p, i) => {
              const old = section;
              if (p.code === 0 && p.value.toUpperCase() === 'SECTION') afterSection = true;
              else if (afterSection && p.code === 2) { section = p.value.toUpperCase(); afterSection = false; }
              else if (p.code === 0 && p.value.toUpperCase() === 'ENDSEC') { section = ''; afterSection = false; }
              return { ...p, section: old || section, index: i };
            });
          }"""
          new_sectioned = """function sectioned(pairs) {
            let section = '', afterSection = false, headerVariable = '', blockName = '', blockEntity = '', entityType = '';
            return pairs.map((p, i) => {
              const old = section;
              if (p.code === 0 && p.value.toUpperCase() === 'SECTION') { afterSection = true; headerVariable = ''; blockName = ''; blockEntity = ''; entityType = ''; }
              else if (afterSection && p.code === 2) { section = p.value.toUpperCase(); afterSection = false; headerVariable = ''; blockName = ''; blockEntity = ''; entityType = ''; }
              else if (p.code === 0 && p.value.toUpperCase() === 'ENDSEC') { section = ''; afterSection = false; headerVariable = ''; blockName = ''; blockEntity = ''; entityType = ''; }
              else {
                if (section === 'HEADER' && p.code === 9) headerVariable = p.value.toUpperCase();
                if (section === 'ENTITIES' && p.code === 0) entityType = p.value.toUpperCase();
                if (section === 'BLOCKS' && p.code === 0) {
                  const type = p.value.toUpperCase();
                  if (type === 'BLOCK') { blockEntity = 'BLOCK'; blockName = ''; }
                  else if (type === 'ENDBLK') blockEntity = 'ENDBLK';
                  else blockEntity = type;
                }
                if (section === 'BLOCKS' && p.code === 2 && blockEntity === 'BLOCK' && !blockName) blockName = p.value.toUpperCase();
              }
              const result = { ...p, section: old || section, headerVariable, blockName, blockEntity, entityType, index: i };
              if (section === 'BLOCKS' && p.code === 0 && p.value.toUpperCase() === 'ENDBLK') { blockEntity = ''; blockName = ''; }
              return result;
            });
          }
          function referencedDimensionBlocks(pairs) {
            const parsed = sectioned(pairs), names = new Set();
            let currentEntity = '';
            for (const p of parsed) {
              if (p.section !== 'ENTITIES') continue;
              if (p.code === 0) currentEntity = p.value.toUpperCase();
              else if (currentEntity === 'DIMENSION' && p.code === 2 && p.value.trim()) names.add(p.value.trim().toUpperCase());
            }
            return names;
          }
          const allowedHeaderCodes = {
            '$EXTMIN': [10,20], '$EXTMAX': [10,20], '$LIMMIN': [10,20], '$LIMMAX': [10,20],
            '$PEXTMIN': [10,20], '$PEXTMAX': [10,20], '$VIEWCTR': [10,20], '$INSBASE': [10,20],
            '$SNAPBASE': [10,20], '$UCSORG': [10,20], '$VIEWSIZE': [40]
          };
          function isAllowedViewHeaderUpdate(p) {
            return p.section === 'HEADER' && Array.isArray(allowedHeaderCodes[p.headerVariable]) && allowedHeaderCodes[p.headerVariable].includes(p.code);
          }"""
          old_audit_setup = """  const a = sectioned(decodeDxf(beforeBytes)), b = sectioned(decodeDxf(afterBytes));
            const errors = [];"""
          new_audit_setup = """  const beforePairs = decodeDxf(beforeBytes);
            const a = sectioned(beforePairs), b = sectioned(decodeDxf(afterBytes));
            const dimensionBlocks = referencedDimensionBlocks(beforePairs);
            const errors = [];"""
          old_audit_body = """      if (a[i].section === 'ENTITIES' && b[i].section === 'ENTITIES' && geomCodes(a[i].code)) geometryChanged++;
                else { nonGeometryChanged++; if (errors.length<10) errors.push(`non-geometric value changed at pair ${i+1}, code ${a[i].code}: ${a[i].value.slice(0,50)} -> ${b[i].value.slice(0,50)}`); }"""
          new_audit_body = """      if (a[i].section === 'ENTITIES' && b[i].section === 'ENTITIES' && geomCodes(a[i].code)) geometryChanged++;
                else if (a[i].section === 'BLOCKS' && b[i].section === 'BLOCKS' && dimensionBlocks.has(a[i].blockName) && a[i].blockEntity && !['BLOCK','ENDBLK'].includes(a[i].blockEntity) && geomCodes(a[i].code)) geometryChanged++;
                else if (isAllowedViewHeaderUpdate(a[i]) && a[i].headerVariable === b[i].headerVariable) { /* Expected CAD view/extents update. */ }
                else { nonGeometryChanged++; if (errors.length<10) errors.push(`non-geometric value changed at pair ${i+1}, section ${a[i].section}, block ${a[i].blockName}/${a[i].blockEntity}, type ${a[i].entityType}, code ${a[i].code}: ${a[i].value.slice(0,50)} -> ${b[i].value.slice(0,50)}`); }"""
          # Exact replace the three logical sections. Indentation inside template literals is ignored by
          # checking their stripped content and replacing the raw blocks exactly once.
          for old, new, label in [
            (old_sectioned, new_sectioned, 'section metadata parser'),
            (old_audit_setup, new_audit_setup, 'audit metadata setup'),
            (old_audit_body, new_audit_body, 'audit allowed-change rules'),
          ]:
            if s.count(old) != 1:
              raise SystemExit(f'ERROR: expected one {label} in STORM regression script; found {s.count(old)}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('PASS: STORM regression audit now allows only v116 CAD view-header updates and coordinates in referenced DIMENSION graphics.')
          PY
          node --check "$STORM_TRANSFORM_TEST"
          node "$STORM_TRANSFORM_TEST" "$REFERENCE_MODULE" "$MANUAL_MODULE" "$FAITHFUL_MODULE" "$PRESERVE_MODULE" "$STORM_OUTPUT_DIR" "$STORM_OUTPUT_DIR" "$STORM_REPORT"

          rm -f "$STORM_OUTPUT_ZIP"
          (cd "$STORM_OUTPUT_DIR" && zip -q "$STORM_OUTPUT_ZIP" ./*.dxf)
          test -s "$STORM_OUTPUT_ZIP"

          python3 - "$INDEX_PATH" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re,sys

          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          if not scripts:
            raise SystemExit('ERROR: No inline JavaScript found.')
          Path(sys.argv[2]).write_text('\n'.join(scripts),encoding='utf-8')
          PY

          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: Secret SURVEYQUANT_KEY_ALIAS is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEY_PASSWORD is missing."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed APK and source patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease --stacktrace

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: Release APK was not generated."; find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true; exit 1; }

          RELEASE="$RUNNER_TEMP/sq-release"
          mkdir -p "$RELEASE/source-patch"
          cp "$APK" "$RELEASE/SurveyQuant_v1.0.117_EXTREME_ZOOM_CAD_PRESERVED.apk"
          cp "$INDEX_PATH" "$RELEASE/source-patch/index.html"
          cp "$MODULE_JS" "$RELEASE/source-patch/SurveyQuant_v1.0.106_ORIENTATION_HOME_MENU_MODULE.js"
          cp "$TEST_JS" "$RELEASE/source-patch/SurveyQuant_v1.0.106_ORIENTATION_HOME_MENU_TEST.js"
          cp "$AXIS_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.107_ORIENTATION_AXIS_READER_PATCH.js"
          cp "$AXIS_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.107_ORIENTATION_AXIS_READER_TEST.js"
          cp "$MANUAL_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.109_ORIENTATION_ZOOM_OSNAP_ID_MODULE.js"
          cp "$MANUAL_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.109_ORIENTATION_ZOOM_OSNAP_ID_TEST.js"
          cp "$REFERENCE_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.111_DXF_RECOVERY_DELETE_PICK_MODULE.js"
          cp "$REFERENCE_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.111_DXF_RECOVERY_DELETE_PICK_TEST.js"
          cp "$RUNNER_TEMP/sq-canvas-display-test.js" "$RELEASE/source-patch/SurveyQuant_v1.0.115_CANVAS_DISPLAY_REGRESSION_TEST.js"
          cp "$RUNNER_TEMP/patch-v115-board-display.py" "$RELEASE/source-patch/SurveyQuant_v1.0.115_CANVAS_DISPLAY_PATCH.py"
          cp "$RUNNER_TEMP/test-v116-cad.js" "$RELEASE/source-patch/SurveyQuant_v1.0.116_CAD_FIDELITY_TEST.js"
          cp "$RUNNER_TEMP/patch-v117-zoom.py" "$RELEASE/source-patch/SurveyQuant_v1.0.117_ZOOM_PRESERVATION_PATCH.py"
          cp "$RUNNER_TEMP/test-v117-zoom.js" "$RELEASE/source-patch/SurveyQuant_v1.0.117_ZOOM_PRESERVATION_TEST.js"
          cp "$RUNNER_TEMP/patch-v116-cad.py" "$RELEASE/source-patch/SurveyQuant_v1.0.116_CAD_FIDELITY_PATCH.py"
          cp "$RUNNER_TEMP/surveyquant-v116-orientation-regression.js" "$RELEASE/source-patch/SurveyQuant_v1.0.116_ORIENTATION_INTEGRATION_TEST.js"
          cp "$FAITHFUL_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.112_DXF_FAITHFUL_RECOVERY_MODULE.js"
          cp "$FAITHFUL_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.112_DXF_FAITHFUL_RECOVERY_TEST.js"
          cp "$PRESERVE_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.113_CAD_PRESERVE_MODULE.js"
          cp "$PRESERVE_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.113_CAD_PRESERVE_TEST.js"
          cp "$V115_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.115_ORIENTATION_TOOLS_MODULE.js"
          cp "$V115_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.115_ORIENTATION_FINAL_TEST.js"
          cp "$V115_PATCHER" "$RELEASE/source-patch/SurveyQuant_v1.0.115_APPLY_PATCH.py"
          cp "$STORM_TEST_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.115_TEST_STORM_DWG.mjs"
          cp "$STORM_TRANSFORM_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.115_TEST_STORM_TRANSFORM.mjs"
          cp "$STORM_REPORT" "$RELEASE/source-patch/STORM_CONVERSION_REPORT.md"
          cp "$STORM_OUTPUT_ZIP" "$RELEASE/STORM_CONVERTED_DXF.zip"
          cp "$DXF_TEST" "$RELEASE/source-patch/dxf-parser-restoration-test.js"

          cat > "$RELEASE/source-patch/README_AR.txt" <<'TXT'
          SurveyQuant v1.0.117 - تكبير أكبر داخل اللوحة مع الحفاظ على بيانات CAD
          - رفع حد التكبير داخل المعاينة إلى 1,000,000× دون تعديل بيانات DXF الأصلية بسبب التكبير.
          - يتضمن الاختبار ملفي STORM DWG الأصليين.
          - تم تفعيل دعم كتابة DXF في LibreDWG-Web v0.7.14.
          - تم إصلاح إنهاء النص في cquote() حتى لا تُضاف بقايا الذاكرة إلى DXF.
          - تم إصلاح حدود الرسم ومركز العرض في DXF بعد الإسقاط ($EXTMIN/$EXTMAX/$VIEWCTR/$VIEWSIZE)، حتى لا تفتح اللوحة خارج نطاق العرض.
          - معاينة اللوحة أصغر (ارتفاع ثابت 230px)، والتكبير/التصغير داخل الرسم فقط مع منع تكبير صفحة WebView.
          - معاينة بألوان ACI/TrueColor وأنماط الخطوط وسماكاتها مع قائمة إظهار/إخفاء الطبقات.
          - المعاينة ترسم حدود HATCH متعددة الرؤوس والتهشير الصلب، وعناصر MLINE، وكتل الأبعاد والنصوص التابعة لها عندما تكون موجودة في DXF.
          - تصدير DXF يحافظ على محتوى الملف والطبقات والنصوص الأصلية، ويحوّل الإحداثيات المكشوفة بدل إعادة بناء لوحة مبسطة.
          - عناصر CAD/Proxy التي لا تتيح صيغة التحويل إظهار هندستها قد لا تظهر كاملة في المعاينة، لكن الاختبار يمنع نجاح إسقاط فارغ.
          - الناتج DXF جديد ولا تتم الكتابة فوق الملف الأصلي.
          - يُراجع تقرير التحويل مع CAD للكائنات الوكيلة أو المتخصصة.
          - اختبارات البناء تتحقق من الملفين الحقيقيين قبل إنشاء APK.
          TXT

          (cd "$RELEASE/source-patch" && zip -qr "$RELEASE/SurveyQuant_v1.0.117_EXTREME_ZOOM_SOURCE_PATCH.zip" .)
          sha256sum "$RELEASE/SurveyQuant_v1.0.117_EXTREME_ZOOM_CAD_PRESERVED.apk" "$RELEASE/SurveyQuant_v1.0.117_EXTREME_ZOOM_SOURCE_PATCH.zip" "$RELEASE/STORM_CONVERTED_DXF.zip" > "$RELEASE/SHA256SUMS.txt"
          cat "$RELEASE/SHA256SUMS.txt"
          echo "RELEASE_DIR=$RELEASE" >> "$GITHUB_ENV"

      - name: Upload APK and source patch
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.117-EXTREME-ZOOM-CAD-PRESERVED
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.117_EXTREME_ZOOM_CAD_PRESERVED.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.117_EXTREME_ZOOM_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/STORM_CONVERTED_DXF.zip
            ${{ runner.temp }}/sq-release/source-patch/STORM_CONVERSION_REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload STORM conversion diagnostics even if the real-file test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.117-STORM-DIAGNOSTICS-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/STORM_CONVERSION_REPORT.md
            ${{ runner.temp }}/sq-storm-output/**
          if-no-files-found: warn
          retention-days: 14
