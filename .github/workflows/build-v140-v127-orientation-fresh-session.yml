      - name: Download the successful V136 base and exact V127 reference
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID" && test -n "$REFERENCE_RUN_ID"
          BASE_DIR="$RUNNER_TEMP/v136-base"
          REF_DIR="$RUNNER_TEMP/v127-reference"
          mkdir -p "$BASE_DIR" "$REF_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.136-UNIVERSAL-DWG-ALL-PROJECTS" --dir "$BASE_DIR"
          gh run download "$REFERENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.127-TEXT-SHRINKS-AS-ZOOM-DWG-ALL-PROJECTS" --dir "$REF_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.136_UNIVERSAL_DWG_ALL_PROJECTS_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.136_UNIVERSAL_DWG_ALL_PROJECTS_SOURCE_PATCH.zip' -print -quit)"
          REF_PATCH="$(find "$REF_DIR" -type f -name 'SurveyQuant_v1.0.127_DWG_TEXT_SHRINKS_AS_ZOOM_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V136 APK missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V136 source ZIP missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$REF_PATCH" || { echo "ERROR: V127 source ZIP missing from run $REFERENCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH"
          unzip -t "$REF_PATCH"
          mkdir -p "$RUNNER_TEMP/v140-source" "$RUNNER_TEMP/v127-source"
          unzip -q "$BASE_PATCH" -d "$RUNNER_TEMP/v140-source"
          unzip -q "$REF_PATCH" -d "$RUNNER_TEMP/v127-source"
          test -s "$RUNNER_TEMP/v140-source/index.html"
          test -s "$RUNNER_TEMP/v127-source/index.html"
          echo "V140_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V140_SOURCE_DIR=$RUNNER_TEMP/v140-source" >> "$GITHUB_ENV"
          echo "V127_SOURCE_DIR=$RUNNER_TEMP/v127-source" >> "$GITHUB_ENV"
          echo "V140_RELEASE_DIR=$RUNNER_TEMP/sq-release" >> "$GITHUB_ENV"

      - name: Restore V127 orientation byte-for-byte and clear prior board session
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$V140_RELEASE_DIR"
          python3 "$V140_PATCHER" \
            --source-html "$V140_SOURCE_DIR/index.html" \
            --reference-html "$V127_SOURCE_DIR/index.html" \
            --output-html "$V140_SOURCE_DIR/index_v140.html" \
            --report "$V140_RELEASE_DIR/V140_RESTORE_REPORT.md"
          node "$V140_TESTER" "$V140_SOURCE_DIR/index_v140.html" "$V127_SOURCE_DIR/index.html"
          if [ -s "$V127_SOURCE_DIR/SurveyQuant_v1.0.127_TEXT_ZOOM_REGRESSION_TEST.js" ]; then
            node "$V127_SOURCE_DIR/SurveyQuant_v1.0.127_TEXT_ZOOM_REGRESSION_TEST.js" "$V140_SOURCE_DIR/index_v140.html"
          fi
          node --check "$V140_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          cp "$V140_SOURCE_DIR/index_v140.html" "$V140_SOURCE_DIR/index.html"
          rm -f "$V140_SOURCE_DIR/index_v140.html"
          cp "$V140_PATCHER" "$V140_SOURCE_DIR/SurveyQuant_v1.0.140_RESTORE_V127_ORIENTATION.py"
          cp "$V140_TESTER" "$V140_SOURCE_DIR/SurveyQuant_v1.0.140_V127_SESSION_REGRESSION_TEST.js"
          cat > "$V140_SOURCE_DIR/README_V140_V127_ORIENTATION_AR.txt" <<'TXT'
          SurveyQuant V140: استعادة مشروع توجيه اللوح من V127

          - تمت استعادة أجسام 7 وحدات JavaScript الخاصة بمشروع التوجيه من مصدر V127 حرفيًا مع اختبار تطابقها.
          - تم الإبقاء على جسر DWG العام الحالي من V136 ومسار WASM وملفات المحرك.
          - تتم إزالة بيانات جلسة الرسم المؤقتة عند البدء والإخفاء، وعند الرجوع من خلفية أندرويد يعاد تحميل WebView لإسقاط اللوحات الموجودة في الذاكرة.
          - العودة من منتقي الملفات مستثناة مرة واحدة حتى لا يفقد التطبيق الملف المختار قبل استهلاكه.
          - تحفظ إعدادات الإخراج ومعرّف الجهاز وحالة الوصول/الدفع؛ لا تُحفظ اللوحات في التخزين المحلي. يتم مسح sessionStorage وقواعد IndexedDB.
          - الإصدار 1.0.140 / versionCode 140.

          الاختبارات لا تغني عن فحص ملفات DWG/DXF فعلية ونقاط تحقق مستقلة قبل استخدام المخرجات في التنفيذ المساحي.
          TXT
          test -s "$V140_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          (cd "$V140_SOURCE_DIR" && zip -qr "$V140_RELEASE_DIR/SurveyQuant_v1.0.140_V127_ORIENTATION_SOURCE_PATCH.zip" .)
          unzip -t "$V140_RELEASE_DIR/SurveyQuant_v1.0.140_V127_ORIENTATION_SOURCE_PATCH.zip" | tail -2

      - name: Inject the exact tested HTML into APK and bump Android manifest
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V140_RELEASE_DIR/SurveyQuant_v1.0.140_ORIENTATION_FRESH_SESSION_UNSIGNED.apk"
          ALIGNED="$V140_RELEASE_DIR/SurveyQuant_v1.0.140_ORIENTATION_FRESH_SESSION_ALIGNED.apk"
          FINAL="$V140_RELEASE_DIR/SurveyQuant_v1.0.140_V127_ORIENTATION_FRESH_SESSION.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V140_PATCHER" --apk-input "$V140_BASE_APK" --apk-output "$RAW" --html-to-inject "$V140_SOURCE_DIR/index.html"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='140'.*versionName='1.0.140'"
          sha256sum "$FINAL" "$V140_RELEASE_DIR/SurveyQuant_v1.0.140_V127_ORIENTATION_SOURCE_PATCH.zip" > "$V140_RELEASE_DIR/SHA256SUMS.txt"
          printf '%s\n' 'PASS V140: exact V127 orientation modules, V136 universal DWG runtime preserved, session reload on app re-entry, manifest 1.0.140/140, tests and APK signature verification passed.' > "$V140_RELEASE_DIR/V140_BUILD_RESULT.txt"
          cat "$V140_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed APK, source patch, and verification report
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.140-V127-ORIENTATION-FRESH-SESSION
          path: |
