name: Build SurveyQuant v1.0.87 - Real Projection, Restore Settings and Exact Logo

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip"
      - "SurveyQuant_v1.0.87_REAL_PROJECTION_SETTINGS_LOGO_PATCH.zip"
      - ".github/workflows/build-v87-real-projection-settings-logo.yml"

permissions:
  contents: read

env:
  SOURCE_ZIP: SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip
  PATCH_ZIP: SurveyQuant_v1.0.87_REAL_PROJECTION_SETTINGS_LOGO_PATCH.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source and patch files
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_ZIP" || { echo "ERROR: missing $SOURCE_ZIP in repository root"; exit 1; }
          test -s "$PATCH_ZIP" || { echo "ERROR: missing $PATCH_ZIP in repository root"; exit 1; }
          unzip -t "$PATCH_ZIP"
          for f in \
            index.html \
            surveyquant_logo.png \
            surveyquant_background.png \
            res/drawable-nodpi/surveyquant_app_logo.png \
            res/mipmap-anydpi-v26/ic_launcher.xml \
            res/mipmap-anydpi-v26/ic_launcher_round.xml \
            res/drawable/ic_surveyquant_foreground.xml \
            res/drawable/ic_surveyquant.xml; do
            unzip -Z1 "$PATCH_ZIP" | grep -Fxq "$f" || { echo "ERROR: patch missing $f"; exit 1; }
          done

      - name: Extract source and patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$PATCH_ZIP" -d "$RUNNER_TEMP/sq-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$PROJECT" || { echo "ERROR: app/build.gradle not found in source ZIP"; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Apply only patched app HTML, background and exact logo resources
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$PROJECT_DIR/app/src/main/assets"
          RES="$PROJECT_DIR/app/src/main/res"
          test -d "$ASSETS" || { echo "ERROR: Android assets directory not found"; exit 1; }
          mkdir -p "$RES/drawable-nodpi" "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cp "$RUNNER_TEMP/sq-patch/index.html" "$ASSETS/index.html"
          cp "$RUNNER_TEMP/sq-patch/surveyquant_logo.png" "$ASSETS/surveyquant_logo.png"
          cp "$RUNNER_TEMP/sq-patch/surveyquant_background.png" "$ASSETS/surveyquant_background.png"
          cp "$RUNNER_TEMP/sq-patch/res/drawable-nodpi/surveyquant_app_logo.png" "$RES/drawable-nodpi/surveyquant_app_logo.png"
          cp "$RUNNER_TEMP/sq-patch/res/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          cp "$RUNNER_TEMP/sq-patch/res/mipmap-anydpi-v26/ic_launcher_round.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          cp "$RUNNER_TEMP/sq-patch/res/drawable/ic_surveyquant_foreground.xml" "$RES/drawable/ic_surveyquant_foreground.xml"
          cp "$RUNNER_TEMP/sq-patch/res/drawable/ic_surveyquant.xml" "$RES/drawable/ic_surveyquant.xml"
          cmp -s "$ASSETS/surveyquant_logo.png" "$RES/drawable-nodpi/surveyquant_app_logo.png"
          test -s "$ASSETS/surveyquant_background.png"
          grep -Fq 'surveyquant_background.png' "$ASSETS/index.html"
          grep -Fq 'surveyquant_logo.png' "$ASSETS/index.html"
          grep -Fq 'installProjectSettingsPanels();' "$ASSETS/index.html"
          grep -Fq 'sq-project-settings' "$ASSETS/index.html"
          grep -Fq "profileCard:{key:'profile'" "$ASSETS/index.html"
          grep -Fq 'qcmpBeforeContourColor' "$ASSETS/index.html"
          grep -Fq 'qcmpAfterContourColor' "$ASSETS/index.html"
          grep -Fq 'compareLevelTypeBefore' "$ASSETS/index.html"
          grep -Fq 'compareLevelTypeAfter' "$ASSETS/index.html"
          grep -Fq 'LAYER 1 / BEFORE - STANDALONE QUANTITY' "$ASSETS/index.html"
          grep -Fq 'LAYER 2 / AFTER - STANDALONE QUANTITY' "$ASSETS/index.html"
          grep -Fq 'DIFFERENCE OF STANDALONE NETS' "$ASSETS/index.html"
          grep -Fq 'function preserveOriginalDXFWithAdditions' "$ASSETS/index.html"
          grep -Fq 'X = Easting' "$ASSETS/index.html"
          grep -Fq '@drawable/surveyquant_app_logo' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -Fq '@drawable/surveyquant_app_logo' "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Validate embedded JavaScript and Android icon XML
        shell: bash
        run: |
          set -euo pipefail
          node - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const re = /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          const scripts = [];
          let match;
          while ((match = re.exec(html)) !== null) if (match[1].trim()) scripts.push(match[1]);
          if (!scripts.length) throw new Error('No inline JavaScript found');
          fs.writeFileSync(process.argv[3], scripts.join('\n'));
          NODE
          node --check "$RUNNER_TEMP/surveyquant-inline.js"
          python3 - "$RUNNER_TEMP/sq-patch/res/mipmap-anydpi-v26/ic_launcher.xml" "$RUNNER_TEMP/sq-patch/res/mipmap-anydpi-v26/ic_launcher_round.xml" "$RUNNER_TEMP/sq-patch/res/drawable/ic_surveyquant_foreground.xml" "$RUNNER_TEMP/sq-patch/res/drawable/ic_surveyquant.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for name in sys.argv[1:]: ET.parse(name)
          print('All patched Android icon XML resources are well-formed.')
          PY

      - name: Set app version to 1.0.87
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          grep -q 'versionCode' "$BUILD_FILE"
          grep -q 'versionName' "$BUILD_FILE"
          sed -E -i "0,/versionCode[[:space:]]+[0-9]+/s//versionCode 87/" "$BUILD_FILE"
          sed -E -i "0,/versionName[[:space:]]+['\"][^'\"]+['\"]/s//versionName '1.0.87'/" "$BUILD_FILE"
          grep -Fq "versionCode 87" "$BUILD_FILE"
          grep -Fq "versionName '1.0.87'" "$BUILD_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD is empty"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: SURVEYQUANT_KEY_ALIAS is empty"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEY_PASSWORD is empty"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.keystore"
          {
            echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.keystore"
            echo "SURVEYQUANT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SURVEYQUANT_KEY_ALIAS=$KEY_ALIAS"
            echo "SURVEYQUANT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Collect APK only
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"
          test -n "$APK" || { echo "ERROR: release APK was not produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/SurveyQuant_v1.0.87_REAL_PROJECTION_SETTINGS_LOGO.apk"

      - name: Upload APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.87-REAL-PROJECTION-SETTINGS-LOGO
          path: release/SurveyQuant_v1.0.87_REAL_PROJECTION_SETTINGS_LOGO.apk
          if-no-files-found: error
