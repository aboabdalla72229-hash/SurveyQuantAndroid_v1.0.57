name: Build SurveyQuant v1.0.172 Static Home Projects + PDF IMAGE DXF Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V170 Android build run ID"
        required: true
        type: string
        default: "41203485156"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v172-static-home-projects-pdf-image-pair.yml"
      - "SurveyQuant_v1.0.172_UPLOAD_BUNDLE*.zip"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v172-static-home-projects-pdf-image-pair
  cancel-in-progress: false

jobs:
  build_v172:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41203485156' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract V172 upload bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          KIT="$RUNNER_TEMP/v172-kit"
          BUNDLE="$(find "$ROOT" -maxdepth 2 -type f -iname 'SurveyQuant_v1.0.172_UPLOAD_BUNDLE*.zip' -size +0c -print -quit)"
          test -n "$BUNDLE" || { echo "ERROR: Upload SurveyQuant_v1.0.172_UPLOAD_BUNDLE.zip to repository root."; exit 1; }
          rm -rf "$KIT"; mkdir -p "$KIT"
          unzip -t "$BUNDLE" | tail -2
          unzip -q "$BUNDLE" -d "$KIT"
          for f in \
            SurveyQuant_v1.0.172_PATCH.py SurveyQuant_v1.0.172_CAD_ENGINE.js \
            SurveyQuant_v1.0.172_CAD_ENGINE_TEST.js SurveyQuant_v1.0.172_APP_REGRESSION_TEST.js \
            SurveyQuant_v1.0.172_IMAGE_DXF_TEST.py SurveyQuant_v1.0.172_PACKAGE_FREE_APK.py \
            README_V172_AR.md V172_TEST_REPORT_AR.txt; do
            test -s "$KIT/$f" || { echo "ERROR: V172 bundle member missing: $f"; exit 1; }
          done
          echo "V172_KIT=$KIT" >> "$GITHUB_ENV"
          echo "PASS: V172 upload bundle validated."

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install independent DXF and raster validators
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ezdxf pillow

      - name: Download the successful V170 APK and complete source
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v170-base"
          SOURCE_DIR="$RUNNER_TEMP/v172-source"
          RELEASE_DIR="$RUNNER_TEMP/v172-release"
          TEST_DIR="$RUNNER_TEMP/v172-test"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR" "$TEST_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR" "$TEST_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "SurveyQuant-v1.0.170-FREE-ORIENTATION-BOARD-VIEWPORT-PDF-WORKER" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.170_FREE_ANDROID_ORIENTATION_VIEW_PDF_WORKER.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.170_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V170 signed APK missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V170 complete source patch missing from run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V172_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V172_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V172_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "V172_TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"

      - name: Apply V172 shortcuts and standard raster IMAGE DXF output
        shell: bash
        run: |
          set -euo pipefail
          cp "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE.js" "$V172_SOURCE_DIR/"
          cp "$V172_KIT/SurveyQuant_v1.0.172_PATCH.py" "$V172_SOURCE_DIR/"
          cp "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE_TEST.js" "$V172_SOURCE_DIR/"
          cp "$V172_KIT/SurveyQuant_v1.0.172_APP_REGRESSION_TEST.js" "$V172_SOURCE_DIR/"
          cp "$V172_KIT/SurveyQuant_v1.0.172_IMAGE_DXF_TEST.py" "$V172_SOURCE_DIR/"
          cp "$V172_KIT/SurveyQuant_v1.0.172_PACKAGE_FREE_APK.py" "$V172_SOURCE_DIR/"
          python3 "$V172_KIT/SurveyQuant_v1.0.172_PATCH.py" \
            --html "$V172_SOURCE_DIR/index.html" \
            --engine "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE.js"
          python3 "$V172_KIT/SurveyQuant_v1.0.172_PATCH.py" \
            --html "$V172_SOURCE_DIR/index.html" \
            --engine "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE.js" --check-only
          cp "$V172_KIT/README_V172_AR.md" "$V172_SOURCE_DIR/"
          cp "$V172_KIT/V172_TEST_REPORT_AR.txt" "$V172_SOURCE_DIR/"
          cp "$V172_KIT/README_V172_AR.md" "$V172_RELEASE_DIR/"
          cp "$V172_KIT/V172_TEST_REPORT_AR.txt" "$V172_RELEASE_DIR/"

      - name: Test ten static home project icons, IMAGE DXF, and preserved CAD behavior
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$V172_SOURCE_DIR/V170_TEST_TILE_0.jpg"
          test -s "$FIXTURE"
          node "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE_TEST.js" \
            "$FIXTURE" "$V172_TEST_DIR/SurveyQuant_v1.0.172_PDF_IMAGE_TEST.dxf"
          cp "$FIXTURE" "$V172_TEST_DIR/V172_PDF_PAGE_REGRESSION.jpg"
          python3 "$V172_KIT/SurveyQuant_v1.0.172_IMAGE_DXF_TEST.py" \
            "$V172_TEST_DIR/SurveyQuant_v1.0.172_PDF_IMAGE_TEST.dxf" \
            "$V172_TEST_DIR/V172_PDF_PAGE_REGRESSION.jpg" \
            --report "$V172_RELEASE_DIR/V172_PDF_IMAGE_DXF_AUDIT.json"
          node "$V172_KIT/SurveyQuant_v1.0.172_APP_REGRESSION_TEST.js" \
            "$V172_SOURCE_DIR/index.html" "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE.js"
          # Keep the V170 orientation, block-axis, snap, zoom and file-identity regression suite.
          node "$V172_SOURCE_DIR/SurveyQuant_v1.0.170_REGRESSION_TEST.js" \
            "$V172_SOURCE_DIR/V170_TEST_TILE_0.jpg" "$V172_SOURCE_DIR/V170_TEST_TILE_1.jpg" \
            "$V172_SOURCE_DIR/V170_TEST_TILE_2.jpg" "$V172_SOURCE_DIR/V170_TEST_TILE_3.jpg" \
            "$V172_TEST_DIR/V170_LEGACY_OLE_READER_TEST.dxf"
          node "$V172_SOURCE_DIR/SurveyQuant_v1.0.170_DWG_WASM_BINARY_TEST.js" \
            "$V172_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js" \
            "$V172_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm" \
            "$V172_SOURCE_DIR/libredwg-writer/dist/libredwg-web.js"

      - name: Syntax-check source and inline app JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "$V172_KIT/SurveyQuant_v1.0.172_PATCH.py" \
            "$V172_KIT/SurveyQuant_v1.0.172_IMAGE_DXF_TEST.py" \
            "$V172_KIT/SurveyQuant_v1.0.172_PACKAGE_FREE_APK.py"
          for js in \
            "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE.js" \
            "$V172_KIT/SurveyQuant_v1.0.172_CAD_ENGINE_TEST.js" \
            "$V172_KIT/SurveyQuant_v1.0.172_APP_REGRESSION_TEST.js" \
            "$V172_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"; do node --check "$js"; done
          INLINE_DIR="$RUNNER_TEMP/v172-inline-check"; rm -rf "$INLINE_DIR"; mkdir -p "$INLINE_DIR"
          python3 - "$V172_SOURCE_DIR/index.html" "$INLINE_DIR" <<'PY'
          from pathlib import Path
          import re,sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8'); out=Path(sys.argv[2]); count=0
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I)):
              attrs,body=m.group(1),m.group(2); typ=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              if not body.strip() or (typ and typ.group(1).lower() not in ('text/javascript','application/javascript','module')): continue
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              (out/f'inline-{i}.js').write_text(body,encoding='utf-8'); count+=1
          if not count: raise SystemExit('No executable inline JavaScript was found')
          print(f'PASS: extracted {count} executable inline scripts')
          PY
          for js in "$INLINE_DIR"/*.js; do node --check "$js"; done
          echo "PASS: V172 syntax, ten static home project buttons (8 original + 2 new), IMAGE DXF, V170 regression suite and WASM initialization."

      - name: Prepare complete V172 source patch
        shell: bash
        run: |
          set -euo pipefail
          cp "$V172_KIT/THIRD_PARTY_NOTICES.md" "$V172_SOURCE_DIR/" 2>/dev/null || true
          rm -rf "$V172_SOURCE_DIR/__pycache__"
          (cd "$V172_SOURCE_DIR" && zip -qr "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_SOURCE_PATCH.zip" | tail -2

      - name: Package V172 APK from the signed V170 Android base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V172_KIT/SurveyQuant_v1.0.172_PACKAGE_FREE_APK.py" \
            --apk-input "$V172_BASE_APK" \
            --apk-output "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_UNSIGNED.apk" \
            --html-to-inject "$V172_SOURCE_DIR/index.html" \
            --wasm-loader "$V172_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_UNSIGNED.apk" <<'PY'
          import sys,zipfile
          from pathlib import Path
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              names=z.namelist(); html=z.read('assets/index.html')
              for marker in (b'sq172-static-visible-home-project-shortcuts-pdf-image-pair',b'sq163-cad-engine',b'sq163-pdfjs-worker',b'sq162-wasm-binary'):
                  if marker not in html: raise SystemExit('V172 APK missing marker: '+marker.decode())
              if not any(n.startswith('lib/arm64-v8a/') for n in names): raise SystemExit('ARM64 runtime missing')
              for abi in ('lib/x86/','lib/x86_64/'):
                  if any(n.startswith(abi) for n in names): raise SystemExit('Unexpected x86 payload '+abi)
          print('PASS V172 APK package: patched HTML, embedded PDF worker, LibreDWG WASM and ARM64 runtime present.')
          PY

      - name: Sign, align and verify the final Android APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_ALIGNED.apk"
          FINAL="$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_ANDROID_PDF_IMAGE_DXF.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='172'.*versionName='1.0.172'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_UNSIGNED.apk"

      - name: Include PDF IMAGE DXF test pair and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "$V172_TEST_DIR/SurveyQuant_v1.0.172_PDF_IMAGE_TEST.dxf" "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_PDF_IMAGE_TEST.dxf"
          cp "$V172_TEST_DIR/V172_PDF_PAGE_REGRESSION.jpg" "$V172_RELEASE_DIR/V172_PDF_PAGE_REGRESSION.jpg"
          sha256sum \
            "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_ANDROID_PDF_IMAGE_DXF.apk" \
            "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_FREE_SOURCE_PATCH.zip" \
            "$V172_RELEASE_DIR/SurveyQuant_v1.0.172_PDF_IMAGE_TEST.dxf" \
            "$V172_RELEASE_DIR/V172_PDF_PAGE_REGRESSION.jpg" > "$V172_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V172_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload V172 APK, source patch, and DXF test pair
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.172-FREE-HOME-SHORTCUTS-PDF-IMAGE-DXF
          path: |
            ${{ runner.temp }}/v172-release/SurveyQuant_v1.0.172_FREE_ANDROID_PDF_IMAGE_DXF.apk
            ${{ runner.temp }}/v172-release/SurveyQuant_v1.0.172_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v172-release/SurveyQuant_v1.0.172_PDF_IMAGE_TEST.dxf
            ${{ runner.temp }}/v172-release/V172_PDF_PAGE_REGRESSION.jpg
            ${{ runner.temp }}/v172-release/V172_PDF_IMAGE_DXF_AUDIT.json
            ${{ runner.temp }}/v172-release/README_V172_AR.md
            ${{ runner.temp }}/v172-release/V172_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v172-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable V172 GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.172
          name: SurveyQuant v1.0.172 - Home Project Shortcuts + PDF IMAGE DXF
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: ${{ runner.temp }}/v172-release/README_V172_AR.md
          files: |
            ${{ runner.temp }}/v172-release/SurveyQuant_v1.0.172_FREE_ANDROID_PDF_IMAGE_DXF.apk
            ${{ runner.temp }}/v172-release/SurveyQuant_v1.0.172_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v172-release/SurveyQuant_v1.0.172_PDF_IMAGE_TEST.dxf
            ${{ runner.temp }}/v172-release/V172_PDF_PAGE_REGRESSION.jpg
            ${{ runner.temp }}/v172-release/V172_PDF_IMAGE_DXF_AUDIT.json
            ${{ runner.temp }}/v172-release/SHA256SUMS.txt
