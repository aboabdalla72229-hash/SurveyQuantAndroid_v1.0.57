name: Build SurveyQuant v1.0.60

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          }

          test -f app/src/main/assets/index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          echo "Project structure OK"

      - name: Verify version
        shell: bash
        run: |
          set -e

          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          grep -qE "versionCode[[:space:]]+60" app/build.gradle || {
            echo "ERROR: versionCode 60 not found"
            exit 1
          }

          grep -qE "versionName[[:space:]]+['\"]1\.0\.60['\"]" app/build.gradle || {
            echo "ERROR: versionName 1.0.60 not found"
            exit 1
          }

          echo "Version 1.0.60 verified"

      - name: Decode signing keystore
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || {
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is missing"
            exit 1
          }

          echo "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > surveyquant-ci.jks

          test -s surveyquant-ci.jks

          echo "Keystore decoded successfully"

      - name: Build signed release APK
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD"
          test -n "$SURVEYQUANT_KEY_ALIAS"
          test -n "$SURVEYQUANT_KEY_PASSWORD"

          chmod +x ./gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/surveyquant-ci.jks" \
            -Pandroid.injected.signing.store.password="$SURVEYQUANT_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SURVEYQUANT_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SURVEYQUANT_KEY_PASSWORD"

      - name: Find APK
        shell: bash
        run: |
          set -e

          find app/build/outputs/apk -type f -name "*.apk" -print

          test -n "$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.60-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
