name: Build SurveyQuant v1.0.134 - Android WebView classic DWG runtime R3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v134-webview-classic-dwg-r3.yml"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Checkout pinned LibreDWG source for the historical V126 build recipe
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-web
          persist-credentials: false

      - name: Checkout isolated LibreDWG source for offline APK assets
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-v134
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Emscripten for LibreDWG WebAssembly
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Set up Android SDK and Gradle
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate and unpack V126 base, V129, V130, V131 and embedded V134 kit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-yaml unzip zip build-essential autoconf automake libtool libtool-bin pkg-config gettext zlib1g-dev libpcre2-dev flex bison texinfo python3-dev

          BASE_KIT="SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.zip"
          PATCH_KIT="SurveyQuant_v1.0.129_SELECT_DELETE_UNDO_REDO_PATCH.zip"
          V130_KIT="SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_PATCH.zip"
          V131_KIT="SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.zip"
          V134_KIT="SurveyQuant_v1.0.134_OFFLINE_DWG_DXF_EXACT_LAND_QUAD_PATCH.zip"
          # Self-contained recovery: the exact V134 source patch is embedded below.
          # Missing or stale companion ZIPs are recreated and verified by SHA-256.
          EXPECTED_V134_SHA256="e399d53c4e4993a048ea4d7612838fc8dabc553fca494f50c0ea52bc8f0164ba"
          EMBEDDED_V134="$RUNNER_TEMP/SurveyQuant_v1.0.134_OFFLINE_DWG_DXF_EXACT_LAND_QUAD_PATCH.zip"
          cat > "$RUNNER_TEMP/v134_patch.b64" <<'V134_PATCH_B64'
