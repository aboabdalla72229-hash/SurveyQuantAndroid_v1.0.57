name: Build SurveyQuant v1.0.57 PATCH4

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip"
      - ".github/workflows/build-v57.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -s SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip || {
            echo "ERROR: Source ZIP not found"
            exit 1
          }

          echo "Source ZIP found successfully."

      - name: Extract source
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip \
            -d extracted

          echo "Source extracted successfully."

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."

          find extracted -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Detect project directory
        run: |
          PROJECT_DIR=$(find extracted -type f -name "gradlew" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found"
            echo "Contents of extracted:"
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project detected:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          echo "Building SurveyQuant v1.0.57 PATCH4..."

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} output/ \;

          echo "Generated APK files:"
          ls -lah output

          if ! ls output/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Generate SHA256
        run: |
          cd output

          sha256sum *.apk > SHA256SUMS.txt

          echo "SHA256:"
          cat SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57-PATCH4-APK
          path: output/
          if-no-files-found: error
