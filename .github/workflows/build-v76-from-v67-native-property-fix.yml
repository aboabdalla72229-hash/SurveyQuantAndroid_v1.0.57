name: Build SurveyQuant v1.0.76

on:
  workflow_dispatch:
  push:
    paths:
      - 'SurveyQuantAndroid_v1.0.76_FROM_V67_NATIVE_PROPERTY_FIX.zip'
      - '.github/workflows/build-v76-from-v67-native-property-fix.yml'

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.76_FROM_V67_NATIVE_PROPERTY_FIX.zip

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and extract Android source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$SOURCE_NAME"
          test -s "$ZIP" || {
            echo "ERROR: Source ZIP not found: $ZIP"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          }

          rm -rf "$RUNNER_TEMP/sq-source"
          mkdir -p "$RUNNER_TEMP/sq-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/sq-source"

          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Android project not found inside ZIP"
            find "$RUNNER_TEMP/sq-source" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/build.gradle"
          test -s "$PROJECT/app/build.gradle"
          test -s "$PROJECT/app/src/main/assets/index.html"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KS_B64" || { echo "ERROR: Missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: Missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: Missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: Missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }

          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.jks"
          test -s "$RUNNER_TEMP/surveyquant-release.jks"
          echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.jks" >> "$GITHUB_ENV"

      - name: Validate version and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          grep -q "versionCode 76" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.0.76'" "$PROJECT_DIR/app/build.gradle"

          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          import pathlib
          import re
          import sys

          html = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          pathlib.Path(sys.argv[2]).write_text('\n'.join(scripts), encoding='utf-8')
          PY

          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || {
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null | sort || true
            exit 1
          }

          mkdir -p "$PROJECT_DIR/release"
          cp "$APK" "$PROJECT_DIR/release/SurveyQuant-v1.0.76-from-v67-release.apk"
          sha256sum "$PROJECT_DIR/release/SurveyQuant-v1.0.76-from-v67-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.76-from-v67-release
          path: ${{ env.PROJECT_DIR }}/release/SurveyQuant-v1.0.76-from-v67-release.apk
          if-no-files-found: error
