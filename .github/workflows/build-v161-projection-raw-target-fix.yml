name: Build SurveyQuant v1.0.161 Projection Raw-Target Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V159 Universal Fast DWG artifact run ID"
        required: true
        type: string
        default: "40514133976"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v161-projection-raw-target-fix.yml"
      - "SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py"
      - "SurveyQuant_v1.0.160_PROJECTION_TEST.js"
      - "SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_FIX.py"
      - "SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_TEST.js"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v161-projection-raw-target-fix
  cancel-in-progress: false

jobs:
  build_v161:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40514133976' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download successful V159 APK and source bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v159-base"
          SOURCE_DIR="$RUNNER_TEMP/v161-source"
          RELEASE_DIR="$RUNNER_TEMP/v161-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.159-FREE-UNIVERSAL-FAST-DWG" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.159_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.159_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V159 APK missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V159 source patch missing from run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V161_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V161_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V161_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Apply V160 memory patch and run its regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py" --html "$V161_SOURCE_DIR/index.html"
          python3 "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py" --html "$V161_SOURCE_DIR/index.html" --check-only
          node "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_TEST.js" "$V161_SOURCE_DIR/index.html"

      - name: Apply V161 raw-reference optimization and test
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_FIX.py" --html "$V161_SOURCE_DIR/index.html"
          python3 "$GITHUB_WORKSPACE/SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_FIX.py" --html "$V161_SOURCE_DIR/index.html" --check-only
          node "$GITHUB_WORKSPACE/SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_TEST.js" "$V161_SOURCE_DIR/index.html"
          cp "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py" "$V161_SOURCE_DIR/"
          cp "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_TEST.js" "$V161_SOURCE_DIR/"
          cp "$GITHUB_WORKSPACE/SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_FIX.py" "$V161_SOURCE_DIR/"
          cp "$GITHUB_WORKSPACE/SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_TEST.js" "$V161_SOURCE_DIR/"
          python3 -m py_compile "$V161_SOURCE_DIR/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py" "$V161_SOURCE_DIR/SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_FIX.py"
          node --check "$V161_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$V161_SOURCE_DIR/index.html" "$RUNNER_TEMP/surveyquant-inline-check.js" <<'PY'
          from pathlib import Path
          import re,sys
          html=Path(sys.argv[1]).read_text(encoding="utf-8")
          scripts=re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>",html,re.I)
          if not scripts: raise SystemExit("No inline scripts found in patched index.html")
          Path(sys.argv[2]).write_text("\n;\n".join(scripts),encoding="utf-8")
          print(f"Found {len(scripts)} inline script blocks for JavaScript syntax verification")
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline-check.js"

      - name: Prepare V161 package builder based on the V159 builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$V161_SOURCE_DIR/SurveyQuant_v1.0.159_PACKAGE_FREE_APK.py" "$V161_SOURCE_DIR/SurveyQuant_v1.0.161_PACKAGE_FREE_APK.py" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text(encoding="utf-8")
          pairs=[
            ("OLD_NAME = '1.0.158'","OLD_NAME = '1.0.159'"),
            ("NEW_NAME = '1.0.159'","NEW_NAME = '1.0.161'"),
            ("NEW_CODE = 159","NEW_CODE = 161"),
          ]
          for old,new in pairs:
              if src.count(old)!=1: raise SystemExit(f"Missing or duplicate package version marker: {old}")
              src=src.replace(old,new,1)
          src=src.replace("V159","V161")
          src=src.replace("1.0.156/156","1.0.161/161")
          src=src.replace("bump APK version to 1.0.156","bump APK version to 1.0.161")
          old_marker="'function parseDWGDatabase(db){'"
          if src.count(old_marker)!=1: raise SystemExit(f"Missing or duplicate package HTML marker: {old_marker}")
          src=src.replace(old_marker,"'function parseDWGDatabase(db,options={}){'",1)
          Path(sys.argv[2]).write_text(src,encoding="utf-8")
          PY
          python3 -m py_compile "$V161_SOURCE_DIR/SurveyQuant_v1.0.161_PACKAGE_FREE_APK.py"

      - name: Package V161 APK with the optimized shared DWG reader
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V161_SOURCE_DIR/SurveyQuant_v1.0.161_PACKAGE_FREE_APK.py" \
            --apk-input "$V161_BASE_APK" \
            --apk-output "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_UNSIGNED.apk" \
            --html-to-inject "$V161_SOURCE_DIR/index.html"
          test -s "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_UNSIGNED.apk"
          python3 - "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_UNSIGNED.apk" "$V161_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js" <<'PY'
          from pathlib import Path
          import copy,sys,zipfile
          apk=Path(sys.argv[1]); fixed=Path(sys.argv[2]).read_bytes(); temp=apk.with_suffix(".patched.apk")
          target="assets/libredwg-writer/wasm/libredwg-web.js"
          removed=[]
          with zipfile.ZipFile(apk,"r") as zin:
              names=[x.filename for x in zin.infolist()]
              if names.count(target)!=1: raise SystemExit(f"Expected one {target}; found {names.count(target)}")
              has_arm64=any(n.startswith("lib/arm64-v8a/") for n in names)
              has_armv7=any(n.startswith("lib/armeabi-v7a/") for n in names)
              if not has_arm64: raise SystemExit("Refusing phone APK: arm64-v8a native libraries are missing")
              with zipfile.ZipFile(temp,"w",allowZip64=True) as zout:
                  for info in zin.infolist():
                      if info.filename.startswith(("lib/x86/","lib/x86_64/")):
                          removed.append(info.filename); continue
                      zout.writestr(copy.copy(info),fixed if info.filename==target else zin.read(info.filename))
          temp.replace(apk)
          with zipfile.ZipFile(apk,"r") as z:
              names=set(z.namelist())
              if any(n.startswith(("lib/x86/","lib/x86_64/")) for n in names): raise SystemExit("x86 libraries remain")
              if not any(n.startswith("lib/arm64-v8a/") for n in names): raise SystemExit("ARM64 libraries missing after ABI trim")
              if has_armv7 and not any(n.startswith("lib/armeabi-v7a/") for n in names): raise SystemExit("ARMv7 libraries unexpectedly removed")
              embedded=z.read(target)
              if embedded!=fixed: raise SystemExit("Embedded DWG WASM loader differs from corrected runtime")
              if b'new Promise((reject,resolve)=>{var xhr=new XMLHttpRequest;xhr.open("GET",url,true)' in embedded: raise SystemExit("Inverted WASM Promise remains in APK")
              if b'new Promise((resolve,reject)=>{var xhr=new XMLHttpRequest;xhr.open("GET",url,true)' not in embedded: raise SystemExit("Corrected WASM Promise missing in APK")
          print(f"PASS: corrected WebAssembly loader embedded; removed {len(removed)} optional x86/x86_64 native files")
          PY

      - name: Sign and verify V161 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_ALIGNED.apk"
          FINAL="$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_ANDROID_WEBVIEW_WASM_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='161'.*versionName='1.0.161'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_UNSIGNED.apk"

      - name: Package source patch, changelog, and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$V161_SOURCE_DIR/SurveyQuant_v1.0.159_PACKAGE_FREE_APK.py"
          rm -rf "$V161_SOURCE_DIR/__pycache__"
          cat > "$V161_SOURCE_DIR/README_V161_PROJECTION_RAW_TARGET_FIX_AR.md" <<'TXT'
          # SurveyQuant v1.0.161: تسريع إسقاط DWG وتقليل استهلاك الذاكرة
          - ملف اللوحة المرجعية DWG يُحوَّل إلى DXF للاحتفاظ ببايتاته وطبقاته الأصلية دون بناء نسخة JavaScript كاملة لكل العناصر.
          - ملف المرجع DXF يُستخدم كبيانات أصلية مباشرة دون تحليله مرة أخرى إلى كائنات هندسية كثيرة.
          - تقليل مصفوفات وسيطة غير لازمة في قراءة ملف المصدر مع الإبقاء على كيانات المصدر المستخدمة في الإسقاط.
          - استمرار دمج عناصر المصدر داخل بيانات المرجع الأصلية، من دون إعادة رسم اللوحة المرجعية.
          - اجتازت اختبارات الصياغة وفحوصات regression للشفرة. يلزم اختبار ملفي DWG الحقيقيين على الهاتف للتأكد من زوال الخروج المفاجئ.
          TXT
          (cd "$V161_SOURCE_DIR" && zip -qr "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_SOURCE_PATCH.zip" | tail -2
          printf '%s\n' '# SurveyQuant v1.0.161 Projection Raw-Target Fix' '- Reference DWG uses conversion-only mode; reference DXF uses raw bytes directly.' '- Avoids a full reference entity model and clone during projection.' '- Reduces unused geometry side arrays while preserving source entities used for overlay.' '- Automated syntax and regression checks pass; real two-DWG phone testing remains required.' > "$V161_RELEASE_DIR/V161_CHANGELOG_EN.txt"
          cp "$V161_SOURCE_DIR/README_V161_PROJECTION_RAW_TARGET_FIX_AR.md" "$V161_RELEASE_DIR/V161_CHANGELOG_AR.md"
          sha256sum "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_ANDROID_WEBVIEW_WASM_FIX.apk" "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_SOURCE_PATCH.zip" > "$V161_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V161_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload verified V161 APK and patch
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.161-FREE-PROJECTION-RAW-TARGET-FIX
          path: |
            ${{ runner.temp }}/v161-release/SurveyQuant_v1.0.161_FREE_ANDROID_WEBVIEW_WASM_FIX.apk
            ${{ runner.temp }}/v161-release/SurveyQuant_v1.0.161_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v161-release/V161_CHANGELOG_AR.md
            ${{ runner.temp }}/v161-release/V161_CHANGELOG_EN.txt
            ${{ runner.temp }}/v161-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish new V161 release without replacing immutable assets
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.161 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.161 already exists and will not be overwritten. APK and patch remain in the Actions artifact."
          else
            gh release create v1.0.161 \
              "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_ANDROID_WEBVIEW_WASM_FIX.apk" \
              "$V161_RELEASE_DIR/SurveyQuant_v1.0.161_FREE_SOURCE_PATCH.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SurveyQuant v1.0.161 - Projection Raw-Target Fix" \
              --notes-file "$V161_RELEASE_DIR/V161_CHANGELOG_AR.md"
          fi
          echo "Release page, if created: https://github.com/$GITHUB_REPOSITORY/releases/tag/v1.0.161"
