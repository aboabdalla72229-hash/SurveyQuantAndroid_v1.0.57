name: Build SurveyQuant v1.0.144 - MLeader Alignment Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V140 base artifact run ID"
        required: true
        type: string
        default: "39964262110"
      reference_run_id:
        description: "Successful V130 orientation/DWG reference artifact run ID"
        required: true
        type: string
        default: "39560732493"
  push:
    paths:
      - ".github/workflows/build-v144-mleader-alignment.yml"
      - "SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_PATCH_KIT.zip"

permissions:
  actions: read
  contents: read

jobs:
  build_v144:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '39964262110' }}
      REFERENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_run_id || '39560732493' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Check out workflow and patch kit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DXF oracle test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ezdxf==1.4.4"
          python - <<'PY'
          import ezdxf
          assert ezdxf.__version__ == "1.4.4", ezdxf.__version__
          print("PASS: pinned ezdxf oracle test dependency.")
          PY

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android build tools configured."

      - name: Validate kit and download successful V140 base and V130 reference
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_PATCH_KIT.zip"
          test -s "$KIT" || { echo "ERROR: Upload SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_PATCH_KIT.zip to repository root first."; exit 1; }
          unzip -t "$KIT"
          KIT_DIR="$RUNNER_TEMP/v144-kit"
          BASE_DIR="$RUNNER_TEMP/v140-base"
          REF_DIR="$RUNNER_TEMP/v130-reference"
          rm -rf "$KIT_DIR" "$BASE_DIR" "$REF_DIR"
          mkdir -p "$KIT_DIR" "$BASE_DIR" "$REF_DIR"
          unzip -q "$KIT" -d "$KIT_DIR"

          PRECISION_PATCHER="$KIT_DIR/SurveyQuant_v1.0.143_APPLY_ORIENTATION_PRECISION_PATCH.py"
          PRECISION_TEST="$KIT_DIR/SurveyQuant_v1.0.144_ORIENTATION_PRECISION_TEST.js"
          ALIGNER="$KIT_DIR/SurveyQuant_v1.0.143_APPLY_ORIENTATION_ALIGNMENT_PATCH.py"
          SAFETY_TEST="$KIT_DIR/SurveyQuant_v1.0.144_ALIGNMENT_SAFETY_TEST.js"
          MLEADER_PATCHER="$KIT_DIR/SurveyQuant_v1.0.144_APPLY_MLEADER_ALIGNMENT_PATCH.py"
          MLEADER_TEST="$KIT_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_TEST.js"
          PACKAGE_APK="$KIT_DIR/SurveyQuant_v1.0.144_PACKAGE_APK.py"
          REAL_ORACLE="$KIT_DIR/SurveyQuant_v1.0.144_REAL_MLEADER_ORACLE_TEST.py"
          REAL_RUNNER="$KIT_DIR/SurveyQuant_v1.0.144_REAL_MLEADER_TRANSFORM_RUNNER.js"
          DWG_TEST="$KIT_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"
          for f in "$PRECISION_PATCHER" "$PRECISION_TEST" "$ALIGNER" "$SAFETY_TEST" "$MLEADER_PATCHER" "$MLEADER_TEST" "$PACKAGE_APK" "$REAL_ORACLE" "$REAL_RUNNER" "$DWG_TEST"; do
            test -s "$f" || { echo "ERROR: missing required patch/test file: $f"; exit 1; }
          done

          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.140-V127-ORIENTATION-FRESH-SESSION" --dir "$BASE_DIR"
          gh run download "$REFERENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.130-DWG-AXIS-MULTISELECT" --dir "$REF_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.140_V127_ORIENTATION_FRESH_SESSION.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.140_V127_ORIENTATION_SOURCE_PATCH.zip' -print -quit)"
          REF_PATCH="$(find "$REF_DIR" -type f -name 'SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V140 signed base APK missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V140 source patch missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$REF_PATCH" || { echo "ERROR: V130 source patch missing from run $REFERENCE_RUN_ID."; exit 1; }
          unzip -t "$BASE_PATCH"
          unzip -t "$REF_PATCH"
          mkdir -p "$RUNNER_TEMP/v144-source" "$RUNNER_TEMP/v130-source" "$RUNNER_TEMP/sq-release"
          unzip -q "$BASE_PATCH" -d "$RUNNER_TEMP/v144-source"
          unzip -q "$REF_PATCH" -d "$RUNNER_TEMP/v130-source"
          test -s "$RUNNER_TEMP/v144-source/index.html"
          test -s "$RUNNER_TEMP/v130-source/index.html"
          {
            echo "V144_KIT_DIR=$KIT_DIR"
            echo "V144_PRECISION_PATCHER=$PRECISION_PATCHER"
            echo "V144_PRECISION_TEST=$PRECISION_TEST"
            echo "V144_ALIGNER=$ALIGNER"
            echo "V144_SAFETY_TEST=$SAFETY_TEST"
            echo "V144_MLEADER_PATCHER=$MLEADER_PATCHER"
            echo "V144_MLEADER_TEST=$MLEADER_TEST"
            echo "V144_PACKAGE_APK=$PACKAGE_APK"
            echo "V144_REAL_ORACLE=$REAL_ORACLE"
            echo "V144_REAL_RUNNER=$REAL_RUNNER"
            echo "V144_DWG_TEST=$DWG_TEST"
            echo "V144_BASE_APK=$BASE_APK"
            echo "V144_SOURCE_DIR=$RUNNER_TEMP/v144-source"
            echo "V130_SOURCE_DIR=$RUNNER_TEMP/v130-source"
            echo "V144_RELEASE_DIR=$RUNNER_TEMP/sq-release"
          } >> "$GITHUB_ENV"

      - name: Apply alignment and MLeader transform; run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$V144_PRECISION_PATCHER" "$V144_ALIGNER" "$V144_MLEADER_PATCHER" "$V144_PACKAGE_APK" "$V144_REAL_ORACLE"
          for f in "$V144_PRECISION_TEST" "$V144_SAFETY_TEST" "$V144_MLEADER_TEST" "$V144_DWG_TEST" "$V144_REAL_RUNNER"; do node --check "$f"; done
          BASE_HTML="$V144_SOURCE_DIR/index_base_v143.html"
          ALIGNED_HTML="$V144_SOURCE_DIR/index_aligned_v143.html"
          FINAL_HTML="$V144_SOURCE_DIR/index_v144.html"
          python3 "$V144_PRECISION_PATCHER" --source-html "$V144_SOURCE_DIR/index.html" --reference-html "$V130_SOURCE_DIR/index.html" --output-html "$BASE_HTML" --report "$V144_RELEASE_DIR/V143_PRECISION_REPORT.md"
          python3 "$V144_ALIGNER" --input-html "$BASE_HTML" --output-html "$ALIGNED_HTML" --report "$V144_RELEASE_DIR/V143_ALIGNMENT_REPORT.md"
          python3 "$V144_MLEADER_PATCHER" --input-html "$ALIGNED_HTML" --output-html "$FINAL_HTML" --report "$V144_RELEASE_DIR/V144_MLEADER_REPORT.md"

          node "$V144_PRECISION_TEST" "$FINAL_HTML" "$V130_SOURCE_DIR/index.html"
          node "$V144_DWG_TEST" "$FINAL_HTML"
          node "$V144_SAFETY_TEST" "$FINAL_HTML"
          node "$V144_MLEADER_TEST" "$FINAL_HTML"
          python3 "$V144_REAL_ORACLE" --html "$FINAL_HTML" --js-runner "$V144_REAL_RUNNER" --work-dir "$RUNNER_TEMP/v144-real-mleader-test"
          node --check "$V144_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$FINAL_HTML" "$RUNNER_TEMP/v144-js-check" <<'PY'
          import pathlib, re, subprocess, sys
          html_path, out_dir = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          out_dir.mkdir(parents=True, exist_ok=True)
          source = html_path.read_text(encoding='utf-8')
          found = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', source, re.I)
          checked = 0
          for i, (attrs, body) in enumerate(found):
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/ld\+json|importmap)["\']', attrs, re.I):
                  continue
              path = out_dir / f'script_{i}.js'
              path.write_text(body, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
              checked += 1
          if checked < 8: raise SystemExit(f'Expected at least 8 inline JS blocks, found {checked}')
          print(f'PASS: {checked} inline JavaScript blocks parsed successfully.')
          PY

          cp "$FINAL_HTML" "$V144_SOURCE_DIR/index.html"
          rm -f "$BASE_HTML" "$ALIGNED_HTML" "$FINAL_HTML"
          rm -f "$V144_SOURCE_DIR/SurveyQuant_v1.0.140_RESTORE_V127_ORIENTATION.py" "$V144_SOURCE_DIR/SurveyQuant_v1.0.140_V127_SESSION_REGRESSION_TEST.js" "$V144_SOURCE_DIR/README_V140_V127_ORIENTATION_AR.txt"
          cp "$V144_PRECISION_PATCHER" "$V144_SOURCE_DIR/SurveyQuant_v1.0.143_APPLY_ORIENTATION_PRECISION_PATCH.py"
          cp "$V144_PRECISION_TEST" "$V144_SOURCE_DIR/SurveyQuant_v1.0.144_ORIENTATION_PRECISION_TEST.js"
          cp "$V144_ALIGNER" "$V144_SOURCE_DIR/SurveyQuant_v1.0.143_APPLY_ORIENTATION_ALIGNMENT_PATCH.py"
          cp "$V144_SAFETY_TEST" "$V144_SOURCE_DIR/SurveyQuant_v1.0.144_ALIGNMENT_SAFETY_TEST.js"
          cp "$V144_MLEADER_PATCHER" "$V144_SOURCE_DIR/SurveyQuant_v1.0.144_APPLY_MLEADER_ALIGNMENT_PATCH.py"
          cp "$V144_MLEADER_TEST" "$V144_SOURCE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_TEST.js"
          cp "$V144_PACKAGE_APK" "$V144_SOURCE_DIR/SurveyQuant_v1.0.144_PACKAGE_APK.py"
          cp "$V144_REAL_ORACLE" "$V144_SOURCE_DIR/SurveyQuant_v1.0.144_REAL_MLEADER_ORACLE_TEST.py"
          cp "$V144_REAL_RUNNER" "$V144_SOURCE_DIR/SurveyQuant_v1.0.144_REAL_MLEADER_TRANSFORM_RUNNER.js"
          cp "$V144_DWG_TEST" "$V144_SOURCE_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"
          cp "$V144_KIT_DIR/README_V144_AR.txt" "$V144_SOURCE_DIR/README_V144_AR.txt"
          cp "$V144_RELEASE_DIR/V144_MLEADER_REPORT.md" "$V144_SOURCE_DIR/V144_MLEADER_REPORT.md"
          rm -f "$V144_RELEASE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_SOURCE_PATCH.zip"
          (cd "$V144_SOURCE_DIR" && zip -qr "$V144_RELEASE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_SOURCE_PATCH.zip" .)
          unzip -t "$V144_RELEASE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_SOURCE_PATCH.zip" | tail -2

      - name: Inject tested HTML into V140 APK, sign, and verify
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V144_RELEASE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_UNSIGNED.apk"
          ALIGNED="$V144_RELEASE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_ALIGNED.apk"
          FINAL="$V144_RELEASE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_FIX.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V144_PACKAGE_APK" --apk-input "$V144_BASE_APK" --apk-output "$RAW" --html-to-inject "$V144_SOURCE_DIR/index.html"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='144'.*versionName='1.0.144'"
          sha256sum "$FINAL" "$V144_RELEASE_DIR/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_SOURCE_PATCH.zip" > "$V144_RELEASE_DIR/SHA256SUMS.txt"
          printf '%s\n' 'PASS V144: exact two-point transform, V130 orientation, Model/Paper-space alignment preflight, real MULTILEADER text/block oracle comparison, inline JS syntax, V140 DWG WASM preserved, version 144 and APK signature verified.' > "$V144_RELEASE_DIR/V144_BUILD_RESULT.txt"
          cat "$V144_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload V144 APK, complete source and reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.144-MLEADER-ALIGNMENT
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.144_MLEADER_ALIGNMENT_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V144_BUILD_RESULT.txt
            ${{ runner.temp }}/sq-release/V143_PRECISION_REPORT.md
            ${{ runner.temp }}/sq-release/V143_ALIGNMENT_REPORT.md
            ${{ runner.temp }}/sq-release/V144_MLEADER_REPORT.md
          if-no-files-found: error
          retention-days: 14
