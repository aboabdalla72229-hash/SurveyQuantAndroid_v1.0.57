name: Build SurveyQuant v1.0.163 CAD DWG Overlay and Alignment Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V161 FREE APK and source artifact run ID"
        required: true
        type: string
        default: "40695730380"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v163-cad-dwg-overlay-alignment-fix.yml"
      - "SurveyQuant_v1.0.163_DWG_CAD_FIX_KIT.zip"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v163-cad-dwg-overlay-alignment-fix
  cancel-in-progress: false

jobs:
  build_v163:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40695730380' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract V163 kit
        shell: bash
        run: |
          set -euo pipefail
          test -s SurveyQuant_v1.0.163_DWG_CAD_FIX_KIT.zip
          mkdir -p "$RUNNER_TEMP/v163-kit"
          unzip -t SurveyQuant_v1.0.163_DWG_CAD_FIX_KIT.zip | tail -2
          unzip -q SurveyQuant_v1.0.163_DWG_CAD_FIX_KIT.zip -d "$RUNNER_TEMP/v163-kit"
          echo "V163_KIT=$RUNNER_TEMP/v163-kit" >> "$GITHUB_ENV"

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download real free ImageTracer and PDF.js bundles
        shell: bash
        run: |
          set -euo pipefail
          DEPS="$RUNNER_TEMP/sq163-npm"
          mkdir -p "$DEPS"
          npm install --prefix "$DEPS" --no-save --no-audit --no-fund imagetracerjs@1.2.6 pdfjs-dist@3.11.174
          TRACER="$(node -e 'process.stdout.write(require.resolve("imagetracerjs",{paths:[process.argv[1]]}))' "$DEPS")"
          PDFJS="$DEPS/node_modules/pdfjs-dist/build/pdf.min.js"
          PDFWORKER="$DEPS/node_modules/pdfjs-dist/build/pdf.worker.min.js"
          test -s "$TRACER" && test -s "$PDFJS" && test -s "$PDFWORKER"
          node --check "$TRACER"
          node --check "$PDFJS"
          node --check "$PDFWORKER"
          echo "V163_TRACER=$TRACER" >> "$GITHUB_ENV"
          echo "V163_PDFJS=$PDFJS" >> "$GITHUB_ENV"
          echo "V163_PDFWORKER=$PDFWORKER" >> "$GITHUB_ENV"
          echo "V163_NPM_ROOT=$DEPS/node_modules" >> "$GITHUB_ENV"

      - name: Download successful V161 APK and source patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v161-base"
          SOURCE_DIR="$RUNNER_TEMP/v163-source"
          RELEASE_DIR="$RUNNER_TEMP/v163-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.161-FREE-PROJECTION-RAW-TARGET-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.161_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.161_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V161 APK missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V161 source patch missing from run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V163_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V163_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V163_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Fix Android WebView DWG WASM loading and verify actual LibreDWG
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V163_KIT/SurveyQuant_v1.0.162_DWG_WASM_FIX.py" \
            --html "$V163_SOURCE_DIR/index.html" \
            --wasm-loader "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js" \
            --wasm "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          python3 "$V163_KIT/SurveyQuant_v1.0.162_DWG_WASM_FIX.py" \
            --html "$V163_SOURCE_DIR/index.html" \
            --wasm-loader "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js" \
            --wasm "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm" --check-only
          node "$V163_KIT/SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js" \
            "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js" \
            "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"

      - name: Replace broken V161 CAD-to-CAD projection with raw DXF record merge
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V163_KIT/SurveyQuant_v1.0.163_APP_FIX.py" --html "$V163_SOURCE_DIR/index.html"
          python3 "$V163_KIT/SurveyQuant_v1.0.163_APP_FIX.py" --html "$V163_SOURCE_DIR/index.html" --check-only

      - name: Inject local CAD alignment, snap/zoom, PDF worker, and ImageTracer engines
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V163_KIT/SurveyQuant_v1.0.163_CAD_INJECT.py" \
            --html "$V163_SOURCE_DIR/index.html" \
            --core "$V163_KIT/SurveyQuant_v1.0.163_CAD_ENGINE.js" \
            --imagetracer "$V163_TRACER" \
            --pdfjs "$V163_PDFJS" \
            --pdf-worker "$V163_PDFWORKER"
          python3 "$V163_KIT/SurveyQuant_v1.0.163_CAD_INJECT.py" \
            --html "$V163_SOURCE_DIR/index.html" \
            --core "$V163_KIT/SurveyQuant_v1.0.163_CAD_ENGINE.js" \
            --imagetracer "$V163_TRACER" \
            --pdfjs "$V163_PDFJS" \
            --pdf-worker "$V163_PDFWORKER" --check-only

      - name: Run CAD, overlay, viewport, PDF worker, and syntax regression checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$V163_KIT"
          node SurveyQuant_v1.0.163_CAD_ENGINE_TEST.js
          node test_raw_merge.js
          node SurveyQuant_v1.0.163_DWG_OVERLAY_PIPELINE_TEST.js "$V163_SOURCE_DIR/index.html"
          node SurveyQuant_v1.0.163_PDF_WORKER_BOOTSTRAP_TEST.js "$V163_SOURCE_DIR/index.html"
          node SurveyQuant_v1.0.163_APP_REGRESSION_TEST.js \
            "$V163_SOURCE_DIR/index.html" \
            "$V163_KIT/SurveyQuant_v1.0.163_CAD_ENGINE.js" \
            "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 -m py_compile SurveyQuant_v1.0.162_DWG_WASM_FIX.py SurveyQuant_v1.0.163_APP_FIX.py SurveyQuant_v1.0.163_CAD_INJECT.py SurveyQuant_v1.0.163_PACKAGE_FREE_APK.py
          node --check "$V163_KIT/SurveyQuant_v1.0.163_CAD_ENGINE.js"
          node --check "$V163_KIT/SurveyQuant_v1.0.163_CAD_ENGINE_TEST.js"
          node --check "$V163_KIT/SurveyQuant_v1.0.163_APP_REGRESSION_TEST.js"
          node --check "$V163_KIT/SurveyQuant_v1.0.163_DWG_OVERLAY_PIPELINE_TEST.js"
          node --check "$V163_KIT/SurveyQuant_v1.0.163_PDF_WORKER_BOOTSTRAP_TEST.js"
          node --check "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$V163_SOURCE_DIR/index.html" "$RUNNER_TEMP/v163-inline-check" <<'PY'
          from pathlib import Path
          import re,sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          out=Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
          matches=list(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I))
          count=0
          for i,m in enumerate(matches):
              attrs=m.group(1);body=m.group(2)
              typ=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              if not body.strip() or (typ and typ.group(1).lower() not in ('text/javascript','application/javascript','module')):continue
              p=out/f'inline-{i}.js';p.write_text(body,encoding='utf-8');count+=1
          if not count:raise SystemExit('No executable inline JavaScript found')
          print(f'Extracted {count} inline scripts for syntax checks')
          PY
          for js in "$RUNNER_TEMP"/v163-inline-check/*.js; do node --check "$js"; done

      - name: Prepare package builder from V161 package rules
        shell: bash
        run: |
          set -euo pipefail
          cp "$V163_KIT/SurveyQuant_v1.0.163_PACKAGE_FREE_APK.py" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.163_CAD_ENGINE.js" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.163_CAD_ENGINE_TEST.js" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.163_APP_FIX.py" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.163_APP_REGRESSION_TEST.js" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.163_DWG_OVERLAY_PIPELINE_TEST.js" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.163_PDF_WORKER_BOOTSTRAP_TEST.js" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.163_CAD_INJECT.py" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.162_DWG_WASM_FIX.py" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/README_V163_DWG_CAD_FIX_AR.md" "$V163_SOURCE_DIR/"
          cp "$V163_KIT/THIRD_PARTY_NOTICES.md" "$V163_SOURCE_DIR/"
          cp "$V163_NPM_ROOT/imagetracerjs/LICENSE" "$V163_SOURCE_DIR/IMAGETRACER_LICENSE.txt" 2>/dev/null || true
          cp "$V163_NPM_ROOT/pdfjs-dist/LICENSE" "$V163_SOURCE_DIR/PDFJS_LICENSE.txt"
          rm -rf "$V163_SOURCE_DIR/__pycache__"
          python3 -m py_compile "$V163_SOURCE_DIR/SurveyQuant_v1.0.163_PACKAGE_FREE_APK.py"

      - name: Package V163 APK with the verified offline engines
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V163_SOURCE_DIR/SurveyQuant_v1.0.163_PACKAGE_FREE_APK.py" \
            --apk-input "$V163_BASE_APK" \
            --apk-output "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_UNSIGNED.apk" \
            --html-to-inject "$V163_SOURCE_DIR/index.html" \
            --wasm-loader "$V163_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_UNSIGNED.apk"
          python3 - "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_UNSIGNED.apk" <<'PY'
          from pathlib import Path
          import sys,zipfile
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              for abi in ('lib/arm64-v8a/','lib/armeabi-v7a/'):
                  if abi+'libc++_shared.so' not in names and not any(n.startswith(abi) for n in names):
                      if abi=='lib/arm64-v8a/':raise SystemExit('ARM64 native runtime missing from APK')
              for abi in ('lib/x86/','lib/x86_64/'):
                  if any(n.startswith(abi) for n in names):raise SystemExit('Unexpected x86 ABI payload remains: '+abi)
              html=z.read('assets/index.html')
              for marker in (b'id="sq163-pdfjs-worker"',b'id="sq163-cad-engine"',b'id="sq162-wasm-binary"',b'sq163RawCadOverlayMerge'):
                  if marker not in html:raise SystemExit('APK HTML marker missing: '+marker.decode())
          print('PASS V163 APK package inspection: embedded PDF worker, CAD engine, ImageTracer, LibreDWG WASM and raw DWG overlay found.')
          PY

      - name: Sign, align, and verify final Android APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_ALIGNED.apk"
          FINAL="$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_ANDROID_WEBVIEW_WASM_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='163'.*versionName='1.0.163'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_UNSIGNED.apk"

      - name: Package source, notes, and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > "$V163_RELEASE_DIR/V163_CHANGELOG_AR.md" <<'TXT'
          # SurveyQuant v1.0.163
          - إصلاح تحميل LibreDWG WebAssembly داخل Android WebView بتضمين WASM ونقله إلى العامل مرة واحدة بدل طلبه من file://.
          - إصلاح مشروع إسقاط DWG/DXF على DWG/DXF: تحويل الملفين إلى DXF خام ثم دمج سجلات الكيانات والبلوكات والطبقات والأنماط مع إعادة ربط المقابض المتعارضة، بدون إعادة رسم العناصر.
          - استعادة مسار إسقاط ملفات النقاط إلى لوحة CAD المرجعية.
          - إضافة مشروع توجيه بنقطتين ونقطتين باستخدام دوران ومقياس موحد وإزاحة، مع تعديل سجلات DXF مباشرة.
          - تكبير حتى 10000x، تكبير/تصغير 2x، سحب، لمس متعدد، والتقاط التقاطع والنهاية والمنتصف والأقرب مع مؤشر موضع الالتقاط.
          - إصلاح PDF.js بتضمين عامل PDF محلي وضبط GlobalWorkerOptions.workerSrc إلى Blob URL محلي.
          - تحويل مجاني محلي للصور وPDF إلى DXF باستخدام ImageTracer وPDF.js.
          - الملفات والنقاط تبقى في الذاكرة المؤقتة فقط داخل الأداة، ويتم تفريغها عند الإغلاق/pagehide.
          - لا تُضمن المحافظة على كل كائنات CAD الخاصة أو المراجع الخارجية أو الكائنات الوكيلة. يوقف الدمج العملية إذا اكتشف مراجع خارجية لا يستطيع إعادة ربطها بأمان. يلزم اختبار ملفات DWG الحقيقية على جهاز المستخدم.
          TXT
          cp "$V163_KIT/README_V163_DWG_CAD_FIX_AR.md" "$V163_RELEASE_DIR/README_V163_DWG_CAD_FIX_AR.md"
          cp "$V163_KIT/THIRD_PARTY_NOTICES.md" "$V163_RELEASE_DIR/THIRD_PARTY_NOTICES.md"
          (cd "$V163_SOURCE_DIR" && zip -qr "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_ANDROID_WEBVIEW_WASM_FIX.apk" "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_SOURCE_PATCH.zip" > "$V163_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V163_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload verified V163 APK and source patch
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.163-FREE-CAD-DWG-OVERLAY-ALIGNMENT-FIX
          path: |
            ${{ runner.temp }}/v163-release/SurveyQuant_v1.0.163_FREE_ANDROID_WEBVIEW_WASM_FIX.apk
            ${{ runner.temp }}/v163-release/SurveyQuant_v1.0.163_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v163-release/V163_CHANGELOG_AR.md
            ${{ runner.temp }}/v163-release/README_V163_DWG_CAD_FIX_AR.md
            ${{ runner.temp }}/v163-release/THIRD_PARTY_NOTICES.md
            ${{ runner.temp }}/v163-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish V163 release without overwriting existing immutable assets
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.163 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.163 already exists; APK and source patch remain in Actions artifact."
          else
            gh release create v1.0.163 \
              "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_ANDROID_WEBVIEW_WASM_FIX.apk" \
              "$V163_RELEASE_DIR/SurveyQuant_v1.0.163_FREE_SOURCE_PATCH.zip" \
              --repo "$GITHUB_REPOSITORY" --title "SurveyQuant v1.0.163 - CAD Overlay and Alignment Fix" \
              --notes-file "$V163_RELEASE_DIR/V163_CHANGELOG_AR.md"
          fi
          echo "Release page, if created: https://github.com/$GITHUB_REPOSITORY/releases/tag/v1.0.163"
