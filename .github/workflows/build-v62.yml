name: Build SurveyQuant V62 XY FIXED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          echo "Source ZIP:"
          ls -lh "$ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          unzip -q \
            SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE.zip \
            -d source

      - name: Set project directory
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="source/SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURING RELEASE SIGNING"
          echo "========================================"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEY_PASSWORD secret is missing."
            exit 1
          fi

          KEYSTORE_FILE="$GITHUB_WORKSPACE/surveyquant-ci.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          chmod 600 "$KEYSTORE_FILE"

          echo "Keystore configured successfully."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING SURVEYQUANT V62 XY FIXED"
          echo "========================================"

          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/SurveyQuant_v1.0.62_XY_FIXED.apk"

          echo "APK ready:"
          ls -lh "$GITHUB_WORKSPACE/output/SurveyQuant_v1.0.62_XY_FIXED.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.62-XY-FIXED
          path: output/SurveyQuant_v1.0.62_XY_FIXED.apk
          if-no-files-found: error
