name: SurveyQuant v57 Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip'
      - '.github/workflows/build-v57.yml'

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -s SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip
          unzip -t SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip

      - name: Confirm source
        run: echo "SurveyQuant v57 source ZIP verified"
