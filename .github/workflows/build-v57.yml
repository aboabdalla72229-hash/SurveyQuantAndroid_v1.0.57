name: Build SurveyQuant v1.0.57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP is empty."
            exit 1
          fi

          echo "Source ZIP found:"
          echo "$SOURCE_ZIP"

      - name: Prepare source
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Source extracted successfully."
          find extracted -maxdepth 4 -type f | head -200

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          ))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          rm -rf release
          mkdir -p release

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} release/ \;

          echo "Generated files:"
          find release -type f -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57
          path: release/*
          if-no-files-found: error
