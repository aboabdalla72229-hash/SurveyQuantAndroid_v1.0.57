name: Build SurveyQuant v1.0.93 - Trial and Forced Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
      - ".github/workflows/build-v93-trial-update.yml"

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract uploaded v1.0.93 source archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$SOURCE_NAME" ]; then
            echo "ERROR: Source archive not found: $SOURCE_NAME"
            ls -lah
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/sq-source"
          mkdir -p "$RUNNER_TEMP/sq-source"
          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"

          PROJECT="$(find "$RUNNER_TEMP/sq-source" \
            -type f -path '*/app/build.gradle' -print -quit \
            | sed 's#/app/build.gradle$##')"

          if [ -z "$PROJECT" ] || [ ! -d "$PROJECT" ]; then
            echo "ERROR: Android project was not found inside the ZIP."
            find "$RUNNER_TEMP/sq-source" -maxdepth 5 -type f | head -200
            exit 1
          fi

          test -s "$PROJECT/settings.gradle" || {
            echo "ERROR: settings.gradle is missing"
            exit 1
          }

          test -s "$PROJECT/build.gradle" || {
            echo "ERROR: Root build.gradle is missing"
            exit 1
          }

          test -s "$PROJECT/app/src/main/AndroidManifest.xml" || {
            echo "ERROR: AndroidManifest.xml is missing"
            exit 1
          }

          test -s "$PROJECT/app/src/main/assets/index.html" || {
            echo "ERROR: App index.html is missing"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Verify version and app features
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Eq 'versionCode[[:space:]]+93([^0-9]|$)' "$GRADLE_FILE" || {
            echo "ERROR: versionCode 93 was not found."
            exit 1
          }

          grep -Eq "versionName[[:space:]]+['\"]1\.0\.93['\"]" "$GRADLE_FILE" || {
            echo "ERROR: versionName 1.0.93 was not found."
            exit 1
          }

          grep -Fq 'minimumVersionCode' "$INDEX" || {
            echo "ERROR: Forced-update check was not found."
            exit 1
          }

          grep -Fq 'kashier/create-session' "$INDEX" || {
            echo "ERROR: Kashier session integration was not found."
            exit 1
          }

          grep -Fq 'kashier/status' "$INDEX" || {
            echo "ERROR: Kashier payment status integration was not found."
            exit 1
          }

          echo "Version and integration checks passed."

      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" \
            "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re
          import sys

          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              html,
              re.S | re.I
          )

          if not scripts:
              raise SystemExit("ERROR: No inline scripts found.")

          Path(sys.argv[2]).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )
          PY

          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore Android release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}" || {
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "${SURVEYQUANT_KEYSTORE_PASSWORD:-}" || {
            echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "${SURVEYQUANT_KEY_ALIAS:-}" || {
            echo "ERROR: SURVEYQUANT_KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "${SURVEYQUANT_KEY_PASSWORD:-}" || {
            echo "ERROR: SURVEYQUANT_KEY_PASSWORD secret is missing."
            exit 1
          }

          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH" || {
            echo "ERROR: Decoded keystore is empty."
            exit 1
          }

          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease --stacktrace

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/sq-release"
          cp "$APK" "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.93.apk"

          sha256sum "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.93.apk"

      - name: Copy source archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sq-release"

          cp "$GITHUB_WORKSPACE/$SOURCE_NAME" \
            "$RUNNER_TEMP/sq-release/SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"

          test -s "$RUNNER_TEMP/sq-release/SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.93-Release
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.93.apk
            ${{ runner.temp }}/sq-release/SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip
          if-no-files-found: error
          retention-days: 14
