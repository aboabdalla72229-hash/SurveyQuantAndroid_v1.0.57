          const t={scale:1,angleDeg:0,tx:100,ty:200,point:(x,y)=>({x:x+100,y:y+200}),vector:(x,y)=>({x,y})};
          const output=core.transformBytes(mixed,t);
          assert(output.bytes&&output.bytes.length>0,'transform output missing');
          const outText=dec.decode(output.bytes);
          assert(outText.includes('MODEL_BOARD_DETAIL')&&outText.includes('PAPERSPACE_TITLEBLOCK'),'all non-selected space data must be preserved');
          function entRecords(text){const lines=text.split(/\r?\n/).map(s=>s.trim());let section='',active=null;const out=[];for(let i=0;i+1<lines.length;i+=2){const code=Number(lines[i]),value=lines[i+1];if(code===0&&value==='SECTION'){section=lines[i+3]||'';i+=2;continue;}if(code===0&&value==='ENDSEC'){section='';active=null;continue;}if(section!=='ENTITIES')continue;if(code===0){if(active)out.push(active);active={type:value,pairs:[]};}else if(active)active.pairs.push({code,value});}if(active)out.push(active);return out;}
          const outRecords=entRecords(outText);const modelLine=outRecords.find(e=>e.type==='LINE'&&e.pairs.some(p=>p.code===8&&p.value==='PLAN'));
          assert(modelLine,'model line should remain');
          const mx=Number(modelLine.pairs.find(p=>p.code===10).value),my=Number(modelLine.pairs.find(p=>p.code===20).value);
          assert.equal(mx,100);assert.equal(my,200,'selected model geometry should be translated');
          const paperLine=outRecords.find(e=>e.type==='LINE'&&e.pairs.some(p=>p.code===8&&p.value==='LAYOUT_BORDER'));
          assert(paperLine,'paper-space geometry should be retained');
          assert.equal(Number(paperLine.pairs.find(p=>p.code===10).value),1000,'non-selected layout geometry must not be transformed');
          assert.equal(Number(paperLine.pairs.find(p=>p.code===20).value),1000);
          const paperOnly=dxf([
           ['0','LINE','8','PAPER_PLAN','67','1','410','Layout1','10','40','20','50','11','50','21','50'],
           ['0','TEXT','8','PAPER_TEXT','67','1','410','Layout1','10','45','20','55','40','1','1','FALLBACK_LAYOUT']
          ]);
          const paperParsed=manual.parseDrawing(paperOnly);
          assert.equal(paperParsed.spaceMode,'PAPER_SPACE','paper-space-only drawings must fall back to the best layout');
          assert.equal(paperParsed.segs.length,1);assert.equal(paperParsed.bounds.minX,40);assert(paperParsed.texts.some(t=>t.text.includes('FALLBACK_LAYOUT')));
          const paperOutput=core.transformBytes(paperOnly,t);
          assert.equal(paperOutput.paperSpaceFallback,true,'paper-space fallback should be reported');
          const paperOutputText=dec.decode(paperOutput.bytes);assert(paperOutputText.includes('FALLBACK_LAYOUT'));
          assert(paperOutputText.includes('140')&&paperOutputText.includes('250'),'paper-space fallback geometry should be transformed');
          // A valid saved CAD viewport should win over a few far-away annotation/block artifacts,
          // while the full geometry and full bounds remain untouched in memory and in the DXF.
          function headerDxf(entities){
           const lines=['0','SECTION','2','HEADER','9','$EXTMIN','10','0','20','0','30','0','9','$EXTMAX','10','10','20','10','30','0','9','$VIEWCTR','10','5','20','5','9','$VIEWSIZE','40','10','0','ENDSEC','0','SECTION','2','ENTITIES'];
           for(const e of entities)lines.push(...e);lines.push('0','ENDSEC','0','EOF');return enc.encode(lines.join('\r\n')+'\r\n');
          }
          const dense=[];for(let i=0;i<25;i++){const y=(i%5)*2,x=Math.floor(i/5)*2;dense.push(['0','LINE','8','BOARD','10',String(x),'20',String(y),'11',String(x+1),'21',String(y+1)]);}
          dense.push(['0','POINT','8','FAR_ANNOTATION','10','999999','20','5','30','0']);
          const withOutlier=headerDxf(dense),fitDrawing=manual.parseDrawing(withOutlier);
          assert(fitDrawing.bounds.maxX>999000,'full geometry bounds must still include a remote INSERT/annotation');
          assert(fitDrawing.fitBounds.maxX<11,'initial viewport should fit the saved main-board extents, not remote outliers');
          assert.equal(fitDrawing.fitBoundsBasis,'DXF_HEADER_EXTENTS','the valid source CAD view extents should be preferred');
          assert(fitDrawing.anchors.some(p=>p.x>999000),'outlier geometry stays present; only the viewport excludes it');
          const fitTransform={...t,viewBounds:fitDrawing.fitBounds};
          const fitOutput=dec.decode(core.transformBytes(withOutlier,fitTransform).bytes);
          const headerVar=(txt,name)=>{const p=txt.split(/\r?\n/).map(x=>x.trim());const ix=p.findIndex((v,i)=>v==='9'&&p[i+1]===name);assert(ix>=0,'header '+name+' exists');const out={};for(let i=ix+2;i<p.length&&p[i]!=='9'&&p[i]!=='0';i+=2)out[p[i]]=Number(p[i+1]);return out;};
          const fitCtr=headerVar(fitOutput,'$VIEWCTR'),fitSize=headerVar(fitOutput,'$VIEWSIZE'),fullMax=headerVar(fitOutput,'$EXTMAX');
          assert(Math.abs(fitCtr['10']-105)<1e-7&&Math.abs(fitCtr['20']-205)<1e-7,'export opens centered on the selected main-board view');
          assert(Math.abs(fitSize['40']-((fitDrawing.fitBounds.maxY-fitDrawing.fitBounds.minY)*1.12))<1e-7,'export uses the focused main-board fit window rather than the outlier-sized window');
          assert.equal(fullMax['10'],110,'saved header fit extents transform around the main board');
          assert(fitOutput.includes('FAR_ANNOTATION')&&fitOutput.includes('1000099'),'far-away CAD geometry is preserved in exported DXF even when the initial view is focused');
          if(stormDirectory&&fs.existsSync(stormDirectory)){
           for(const file of fs.readdirSync(stormDirectory).filter(f=>/^STORM_[12]_converted\.dxf$/.test(f))){
            const bytes=new Uint8Array(fs.readFileSync(require('node:path').join(stormDirectory,file)));
            const real=manual.parseDrawing(bytes);
            assert.equal(real.spaceMode,'MODEL_SPACE',file+' should default to Model Space when model drawing entities exist');
            assert(real.segs.length>0,file+' should render board linework');
            assert(real.bounds.maxX>real.bounds.minX&&real.bounds.maxY>real.bounds.minY,file+' should retain nonzero full selected-space bounds');
            assert(real.modelEntityCount>0,file+' should select model-space entities');
            assert.equal(real.fitBoundsBasis,'DXF_HEADER_EXTENTS',file+' should prefer the original valid CAD viewport for initial fit');
            assert(real.bounds.maxX-real.bounds.minX>(real.fitBounds.maxX-real.fitBounds.minX)*5,file+' full bounds should remain distinct from focused fit bounds');
            assert(real.anchors.length>1000,file+' should retain detailed geometry anchors despite viewport fit');
            const preview=core.parsePreview(bytes);
            assert.equal(preview.spaceMode,'MODEL_SPACE',file+' preview must remain in Model Space');
            assert.equal(preview.fitBoundsBasis,'DXF_HEADER_EXTENTS',file+' supplemental preview must use the same canonical fit');
            assert(preview.segs.length>1000,file+' should retain many rendered details');
            assert(preview.bounds.maxX-preview.bounds.minX>(preview.fitBounds.maxX-preview.fitBounds.minX)*5,file+' full preview bounds should not be rewritten to hide geometry');
            console.log('PASS real STORM preview '+file+': model entities='+real.modelEntityCount+', layout entities='+real.paperEntityCount+', rendered segments='+preview.segs.length+', focused viewport='+preview.fitBoundsBasis);
           }
          }
          console.log('PASS v118 regression: selected drawing space, CAD header viewport fit, full entity preservation, focused exported view, mixed Model/Paper Space, and Paper Space fallback.');
          NODE
          node --check "$RUNNER_TEMP/test-v118-space-selection.js"
          node "$RUNNER_TEMP/test-v118-space-selection.js" "$MODULE_JS" "$MANUAL_MODULE" "$REFERENCE_MODULE" "$STORM_OUTPUT_DIR"
          grep -Fq 'function selectDrawingSpace(entities)' "$INDEX_PATH"
          grep -Fq "spaceMode:selectedSpace?selectedSpace.spaceMode" "$REFERENCE_MODULE"

      - name: Set Android release version to 1.0.118
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re,sys

          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          s,nc=re.subn(r'(?m)(\bversionCode\s+)\d+\b',r'\g<1>118',s,count=1)
          s,nn=re.subn(r"(?m)(\bversionName\s+)([\"'])\d+\.\d+\.\d+\2",r"\g<1>'1.0.118'",s,count=1)
          if nc!=1 or nn!=1:
            raise SystemExit(f'ERROR: Version edits failed (code={nc}, name={nn}).')
          p.write_text(s,encoding='utf-8')
          PY

          grep -Eq 'versionCode[[:space:]]+118([^0-9]|$)' "$PROJECT_DIR/app/build.gradle"
          grep -Eq "versionName[[:space:]]+['\"]1\.0\.118['\"]" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'const SQ_APP_VERSION_CODE = 118;' "$INDEX_PATH"

      - name: Run JavaScript and CAD-preservation regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check "$MODULE_JS"
          node "$TEST_JS" "$MODULE_JS"
          node --check "$AXIS_MODULE"
          node "$AXIS_TEST" "$AXIS_MODULE"
          node --check "$MANUAL_MODULE"
          node "$MANUAL_TEST" "$MANUAL_MODULE" "$MODULE_JS"
          node --check "$REFERENCE_MODULE"
          node "$REFERENCE_TEST" "$MODULE_JS" "$MANUAL_MODULE" "$REFERENCE_MODULE"

          cat > "$RUNNER_TEMP/sq-canvas-display-test.js" <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const [enginePath, manualPath, referencePath] = process.argv.slice(2);
          assert(enginePath && manualPath && referencePath, 'canvas display regression test inputs are missing');
          const nodes = new Map();
          for (const id of ['sq110TargetScreen','sq110ReferenceScreen','sq110Step1','sq110Step2']) nodes.set(id,{style:{display:'',opacity:''}});
          const document = {readyState:'loading',addEventListener(){},getElementById(id){return nodes.get(id)||null;}};
          const window = {devicePixelRatio:1,addEventListener(){},removeEventListener(){},requestAnimationFrame(fn){fn();}};
          const context = {window,document,TextEncoder,TextDecoder,Uint8Array,ArrayBuffer,Blob,URL,Math,Number,String,Map,Set,Array,Object,RegExp,Error,Infinity,Promise,JSON,parseInt,parseFloat,setTimeout,clearTimeout,console};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync(enginePath,'utf8'),context,{filename:enginePath});
          vm.runInContext(fs.readFileSync(manualPath,'utf8'),context,{filename:manualPath});
          vm.runInContext(fs.readFileSync(referencePath,'utf8'),context,{filename:referencePath});
          const api=window.__sqOrientation111API;
          assert(api&&api.state&&typeof api.refreshVisibleCadCanvas==='function','visible canvas refresh API must exist');
          let rect={width:640,height:340},resizes=0;
          api.state.views.reference={side:'reference',canvas:{getBoundingClientRect(){return rect;}},ctx:null,drawing:{},resizeHandler(){resizes++;}};
          api.showScreen('reference');
          assert.equal(nodes.get('sq110ReferenceScreen').style.display,'block','reference screen becomes visible');
          assert.equal(resizes,1,'switching screen forces canvas remeasure/redraw');
          rect={width:0,height:0};api.refreshVisibleCadCanvas('reference');
          assert.equal(resizes,1,'hidden zero-size canvas is not collapsed to 1x1');
          rect={width:720,height:340};api.refreshVisibleCadCanvas('reference');
          assert.equal(resizes,2,'visible canvas recovers when dimensions return');
          const patchedSource=fs.readFileSync(referencePath,'utf8');
          assert.match(patchedSource,/const r=c\.getBoundingClientRect\(\);if\(!r\|\|r\.width<2\|\|r\.height<2\)return;/,'hidden canvas must not be forced to 1x1');
          assert.match(patchedSource,/if\(c\.width!==width\)c\.width=width;if\(c\.height!==height\)c\.height=height;/,'canvas backing dimensions must follow visible CSS dimensions');
          assert.match(patchedSource,/new window\.ResizeObserver\(\(\)=>resize\(\)\)/,'responsive observer is installed');
          console.log('PASS v115 board-display regression: redraw after screen switch/import, ignore hidden zero-size canvas, preserve correct backing dimensions, and observe layout changes.');
          NODE
          node "$RUNNER_TEMP/sq-canvas-display-test.js" "$MODULE_JS" "$MANUAL_MODULE" "$REFERENCE_MODULE"

          node --check "$FAITHFUL_MODULE"
          node "$FAITHFUL_TEST" "$MODULE_JS" "$MANUAL_MODULE" "$REFERENCE_MODULE" "$FAITHFUL_MODULE"

          cp "$PATCH_INDEX" "$RUNNER_TEMP/dxf-parser-restoration-test.html"
          python3 - "$RUNNER_TEMP/dxf-parser-restoration-test.html" <<'PY'
          from pathlib import Path
          import re,sys

          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'const SQ_APP_VERSION_CODE = \d+;', 'const SQ_APP_VERSION_CODE = 104;', s, count=1)
          if n!=1:
            raise SystemExit('ERROR: Could not create the isolated v104 DXF regression fixture.')
          p.write_text(s,encoding='utf-8')
          PY

          node "$DXF_TEST" "$RUNNER_TEMP/dxf-parser-restoration-test.html"
          node --check "$PRESERVE_MODULE"
          echo "The old v113 hard-veto test is intentionally replaced by the v115 nonblocking-export test. v118 separately verifies Model Space / Layout selection."
          node --check "$V115_MODULE"
          python3 - "$V115_TEST" "$RUNNER_TEMP/surveyquant-v116-orientation-regression.js" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text(encoding='utf-8')
          replacements=[
            ("const SQ_APP_VERSION_CODE = 115;", "const SQ_APP_VERSION_CODE = 118;"),
            ("height:520px", "height:230px;min-height:230px;max-height:230px"),
          ]
          for old,new in replacements:
            count=source.count(old)
            if count != 1:
              raise SystemExit(f"ERROR: Expected exactly one v115-to-v116 assertion update for {old!r}; found {count}.")
            source=source.replace(old,new,1)
          if 'window.__sqOrientation115Tools' not in source:
            raise SystemExit('ERROR: The historical v115 integration assertions are incomplete.')
          Path(sys.argv[2]).write_text(source,encoding='utf-8')
          PY
          node "$RUNNER_TEMP/surveyquant-v116-orientation-regression.js" "$REFERENCE_MODULE" "$PRESERVE_MODULE" "$V115_MODULE" "$INDEX_PATH"
      - name: Build Android APK v1.0.118
        shell: bash
        run: |
          set -euo pipefail

          test -d "$PROJECT_DIR"
          test -s "$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper is missing from the Android source."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          "$PROJECT_DIR/gradlew" \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

          APK_SOURCE="$(
            find "$PROJECT_DIR/app/build/outputs/apk/debug" \
              -type f -name '*.apk' -print -quit
          )"

          test -n "$APK_SOURCE"
          test -s "$APK_SOURCE"

          mkdir -p "$RUNNER_TEMP/surveyquant-apk"

          cp "$APK_SOURCE" \
            "$RUNNER_TEMP/surveyquant-apk/SurveyQuant-v1.0.118-debug.apk"

          sha256sum \
            "$RUNNER_TEMP/surveyquant-apk/SurveyQuant-v1.0.118-debug.apk" \
            > "$RUNNER_TEMP/surveyquant-apk/SHA256SUMS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.118-APK
          path: |
            ${{ runner.temp }}/surveyquant-apk/SurveyQuant-v1.0.118-debug.apk
            ${{ runner.temp }}/surveyquant-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
