name: Build SurveyQuant V62

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate V62 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SurveyQuant V62 Source"
          echo "========================================"

          echo "Repository root:"
          pwd

          echo ""
          echo "ZIP files in repository:"
          find . -type f -iname "*.zip" -print || true

          echo ""

          ZIP=""

          # 1. البحث عن V62 بأي اسم
          ZIP="$(find . -type f -iname "*v1.0.62*.zip" -print -quit || true)"

          # 2. لو لم يوجد، البحث عن FINAL_CANDIDATE
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -iname "*FINAL_CANDIDATE*.zip" -print -quit || true)"
          fi

          # 3. لو لم يوجد، البحث عن أي ZIP واحد
          if [ -z "$ZIP" ]; then
            COUNT="$(find . -type f -iname "*.zip" | wc -l)"

            if [ "$COUNT" -eq 1 ]; then
              ZIP="$(find . -type f -iname "*.zip" -print -quit)"
            fi
          fi

          if [ -z "$ZIP" ]; then
            echo ""
            echo "ERROR: No source ZIP found."
            echo ""
            echo "Files available in repository:"
            find . -maxdepth 4 -type f -print | sort | head -300
            exit 1
          fi

          echo ""
          echo "SOURCE ZIP FOUND:"
          echo "$ZIP"

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo ""
          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find source -type f -name "gradlew" -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside source ZIP."

            echo ""
            echo "Source tree:"
            find source -maxdepth 6 -type f | sort | head -500

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Android Project Verification"
          echo "========================================"

          test -f gradlew

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "WARNING: settings.gradle not found."
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "WARNING: root build.gradle not found."
          fi

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "========================================"
          echo "Building SurveyQuant V62"
          echo "========================================"

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."

            echo ""
            echo "Build outputs:"
            find "$PROJECT_DIR" -type f \
              \( -iname "*.apk" -o -iname "*.aab" \) \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/SurveyQuant_v1.0.62.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.62
          path: output/SurveyQuant_v1.0.62.apk
          if-no-files-found: error
