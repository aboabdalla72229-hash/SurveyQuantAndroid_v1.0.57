name: Build SurveyQuant v1.0.60

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "===== ROOT ====="
          pwd
          ls -la

          echo "===== IMPORTANT FILES ====="
          find . -type f -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "AndroidManifest.xml" -o -name "index.html" -o -name "gradlew" -print | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find . -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle was not found"
            echo "The repository structure is:"
            find . -maxdepth 4 -type f -print | sort
            exit 1
          fi

          echo "Found:"
          echo "$APP_GRADLE"

          PROJECT_ROOT=$(dirname "$(dirname "$APP_GRADLE")")

          echo "ANDROID_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_APP_GRADLE"

          echo "Checking AndroidManifest..."
          find "$ANDROID_PROJECT_ROOT" -name "AndroidManifest.xml" -print

          echo "Checking index.html..."
          find "$ANDROID_PROJECT_ROOT" -name "index.html" -print

          echo "Project structure detected successfully."

      - name: Show current version
        shell: bash
        run: |
          set -e

          echo "===== VERSION ====="

          grep -n "versionCode" "$ANDROID_APP_GRADLE" || true
          grep -n "versionName" "$ANDROID_APP_GRADLE" || true

      - name: Verify version 1.0.60
        shell: bash
        run: |
          set -e

          grep -qE "versionCode[[:space:]]+60" "$ANDROID_APP_GRADLE" || {
            echo "ERROR: versionCode 60 not found"
            exit 1
          }

          grep -qE "versionName[[:space:]]+['\"]1\.0\.60['\"]" "$ANDROID_APP_GRADLE" || {
            echo "ERROR: versionName 1.0.60 not found"
            exit 1
          }

          echo "Version 1.0.60 verified."

      - name: Verify four signing secrets
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
         
