name: Build SurveyQuant V62

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SurveyQuant V62 Source Search"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Searching for ZIP files..."

          find . -type f -iname "*.zip" -print || true

          ZIP=""

          ZIP="$(find . -type f -iname "*v1.0.62*.zip" -print -quit || true)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -iname "*V62*.zip" -print -quit || true)"
          fi

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -iname "*FINAL_CANDIDATE*.zip" -print -quit || true)"
          fi

          if [ -z "$ZIP" ]; then
            COUNT="$(find . -type f -iname "*.zip" | wc -l)"

            if [ "$COUNT" -eq 1 ]; then
              ZIP="$(find . -type f -iname "*.zip" -print -quit)"
            fi
          fi

          if [ -z "$ZIP" ]; then
            echo ""
            echo "ERROR: No source ZIP found in repository."
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f -print | sort | head -500
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SOURCE ZIP FOUND"
          echo "========================================"
          echo "$ZIP"

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d source

          echo ""
          echo "Source contents:"
          find source -maxdepth 4 -type f -print | head -500

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find source -type f -name "gradlew" -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew not found."
            echo ""
            echo "Searching project files:"
            find source -maxdepth 7 -type f -print | sort | head -1000
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PROJECT VERIFICATION"
          echo "========================================"

          test -f gradlew

          echo ""
          echo "Gradle files:"

          find . -maxdepth 4 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \) \
            -print

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "========================================"
          echo "BUILDING SURVEYQUANT V62"
          echo "========================================"

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" output/SurveyQuant_v1.0.62.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.62
          path: output/SurveyQuant_v1.0.62.apk
          if-no-files-found: error
