name: Build SurveyQuant v1.0.175 from V162 Regression Repair

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V162 APK and source artifact run ID"
        required: true
        type: string
        default: "40919113310"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v175-v162-regression-repair.yml"
      - "SurveyQuant_v1.0.175_FIX_KIT.zip"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v175-v162-regression-repair
  cancel-in-progress: false

jobs:
  build_v175:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40919113310' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract V175 repair kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_ZIP="$GITHUB_WORKSPACE/SurveyQuant_v1.0.175_FIX_KIT.zip"
          test -s "$KIT_ZIP" || { echo "ERROR: Upload SurveyQuant_v1.0.175_FIX_KIT.zip to the repository root"; exit 1; }
          KIT="$RUNNER_TEMP/sq175-kit"
          rm -rf "$KIT" && mkdir -p "$KIT"
          unzip -q "$KIT_ZIP" -d "$KIT"
          for f in SurveyQuant_v1.0.175_PATCH.py SurveyQuant_v1.0.175_CAD_ENGINE.js SurveyQuant_v1.0.175_PACKAGE_FREE_APK.py pdfjs-v3.11.174.min.js pdfjs-worker-v3.11.174.min.js; do
            test -s "$KIT/$f" || { echo "ERROR: Missing kit file $f"; exit 1; }
          done
          echo "SQ175_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the exact V162 base APK and source patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v162-base"
          SOURCE_DIR="$RUNNER_TEMP/v175-source"
          RELEASE_DIR="$RUNNER_TEMP/v175-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.162-FREE-DWG-WASM-PROJECTION-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V162 APK missing from source run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V162 source patch missing from source run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V175_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V175_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V175_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Repair point parsing, embed PDF.js worker, and install independent CAD projects
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ175_KIT/SurveyQuant_v1.0.175_PATCH.py" \
            --html "$V175_SOURCE_DIR/index.html" \
            --engine "$SQ175_KIT/SurveyQuant_v1.0.175_CAD_ENGINE.js" \
            --pdfjs "$SQ175_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ175_KIT/pdfjs-worker-v3.11.174.min.js"
          python3 "$SQ175_KIT/SurveyQuant_v1.0.175_PATCH.py" \
            --html "$V175_SOURCE_DIR/index.html" \
            --engine "$SQ175_KIT/SurveyQuant_v1.0.175_CAD_ENGINE.js" \
            --pdfjs "$SQ175_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ175_KIT/pdfjs-worker-v3.11.174.min.js" --check-only
          cp "$SQ175_KIT/SurveyQuant_v1.0.175_CAD_ENGINE.js" "$V175_SOURCE_DIR/"
          cp "$SQ175_KIT/SurveyQuant_v1.0.175_PATCH.py" "$V175_SOURCE_DIR/"
          cp "$SQ175_KIT/SurveyQuant_v1.0.175_PACKAGE_FREE_APK.py" "$V175_SOURCE_DIR/"
          cp "$SQ175_KIT/SurveyQuant_v1.0.175_POINT_PARSER_TEST.js" "$V175_SOURCE_DIR/"
          cp "$SQ175_KIT/SurveyQuant_v1.0.175_CAD_ENGINE_TEST.js" "$V175_SOURCE_DIR/"
          cp "$SQ175_KIT/SurveyQuant_v1.0.175_PDF_IMAGE_DXF_TEST.js" "$V175_SOURCE_DIR/"
          cp "$SQ175_KIT/SurveyQuant_v1.0.175_REGRESSION_TEST.js" "$V175_SOURCE_DIR/"

      - name: Run point, projection, orientation, PDF, and all-project regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$V175_SOURCE_DIR"
          python3 -m py_compile SurveyQuant_v1.0.175_PATCH.py SurveyQuant_v1.0.175_PACKAGE_FREE_APK.py
          node --check SurveyQuant_v1.0.175_CAD_ENGINE.js
          node --check "$SQ175_KIT/pdfjs-worker-v3.11.174.min.js"
          node SurveyQuant_v1.0.175_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.175_CAD_ENGINE_TEST.js
          node SurveyQuant_v1.0.175_PDF_IMAGE_DXF_TEST.js index.html
          node SurveyQuant_v1.0.175_REGRESSION_TEST.js index.html SurveyQuant_v1.0.175_CAD_ENGINE.js
          node SurveyQuant_v1.0.161_PROJECTION_RAW_TARGET_TEST.js index.html
          node SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js libredwg-writer/wasm/libredwg-web.js libredwg-writer/wasm/libredwg-web.wasm
          node --check libredwg-writer/wasm/libredwg-web.js
          python3 - "$V175_SOURCE_DIR/index.html" "$RUNNER_TEMP/sq175-inline-scripts" <<'PY'
          from pathlib import Path
          import re,sys,subprocess
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          out=Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
          count=0
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I)):
              attrs,body=m.group(1),m.group(2)
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/octet-stream|importmap)["\']',attrs,re.I):continue
              f=out/f'inline-{i:04}.js';f.write_text(body,encoding='utf-8')
              p=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if p.returncode:raise SystemExit(f'Inline JavaScript {i} failed syntax check: {p.stderr}')
              count+=1
          if count<5:raise SystemExit(f'Expected at least 5 inline scripts, got {count}')
          print(f'PASS V175 inline JavaScript syntax: {count} script blocks')
          PY

      - name: Prepare V175 APK from the V162 base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V175_SOURCE_DIR/SurveyQuant_v1.0.175_PACKAGE_FREE_APK.py" \
            --apk-input "$V175_BASE_APK" \
            --apk-output "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_UNSIGNED.apk" \
            --html-to-inject "$V175_SOURCE_DIR/index.html"
          test -s "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_UNSIGNED.apk"
          unzip -t "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_UNSIGNED.apk" | tail -2

      - name: Sign and verify V175 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_ALIGNED.apk"
          FINAL="$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_ANDROID_ORIENTATION_PDF_POINT_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='175'.*versionName='1.0.175'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_UNSIGNED.apk"

      - name: Create V175 test report and source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$V175_SOURCE_DIR/README_V175_AR.md" <<'TXT'
          # SurveyQuant v1.0.175 مبني مباشرة على V162
          - أصل البناء: APK وSource Patch الناجحان V162، وليس V174.
          - إصلاح قارئ النقاط: رقم النقطة ID لا يدخل ضمن X/Y/Z. الترتيب الافتراضي بدون Header هو ID,Easting,Northing,Elevation، مع قراءة الأعمدة من Header عند وجوده. X=Easting وY=Northing.
          - مشروع تحويل الملفات إلى DXF يستخدم نوع الملف المختار في القائمة، ويشارك قارئ النقاط المصحح.
          - مشروع إسقاط الملفات يحتفظ بمسار المرجع الخام والدمج المحافظ على بايتات DXF الأصلية.
          - مشروع توجيه اللوحات أصبح بطاقة مستقلة في قائمة المشاريع. يختار نقطتين من اللوحة غير الموجهة ثم نقطتين مقابلتين من المرجع، ويحوّل ملف المصدر الأصلي إلى DXF جديد مع إبقاء المصدر دون تعديل.
          - مشروع PDF/الصورة إلى DXF أصبح بطاقة مستقلة. الصفحة تُحفظ كصورة JPG مرجعية مرتبطة بكيان IMAGE/IMAGEDEF قياسي في DXF، للحفاظ على ألوان وتفاصيل الصفحة. يجب إبقاء JPG بجوار DXF.
          - اجتازت اختبارات parser وprojection وorientation وPDF IMAGE/IMAGEDEF وWASM وJavaScript وAPK package integrity. يلزم اختبار ملفات المستخدم الحقيقية على الهاتف بعد تثبيت النسخة.
          TXT
          cat > "$V175_RELEASE_DIR/V175_TEST_REPORT_AR.txt" <<'TXT'
          SurveyQuant V175 test report
          Base: V162 artifact run 40919113310
          Point parser: numeric point IDs excluded from coordinates; PNT/TXT/CSV/header reorder tests passed.
          File-to-DXF: selected format is passed to the shared parser.
          Projection: V161 raw-reference and memory regression test passed; DXF reference merge retained.
          Orientation: six transform cases passed (CCW/CW 90, 180, zero, +37, -143); source DXF record transform and degenerate baseline rejection passed.
          PDF: standard IMAGE + IMAGEDEF DXF audit passed; matching PDF.js worker embedded; JPG sidecar naming and save order verified.
          DWG: embedded LibreDWG WASM smoke test passed without external WASM fetch.
          All 6 inline JavaScript script blocks passed node --check.
          APK: built from V162 APK, manifest version 1.0.175/175 verified, ZIP integrity passed, signed APK verified by apksigner.
          Not claimed: real DWG project files and the Android handset have not been exercised in this cloud build.
          TXT
          rm -rf "$V175_SOURCE_DIR/__pycache__"
          (cd "$V175_SOURCE_DIR" && zip -qr "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_SOURCE_PATCH.zip" | tail -2
          cp "$V175_SOURCE_DIR/README_V175_AR.md" "$V175_RELEASE_DIR/README_V175_AR.md"
          sha256sum "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_ANDROID_ORIENTATION_PDF_POINT_FIX.apk" "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_SOURCE_PATCH.zip" > "$V175_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V175_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload V175 APK, source patch, and test report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.175-FREE-V162-REGRESSION-REPAIR
          path: |
            ${{ runner.temp }}/v175-release/SurveyQuant_v1.0.175_FREE_ANDROID_ORIENTATION_PDF_POINT_FIX.apk
            ${{ runner.temp }}/v175-release/SurveyQuant_v1.0.175_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v175-release/README_V175_AR.md
            ${{ runner.temp }}/v175-release/V175_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v175-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish V175 release without replacing immutable assets
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.175 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.175 already exists; the new APK and source patch remain in the Actions artifact."
          else
            gh release create v1.0.175 \
              "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_ANDROID_ORIENTATION_PDF_POINT_FIX.apk" \
              "$V175_RELEASE_DIR/SurveyQuant_v1.0.175_FREE_SOURCE_PATCH.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SurveyQuant v1.0.175 - V162 Regression Repair" \
              --notes-file "$V175_SOURCE_DIR/README_V175_AR.md"
          fi
