name: Build SurveyQuant V62 XY FIXED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify V62 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE.zip"

          echo "========================================"
          echo "SURVEYQUANT V62 XY FIXED"
          echo "========================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          ls -lh "$ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source

          mkdir -p source

          unzip -q \
            SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE.zip \
            -d source

          echo "========================================"
          echo "EXTRACTED SOURCE"
          echo "========================================"

          find source -maxdepth 5 -type f -print | sort

      - name: Set Android project directory
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="source/SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          echo "$PROJECT_DIR"

      - name: Inspect Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "settings.gradle"
          echo "========================================"

          cat settings.gradle

          echo ""
          echo "========================================"
          echo "root build.gradle"
          echo "========================================"

          cat build.gradle

          echo ""
          echo "========================================"
          echo "app/build.gradle"
          echo "========================================"

          cat app/build.gradle

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING SURVEYQUANT V62"
          echo "========================================"

          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/SurveyQuant_v1.0.62_XY_FIXED.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.62-XY-FIXED
          path: output/SurveyQuant_v1.0.62_XY_FIXED.apk
          if-no-files-found: error
