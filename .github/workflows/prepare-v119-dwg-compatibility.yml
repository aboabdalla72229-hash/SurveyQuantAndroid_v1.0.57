name: paild V119 Universal DWG Handling

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Repair the real V119 build workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/prepare-v119-dwg-compatibility.yml")
          if not path.is_file():
              raise SystemExit(f"ERROR: Correct V119 workflow not found: {path}")
          source = path.read_text(encoding="utf-8")
          original = source

          # Fix doubled regex escapes only inside the temporary DWG bridge source.
          start_marker = "cat > \"$RUNNER_TEMP/sq-v119-dwg-bridge.js\" <<'JS'"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("ERROR: V119 DWG bridge start marker was not found.")
          end = source.find("\n          JS\n", start)
          if end < 0:
              raise SystemExit("ERROR: V119 DWG bridge end marker was not found.")
          bridge = source[start:end]
          bridge = bridge.replace(r"\\.dwg", r"\.dwg")
          bridge = bridge.replace(r"\\.dxf", r"\.dxf")

          # Add DWG/DXF to every file picker, including inputs created after a project opens.
          accept_anchor = "            var MIME = 'application/dxf';"
          accept_code = """            var MIME = 'application/dxf';
            var DWG_ACCEPT_TYPES = ['.dwg','.dxf','application/dwg','application/x-dwg','application/dxf','application/x-dxf','application/acad','application/x-acad','image/vnd.dwg'];
            function enableDwgInput(input) {
              if (!input || String(input.tagName || '').toLowerCase() !== 'input' || String(input.type || '').toLowerCase() !== 'file') return;
              var existing = String(input.accept || '').split(',').map(function(x){return x.trim();}).filter(Boolean);
              DWG_ACCEPT_TYPES.forEach(function(item){
                if (!existing.some(function(x){return x.toLowerCase() === item.toLowerCase();})) existing.push(item);
              });
              input.accept = existing.join(',');
            }
            function scanFileInputs(root) {
              if (root && root.nodeType === 1) enableDwgInput(root);
              if (root && typeof root.querySelectorAll === 'function') root.querySelectorAll('input[type="file"]').forEach(enableDwgInput);
            }
            scanFileInputs(document);
            if (typeof MutationObserver === 'function' && document.documentElement) {
              new MutationObserver(function(records){
                records.forEach(function(record){ (record.addedNodes || []).forEach(scanFileInputs); });
              }).observe(document.documentElement, {childList:true,subtree:true});
            }"""
          if "DWG_ACCEPT_TYPES" not in bridge:
              if bridge.count(accept_anchor) != 1:
                  raise SystemExit("ERROR: DWG MIME insertion anchor is not unique.")
              bridge = bridge.replace(accept_anchor, accept_code, 1)

          # Reject malformed conversion output rather than silently opening an empty/incomplete drawing.
          validation = r"""            function validateDxfText(text) {
              if (typeof text !== 'string' || !text.trim()) throw new Error('ملف DXF الناتج فارغ.');
              var normalized = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
              var lines = normalized.split('\n');
              while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
              if (lines.length < 8 || lines.length % 2 !== 0) throw new Error('ملف DXF الناتج غير مكتمل: أزواج group-code غير متوازنة.');
              if (lines[0].trim() !== '0' || lines[1].trim().toUpperCase() !== 'SECTION') throw new Error('بداية DXF الناتج غير صحيحة.');
              if (lines[lines.length - 2].trim() !== '0' || lines[lines.length - 1].trim().toUpperCase() !== 'EOF') throw new Error('نهاية DXF الناتج غير مكتملة.');
              var hasEntities = false, hasLayerTable = false, inTables = false, waitingForTableName = false;
              for (var i = 0; i + 1 < lines.length; i += 2) {
                var code = lines[i].trim(), value = lines[i + 1].trim();
                if (!/^-?\d+$/.test(code)) throw new Error('ملف DXF الناتج تالف قرب المجموعة ' + (i / 2 + 1) + '.');
                if (code === '0' && value.toUpperCase() === 'SECTION' && lines[i + 2] && lines[i + 2].trim() === '2' && lines[i + 3] && lines[i + 3].trim().toUpperCase() === 'ENTITIES') hasEntities = true;
                if (code === '0' && value.toUpperCase() === 'SECTION' && lines[i + 2] && lines[i + 2].trim() === '2' && lines[i + 3] && lines[i + 3].trim().toUpperCase() === 'TABLES') inTables = true;
                else if (inTables && code === '0' && value.toUpperCase() === 'TABLE') waitingForTableName = true;
                else if (waitingForTableName && code === '2') { if (value.toUpperCase() === 'LAYER') hasLayerTable = true; waitingForTableName = false; }
                else if (inTables && code === '0' && value.toUpperCase() === 'ENDSEC') inTables = false;
              }
              if (!hasEntities) throw new Error('قسم ENTITIES مفقود من DXF الناتج؛ أوقفنا الاستيراد لتجنب لوحة فارغة.');
              if (!hasLayerTable) throw new Error('جدول LAYER مفقود من DXF الناتج؛ أوقفنا الاستيراد لتجنب فقد الطبقات بصمت.');
              return normalized;
            }
          """
          if "function validateDxfText(text)" not in bridge:
              validate_anchor = "            function asDxfFile(result, sourceFile) {"
              if bridge.count(validate_anchor) != 1:
                  raise SystemExit("ERROR: DXF validation insertion point is not unique.")
              bridge = bridge.replace(validate_anchor, validation + validate_anchor, 1)

          old_convert_one = """            async function convertOne(file) {
              var converter = getConverter();
              if (!converter) throw new Error('محوّل DWG المشترك غير متاح. لم يتم تعديل الملف الأصلي.');
              return asDxfFile(await converter(file), file);
            }"""
          new_convert_one = """            async function convertOne(file) {
              var converter = getConverter();
              if (!converter) throw new Error('محوّل DWG المشترك غير متاح. لم يتم تعديل الملف الأصلي.');
              var converted = asDxfFile(await converter(file), file);
              var outputText = new TextDecoder('utf-8', {fatal:false}).decode(await converted.arrayBuffer());
              validateDxfText(outputText);
              return converted;
            }"""
          if old_convert_one in bridge:
              bridge = bridge.replace(old_convert_one, new_convert_one, 1)
          elif new_convert_one not in bridge:
              raise SystemExit("ERROR: Could not patch DWG converter call safely.")

          old_api = "            window.__sqV119DwgBridgeAPI = {asDxfFile:asDxfFile,convertOne:convertOne};"
          new_api = "            window.__sqV119DwgBridgeAPI = {asDxfFile:asDxfFile,convertOne:convertOne,validateDxfText:validateDxfText,enableDwgInput:enableDwgInput};"
          if old_api in bridge:
              bridge = bridge.replace(old_api, new_api, 1)
          elif new_api not in bridge:
              raise SystemExit("ERROR: DWG bridge test API export anchor missing.")
          source = source[:start] + bridge + source[end:]

          # Remove the current accept-filter restriction that misses non-CAD file inputs.
          lines = source.splitlines()
          for i, line in enumerate(lines[:-1]):
              if "lambda m: m.group(1)+m.group(2)+" in line and "dict.fromkeys" in line and ".dwg" in line:
                  next_line = lines[i + 1]
                  if "if re.search(r'(" in next_line and "else m.group(0)" in next_line:
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[i] = indent + "lambda m: m.group(1)+m.group(2)+','.join(dict.fromkeys([x.strip() for x in m.group(3).split(',') if x.strip()]+['.dwg','.dxf','application/dwg','application/x-dwg','application/dxf','application/x-dxf','application/acad','application/x-acad','image/vnd.dwg']))+m.group(2),"
                      lines[i + 1] = ""
                      break
          source = "\n".join(lines) + "\n"

          # Ensure the CAD text is zoomed with the board, and its tests check the same formula.
          source = source.replace(
              'new_text = "size=Math.max(0.1,Math.abs(Number(t.height)||2.5)*m.scale);"',
              'new_text = "size=Math.max(0.1,Math.abs(Number(t.height)||2.5)*m.scale*v.zoom);"'
          )
          source = source.replace(
              "grep -Fq 'size=Math.max(0.1,Math.abs(Number(t.height)||2.5)*m.scale)' \"$INDEX_PATH\"",
              "grep -Fq 'size=Math.max(0.1,Math.abs(Number(t.height)||2.5)*m.scale*v.zoom)' \"$INDEX_PATH\""
          )
          source = source.replace(
              "'size=Math.max(0.1,Math.abs(Number(t.height)||2.5)*m.scale)'",
              "'size=Math.max(0.1,Math.abs(Number(t.height)||2.5)*m.scale*v.zoom)'"
          )

          # Run regression checks against the real bridge generated during the V119 build.
          test_anchor = ('          node --check "$RUNNER_TEMP/sq-v119-dwg-bridge.js"' + "\n" +
                         '          grep -Fq \'id="sq-v119-universal-dwg-bridge"\' "$INDEX_PATH"')
          test_block = r"""          node --check "$RUNNER_TEMP/sq-v119-dwg-bridge.js"
          node - "$RUNNER_TEMP/sq-v119-dwg-bridge.js" <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const input = {tagName:'INPUT',type:'file',accept:'.csv'};
          const doc = {nodeType:9,querySelectorAll(){return [input];},addEventListener(){},documentElement:null};
          const win = {};
          const context = {window:win,document:doc,Array,ArrayBuffer,Uint8Array,TextDecoder,Date,console,File:class File{},Blob:class Blob{},Event:class Event{}};
          vm.runInNewContext(source, context, {filename:'sq-v119-dwg-bridge.js'});
          assert(/\.dwg$/i.test('plan.dwg'), 'correct .dwg filename matcher');
          assert(!/\\.dwg$/i.test('plan.dwg'), 'double-escaped matcher would fail');
          assert(input.accept.includes('.dwg') && input.accept.includes('.dxf'), 'all project file inputs accept DWG and DXF');
          const api = win.__sqV119DwgBridgeAPI;
          assert(api && typeof api.validateDxfText === 'function', 'validation API exposed');
          const valid = ['0','SECTION','2','HEADER','0','ENDSEC','0','SECTION','2','TABLES','0','TABLE','2','LAYER','70','1','0','LAYER','2','0','70','0','62','7','0','ENDTAB','0','ENDSEC','0','SECTION','2','ENTITIES','0','LINE','8','0','10','0','20','0','11','1','21','1','0','ENDSEC','0','EOF'].join('\n')+'\n';
          assert.equal(api.validateDxfText(valid).includes('ENTITIES'), true);
          assert.throws(() => api.validateDxfText('0\nSECTION\n2\nENTITIES\n0\nENDSEC\n0\nEOF\n'), /جدول LAYER/);
          assert.throws(() => api.validateDxfText('not-a-dxf'), /أزواج group-code|بداية DXF/);
          assert(source.includes('DWG_ACCEPT_TYPES'), 'dynamic file input acceptance added');
          assert(source.includes('new MutationObserver'), 'dynamic project inputs covered');
          console.log('PASS universal DWG bridge regression: correct extension matching, every picker accepts DWG, malformed/partial DXF rejected.');
          NODE
          grep -Fq 'id="sq-v119-universal-dwg-bridge"' $INDEX_PATH"""
          if "PASS universal DWG bridge regression" not in source:
              if test_anchor not in source:
                  raise SystemExit("ERROR: Could not locate V119 bridge test insertion point.")
              source = source.replace(test_anchor, test_block, 1)

          required = [
              "DWG_ACCEPT_TYPES",
              "function validateDxfText(text)",
              "validateDxfText(outputText)",
              "PASS universal DWG bridge regression",
              "convertList(files)",
              'size=Math.max(0.1,Math.abs(Number(t.height)||2.5)*m.scale*v.zoom)',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("ERROR: V119 repair verification failed: " + ", ".join(missing))
          if r"\\.dwg" in bridge or r"\\.dxf" in bridge:
              raise SystemExit("ERROR: double-escaped DWG/DXF matcher remains in the bridge.")
          if source == original:
              print("V119 workflow was already repaired; no workflow content changes were necessary.")
          else:
              path.write_text(source, encoding="utf-8")
              print("PASS: V119 workflow repaired with universal picker support, valid DWG-extension detection, DXF/layer validation, and synchronized board/text scale.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- .github/workflows/prepare-v119-dwg-compatibility.yml; then
            git add .github/workflows/prepare-v119-dwg-compatibility.yml
            git commit -m "Fix V119 universal DWG import and DXF validation"
            git push origin HEAD:main
          fi

      - name: Start the repaired V119 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/prepare-v119-dwg-compatibility.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched the repaired V119 workflow."
