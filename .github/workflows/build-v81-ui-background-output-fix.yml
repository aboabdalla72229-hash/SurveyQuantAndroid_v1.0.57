name: Build SurveyQuant v1.0.81 - UI Background Output Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v67 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/surveyquant"
          mkdir -p "$RUNNER_TEMP/surveyquant"

          SOURCE_ZIP="SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: $SOURCE_ZIP not found."
            exit 1
          fi

          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/surveyquant"

      - name: Load v81 patch from bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="SurveyQuant_v1.0.81_WORKFLOW_BUNDLE.zip"

          if [ ! -f "$BUNDLE" ]; then
            echo "ERROR: $BUNDLE not found in repository root."
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/patch"
          mkdir -p "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/patch"

          unzip -q "$BUNDLE" -d "$RUNNER_TEMP/bundle"

          PATCH="$(find "$RUNNER_TEMP/bundle" -type f -name 'surveyquant-v67-ui-background-output-patch.zip' -print -quit)"

          if [ -z "$PATCH" ]; then
            echo "ERROR: bundled patch ZIP not found."
            exit 1
          fi

          unzip -q "$PATCH" -d "$RUNNER_TEMP/patch"

      - name: Apply v81 UI/background/output patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_INDEX="$(find "$RUNNER_TEMP/patch" -type f -name 'index-v67-patched.html' -print -quit)"
          TARGET_INDEX="$(find "$RUNNER_TEMP/surveyquant" -type f -name 'index.html' -print -quit)"

          if [ -z "$PATCH_INDEX" ]; then
            echo "ERROR: index-v67-patched.html not found."
            exit 1
          fi

          if [ -z "$TARGET_INDEX" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          cp "$PATCH_INDEX" "$TARGET_INDEX"

          ASSETS="$(find "$RUNNER_TEMP/surveyquant" -type d -path '*/src/main/assets' -print -quit || true)"

          if [ -n "$ASSETS" ]; then
            BG="$(find "$RUNNER_TEMP/patch" -type f -name 'surveyquant_background.png' -print -quit || true)"
            LOGO="$(find "$RUNNER_TEMP/patch" -type f -name 'surveyquant_logo.png' -print -quit || true)"

            [ -z "$BG" ] || cp "$BG" "$ASSETS/surveyquant_background.png"
            [ -z "$LOGO" ] || cp "$LOGO" "$ASSETS/surveyquant_logo.png"
          fi

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(find "$RUNNER_TEMP/surveyquant" -type f -name gradlew -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect v1.0.81 outputs
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/SurveyQuant_v1.0.81.apk"

          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/release/SurveyQuantAndroid_v1.0.81_UI_BACKGROUND_OUTPUT_FIX.zip" surveyquant

      - name: Upload v1.0.81 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.81
          path: |
            release/SurveyQuant_v1.0.81.apk
            release/SurveyQuantAndroid_v1.0.81_UI_BACKGROUND_OUTPUT_FIX.zip
          if-no-files-found: error
