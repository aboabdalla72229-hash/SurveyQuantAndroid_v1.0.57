name: Build SurveyQuant V60

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v60.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify source files
        shell: bash
        run: |
          set -e
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          grep -q "versionCode 60" app/build.gradle
          grep -q "versionName '1.0.60'" app/build.gradle

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/surveyquant.jks"
          test -s "$RUNNER_TEMP/surveyquant.jks"

      - name: Build release APK
        env:
          SURVEYQUANT_KEYSTORE_FILE: ${{ runner.temp }}/surveyquant.jks
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.60-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
