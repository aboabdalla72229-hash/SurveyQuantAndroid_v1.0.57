name: Build SurveyQuant v1.0.147 - HATCH + Concrete Root-Cause Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V146 base APK/source artifact run ID"
        required: true
        type: string
        default: "40095820975"
      reference_run_id:
        description: "Successful V130 DWG/orientation reference run ID"
        required: true
        type: string
        default: "39560732493"
  push:
    paths:
      - ".github/workflows/build-v147-hatch-concrete-root-cause-fix.yml"
      - "SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_PATCH_KIT.zip"

permissions:
  actions: read
  contents: read

jobs:
  build_v147:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40095820975' }}
      REFERENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_run_id || '39560732493' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Check out workflow and patch kit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned DXF reference oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ezdxf==1.4.4"
          python - <<'PY'
          import ezdxf
          assert ezdxf.__version__ == "1.4.4", ezdxf.__version__
          print("PASS: ezdxf 1.4.4 reference oracle is installed.")
          PY

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android build tools configured."

      - name: Download V146 base and V130 reference; unpack V147 patch kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_PATCH_KIT.zip"
          test -s "$KIT" || { echo "ERROR: Upload SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_PATCH_KIT.zip to the repository root."; exit 1; }
          unzip -t "$KIT"
          KIT_DIR="$RUNNER_TEMP/v147-kit"
          BASE_DIR="$RUNNER_TEMP/v146-base"
          REF_DIR="$RUNNER_TEMP/v130-reference"
          rm -rf "$KIT_DIR" "$BASE_DIR" "$REF_DIR"
          mkdir -p "$KIT_DIR" "$BASE_DIR" "$REF_DIR"
          unzip -q "$KIT" -d "$KIT_DIR"
          for f in \
            SurveyQuant_v1.0.147_APPLY_ROOT_CAUSE_FIX.py \
            SurveyQuant_v1.0.147_PACKAGE_APK.py \
            SurveyQuant_v1.0.147_REGRESSION_TEST.js \
            SurveyQuant_v1.0.147_STABILITY_TEST.js \
            SurveyQuant_v1.0.147_ORIENTATION_PRECISION_TEST.js \
            SurveyQuant_v1.0.147_ALIGNMENT_SAFETY_TEST.js \
            SurveyQuant_v1.0.147_MLEADER_ALIGNMENT_TEST.js \
            SurveyQuant_v1.0.147_3D_OCS_AXIS_TEST.js \
            SurveyQuant_v1.0.147_REAL_MLEADER_ORACLE_TEST.py \
            SurveyQuant_v1.0.147_REAL_MLEADER_TRANSFORM_RUNNER.js \
            SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js; do
            test -s "$KIT_DIR/$f" || { echo "ERROR: required file missing: $f"; exit 1; }
          done
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.146-DXF-MEMORY-HATCH-AXIS-FIX" --dir "$BASE_DIR"
          gh run download "$REFERENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.130-DWG-AXIS-MULTISELECT" --dir "$REF_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.146_DXF_MEMORY_HATCH_AXIS_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.146_DXF_MEMORY_HATCH_AXIS_FIX_SOURCE_PATCH.zip' -print -quit)"
          REF_PATCH="$(find "$REF_DIR" -type f -name 'SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V146 signed APK missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V146 source patch missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$REF_PATCH" || { echo "ERROR: V130 reference source missing from run $REFERENCE_RUN_ID."; exit 1; }
          unzip -t "$BASE_PATCH"
          unzip -t "$REF_PATCH"
          mkdir -p "$RUNNER_TEMP/v147-source" "$RUNNER_TEMP/v130-source" "$RUNNER_TEMP/sq-release"
          unzip -q "$BASE_PATCH" -d "$RUNNER_TEMP/v147-source"
          unzip -q "$REF_PATCH" -d "$RUNNER_TEMP/v130-source"
          test -s "$RUNNER_TEMP/v147-source/index.html"
          test -s "$RUNNER_TEMP/v130-source/index.html"
          {
            echo "V147_KIT_DIR=$KIT_DIR"
            echo "V147_BASE_APK=$BASE_APK"
            echo "V147_SOURCE_DIR=$RUNNER_TEMP/v147-source"
            echo "V130_SOURCE_DIR=$RUNNER_TEMP/v130-source"
            echo "V147_RELEASE_DIR=$RUNNER_TEMP/sq-release"
          } >> "$GITHUB_ENV"

      - name: Apply root-cause fixes and run the full regression suite
        shell: bash
        run: |
          set -euo pipefail
          PATCHER="$V147_KIT_DIR/SurveyQuant_v1.0.147_APPLY_ROOT_CAUSE_FIX.py"
          FINAL_HTML="$V147_SOURCE_DIR/index_v147.html"
          python -m py_compile "$PATCHER" "$V147_KIT_DIR/SurveyQuant_v1.0.147_PACKAGE_APK.py" "$V147_KIT_DIR/SurveyQuant_v1.0.147_REAL_MLEADER_ORACLE_TEST.py"
          for f in \
            "$V147_KIT_DIR/SurveyQuant_v1.0.147_REGRESSION_TEST.js" \
            "$V147_KIT_DIR/SurveyQuant_v1.0.147_STABILITY_TEST.js" \
            "$V147_KIT_DIR/SurveyQuant_v1.0.147_ORIENTATION_PRECISION_TEST.js" \
            "$V147_KIT_DIR/SurveyQuant_v1.0.147_ALIGNMENT_SAFETY_TEST.js" \
            "$V147_KIT_DIR/SurveyQuant_v1.0.147_MLEADER_ALIGNMENT_TEST.js" \
            "$V147_KIT_DIR/SurveyQuant_v1.0.147_3D_OCS_AXIS_TEST.js" \
            "$V147_KIT_DIR/SurveyQuant_v1.0.147_REAL_MLEADER_TRANSFORM_RUNNER.js" \
            "$V147_KIT_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"; do node --check "$f"; done
          python3 "$PATCHER" --input-html "$V147_SOURCE_DIR/index.html" --output-html "$FINAL_HTML" --report "$V147_RELEASE_DIR/V147_ROOT_CAUSE_REPORT.md"
          node "$V147_KIT_DIR/SurveyQuant_v1.0.147_REGRESSION_TEST.js" "$FINAL_HTML"
          node "$V147_KIT_DIR/SurveyQuant_v1.0.147_STABILITY_TEST.js" "$FINAL_HTML"
          node "$V147_KIT_DIR/SurveyQuant_v1.0.147_ORIENTATION_PRECISION_TEST.js" "$FINAL_HTML" "$V130_SOURCE_DIR/index.html"
          node "$V147_KIT_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js" "$FINAL_HTML"
          node "$V147_KIT_DIR/SurveyQuant_v1.0.147_ALIGNMENT_SAFETY_TEST.js" "$FINAL_HTML"
          node "$V147_KIT_DIR/SurveyQuant_v1.0.147_MLEADER_ALIGNMENT_TEST.js" "$FINAL_HTML"
          node "$V147_KIT_DIR/SurveyQuant_v1.0.147_3D_OCS_AXIS_TEST.js" "$FINAL_HTML"
          python3 "$V147_KIT_DIR/SurveyQuant_v1.0.147_REAL_MLEADER_ORACLE_TEST.py" --html "$FINAL_HTML" --js-runner "$V147_KIT_DIR/SurveyQuant_v1.0.147_REAL_MLEADER_TRANSFORM_RUNNER.js" --work-dir "$RUNNER_TEMP/v147-real-mleader-test"
          node --check "$V147_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$FINAL_HTML" "$RUNNER_TEMP/v147-inline-js-check" <<'PY'
          import pathlib, re, subprocess, sys
          html_path, out_dir = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          out_dir.mkdir(parents=True, exist_ok=True)
          source = html_path.read_text(encoding='utf-8')
          found = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', source, re.I)
          checked = 0
          for i, (attrs, body) in enumerate(found):
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/ld\+json|importmap)["\']', attrs, re.I):
                  continue
              path = out_dir / f'script_{i}.js'
              path.write_text(body, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
              checked += 1
          if checked < 8: raise SystemExit(f'Expected at least 8 inline JavaScript blocks, found {checked}')
          print(f'PASS: {checked} inline JavaScript blocks parse.')
          PY
          grep -q 'function processHatchRecord()' "$FINAL_HTML"
          grep -q 'function sqConcreteClosedPolylines(model, layerName)' "$FINAL_HTML"
          grep -q 'function sqConcreteExpandBlockPolylines(model)' "$FINAL_HTML"
          if grep -q 'كيانات في OCS غير قياسي لا يمكن تحويل' "$FINAL_HTML"; then echo "ERROR: obsolete OCS-blocking warning remains."; exit 1; fi
          cp "$FINAL_HTML" "$V147_SOURCE_DIR/index.html"
          rm -f "$FINAL_HTML"
          for f in "$V147_KIT_DIR"/SurveyQuant_v1.0.147_* "$V147_KIT_DIR"/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js "$V147_KIT_DIR"/README_V147_AR.txt "$V147_KIT_DIR"/SurveyQuant_v1.0.147_AUTOMATED_TEST_RESULTS.md "$V147_KIT_DIR"/SurveyQuant_v1.0.147_ROOT_CAUSE_REPORT.md; do
            [ -f "$f" ] && cp "$f" "$V147_SOURCE_DIR/"
          done
          cp "$V147_RELEASE_DIR/V147_ROOT_CAUSE_REPORT.md" "$V147_SOURCE_DIR/V147_ROOT_CAUSE_REPORT.md"
          cat > "$V147_RELEASE_DIR/V147_BUILD_RESULT.txt" <<'TXT'
          PASS V147: HATCH edge-aware transform prevents unpaired boundary endpoints; pattern-local vectors remain translation-free; concrete closed polyline raw recovery, LINE-loop recovery, and INSERT outline expansion pass; 24000 DXF entities remain after transformation; V130 orientation/DWG, 3D/OCS, MLEADER and ezdxf-oracle regressions pass; all inline JavaScript blocks parse.
          TXT
          rm -f "$V147_RELEASE_DIR/SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_SOURCE_PATCH.zip"
          (cd "$V147_SOURCE_DIR" && zip -qr "$V147_RELEASE_DIR/SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_SOURCE_PATCH.zip" .)
          unzip -t "$V147_RELEASE_DIR/SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_SOURCE_PATCH.zip" | tail -2

      - name: Inject tested HTML into V146 APK, sign, and verify V147
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V147_RELEASE_DIR/SurveyQuant_v1.0.147_HATCH_AND_CONCRETE_ROOT_CAUSE_FIX_UNSIGNED.apk"
          ALIGNED="$V147_RELEASE_DIR/SurveyQuant_v1.0.147_HATCH_AND_CONCRETE_ROOT_CAUSE_FIX_ALIGNED.apk"
          FINAL="$V147_RELEASE_DIR/SurveyQuant_v1.0.147_HATCH_AND_CONCRETE_ROOT_CAUSE_FIX.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V147_KIT_DIR/SurveyQuant_v1.0.147_PACKAGE_APK.py" --apk-input "$V147_BASE_APK" --apk-output "$RAW" --html-to-inject "$V147_SOURCE_DIR/index.html"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='147'.*versionName='1.0.147'"
          sha256sum "$FINAL" "$V147_RELEASE_DIR/SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_SOURCE_PATCH.zip" > "$V147_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V147_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed V147 APK, source and reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.147-HATCH-AND-CONCRETE-ROOT-CAUSE-FIX
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.147_HATCH_AND_CONCRETE_ROOT_CAUSE_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.147_ROOT_CAUSE_FIX_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V147_BUILD_RESULT.txt
            ${{ runner.temp }}/sq-release/V147_ROOT_CAUSE_REPORT.md
          if-no-files-found: error
          retention-days: 14
