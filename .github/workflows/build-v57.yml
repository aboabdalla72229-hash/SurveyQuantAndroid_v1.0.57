name: Build SurveyQuant v1.0.57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Check source ZIP
      # ============================================================
      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          ZIP_NAME="SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip"

          if [ ! -s "$ZIP_NAME" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP_NAME"
            exit 1
          fi

          echo "Source ZIP:"
          ls -lh "$ZIP_NAME"

      # ============================================================
      # 3. Extract
      # ============================================================
      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip" \
            -d extracted

          echo "=== EXTRACTED PROJECTS ==="
          find extracted -maxdepth 3 -type f | sort | head -300

      # ============================================================
      # 4. Detect Android project
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app build file not found."
            exit 1
          fi

          echo "$PROJECT_DIR" > project_dir.txt

      # ============================================================
      # 5. Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 6. Setup Android
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 7. Create CI keystore
      # ============================================================
      - name: Create CI keystore
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          mkdir -p keystore-setup

          KEYSTORE="$PWD/keystore-setup/surveyquant-ci.jks"

          echo "Creating CI keystore..."

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias surveyquant \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass surveyquant123 \
            -keypass surveyquant123 \
            -dname "CN=SurveyQuant, OU=Engineering, O=SurveyQuant, L=Egypt, ST=Beni Suef, C=EG"

          test -f "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE"

          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEYSTORE_ALIAS=surveyquant" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEYSTORE_PASSWORD=surveyquant123" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEY_PASSWORD=surveyquant123" >> "$GITHUB_ENV"

      # ============================================================
      # 8. Inspect build.gradle
      # ============================================================
      - name: Inspect signing configuration
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "APP BUILD.GRADLE"
          echo "========================================"

          nl -ba app/build.gradle | sed -n '1,80p'

          echo "========================================"
          echo "SIGNING REFERENCES"
          echo "========================================"

          grep -n -E \
            "SURVEYQUANT|keystore|signingConfigs|signingConfig|throw new GradleException" \
            app/build.gradle || true

      # ============================================================
      # 9. Patch mandatory keystore check
      # ============================================================
      - name: Patch keystore configuration
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          text = p.read_text(encoding="utf-8")

          print("Searching for mandatory keystore exception...")

          old_patterns = [
              'throw new GradleException("SURVEYQUANT_KEYSTORE_FILE is not configured")',
              "throw new GradleException('SURVEYQUANT_KEYSTORE_FILE is not configured')"
          ]

          changed = False

          for old in old_patterns:
              if old in text:
                  text = text.replace(
                      old,
                      'println("CI BUILD: SURVEYQUANT_KEYSTORE_FILE supplied by GitHub Actions")'
                  )
                  changed = True

          if changed:
              p.write_text(text, encoding="utf-8")
              print("Keystore mandatory exception patched.")
          else:
              print("Mandatory exception string not found.")
              print("The build file will be shown below.")

          print("===== BUILD.GRADLE AFTER PATCH =====")
          for i, line in enumerate(text.splitlines(), 1):
              if i <= 50:
                  print(f"{i}: {line}")
          PY

      # ============================================================
      # 10. Generate Gradle wrapper
      # ============================================================
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."

            gradle wrapper \
              --gradle-version 8.6
          fi

          chmod +x gradlew

          echo "=== GRADLE VERSION ==="

          ./gradlew --version

      # ============================================================
      # 11. Build
      # ============================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING SURVEYQUANT v1.0.57"
          echo "========================================"

          echo "Project:"
          pwd

          echo "Keystore:"
          echo "$SURVEYQUANT_KEYSTORE_FILE"

          test -f "$SURVEYQUANT_KEYSTORE_FILE"

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 12. Find APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -print || true

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            release/SurveyQuant-v1.0.57.apk

          ls -lh release/SurveyQuant-v1.0.57.apk

      # ============================================================
      # 13. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57
          path: release/SurveyQuant-v1.0.57.apk
          if-no-files-found: error

      # ============================================================
      # 14. Upload build reports if failure
      # ============================================================
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57-build-reports
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/**
          if-no-files-found: ignore
