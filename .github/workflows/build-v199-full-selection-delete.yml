name: Build SurveyQuant v1.0.199 Full Selection Delete Addendum (V177 Base)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Exact V162 base APK/source artifact run ID used by the V177 line"
        required: true
        type: string
        default: "40919113310"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v199-full-selection-delete.yml"
      - "SurveyQuant_v1.0.177_FIX_KIT.zip"
      - "SurveyQuant_v1.0.199_SINGLE_CANVAS_DATA_EXPORT_PATCH.zip"
      - "SurveyQuant_v1.0.199_SINGLE_CANVAS_DATA_EXPORT_PATCH-1.zip"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v199-v177-base-single-canvas-data
  cancel-in-progress: false

jobs:
  build_v199:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40919113310' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract and validate V177 fix kit and V199 addendum
        shell: bash
        run: |
          set -euo pipefail
          KIT_ZIP="$GITHUB_WORKSPACE/SurveyQuant_v1.0.177_FIX_KIT.zip"
          PATCH_PRIMARY="$GITHUB_WORKSPACE/SurveyQuant_v1.0.199_SINGLE_CANVAS_DATA_EXPORT_PATCH.zip"
          PATCH_UPLOADED="$GITHUB_WORKSPACE/SurveyQuant_v1.0.199_SINGLE_CANVAS_DATA_EXPORT_PATCH-1.zip"
          test -s "$KIT_ZIP" || { echo "ERROR: Missing SurveyQuant_v1.0.177_FIX_KIT.zip in repository root"; exit 1; }

          # GitHub renamed the uploaded duplicate to PATCH-1.zip. Accept both exact names.
          if [ -s "$PATCH_PRIMARY" ]; then
            PATCH_ZIP="$PATCH_PRIMARY"
          elif [ -s "$PATCH_UPLOADED" ]; then
            PATCH_ZIP="$PATCH_UPLOADED"
          else
            echo "ERROR: Missing V199 addendum ZIP. Expected PATCH.zip or PATCH-1.zip in repository root."
            exit 1
          fi
          echo "V199 addendum archive selected: $(basename "$PATCH_ZIP")"
          EXPECTED_PATCH_SHA256="090551ad3f9e2edffe1d33522cdd8b0078c904bbec0a38674204d136ef7ebc1f"
          ACTUAL_PATCH_SHA256="$(sha256sum "$PATCH_ZIP" | awk '{print $1}')"
          test "$ACTUAL_PATCH_SHA256" = "$EXPECTED_PATCH_SHA256" || {
            echo "ERROR: V199 addendum checksum mismatch. Expected $EXPECTED_PATCH_SHA256, got $ACTUAL_PATCH_SHA256"
            exit 1
          }
          unzip -tq "$PATCH_ZIP" >/dev/null || { echo "ERROR: V199 addendum ZIP is corrupt"; exit 1; }
          echo "PASS V199 addendum archive name, SHA-256 and ZIP integrity"

          KIT="$RUNNER_TEMP/sq177-kit"
          ADDON="$RUNNER_TEMP/sq199-addendum"
          rm -rf "$KIT" "$ADDON"
          mkdir -p "$KIT" "$ADDON"
          unzip -q "$KIT_ZIP" -d "$KIT"
          unzip -q "$PATCH_ZIP" -d "$ADDON"

          for f in \
            SurveyQuant_v1.0.176_PATCH.py \
            SurveyQuant_v1.0.176_CAD_ENGINE.js \
            SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.177_CAD_ENGINE.js \
            SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.177_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.177_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js \
            SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            SurveyQuant_v1.0.177_IMAGETRACER.js \
            SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V177_VECTOR_TEST.pdf; do
            test -s "$KIT/$f" || { echo "ERROR: Missing V177 fix-kit file: $f"; exit 1; }
          done

          for f in \
            SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_MODULE.js \
            SurveyQuant_v1.0.177_APPLY_SINGLE_CANVAS_DATA_PATCH.py \
            SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_TEST.js \
            SurveyQuant_v1.0.177_TEST_ADDENDUM_PACKAGE.py \
            SurveyQuant_v1.0.177_TEST_APPLIER.py \
            V177_TEST_PIXEL.jpg \
            README_V199_AR.md; do
            test -s "$ADDON/$f" || { echo "ERROR: Missing V199 patch file: $f"; exit 1; }
          done

          echo "SQ177_KIT=$KIT" >> "$GITHUB_ENV"
          echo "SQ199_ADDON=$ADDON" >> "$GITHUB_ENV"

      - name: Download exact V162 source and APK artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v162-base"
          SOURCE_DIR="$RUNNER_TEMP/v199-source"
          RELEASE_DIR="$RUNNER_TEMP/v199-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"

          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "SurveyQuant-v1.0.162-FREE-DWG-WASM-PROJECTION-FIX" \
            --dir "$BASE_DIR"

          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V162 APK missing from Actions run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V162 source patch missing from Actions run $SOURCE_RUN_ID"; exit 1; }

          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"

          echo "V199_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V199_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V199_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Apply V176 compatibility stage to clean V162 source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ177_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V199_SOURCE_DIR/index.html" \
            --engine "$SQ177_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ177_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ177_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ177_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt"

          python3 "$SQ177_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V199_SOURCE_DIR/index.html" \
            --engine "$SQ177_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ177_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ177_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ177_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt" \
            --check-only

      - name: Apply V177 file-bytes, canvas identity and PDF/DXF fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ177_KIT/SurveyQuant_v1.0.177_PATCH.py" \
            --html "$V199_SOURCE_DIR/index.html" \
            --engine "$SQ177_KIT/SurveyQuant_v1.0.177_CAD_ENGINE.js" \
            --drop-files-merge "$SQ177_KIT/SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt"

          python3 "$SQ177_KIT/SurveyQuant_v1.0.177_PATCH.py" \
            --html "$V199_SOURCE_DIR/index.html" \
            --engine "$SQ177_KIT/SurveyQuant_v1.0.177_CAD_ENGINE.js" \
            --drop-files-merge "$SQ177_KIT/SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt" \
            --check-only

          for f in \
            SurveyQuant_v1.0.177_CAD_ENGINE.js \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.177_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.177_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.177_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js \
            SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            SurveyQuant_v1.0.177_IMAGETRACER.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V177_VECTOR_TEST.pdf; do
            cp "$SQ177_KIT/$f" "$V199_SOURCE_DIR/"
          done

      - name: Verify V177 engine export before V199 injection
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$V199_SOURCE_DIR/index.html" <<'PY'
          from pathlib import Path
          import sys
          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          checks = {
              "V177 CAD engine script": 'id="sq176-cad-engine"',
              "V177 CAD API export": "root.SurveyQuantCAD177 = api",
              "V177 shared file parser": "function parseFile(file,options={})",
              "Android safe save bridge": "safeDownloadFile",
          }
          missing = [name for name, token in checks.items() if token not in html]
          if missing:
              raise SystemExit("V177 base integrity check failed: " + ", ".join(missing))
          print("PASS V177 runtime engine export and shared bridges verified")
          PY

      - name: Inject V199 single-canvas and data selection addendum
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ199_ADDON/SurveyQuant_v1.0.177_APPLY_SINGLE_CANVAS_DATA_PATCH.py" \
            --html "$V199_SOURCE_DIR/index.html" \
            --module "$SQ199_ADDON/SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_MODULE.js"

          python3 "$SQ199_ADDON/SurveyQuant_v1.0.177_APPLY_SINGLE_CANVAS_DATA_PATCH.py" \
            --html "$V199_SOURCE_DIR/index.html" \
            --module "$SQ199_ADDON/SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_MODULE.js" \
            --check-only

          python3 "$SQ199_ADDON/SurveyQuant_v1.0.177_TEST_APPLIER.py"
          node --check "$SQ199_ADDON/SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_MODULE.js"
          node "$SQ199_ADDON/SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_TEST.js" \
            "$SQ199_ADDON/SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_MODULE.js" \
            "$V199_RELEASE_DIR"
          python3 "$SQ199_ADDON/SurveyQuant_v1.0.177_TEST_ADDENDUM_PACKAGE.py" \
            --html "$V199_SOURCE_DIR/index.html" \
            --module "$SQ199_ADDON/SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_MODULE.js"

      - name: Configure APK package version as 1.0.199 (199)
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$V199_SOURCE_DIR/SurveyQuant_v1.0.177_PACKAGE_FREE_APK.py" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          if not p.is_file():
              raise SystemExit(f"APK packager missing: {p}")
          src = p.read_text(encoding="utf-8")
          replacements = {
              "NEW_NAME": "'1.0.199'",
              "NEW_CODE": "199",
          }
          for key, value in replacements.items():
              pattern = re.compile(rf"(?m)^{key}\s*=\s*[^\r\n]+$")
              hits = list(pattern.finditer(src))
              if len(hits) != 1:
                  raise SystemExit(f"Expected exactly one {key} constant in V177 packager, found {len(hits)}")
              src = pattern.sub(f"{key} = {value}", src, count=1)
          if "NEW_NAME = '1.0.199'" not in src or "NEW_CODE = 199" not in src:
              raise SystemExit("Could not set V199 APK manifest version")
          p.write_text(src, encoding="utf-8")
          compile(src, str(p), "exec")
          print("PASS APK manifest version constants: versionName=1.0.199, versionCode=199")
          PY

      - name: Run V177 compatibility and V199 addendum checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$V199_SOURCE_DIR"
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4

          python3 -m py_compile \
            "$SQ177_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.177_PACKAGE_FREE_APK.py \
            "$SQ199_ADDON/SurveyQuant_v1.0.177_APPLY_SINGLE_CANVAS_DATA_PATCH.py" \
            "$SQ199_ADDON/SurveyQuant_v1.0.177_TEST_ADDENDUM_PACKAGE.py"

          node --check SurveyQuant_v1.0.177_CAD_ENGINE.js
          node --check SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js
          node --check SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js
          node --check "$SQ199_ADDON/SurveyQuant_v1.0.177_SINGLE_CANVAS_DATA_EXPORT_MODULE.js"
          node --check libredwg-writer/wasm/libredwg-web.js

          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js index.html
          node SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js \
            "$V199_RELEASE_DIR/V177_MERGED_BOARDS_TEST.dxf" \
            "$V199_RELEASE_DIR/V177_ORIENTED_BOARD_TEST.dxf"
          node SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js \
            "$V199_RELEASE_DIR/V177_ORIENTATION_BOARD_FILE_TEST.dxf"
          node SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V177_VECTOR_TEST.pdf \
            "$V199_RELEASE_DIR/V177_PDF_VECTOR_TEST_OUT.dxf"
          node SurveyQuant_v1.0.177_APP_PROJECT_TEST.js index.html
          node SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            libredwg-writer/wasm/libredwg-web.js \
            libredwg-writer/wasm/libredwg-web.wasm

          python3 - "$V199_SOURCE_DIR/index.html" "$RUNNER_TEMP/sq199-inline-scripts" <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          out = Path(sys.argv[2]); out.mkdir(parents=True, exist_ok=True)
          count = 0
          for i, m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)):
              attrs, body = m.group(1), m.group(2)
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/octet-stream|importmap)["\']', attrs, re.I):
                  continue
              f = out / f'inline-{i:04}.js'; f.write_text(body, encoding='utf-8')
              result = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit(f'Inline JavaScript #{i} failed:\n{result.stderr}')
              count += 1
          if count < 6:
              raise SystemExit(f'Expected at least 6 inline JS blocks; found {count}')
          print(f'PASS inline JavaScript syntax: {count} blocks')
          PY
          rm -f pdf.worker.js

      - name: Package unsigned V199 APK from exact V162 base APK
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V199_SOURCE_DIR/SurveyQuant_v1.0.177_PACKAGE_FREE_APK.py" \
            --apk-input "$V199_BASE_APK" \
            --apk-output "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_UNSIGNED.apk" \
            --html-to-inject "$V199_SOURCE_DIR/index.html"
          test -s "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_UNSIGNED.apk"
          unzip -t "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_UNSIGNED.apk" | tail -2

      - name: Sign, align and verify V199 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null

          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_ALIGNED.apk"
          FINAL="$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_ANDROID_SINGLE_CANVAS_DATA.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"

          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 \
            "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks "$STORE" \
            --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" \
            --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD \
            --key-pass env:SURVEYQUANT_KEY_PASSWORD \
            --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='199'.*versionName='1.0.199'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_UNSIGNED.apk"

      - name: Package full V199 source patch, report and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > "$V199_SOURCE_DIR/README_V199_BUILD_AR.md" <<'TXT'
          SurveyQuant V1.0.199 - Single Canvas / Data / Selection Addendum
          APK versionName=1.0.199, versionCode=199.
          Build lineage: exact V162 source/APK artifact run 40919113310, V176 compatibility stage, V177 CAD/filebytes/PDF stage, then V199 addendum.
          The V199 addendum provides the orientation and point-data screens plus in-session entity selection, window selection, select similar, delete selected and restore deleted controls.
          Important: deletion is in-session only. The addendum does not claim permanent removal of deleted original CAD entities from DXF export.
          Automated checks are synthetic/structural; user handset testing with the original DWG/DXF/PDF samples remains necessary.
          TXT

          cp "$SQ199_ADDON/README_V199_AR.md" "$V199_RELEASE_DIR/README_V199_AR.md"
          cp "$V199_SOURCE_DIR/README_V199_BUILD_AR.md" "$V199_RELEASE_DIR/README_V199_BUILD_AR.md"
          rm -rf "$V199_SOURCE_DIR/__pycache__"
          (cd "$V199_SOURCE_DIR" && zip -qr "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_SOURCE_PATCH.zip" | tail -2

          sha256sum \
            "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_ANDROID_SINGLE_CANVAS_DATA.apk" \
            "$V199_RELEASE_DIR/SurveyQuant_v1.0.199_FREE_SOURCE_PATCH.zip" \
            "$V199_RELEASE_DIR/V177_MERGED_BOARDS_TEST.dxf" \
            "$V199_RELEASE_DIR/V177_ORIENTED_BOARD_TEST.dxf" \
            "$V199_RELEASE_DIR/V177_ORIENTATION_BOARD_FILE_TEST.dxf" \
            "$V199_RELEASE_DIR/V177_PDF_VECTOR_TEST_OUT.dxf" \
            > "$V199_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V199_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload V199 APK, source patch, test DXF and reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.199-FULL-SINGLE-CANVAS-DATA-EXPORT
          path: |
            ${{ runner.temp }}/v199-release/SurveyQuant_v1.0.199_FREE_ANDROID_SINGLE_CANVAS_DATA.apk
            ${{ runner.temp }}/v199-release/SurveyQuant_v1.0.199_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v199-release/README_V199_AR.md
            ${{ runner.temp }}/v199-release/README_V199_BUILD_AR.md
            ${{ runner.temp }}/v199-release/SHA256SUMS.txt
            ${{ runner.temp }}/v199-release/V177_MERGED_BOARDS_TEST.dxf
            ${{ runner.temp }}/v199-release/V177_ORIENTED_BOARD_TEST.dxf
            ${{ runner.temp }}/v199-release/V177_ORIENTATION_BOARD_FILE_TEST.dxf
            ${{ runner.temp }}/v199-release/V177_PDF_VECTOR_TEST_OUT.dxf
          if-no-files-found: error
          retention-days: 30
