name: Build SurveyQuant v1.0.84 - Exact Project Settings + Quantity + DXF Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip"
      - "SurveyQuantAndroid_v1.0.84_V67_EXACT_FIXES.zip"
      - ".github/workflows/build-v84-exact-settings-contour-dxf-fix.yml"

permissions:
  contents: read

env:
  SOURCE_ZIP: SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip
  PATCH_ZIP: SurveyQuantAndroid_v1.0.84_V67_EXACT_FIXES.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v84 inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_ZIP"
          test -s "$PATCH_ZIP"

      - name: Extract v67 source and v84 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$PATCH_ZIP" -d "$RUNNER_TEMP/sq-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$PROJECT"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"
          LOGO="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'surveyquant_logo.png' -print -quit)"
          BG="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'surveyquant_background.png' -print -quit)"
          test -n "$PATCH_INDEX"
          test -n "$LOGO"
          test -n "$BG"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Apply v84 base and exact requested fixes
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$PROJECT_DIR/app/src/main/assets"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"
          LOGO="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'surveyquant_logo.png' -print -quit)"
          BG="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'surveyquant_background.png' -print -quit)"
          cp "$PATCH_INDEX" "$ASSETS/index.html"
          cp "$LOGO" "$ASSETS/surveyquant_logo.png"
          cp "$BG" "$ASSETS/surveyquant_background.png"

          cat > "$RUNNER_TEMP/patch_v84.py" <<'PY_PATCH'
          
          #!/usr/bin/env python3
          import re
          import sys
          from pathlib import Path
          
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"PATCH ERROR: marker not found: {label}")
              return text.replace(old, new, 1)
          
          def main():
              if len(sys.argv) != 2:
                  raise SystemExit("usage: patch_v84.py INDEX_HTML")
              path = Path(sys.argv[1])
              text = path.read_text(encoding="utf-8")
          
              css_marker = "        .engineering-frame-note{background:#101b28;border:1px dashed #31506A;padding:10px;border-radius:8px;margin-top:10px;color:#b9fff5}"
              css_add = '''
                  .sq-project-settings{background:rgba(8,17,27,.72);border:1px solid #31506A;border-radius:10px;padding:12px;margin:0 0 14px}
                  .sq-project-settings summary{cursor:pointer;font-weight:800;color:#fff}
                  .sq-settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
                  .sq-settings-group{border:1px solid #2c3b52;border-radius:9px;padding:10px;background:rgba(15,20,29,.72)}
                  .sq-settings-group h4{margin:0 0 8px;color:#57d4c4}
                  .sq-settings-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
                  .sq-settings-actions button{margin-top:0}
                  @media(max-width:650px){.sq-settings-grid{grid-template-columns:1fr}}
          '''
              text = replace_once(text, css_marker, css_marker + css_add, "settings CSS")
          
              js_marker = "let dwgLibPromise=null, activeProjectId='project1Card', droppedOriginalCadBytes=null, droppedOriginalCadName='';"
              js_add = '''
          const SQ_DEFAULT_PROJECT_SETTINGS={
            lineColor:'#2463eb',textColor:'#202020',textHeight:.25,
            pointSize:.5,pointSymbol:'circleX',pointColor:'#ff3333',
            detailColor:'#00aaff',labelSize:.25,showId:true,showElevation:true,
            contourColor:'#00cc66',tinColor:'#808080',gridColor:'#808080'
          };
          const SQ_PROJECT_SETTINGS={};
          function sqCloneDefaults(){return JSON.parse(JSON.stringify(SQ_DEFAULT_PROJECT_SETTINGS));}
          function sqEnsureProjectSettings(pid=activeProjectId){
            if(!SQ_PROJECT_SETTINGS[pid]) SQ_PROJECT_SETTINGS[pid]={base:sqCloneDefaults(),before:sqCloneDefaults(),after:sqCloneDefaults()};
            return SQ_PROJECT_SETTINGS[pid];
          }
          function sqHex(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
          function sqNum(v,d,min=.01){const n=Number(v);return Number.isFinite(n)?Math.max(min,n):d;}
          function sqLayerCfg(pid,which='base'){
            const s=sqEnsureProjectSettings(pid);
            const src=s[which]||s.base;
            const out={...src};
            out.lineColor=sqHex(src.lineColor,SQ_DEFAULT_PROJECT_SETTINGS.lineColor);
            out.textColor=sqHex(src.textColor,SQ_DEFAULT_PROJECT_SETTINGS.textColor);
            out.textHeight=sqNum(src.textHeight,.25,.01);
            out.pointSize=sqNum(src.pointSize,.5,.01);
            out.pointSymbol=['plus','x','circleX','squareX'].includes(src.pointSymbol)?src.pointSymbol:'circleX';
            out.pointColor=sqHex(src.pointColor,SQ_DEFAULT_PROJECT_SETTINGS.pointColor);
            out.detailColor=sqHex(src.detailColor,SQ_DEFAULT_PROJECT_SETTINGS.detailColor);
            out.labelSize=sqNum(src.labelSize,.25,.01);
            out.showId=src.showId!==false;out.showElevation=src.showElevation!==false;
            out.contourColor=sqHex(src.contourColor,SQ_DEFAULT_PROJECT_SETTINGS.contourColor);
            out.tinColor=sqHex(src.tinColor,SQ_DEFAULT_PROJECT_SETTINGS.tinColor);
            out.gridColor=sqHex(src.gridColor,SQ_DEFAULT_PROJECT_SETTINGS.gridColor);
            out.lineAci=hexToCadAci(out.lineColor);out.textAci=hexToCadAci(out.textColor);
            out.pointAci=hexToCadAci(out.pointColor);out.detailAci=hexToCadAci(out.detailColor);
            out.contourAci=hexToCadAci(out.contourColor);out.tinAci=hexToCadAci(out.tinColor);
            out.gridAci=hexToCadAci(out.gridColor);return out;
          }
          function getProjectOutputSettings(){return sqLayerCfg(activeProjectId,'base');}
          function getGlobalOutputSettings(){return getProjectOutputSettings();}
          function getPointStyleSettings(){const s=sqLayerCfg(activeProjectId,'base');return{symbol:s.pointSymbol,color:s.pointAci,detailColor:s.detailAci,size:s.pointSize,labelSize:s.labelSize,showId:s.showId,showElevation:s.showElevation};}
          function sqSettingsField(prefix,key,label,type='color',value=''){
            const id=`sq_${prefix}_${key}`;
            if(type==='select'){const v=String(value||'circleX');return `<div><label>${label}</label><select id="${id}">${[['plus','+'],['x','X'],['circleX','دائرة داخلها X'],['squareX','مربع داخله X']].map(([k,t])=>`<option value="${k}" ${v===k?'selected':''}>${t}</option>`).join('')}</select></div>`;}
            return `<div><label>${label}</label><input id="${id}" type="${type}" value="${value}"></div>`;
          }
          function sqSettingsPanelHtml(pid){
            const compare=pid==='project1Card';const s=sqEnsureProjectSettings(pid);
            const group=(key,title)=>{
              const q=s[key]||sqCloneDefaults(),prefix=pid+'_'+key;
              return `<div class="sq-settings-group"><h4>${title}</h4><div class="sq-settings-grid">
                ${sqSettingsField(prefix,'lineColor','لون الخطوط','color',q.lineColor)}
                ${sqSettingsField(prefix,'textColor','لون الكتابة','color',q.textColor)}
                ${sqSettingsField(prefix,'textHeight','حجم النص','number',q.textHeight)}
                ${sqSettingsField(prefix,'pointSymbol','استايل النقطة','select',q.pointSymbol)}
                ${sqSettingsField(prefix,'pointSize','حجم النقطة','number',q.pointSize)}
                ${sqSettingsField(prefix,'pointColor','لون النقطة','color',q.pointColor)}
                ${sqSettingsField(prefix,'detailColor','لون تفاصيل النقاط','color',q.detailColor)}
                ${sqSettingsField(prefix,'labelSize','حجم تسمية النقطة','number',q.labelSize)}
                ${sqSettingsField(prefix,'contourColor','لون خطوط الكنتور','color',q.contourColor)}
                ${sqSettingsField(prefix,'tinColor','لون TIN / المثلثات','color',q.tinColor)}
                ${sqSettingsField(prefix,'gridColor','لون الشبكة','color',q.gridColor)}
                </div>
                <label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input id="sq_${prefix}_showId" type="checkbox" ${q.showId?'checked':''}> إظهار رقم النقطة</label>
                <label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input id="sq_${prefix}_showElevation" type="checkbox" ${q.showElevation?'checked':''}> إظهار منسوب النقطة</label>
              </div>`;
            };
            return `<details class="sq-project-settings" id="sqSettings_${pid}"><summary>🎨 إعدادات إخراج هذا المشروع</summary>
              <div class="muted" style="margin-top:8px">الإعدادات مستقلة لكل مشروع. لا يتم حفظها تلقائيًا.</div>
              <div id="sqSettingsBody_${pid}" class="sq-settings-grid">${compare?group('before','الطبقة الأولى / قبل')+group('after','الطبقة الثانية / بعد'):group('base','إعدادات المشروع')}</div>
              <div class="sq-settings-actions">
                <button class="btn-blue" type="button" onclick="sqApplyProjectSettings('${pid}')">✅ تطبيق الإعدادات</button>
                <button class="btn-green" type="button" onclick="sqSaveProjectSettings('${pid}')">💾 حفظ اختياري لهذا المشروع</button>
              </div>
            </details>`;
          }
          function sqSyncOne(pid,key){
            const s=sqEnsureProjectSettings(pid),q=s[key]||sqCloneDefaults(),prefix=`sq_${pid}_${key}_`,get=id=>document.getElementById(prefix+id);
            if(get('lineColor'))q.lineColor=sqHex(get('lineColor').value,q.lineColor);
            if(get('textColor'))q.textColor=sqHex(get('textColor').value,q.textColor);
            if(get('textHeight'))q.textHeight=sqNum(get('textHeight').value,q.textHeight,.01);
            if(get('pointSymbol'))q.pointSymbol=get('pointSymbol').value;
            if(get('pointSize'))q.pointSize=sqNum(get('pointSize').value,q.pointSize,.01);
            if(get('pointColor'))q.pointColor=sqHex(get('pointColor').value,q.pointColor);
            if(get('detailColor'))q.detailColor=sqHex(get('detailColor').value,q.detailColor);
            if(get('labelSize'))q.labelSize=sqNum(get('labelSize').value,q.labelSize,.01);
            if(get('contourColor'))q.contourColor=sqHex(get('contourColor').value,q.contourColor);
            if(get('tinColor'))q.tinColor=sqHex(get('tinColor').value,q.tinColor);
            if(get('gridColor'))q.gridColor=sqHex(get('gridColor').value,q.gridColor);
            const sid=document.getElementById(`${prefix}showId`);if(sid)q.showId=sid.checked;
            const se=document.getElementById(`${prefix}showElevation`);if(se)q.showElevation=se.checked;
            s[key]=q;
          }
          function sqApplyProjectSettings(pid){
            const compare=pid==='project1Card';sqSyncOne(pid,compare?'before':'base');if(compare)sqSyncOne(pid,'after');
            const el=document.getElementById('sqSettings_'+pid);if(el)el.open=false;
            showDownloadStatus('تم تطبيق إعدادات المشروع فقط، بدون حفظ تلقائي.',true);
          }
          function sqSaveProjectSettings(pid){
            sqApplyProjectSettings(pid);
            try{localStorage.setItem('sq_project_settings_v84_'+pid,JSON.stringify(sqEnsureProjectSettings(pid)));showDownloadStatus('تم حفظ إعدادات هذا المشروع اختياريًا.',true);}
            catch(e){alert('تعذر حفظ إعدادات المشروع: '+(e.message||e));}
          }
          function sqLoadProjectSavedSettings(pid){
            const raw=localStorage.getItem('sq_project_settings_v84_'+pid);if(!raw)return;
            try{const obj=JSON.parse(raw);if(obj&&typeof obj==='object')SQ_PROJECT_SETTINGS[pid]={base:{...sqCloneDefaults(),...(obj.base||{})},before:{...sqCloneDefaults(),...(obj.before||{})},after:{...sqCloneDefaults(),...(obj.after||{})}};}catch(_){}
          }
          function ensureProjectSettingsPanel(card){
            if(!card||card.querySelector('.sq-project-settings'))return;
            sqLoadProjectSavedSettings(card.id);
            const head=card.querySelector('.project-page-head');if(head)head.insertAdjacentHTML('afterend',sqSettingsPanelHtml(card.id));
