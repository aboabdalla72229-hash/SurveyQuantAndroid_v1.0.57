
name: Build SurveyQuant v1.0.57 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KS_B64" || { echo "Missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "Missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "Missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "Missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }

      - name: Extract project source
        shell: bash
        run: |
          test -s SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip || { echo "Missing source ZIP"; exit 1; }
          mkdir extracted
          unzip -q SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip -d extracted
          PROJECT=$(find extracted -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')
          test -n "$PROJECT" || { echo "Android project not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.jks"
          test -s "$RUNNER_TEMP/surveyquant-release.jks"
          echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/SurveyQuant-v1.0.57-release.apk
          ls -lh release/SurveyQuant-v1.0.57-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57-release
          path: release/SurveyQuant-v1.0.57-release.apk
          if-no-files-found: error
