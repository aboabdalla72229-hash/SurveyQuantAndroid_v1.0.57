                      for(const yy of [0,10]) entities.push({type:'XLINE',layer:'GRID',basePoint:point(0,yy),directionVector:vector(1,0)});
                      for(const [label,x] of [['AS',0],['BS',10]]) entities.push({type:'TEXT',layer:'BUBBLES',position:point(x,-0.5),text:label,height:0.5});
                      for(const [label,yy] of [['Z1',0],['Z2',10]]) entities.push({type:'TEXT',layer:'BUBBLES',position:point(-0.5,yy),text:label,height:0.5});
                      return {source:'DXF',entities};
                    }
