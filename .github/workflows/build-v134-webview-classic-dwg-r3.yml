          V130_TEST="$V130_PATCH_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"
          V131_PATCHER="$V131_PATCH_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.py"
          V131_TEST="$V131_PATCH_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_TEST.js"
          V134_PATCHER="$V134_PATCH_DIR/SurveyQuant_v1.0.134_APPLY_PATCH.py"
          V134_TEST="$V134_PATCH_DIR/SurveyQuant_v1.0.134_REGRESSION_TEST.js"
          test -s "$V130_PATCHER" && test -s "$V130_TEST"
          test -s "$V131_PATCHER" && test -s "$V131_TEST"
          test -s "$V134_PATCHER" && test -s "$V134_TEST"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_APPLY_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_IMPORT_BRIDGE.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.128_APPLY_CAD_ZOOM_DWG_PATCH.py"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.129_APPLY_DELETE_UNDO_REDO_PATCH.py"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.129_DELETE_UNDO_REDO_TEST.js"
          echo "V126_KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "V128_PATCH_DIR=$PATCH_DIR" >> "$GITHUB_ENV"
          echo "V129_PATCH_DIR=$PATCH_DIR" >> "$GITHUB_ENV"
          echo "V130_PATCH_DIR=$V130_PATCH_DIR" >> "$GITHUB_ENV"
          echo "V130_PATCHER=$V130_PATCHER" >> "$GITHUB_ENV"
          echo "V130_TEST=$V130_TEST" >> "$GITHUB_ENV"
          echo "V131_PATCH_DIR=$V131_PATCH_DIR" >> "$GITHUB_ENV"
          echo "V131_PATCHER=$V131_PATCHER" >> "$GITHUB_ENV"
          echo "V131_TEST=$V131_TEST" >> "$GITHUB_ENV"
          echo "V134_PATCH_DIR=$V134_PATCH_DIR" >> "$GITHUB_ENV"
          echo "V134_PATCHER=$V134_PATCHER" >> "$GITHUB_ENV"
          echo "V134_TEST=$V134_TEST" >> "$GITHUB_ENV"
          echo "V117_PATCHER=$KIT_DIR/SurveyQuant_v1.0.117_APPLY_PATCH.py" >> "$GITHUB_ENV"
          echo "V117_BRIDGE=$KIT_DIR/SurveyQuant_v1.0.117_DWG_IMPORT_BRIDGE.js" >> "$GITHUB_ENV"
          echo "V117_TEST=$KIT_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js" >> "$GITHUB_ENV"
          echo "V126_PATCHER=$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py" >> "$GITHUB_ENV"
          echo "V126_TEST=$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js" >> "$GITHUB_ENV"

      - name: Build the offline writer-enabled LibreDWG engine and bundle the DXF parser
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          LIBROOT="$GITHUB_WORKSPACE/external/libredwg-v134"
          LIBJS="$LIBROOT/bindings/javascript"
          ENGINE_DIR="$RUNNER_TEMP/sq-v134-engine"
          DXF_DIR="$RUNNER_TEMP/sq-v134-dxf-parser"
          STORM_PACKAGE="$RUNNER_TEMP/sq-v134-v115-package"
          STORM_INPUT="$RUNNER_TEMP/sq-v134-storm-input"
          STORM_OUTPUT="$RUNNER_TEMP/sq-v134-storm-output"
          mkdir -p "$ENGINE_DIR" "$DXF_DIR" "$STORM_PACKAGE" "$STORM_INPUT" "$STORM_OUTPUT"
          test -s "$LIBROOT/configure.ac" || { echo "ERROR: pinned LibreDWG source checkout missing."; exit 1; }
          (cd "$LIBROOT" && ./autogen.sh)

          # Use the tested v115 string-termination fix before enabling the DXF writer.
          python3 - "$LIBROOT/src/out_dxf.c" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old = "\n".join([
              "      else",
              "        *dest++ = c;",
              "    }",
              "  d[len - 1] = '\\0'; // add final delim, skipped above",
              "  return d;",
              "}",
          ])
          new = "\n".join([
              "      else",
              "        *dest++ = c;",
              "    }",
              "  /* V134: terminate at the last byte actually written. */",
              "  if (dest >= dend)",
              "    dest = d + len - 1;",
              "  *dest = '\\0';",
              "  d[len - 1] = '\\0'; // final allocation sentinel",
              "  return d;",
              "}",
          ])
          if source.count(old) != 1:
              raise SystemExit("ERROR: expected one known cquote() terminator block; refusing an unverified engine build.")
          patched = source.replace(old, new, 1)
          if "if (dest >= dend)" not in patched or "*dest = '\\0';" not in patched:
              raise SystemExit("ERROR: cquote() patch verification failed.")
          path.write_text(patched, encoding="utf-8")
          print("PASS: cquote() termination patch verified.")
          PY

          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='external/libredwg-v134/bindings/javascript/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          const before=j.scripts['build:prepare'];
          if(!before) throw new Error('Missing build:prepare');
          let prepare=before.replace(/\s--disable-write\b/g,'').replace(/\s--disable-dxf\b/g,'');
          if(/--disable-write\b|--disable-dxf\b/.test(prepare)) throw new Error('Writer flags still disabled');
          // The previous -O2 build still failed while wasm-emscripten-finalize parsed
          // a function with too many locals. Build both C objects and embind glue for
          // size, using -Os so optimization coalesces locals before finalization.
          const cflags=(prepare.match(/CFLAGS="[^"]*"/)||[])[0];
          if(!cflags) throw new Error('Could not find configure CFLAGS in build:prepare');
          const compactCflags=cflags.replace(/-O[0-3sSz]+\b/,'-Os');
          if(compactCflags===cflags || !/CFLAGS="-Os(?:\s|\")/.test(compactCflags))
            throw new Error('Could not switch configure CFLAGS to -Os');
          prepare=prepare.replace(cflags,compactCflags);
          j.scripts['build:prepare']=prepare;
          const obj=j.scripts['build:obj'];
          if(!obj) throw new Error('Missing build:obj');
          j.scripts['build:obj']=obj.replace(/emmake\s+make(?=\s|$)/,'emmake make -C src');
          const wasm=j.scripts['build:wasm'];
          if(!wasm) throw new Error('Missing build:wasm');
          // -O2 had the same too-many-locals finalizer failure after SINGLE_FILE was
          // removed. Switch the embind translation units and link step to -Os too.
          let compactWasm=wasm.replace(/(^|\s)-O2(?=\s)/,'$1-Os');
          compactWasm=compactWasm.replace(/\s-s\s+SINGLE_FILE=1\b/g,'');
          if(compactWasm===wasm || !/(^|\s)-Os(?=\s)/.test(compactWasm))
            throw new Error('Could not switch build:wasm optimization to -Os');
          if(/SINGLE_FILE=1/.test(compactWasm)) throw new Error('SINGLE_FILE must remain disabled for this engine build');
          // Emscripten's embind TypeScript generator needs WASM_BIGINT=1 to map
          // uint64_t to TypeScript bigint. Do not remove --emit-tsd: src/libredwg.ts
          // imports MainModule from ../wasm/libredwg-web and pnpm build needs that type.
          const tsdArg=/\s--emit-tsd\s+libredwg-web\.d\.ts\b/;
          if(!tsdArg.test(compactWasm)) throw new Error('Expected --emit-tsd libredwg-web.d.ts in build:wasm');
          if(!/\s-s\s+WASM_BIGINT=1\b/.test(compactWasm)) {
            compactWasm=compactWasm.replace(tsdArg, ' -s WASM_BIGINT=1 --emit-tsd libredwg-web.d.ts');
          }
          if(!/\s-s\s+WASM_BIGINT=1\b/.test(compactWasm)) throw new Error('WASM_BIGINT=1 was not injected into build:wasm');
          if(!/\s--emit-tsd\s+libredwg-web\.d\.ts\b/.test(compactWasm)) throw new Error('--emit-tsd output must be retained for MainModule typing');
          j.scripts['build:wasm']=compactWasm;
          const cp=j.scripts.copy;
          if(!cp) throw new Error('Missing copy script');
          if(!/libredwg-web\.wasm/.test(cp)) throw new Error('copy script must copy separate libredwg-web.wasm');
          if(!/libredwg-web\.d\.ts/.test(cp)) throw new Error('copy script must copy the generated MainModule declarations');
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          console.log('PASS: writer enabled, CFLAGS=-Os, WASM linker=-Os, WASM_BIGINT=1, --emit-tsd retained, separate WASM sidecar retained.');
          console.log('Verified build:wasm:', j.scripts['build:wasm']);
          JS

          cd "$LIBJS"
          pnpm install --frozen-lockfile
          pnpm build:prepare
          pnpm build:obj
          test -s ../../build-wasm/src/out_dxf.o || { echo "ERROR: out_dxf.o missing; DXF writer not built."; exit 1; }
          test -s ../../build-wasm/src/encode.o || { echo "ERROR: encode.o missing; DWG/DXF support not built."; exit 1; }
          pnpm build:wasm
          pnpm copy
          test -s wasm/libredwg-web.wasm || { echo "ERROR: build/copy did not produce the separate WASM binary."; exit 1; }
          # Binaryen is an optional extra validator, not a build dependency.
          # Some GitHub runner images do not have wasm-opt installed. Do not fail a
          # successfully compiled WASM module solely because this optional tool is absent.
          if command -v wasm-opt >/dev/null 2>&1; then
            echo "Binaryen validator: $(wasm-opt --version)"
            wasm-opt wasm/libredwg-web.wasm --validate -o "$RUNNER_TEMP/v134-libredwg-validated.wasm"
            test -s "$RUNNER_TEMP/v134-libredwg-validated.wasm"
            echo "PASS: optional Binaryen validation completed."
          else
            echo "::notice::wasm-opt is absent; skipping optional Binaryen validation. Required WASM magic, sidecar, JS syntax, and APK asset checks remain enabled."
          fi
          pnpm build
          test -s dist/libredwg-web.js
          test -s wasm/libredwg-web.js
          test -s wasm/libredwg-web.wasm || { echo "ERROR: separate libredwg-web.wasm was not copied."; exit 1; }
          WASM_MAGIC="$(od -An -tx1 -N4 wasm/libredwg-web.wasm | tr -d ' \n')"
          test "$WASM_MAGIC" = "0061736d" || { echo "ERROR: invalid WebAssembly magic: $WASM_MAGIC"; exit 1; }
          node --check dist/libredwg-web.js
          node --check wasm/libredwg-web.js

          cp -a dist "$ENGINE_DIR/dist"
          cp -a wasm "$ENGINE_DIR/wasm"
          for f in "$LIBROOT/LICENSE" "$LIBROOT/README.md"; do if [ -s "$f" ]; then cp "$f" "$ENGINE_DIR/$(basename "$f")"; fi; done
          cat > "$ENGINE_DIR/BUILD_CONFIGURATION_V134.txt" <<'TXT'
          SurveyQuant v1.0.134 local CAD runtime
          Upstream: mlightcad/libredwg-web v0.7.14, GPL-3.0
          Built with DXF writing enabled using -Os for both configure CFLAGS and the embind/link step. TypeScript declaration generation is retained with -s WASM_BIGINT=1 so uint64_t maps to TypeScript bigint. WebAssembly remains a separate libredwg-web.wasm file. The app also clears WebView localStorage/sessionStorage at startup and on document unload, and deletes origin-scoped IndexedDB databases when supported.
          The dist JS module, WASM JS loader, and WASM binary are all bundled inside APK assets. No jsDelivr/unpkg runtime fetch is expected.
          TXT

          npm pack dxf-parser@1.1.2 --pack-destination "$DXF_DIR"
          tar -xzf "$DXF_DIR/dxf-parser-1.1.2.tgz" -C "$DXF_DIR"
          DXF_PARSER="$DXF_DIR/package/dist/dxf-parser.js"
          test -s "$DXF_PARSER"
          echo "V134_ENGINE_DIR=$ENGINE_DIR" >> "$GITHUB_ENV"
          echo "V134_DXF_PARSER=$DXF_PARSER" >> "$GITHUB_ENV"
          echo "V134_STORM_PACKAGE=$STORM_PACKAGE" >> "$GITHUB_ENV"
          echo "V134_STORM_INPUT=$STORM_INPUT" >> "$GITHUB_ENV"
          echo "V134_STORM_OUTPUT=$STORM_OUTPUT" >> "$GITHUB_ENV"

          # Use the same two real DWG files shipped with the historical V115 package.
          V115_ARCHIVE="$GITHUB_WORKSPACE/SurveyQuant_v1.0.115_ORIENTATION_FINAL_PATCH_PACKAGE.zip"
          test -s "$V115_ARCHIVE" || { echo "ERROR: V115 STORM DWG fixture package missing."; exit 1; }
          unzip -q "$V115_ARCHIVE" -d "$STORM_PACKAGE"
          test -s "$STORM_PACKAGE/SurveyQuant_v1.0.115_TEST_STORM_DWG.mjs"
          test -s "$STORM_PACKAGE/STORM.zip"
          unzip -q "$STORM_PACKAGE/STORM.zip" -d "$STORM_INPUT"
          test "$(find "$STORM_INPUT" -type f -iname '*.dwg' | wc -l)" -eq 2 || { echo "ERROR: expected two original STORM DWGs."; exit 1; }
          STORM_REPORT="$RUNNER_TEMP/sq-v134-STORM_CONVERSION_REPORT.md"
          node "$STORM_PACKAGE/SurveyQuant_v1.0.115_TEST_STORM_DWG.mjs" "$LIBJS" "$STORM_INPUT" "$STORM_OUTPUT" "$STORM_REPORT"
          test -s "$STORM_REPORT"
          test "$(find "$STORM_OUTPUT" -type f -iname '*.dxf' | wc -l)" -eq 2 || { echo "ERROR: expected successful DXF outputs for both real DWGs."; exit 1; }
          (cd "$STORM_OUTPUT" && zip -q "$RUNNER_TEMP/SurveyQuant_v1.0.134_STORM_CONVERTED_DXF.zip" ./*.dxf)
          test -s "$RUNNER_TEMP/SurveyQuant_v1.0.134_STORM_CONVERTED_DXF.zip"
          cp "$STORM_REPORT" "$RUNNER_TEMP/SurveyQuant_v1.0.134_STORM_CONVERSION_REPORT.md"
          echo "V134_STORM_REPORT=$RUNNER_TEMP/SurveyQuant_v1.0.134_STORM_CONVERSION_REPORT.md" >> "$GITHUB_ENV"
          echo "V134_STORM_ZIP=$RUNNER_TEMP/SurveyQuant_v1.0.134_STORM_CONVERTED_DXF.zip" >> "$GITHUB_ENV"

      - name: Rebuild DWG runtime as classic scripts for Android WebView
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          LIBJS="$GITHUB_WORKSPACE/external/libredwg-v134/bindings/javascript"
          ENGINE_DIR="$V134_ENGINE_DIR"
          cd "$LIBJS"
          test -s ../../build-wasm/src/out_dxf.o || { echo "ERROR: verified DWG/DXF object build is missing."; exit 1; }
          test -s ../../build-wasm/src/encode.o || { echo "ERROR: verified DWG/DXF encoder object is missing."; exit 1; }

          # First build + two real DWG conversion tests above prove the engine logic works in Node.
          # Re-link the same object files without EXPORT_ES6 so WebView can load a classic script
          # from file:///android_asset without module-CORS failures.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='package.json';
          const pkg=JSON.parse(fs.readFileSync(p,'utf8'));
          let wasm=pkg.scripts['build:wasm'];
          if(!wasm) throw new Error('Missing build:wasm before classic runtime build');
          const classic=wasm.replace(/\s-s\s+EXPORT_ES6=1\b/g,'');
          if(classic===wasm || /EXPORT_ES6=1/.test(classic)) throw new Error('Could not remove EXPORT_ES6=1 for classic WebView runtime');
          if(!/WASM_BIGINT=1/.test(classic) || !/--emit-tsd\s+libredwg-web\.d\.ts/.test(classic)) throw new Error('Classic rebuild must retain WASM_BIGINT=1 and TypeScript declaration generation');
          pkg.scripts['build:wasm']=classic;
          fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n');

          const tsPath='src/libredwg.ts';
          let ts=fs.readFileSync(tsPath,'utf8');
          const imports=/import \{ MainModule \} from '\.\.\/wasm\/libredwg-web'\r?\nimport createModule from '\.\.\/wasm\/libredwg-web\.js'\r?\n/;
          if(!imports.test(ts)) throw new Error('Expected upstream runtime imports not found in src/libredwg.ts');
          ts=ts.replace(imports, "import type { MainModule } from '../wasm/libredwg-web'\nconst createModule = (moduleArg?: any): Promise<MainModule> => {\n  const factory = (globalThis as any).createModule\n  if (typeof factory !== 'function') throw new Error('Classic LibreDWG factory is not loaded')\n  return factory(moduleArg) as Promise<MainModule>\n}\n");
          if(/import createModule from '\.\.\/wasm\/libredwg-web\.js'/.test(ts)) throw new Error('ESM import of Emscripten runtime remains in src/libredwg.ts');
          fs.writeFileSync(tsPath,ts);

          const vitePath='vite.config.ts';
          let vite=fs.readFileSync(vitePath,'utf8');
          const oldName="name: 'libredwg-web',";
          if(vite.split(oldName).length!==2) throw new Error('Unexpected vite library name; refusing unverified IIFE conversion');
          vite=vite.replace(oldName,"name: 'SurveyQuantLibreDwg',\n      formats: ['iife'],");
          const ext=/external:\s*\['module',\s*'node:module',\s*'\.\.\/wasm\/libredwg-web\.js'\]/;
          if(!ext.test(vite)) throw new Error('Expected external ESM WASM import list not found in vite.config.ts');
          vite=vite.replace(ext,'external: []');
          fs.writeFileSync(vitePath,vite);
          console.log('PASS: package switched to classic Emscripten glue + IIFE global SurveyQuantLibreDwg; no runtime ESM import is needed.');
          JS

          pnpm build:wasm
          pnpm copy
          test -s wasm/libredwg-web.wasm || { echo "ERROR: classic relink did not produce WASM sidecar."; exit 1; }
          node --check wasm/libredwg-web.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const runtime=fs.readFileSync('wasm/libredwg-web.js','utf8');
          if(!/^\s*var\s+createModule\b/m.test(runtime)) throw new Error('Emscripten classic loader did not expose global createModule');
          if(/^\s*(?:import|export)\s/m.test(runtime)) throw new Error('Emscripten loader unexpectedly remains an ES module');
          const wasm=fs.readFileSync('wasm/libredwg-web.wasm');
          if(wasm.length<100000 || wasm.subarray(0,4).toString('hex')!=='0061736d') throw new Error('Classic runtime WASM sidecar is invalid');
          JS
          pnpm build
          test -s dist/libredwg-web.js || { echo "ERROR: IIFE DWG API bundle missing."; exit 1; }
          node --check dist/libredwg-web.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dist=fs.readFileSync('dist/libredwg-web.js','utf8');
          if(!/SurveyQuantLibreDwg/.test(dist)) throw new Error('IIFE did not publish expected SurveyQuantLibreDwg global');
          if(/^\s*(?:import|export)\s/m.test(dist)) throw new Error('DWG API bundle still has top-level ESM syntax');
          if(/import\(['"]\.\.\/wasm\/libredwg-web\.js['"]\)/.test(dist)) throw new Error('DWG API still dynamically imports the WASM module');
          JS

          # Replace the Node-tested ESM outputs in the APK staging folder with the WebView runtime.
          rm -rf "$ENGINE_DIR/dist" "$ENGINE_DIR/wasm"
          mkdir -p "$ENGINE_DIR/dist" "$ENGINE_DIR/wasm"
          cp -a dist/. "$ENGINE_DIR/dist/"
          cp wasm/libredwg-web.js "$ENGINE_DIR/wasm/libredwg-web.js"
          cp wasm/libredwg-web.wasm "$ENGINE_DIR/wasm/libredwg-web.wasm"
          cp wasm/libredwg-web.d.ts "$ENGINE_DIR/wasm/libredwg-web.d.ts"
          cat >> "$ENGINE_DIR/BUILD_CONFIGURATION_V134.txt" <<'TXT'
          Android WebView runtime: Emscripten glue compiled as classic script (EXPORT_ES6 disabled); high-level LibreDwg API bundled as IIFE global SurveyQuantLibreDwg. HTML loads the classic WASM factory first, then the IIFE API, and passes an explicit local WASM path to LibreDwg.create(). This avoids relying on dynamic ESM imports from the Android file asset origin.
          TXT
          test -s "$ENGINE_DIR/dist/libredwg-web.js" && test -s "$ENGINE_DIR/wasm/libredwg-web.js" && test -s "$ENGINE_DIR/wasm/libredwg-web.wasm"
          echo "PASS: WebView-compatible classic DWG runtime staged for APK packaging."

      - name: Build known-good V126 base with V117 orientation and shared DWG support
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          python3 "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk"
          test -s "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_SOURCE_PATCH.zip"
          test -s "$RUNNER_TEMP/sq-release/source-patch/index.html"

      - name: Apply V128, V129, V130, V131 and V134 then run all regression checks
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="$RUNNER_TEMP/sq-release/source-patch"
          python3 "$V128_PATCH_DIR/SurveyQuant_v1.0.128_APPLY_CAD_ZOOM_DWG_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V128_PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js" "$SRC_DIR/index.html"
          python3 "$V129_PATCH_DIR/SurveyQuant_v1.0.129_APPLY_DELETE_UNDO_REDO_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V128_PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js" "$SRC_DIR/index.html"
          node "$V129_PATCH_DIR/SurveyQuant_v1.0.129_DELETE_UNDO_REDO_TEST.js" "$SRC_DIR/index.html"
          python3 "$V130_PATCHER" --html "$SRC_DIR/index.html"
          node "$V130_TEST" "$SRC_DIR/index.html"
          cp "$V130_PATCHER" "$SRC_DIR/SurveyQuant_v1.0.130_APPLY_DWG_AXIS_MULTISELECT_PATCH.py"
          cp "$V130_TEST" "$SRC_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"
          cp "$V130_PATCH_DIR/README_V130_AR.txt" "$SRC_DIR/README_V130_AR.txt"
          python3 "$V131_PATCHER" --html "$SRC_DIR/index.html"
          node "$V131_TEST" "$SRC_DIR/index.html"
          cp "$V131_PATCHER" "$SRC_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.py"
          cp "$V131_TEST" "$SRC_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_TEST.js"
          cp "$V131_PATCH_DIR/README_V131_AR.txt" "$SRC_DIR/README_V131_AR.txt"

          # Bundle the DWG ESM module, its WASM JS loader + binary, and DXF parser.
          mkdir -p "$SRC_DIR/libredwg-writer/dist" "$SRC_DIR/libredwg-writer/wasm"
          cp "$V134_ENGINE_DIR/dist/libredwg-web.js" "$SRC_DIR/libredwg-writer/dist/libredwg-web.js"
          cp "$V134_ENGINE_DIR/wasm/libredwg-web.js" "$SRC_DIR/libredwg-writer/wasm/libredwg-web.js"
          cp "$V134_ENGINE_DIR/wasm/libredwg-web.wasm" "$SRC_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          cp "$V134_DXF_PARSER" "$SRC_DIR/dxf-parser.js"
          cp "$V134_ENGINE_DIR/BUILD_CONFIGURATION_V134.txt" "$SRC_DIR/libredwg-writer/BUILD_CONFIGURATION_V134.txt"
          if [ -s "$V134_ENGINE_DIR/LICENSE" ]; then cp "$V134_ENGINE_DIR/LICENSE" "$SRC_DIR/libredwg-writer/LICENSE"; fi
          if [ -s "$V134_ENGINE_DIR/README.md" ]; then cp "$V134_ENGINE_DIR/README.md" "$SRC_DIR/libredwg-writer/README_UPSTREAM.md"; fi
          python3 "$V134_PATCHER" --html "$SRC_DIR/index.html"
          node "$V134_TEST" "$SRC_DIR/index.html"
          node --check "$SRC_DIR/dxf-parser.js"
          test -s "$SRC_DIR/libredwg-writer/dist/libredwg-web.js"
          test -s "$SRC_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SRC_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          SOURCE_WASM_MAGIC="$(od -An -tx1 -N4 "$SRC_DIR/libredwg-writer/wasm/libredwg-web.wasm" | tr -d ' \n')"
          test "$SOURCE_WASM_MAGIC" = "0061736d" || { echo "ERROR: bundled source-patch WASM binary is invalid."; exit 1; }
          cp "$V134_PATCHER" "$SRC_DIR/SurveyQuant_v1.0.134_APPLY_PATCH.py"
          cp "$V134_TEST" "$SRC_DIR/SurveyQuant_v1.0.134_REGRESSION_TEST.js"
          cp "$V134_PATCH_DIR/README_V134_AR.txt" "$SRC_DIR/README_V134_AR.txt"

          V134_SOURCE_PATCH="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.134_OFFLINE_DWG_DXF_EXACT_LAND_QUAD_SOURCE_PATCH.zip"
          rm -f "$V134_SOURCE_PATCH"
          (cd "$SRC_DIR" && zip -qr "$V134_SOURCE_PATCH" .)
          unzip -t "$V134_SOURCE_PATCH"
          echo "V134_SOURCE_PATCH=$V134_SOURCE_PATCH" >> "$GITHUB_ENV"

      - name: Patch final APK with local DWG/DXF engines, test, align and sign
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          BASE_APK="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk"
          V128_APK="$RUNNER_TEMP/sq-release/v128-patched-unsigned.apk"
          V129_APK="$RUNNER_TEMP/sq-release/v129-patched-unsigned.apk"
          V130_APK="$RUNNER_TEMP/sq-release/v130-patched-unsigned.apk"
          V131_APK="$RUNNER_TEMP/sq-release/v131-patched-unsigned.apk"
          RAW_APK="$RUNNER_TEMP/sq-release/v134-patched-unsigned.apk"
          APK_HTML="$RUNNER_TEMP/sq-release/apk-index.html"
          ALIGNED_APK="$RUNNER_TEMP/sq-release/v134-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.134_OFFLINE_DWG_DXF_EXACT_LAND_QUAD_FIX.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"

          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: SURVEYQUANT_KEY_ALIAS secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEY_PASSWORD secret is empty."; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"

          python3 "$V128_PATCH_DIR/SurveyQuant_v1.0.128_APPLY_CAD_ZOOM_DWG_PATCH.py" --apk "$BASE_APK" --output "$V128_APK"
          python3 "$V129_PATCH_DIR/SurveyQuant_v1.0.129_APPLY_DELETE_UNDO_REDO_PATCH.py" --apk "$V128_APK" --output "$V129_APK"
          python3 "$V130_PATCHER" --apk "$V129_APK" --output "$V130_APK"
          python3 "$V131_PATCHER" --apk "$V130_APK" --output "$V131_APK"
          python3 "$V134_PATCHER" --apk "$V131_APK" --output "$RAW_APK" --engine-dir "$V134_ENGINE_DIR" --dxf-parser "$V134_DXF_PARSER"
          unzip -p "$RAW_APK" assets/index.html > "$APK_HTML"
          node "$V130_TEST" "$APK_HTML"
          node "$V131_TEST" "$APK_HTML"
          node "$V134_TEST" "$APK_HTML"
          unzip -l "$RAW_APK" | grep -F 'assets/libredwg-writer/dist/libredwg-web.js'
          unzip -l "$RAW_APK" | grep -F 'assets/libredwg-writer/wasm/libredwg-web.js'
          unzip -l "$RAW_APK" | grep -F 'assets/libredwg-writer/wasm/libredwg-web.wasm'
          python3 - "$RAW_APK" <<'PYWASM'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              b=z.read('assets/libredwg-writer/wasm/libredwg-web.wasm')
          if len(b)<100_000 or b[:4] != b'\x00asm':
              raise SystemExit('ERROR: APK contains an invalid or missing libredwg-web.wasm')
          print('PASS: packaged APK has a valid separate WebAssembly binary:', len(b), 'bytes')
          PYWASM
          unzip -l "$RAW_APK" | grep -F 'assets/dxf-parser.js'

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "ERROR: Android SDK path is unavailable."; exit 1; }
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/zipalign" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            yes | sdkmanager --licenses >/dev/null
            sdkmanager "build-tools;35.0.0" >/dev/null
            BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          fi
          test -x "$BUILD_TOOLS/zipalign" && test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL_APK"

          sha256sum "$FINAL_APK" "$V134_SOURCE_PATCH" "$V134_STORM_ZIP" > "$RUNNER_TEMP/sq-release/SHA256SUMS.txt"
          printf '%s\n' 'V134 R3 PASS: two real STORM DWGs converted in Node, WebView classic loader + IIFE runtime packaged offline, local DXF parser, and exact-side convex quadrilateral regression tests.' > "$RUNNER_TEMP/sq-release/V134_BUILD_RESULT.txt"
          cat "$RUNNER_TEMP/sq-release/SHA256SUMS.txt"

      - name: Upload V134 APK, source patch, STORM conversion proof and checksums
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.134-WEBVIEW-CLASSIC-DWG-R3
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.134_OFFLINE_DWG_DXF_EXACT_LAND_QUAD_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.134_OFFLINE_DWG_DXF_EXACT_LAND_QUAD_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V134_BUILD_RESULT.txt
            ${{ runner.temp }}/SurveyQuant_v1.0.134_STORM_CONVERTED_DXF.zip
            ${{ runner.temp }}/SurveyQuant_v1.0.134_STORM_CONVERSION_REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics even if the build fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SurveyQuant-v1.0.134-DIAGNOSTICS-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sq-v134-STORM_CONVERSION_REPORT.md
            ${{ runner.temp }}/sq-v134-storm-output/**
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
