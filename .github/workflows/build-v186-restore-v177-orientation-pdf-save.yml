name: Build SurveyQuant v1.0.186 Restore V177 Orientation + PDF Save

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v186-restore-v177-orientation-pdf-save.yml"
      - "SurveyQuant_v1.0.186_RESTORE_V177_SOURCE_PATCH*.zip"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V177 signed APK workflow run ID"
        required: true
        type: string
        default: "41326866230"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v186-restore-v177-orientation-pdf-save
  cancel-in-progress: false

jobs:
  build_v186:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41326866230' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DXF validation dependency
        run: python3 -m pip install --disable-pip-version-check ezdxf==1.4.4

      - name: Extract V186 source patch
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR="$RUNNER_TEMP/v186-archive"
          KIT="$RUNNER_TEMP/v186-kit"
          mkdir -p "$ARCHIVE_DIR" "$KIT"
          PATCH_ZIP="$(find . -type f -name 'SurveyQuant_v1.0.186_RESTORE_V177_SOURCE_PATCH-*.zip' -not -path './.git/*' -print | sort -V | tail -n 1)"
          if [ -z "$PATCH_ZIP" ]; then
            PATCH_ZIP="$(find . -type f -name 'SurveyQuant_v1.0.186_RESTORE_V177_SOURCE_PATCH.zip' -not -path './.git/*' -print -quit)"
          fi
          test -s "$PATCH_ZIP" || { echo "ERROR: V186 source patch ZIP not found. Files matching v186:"; find . -maxdepth 4 -iname '*v186*' -print; exit 1; }
          echo "Using $PATCH_ZIP"
          unzip -q "$PATCH_ZIP" -d "$ARCHIVE_DIR"
          cp -a "$ARCHIVE_DIR/." "$KIT/"
          for f in index.html SurveyQuant_v1.0.186_PACKAGE_FREE_APK.py SurveyQuant_v1.0.177_CAD_ENGINE.js test_v186_restore_contract.py test_v186_pdf_save.js test_v186_pdf_raster_detection.js V186_RASTER_FIXTURE.pdf SurveyQuant_v1.0.177_APP_PROJECT_TEST.js SurveyQuant_v1.0.177_POINT_PARSER_TEST.js SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js V177_VECTOR_TEST.pdf pdfjs-v3.11.174.min.js pdf.worker.js README_V186_AR.md; do
            test -s "$KIT/$f" || { echo "ERROR: V186 kit missing $f"; exit 1; }
          done
          python3 - "$KIT/SurveyQuant_v1.0.186_PACKAGE_FREE_APK.py" <<'PY'
          import ast,sys
          from pathlib import Path
          ast.parse(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print('V186 package script syntax: PASS')
          PY
          echo "V186_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Download successful V177 signed base APK
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v177-base"
          mkdir -p "$BASE"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.177-FREE-FILEBYTES-ORIENTATION-PDF-FIX" --dir "$BASE"
          APK="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.177_FREE_ANDROID_RAW_CAD_VECTOR_PDF_FIX.apk' -print -quit)"
          test -s "$APK" || { echo "ERROR: signed V177 APK not found in successful run $SOURCE_RUN_ID"; find "$BASE" -type f -maxdepth 3; exit 1; }
          echo "V177_BASE_APK=$APK" >> "$GITHUB_ENV"

      - name: Run restored V177 orientation and PDF regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$V186_KIT"
          python3 test_v186_restore_contract.py | tee V186_RESTORE_CONTRACT_TEST.txt
          node SurveyQuant_v1.0.177_APP_PROJECT_TEST.js | tee V186_PROJECT_TEST.txt
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js | tee V186_POINT_TEST.txt
          node SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js | tee V186_ANDROID_BYTES_TEST.txt
          node SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js | tee V186_CAD_ENGINE_TEST.txt
          node SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js pdfjs-v3.11.174.min.js pdf.worker.js V177_VECTOR_TEST.pdf V186_VECTOR_PDF_TEST.dxf | tee V186_VECTOR_PDF_TEST.txt
          node SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js | tee V186_ORIENTATION_FILE_TEST.txt
          node test_v186_pdf_raster_detection.js | tee V186_PDF_RASTER_DETECTION_TEST.txt
          node test_v186_pdf_save.js | tee V186_PDF_SAVE_TEST.txt
          python3 - <<'PY'
          import ezdxf,ezdxf.recover,json
          from pathlib import Path
          root=Path('.')
          reports=[]
          for name in ('V186_VECTOR_PDF_TEST.dxf','V186_RASTER_UNDERLAY_TEST.dxf'):
              path=root/name
              doc,_=ezdxf.recover.readfile(path)
              audit=doc.audit()
              if doc.dxfversion not in ('AC1009','AC1015') or audit.errors or audit.fixes:
                  raise SystemExit(f'DXF audit failed: {name}; version={doc.dxfversion}; errors={len(audit.errors)}; fixes={len(audit.fixes)}')
              reports.append({'file':name,'version':doc.dxfversion,'entities':[e.dxftype() for e in doc.modelspace()],'errors':len(audit.errors),'fixes':len(audit.fixes)})
          Path('V186_DXF_AUDIT.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          PY

      - name: Package v1.0.186 using V177 orientation source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v186-release"
          mkdir -p "$OUT"
          python3 "$V186_KIT/SurveyQuant_v1.0.186_PACKAGE_FREE_APK.py" \
            --apk-input "$V177_BASE_APK" \
            --apk-output "$OUT/SurveyQuant_v1.0.186_UNSIGNED.apk" \
            --html-to-inject "$V186_KIT/index.html"
          test -s "$OUT/SurveyQuant_v1.0.186_UNSIGNED.apk"
          unzip -t "$OUT/SurveyQuant_v1.0.186_UNSIGNED.apk" | tail -2
          echo "V186_RELEASE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V186_RELEASE_DIR/SurveyQuant_v1.0.186_ALIGNED.apk"
          FINAL="$V186_RELEASE_DIR/SurveyQuant_v1.0.186_FREE_RESTORED_V177_ORIENTATION_PDF_SAVE.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V186_RELEASE_DIR/SurveyQuant_v1.0.186_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -F "versionCode='186' versionName='1.0.186'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V186_RELEASE_DIR/SurveyQuant_v1.0.186_UNSIGNED.apk"

      - name: Build source ZIP and checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd "$V186_KIT" && zip -qr "$V186_RELEASE_DIR/SurveyQuant_v1.0.186_RESTORE_V177_SOURCE_PATCH.zip" .)
          unzip -t "$V186_RELEASE_DIR/SurveyQuant_v1.0.186_RESTORE_V177_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V186_RELEASE_DIR/SurveyQuant_v1.0.186_FREE_RESTORED_V177_ORIENTATION_PDF_SAVE.apk" "$V186_RELEASE_DIR/SurveyQuant_v1.0.186_RESTORE_V177_SOURCE_PATCH.zip" "$V186_KIT"/*.dxf > "$V186_RELEASE_DIR/SHA256SUMS.txt"
          cp "$V186_KIT/README_V186_AR.md" "$V186_RELEASE_DIR/README_V186_AR.md"
          cat "$V186_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed APK, source and test evidence
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.186-RESTORED-V177-ORIENTATION-PDF-SAVE
          path: |
            ${{ runner.temp }}/v186-release/SurveyQuant_v1.0.186_FREE_RESTORED_V177_ORIENTATION_PDF_SAVE.apk
            ${{ runner.temp }}/v186-release/SurveyQuant_v1.0.186_RESTORE_V177_SOURCE_PATCH.zip
            ${{ runner.temp }}/v186-release/README_V186_AR.md
            ${{ runner.temp }}/v186-release/SHA256SUMS.txt
            ${{ runner.temp }}/v186-kit/V186_*.txt
            ${{ runner.temp }}/v186-kit/V186_*.json
            ${{ runner.temp }}/v186-kit/V186_*.dxf
          if-no-files-found: error
          retention-days: 30
