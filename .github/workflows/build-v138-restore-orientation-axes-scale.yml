          WASM_PROMISE_OLD = b"return new Promise((reject,resolve)=>{var xhr=new XMLHttpRequest;"
          WASM_PROMISE_FIXED = b"return new Promise((resolve,reject)=>{var xhr=new XMLHttpRequest;"
          
          
          def patch_wasm_loader(data: bytes) -> bytes:
              old_count = data.count(WASM_PROMISE_OLD)
              fixed_count = data.count(WASM_PROMISE_FIXED)
              if old_count == 1 and fixed_count == 0:
                  data = data.replace(WASM_PROMISE_OLD, WASM_PROMISE_FIXED, 1)
              elif old_count == 0 and fixed_count == 1:
                  pass
              else:
                  raise SystemExit(f"ERROR V138: expected exactly one reversed file:// WASM Promise callback; old={old_count}, fixed={fixed_count}.")
