name: Build SurveyQuant v1.0.141 - Restore V130 Orientation + Fresh Board Session

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v141-v130-orientation-fresh-session.yml"

permissions:
  actions: read
  contents: read

jobs:
  build_v141:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "39964262110"
      REFERENCE_RUN_ID: "39560732493"
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android build tools configured."

      - name: Download successful V140 base and V130 orientation reference
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v140-base"
          REF_DIR="$RUNNER_TEMP/v130-reference"
          mkdir -p "$BASE_DIR" "$REF_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.140-V127-ORIENTATION-FRESH-SESSION" --dir "$BASE_DIR"
          gh run download "$REFERENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.130-DWG-AXIS-MULTISELECT" --dir "$REF_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.140_V127_ORIENTATION_FRESH_SESSION.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.140_V127_ORIENTATION_SOURCE_PATCH.zip' -print -quit)"
          REF_PATCH="$(find "$REF_DIR" -type f -name 'SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V140 base APK missing"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V140 source patch missing"; exit 1; }
          test -s "$REF_PATCH" || { echo "ERROR: V130 reference patch missing"; exit 1; }
          unzip -t "$BASE_PATCH"
          unzip -t "$REF_PATCH"
          mkdir -p "$RUNNER_TEMP/v141-source" "$RUNNER_TEMP/v130-source" "$RUNNER_TEMP/sq-release"
          unzip -q "$BASE_PATCH" -d "$RUNNER_TEMP/v141-source"
          unzip -q "$REF_PATCH" -d "$RUNNER_TEMP/v130-source"
          test -s "$RUNNER_TEMP/v141-source/index.html"
          test -s "$RUNNER_TEMP/v130-source/index.html"
          echo "V141_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V141_SOURCE_DIR=$RUNNER_TEMP/v141-source" >> "$GITHUB_ENV"
          echo "V130_SOURCE_DIR=$RUNNER_TEMP/v130-source" >> "$GITHUB_ENV"
          echo "V141_RELEASE_DIR=$RUNNER_TEMP/sq-release" >> "$GITHUB_ENV"

      - name: Create tested V130 orientation transplant patcher and regression test
        shell: bash
        run: |
          set -euo pipefail
          PATCHER="$RUNNER_TEMP/SurveyQuant_v1.0.141_RESTORE_V130_ORIENTATION.py"
          TESTER="$RUNNER_TEMP/SurveyQuant_v1.0.141_V130_ORIENTATION_REGRESSION_TEST.js"
          cat > "$PATCHER" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, copy, hashlib, re, struct, zipfile
          from pathlib import Path

          SCRIPT_IDS = (
              "sq-orientation-module",
              "sq-orientation-axis-reader-module",
              "sq-orientation-manual-points-module",
              "sq-orientation-reference-board-module",
              "sq-orientation-dxf-faithful-recovery-module",
              "sq-orientation-cad-preserve-module",
              "sq-orientation-v115-tools-module",
          )
          OLD_CODE, NEW_CODE = 140, 141
          OLD_NAME, NEW_NAME = "1.0.140", "1.0.141"

          def pattern(script_id: str) -> re.Pattern[str]:
              return re.compile(r'(<script\b(?=[^>]*\bid=["\']' + re.escape(script_id) + r'["\'])[^>]*>)([\s\S]*?)(</script\s*>)', re.I)

          def script_body(html: str, script_id: str) -> str:
              found = list(pattern(script_id).finditer(html))
              if len(found) != 1:
                  raise ValueError(f"Expected exactly one script {script_id!r}, got {len(found)}")
              return found[0].group(2)

          def replace_body(html: str, script_id: str, body: str) -> str:
              matches = list(pattern(script_id).finditer(html))
              if len(matches) != 1:
                  raise ValueError(f"Expected exactly one target script {script_id!r}, got {len(matches)}")
              m = matches[0]
              return html[:m.start(2)] + body + html[m.end(2):]

          def apply(source: str, reference: str) -> tuple[str, dict[str, str]]:
              result, hashes = source, {}
              for sid in SCRIPT_IDS:
                  ref_body = script_body(reference, sid)
                  result = replace_body(result, sid, ref_body)
                  hashes[sid] = hashlib.sha256(ref_body.encode("utf-8")).hexdigest()
              old = f"const SQ_APP_VERSION_CODE = {OLD_CODE};"
              new = f"const SQ_APP_VERSION_CODE = {NEW_CODE};"
              if result.count(old) != 1:
                  raise ValueError(f"Expected exactly one app version constant {old!r}, found {result.count(old)}")
              result = result.replace(old, new, 1)
              if 'id="sq-v117-universal-dwg-bridge"' not in result:
                  raise ValueError("V140 universal DWG bridge is missing")
              if "function sqDwgWasmRuntimePath()" not in result:
                  raise ValueError("V140 DWG WASM runtime path helper is missing")
              if 'id="surveyquant-v140-fresh-board-session"' not in result:
                  raise ValueError("V140 fresh-board session cleanup guard is missing")
              if new not in result:
                  raise ValueError("App version was not updated to V141")
              for sid in SCRIPT_IDS:
                  if script_body(result, sid) != script_body(reference, sid):
                      raise AssertionError(f"V130 orientation module mismatch after transplant: {sid}")
              return result, hashes

          def read_len8(data: bytes, pos: int) -> tuple[int, int]:
              first = data[pos]
              if first & 0x80: return (((first & 0x7F) << 8) | data[pos + 1]), pos + 2
              return first, pos + 1

          def read_len16(data: bytes, pos: int) -> tuple[int, int]:
              first = struct.unpack_from("<H", data, pos)[0]
              if first & 0x8000:
                  second = struct.unpack_from("<H", data, pos + 2)[0]
                  return (((first & 0x7FFF) << 16) | second), pos + 4
              return first, pos + 2

          def patch_manifest(manifest: bytes) -> bytes:
              if len(manifest) < 8 or struct.unpack_from("<H", manifest, 0)[0] != 0x0003:
                  raise ValueError("AndroidManifest.xml is not Android binary XML")
              result = bytearray(manifest)
              pos = struct.unpack_from("<H", result, 2)[0]
              total = struct.unpack_from("<I", result, 4)[0]
              if total > len(result) or total < pos: raise ValueError("Invalid Android binary XML size")
              strings, spans, chunks = None, [], []
              while pos < total:
                  if pos + 8 > total: raise ValueError("Truncated Android XML chunk")
                  kind, header, size = struct.unpack_from("<HHI", result, pos)
                  if size < header or pos + size > total: raise ValueError("Invalid Android XML chunk bounds")
                  chunks.append((pos, kind, header, size))
                  if kind == 0x0001:
                      count, _styles, flags, strings_start, _styles_start = struct.unpack_from("<IIIII", result, pos + 8)
                      if count > 100000: raise ValueError("Unreasonable string count")
                      offsets_start, base = pos + header, pos + strings_start
                      utf8 = bool(flags & 0x100)
                      strings = []
                      spans = []
                      for i in range(count):
                          rel = struct.unpack_from("<I", result, offsets_start + i * 4)[0]
                          p = base + rel
                          if utf8:
                              _chars, p = read_len8(result, p)
                              byte_len, p = read_len8(result, p)
                              begin, end = p, p + byte_len
                              strings.append(bytes(result[begin:end]).decode("utf-8", "strict"))
                              spans.append((begin, end, True))
                          else:
                              char_len, p = read_len16(result, p)
                              begin, end = p, p + char_len * 2
                              strings.append(bytes(result[begin:end]).decode("utf-16le", "strict"))
                              spans.append((begin, end, False))
                  pos += size
              if strings is None: raise ValueError("Android XML string pool missing")
              old_ids = [i for i, value in enumerate(strings) if value == OLD_NAME]
              if not old_ids and NEW_NAME not in strings:
                  raise ValueError(f"Manifest has neither {OLD_NAME} nor {NEW_NAME}")
              for i in old_ids:
                  begin, end, is_utf8 = spans[i]
                  encoded = NEW_NAME.encode("utf-8" if is_utf8 else "utf-16le")
                  if len(encoded) != end - begin: raise ValueError("Version-name replacement changes string length")
                  result[begin:end] = encoded
                  strings[i] = NEW_NAME
              fields = []
              for chunk_pos, kind, _header, size in chunks:
                  if kind != 0x0102 or size < 36: continue
                  name_idx = struct.unpack_from("<I", result, chunk_pos + 20)[0]
                  if name_idx >= len(strings) or strings[name_idx] != "manifest": continue
                  attr_start = struct.unpack_from("<H", result, chunk_pos + 24)[0]
                  attr_size = struct.unpack_from("<H", result, chunk_pos + 26)[0]
                  attr_count = struct.unpack_from("<H", result, chunk_pos + 28)[0]
                  if attr_size < 20 or attr_count > 1024: raise ValueError("Invalid manifest attribute table")
                  first = chunk_pos + 16 + attr_start
                  for n in range(attr_count):
                      at = first + n * attr_size
                      name = struct.unpack_from("<I", result, at + 4)[0]
                      if name < len(strings) and strings[name] == "versionCode":
                          value_size, value_type = struct.unpack_from("<H", result, at + 12)[0], result[at + 15]
                          if value_size < 8 or value_type not in (0x10, 0x11): raise ValueError("versionCode is not integer typed")
                          fields.append(at + 16)
              if len(fields) != 1: raise ValueError(f"Expected one versionCode attribute, found {len(fields)}")
              struct.pack_into("<I", result, fields[0], NEW_CODE)
              return bytes(result)

          def package_apk(input_apk: Path, output_apk: Path, html_path: Path) -> None:
              html_bytes = html_path.read_bytes()
              html = html_bytes.decode("utf-8")
              if 'const SQ_APP_VERSION_CODE = 141;' not in html or 'id="surveyquant-v140-fresh-board-session"' not in html:
                  raise ValueError("Injected HTML is missing the V141 version or fresh-session guard")
              output_apk.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(input_apk, "r") as zin:
                  names = [i.filename for i in zin.infolist()]
                  if names.count("assets/index.html") != 1 or names.count("AndroidManifest.xml") != 1:
                      raise ValueError("Base APK must contain one index.html and AndroidManifest.xml")
                  seen = set()
                  with zipfile.ZipFile(output_apk, "w", allowZip64=True) as zout:
                      for info in zin.infolist():
                          name = info.filename
                          if name in seen: raise ValueError("Duplicate ZIP entry: " + name)
                          seen.add(name)
                          upper = name.upper()
                          if upper.startswith("META-INF/") and (upper.endswith(".SF") or upper.endswith(".RSA") or upper.endswith(".DSA") or upper.endswith(".EC") or upper.endswith("MANIFEST.MF")):
                              continue
                          data = zin.read(name)
                          if name == "assets/index.html": data = html_bytes
                          elif name == "AndroidManifest.xml": data = patch_manifest(data)
                          zout.writestr(copy.copy(info), data)
              with zipfile.ZipFile(output_apk, "r") as check:
                  if check.read("assets/index.html") != html_bytes: raise ValueError("APK HTML bytes do not match tested HTML")
                  if patch_manifest(check.read("AndroidManifest.xml")) != check.read("AndroidManifest.xml"):
                      raise ValueError("APK manifest version is not V141")
                  if "assets/libredwg-writer/wasm/libredwg-web.wasm" not in check.namelist():
                      raise ValueError("APK lost DWG WebAssembly runtime")
              print("PASS: packaged exact tested HTML, manifest versionName 1.0.141/versionCode 141, and retained DWG WASM runtime")

          def main() -> None:
              ap = argparse.ArgumentParser()
              ap.add_argument("--source-html", type=Path)
              ap.add_argument("--reference-html", type=Path)
              ap.add_argument("--output-html", type=Path)
              ap.add_argument("--apk-input", type=Path)
              ap.add_argument("--apk-output", type=Path)
              ap.add_argument("--html-to-inject", type=Path)
              args = ap.parse_args()
              if args.source_html and args.reference_html and args.output_html and not args.apk_input:
                  patched, hashes = apply(args.source_html.read_text(encoding="utf-8"), args.reference_html.read_text(encoding="utf-8"))
                  args.output_html.parent.mkdir(parents=True, exist_ok=True)
                  args.output_html.write_text(patched, encoding="utf-8", newline="")
                  for sid, digest in hashes.items(): print(f"PASS {sid} sha256={digest}")
                  print("PASS: transplanted all seven V130 orientation modules; preserved V140 DWG bridge and fresh-session guard")
                  return
              if args.apk_input and args.apk_output and args.html_to_inject:
                  package_apk(args.apk_input, args.apk_output, args.html_to_inject)
                  return
              ap.error("Use --source-html CURRENT --reference-html V130 --output-html OUT, or --apk-input APK --apk-output APK --html-to-inject HTML")
          if __name__ == "__main__": main()
          PY

          cat > "$TESTER" <<'JS'
          'use strict';
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const current = fs.readFileSync(process.argv[2], 'utf8');
          const reference = fs.readFileSync(process.argv[3], 'utf8');
          const ids = ['sq-orientation-module','sq-orientation-axis-reader-module','sq-orientation-manual-points-module','sq-orientation-reference-board-module','sq-orientation-dxf-faithful-recovery-module','sq-orientation-cad-preserve-module','sq-orientation-v115-tools-module'];
          function body(html,id) {
            const re = new RegExp(`(<script\\b(?=[^>]*\\bid=["']${id}["'])[^>]*>)([\\s\\S]*?)(<\\/script\\s*>)`, 'i');
            const m = html.match(re);
            assert(m, `missing script ${id}`);
            assert.equal((html.match(new RegExp(`id=["']${id}["']`,'g'))||[]).length,1,`duplicate script ${id}`);
            return m[2];
          }
          for (const id of ids) assert.equal(body(current,id),body(reference,id),`not byte-identical to V130: ${id}`);
          assert(current.includes('const SQ_APP_VERSION_CODE = 141;'),'version 141 constant missing');
          assert(current.includes('id="sq-v117-universal-dwg-bridge"'),'universal DWG bridge missing');
          assert(current.includes('function sqDwgWasmRuntimePath()'),'DWG WASM path helper missing');
          assert(current.includes('id="surveyquant-v140-fresh-board-session"'),'fresh-session reset from V140 missing');
          console.log('PASS V141: 7 orientation modules match V130 byte-for-byte.');
          console.log('PASS V141: V140 universal DWG bridge, WASM helper, and fresh-board session cleanup remain.');
          JS
          python3 -m py_compile "$PATCHER"
          node --check "$TESTER"
          echo "V141_PATCHER=$PATCHER" >> "$GITHUB_ENV"
          echo "V141_TESTER=$TESTER" >> "$GITHUB_ENV"

      - name: Transplant V130 orientation into V140 and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V141_PATCHER" --source-html "$V141_SOURCE_DIR/index.html" --reference-html "$V130_SOURCE_DIR/index.html" --output-html "$V141_SOURCE_DIR/index_v141.html"
          node "$V141_TESTER" "$V141_SOURCE_DIR/index_v141.html" "$V130_SOURCE_DIR/index.html"
          test -s "$V130_SOURCE_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"
          node "$V130_SOURCE_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js" "$V141_SOURCE_DIR/index_v141.html"
          node --check "$V141_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          cp "$V141_SOURCE_DIR/index_v141.html" "$V141_SOURCE_DIR/index.html"
          rm -f "$V141_SOURCE_DIR/index_v141.html"
          cp "$V141_PATCHER" "$V141_SOURCE_DIR/SurveyQuant_v1.0.141_RESTORE_V130_ORIENTATION.py"
          cp "$V141_TESTER" "$V141_SOURCE_DIR/SurveyQuant_v1.0.141_V130_ORIENTATION_REGRESSION_TEST.js"
          cat > "$V141_SOURCE_DIR/README_V141_V130_ORIENTATION_AR.txt" <<'TXT'
          SurveyQuant V141: استعادة مشروع توجيه اللوح من V130
          - تم نقل وحدات مشروع التوجيه السبع حرفيًا من مصدر V130 واختبار تطابقها.
          - تم الإبقاء على قاعدة V140 ومكونات دعم DWG العامة ومحرك WASM.
          - تم الإبقاء على تنظيف جلسة الرسم الذي يمنع الاحتفاظ بلوحات سابقة عند العودة للتطبيق.
          - الإصدار 1.0.141 / versionCode 141.
          - اختبارات المصدر لا تغني عن تجربة ملفات DWG/DXF فعلية والتحقق من نقاط مساحية معروفة.
          TXT
          (cd "$V141_SOURCE_DIR" && zip -qr "$V141_RELEASE_DIR/SurveyQuant_v1.0.141_V130_ORIENTATION_SOURCE_PATCH.zip" .)
          unzip -t "$V141_RELEASE_DIR/SurveyQuant_v1.0.141_V130_ORIENTATION_SOURCE_PATCH.zip" | tail -2

      - name: Inject tested HTML into APK, align, and sign
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V141_RELEASE_DIR/SurveyQuant_v1.0.141_V130_ORIENTATION_UNSIGNED.apk"
          ALIGNED="$V141_RELEASE_DIR/SurveyQuant_v1.0.141_V130_ORIENTATION_ALIGNED.apk"
          FINAL="$V141_RELEASE_DIR/SurveyQuant_v1.0.141_V130_ORIENTATION_FIX.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V141_PATCHER" --apk-input "$V141_BASE_APK" --apk-output "$RAW" --html-to-inject "$V141_SOURCE_DIR/index.html"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='141'.*versionName='1.0.141'"
          sha256sum "$FINAL" "$V141_RELEASE_DIR/SurveyQuant_v1.0.141_V130_ORIENTATION_SOURCE_PATCH.zip" > "$V141_RELEASE_DIR/SHA256SUMS.txt"
          printf '%s\n' 'PASS V141: V130 orientation modules, V140 DWG support and session reset preserved; APK manifest and signature verified.' > "$V141_RELEASE_DIR/V141_BUILD_RESULT.txt"
          cat "$V141_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload V141 APK, source patch, and validation summary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.141-V130-ORIENTATION-FRESH-SESSION
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.141_V130_ORIENTATION_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.141_V130_ORIENTATION_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V141_BUILD_RESULT.txt
          if-no-files-found: error
          retention-days: 14
