name: Build SurveyQuant v1.0.58

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          set -e

          ZIP="SurveyQuantAndroid_v1.0.58_PATCH4_REPAIRED_SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "SurveyQuantAndroid_v1.0.58_PATCH4_REPAIRED_SOURCE.zip" \
            -d extracted

          PROJECT_DIR=$(find extracted \
            -type f \
            -path "*/app/build.gradle" \
            -print -quit \
            | sed 's#/app/build.gradle$##')

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/app/build.gradle"

          test -f \
            "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Source verification OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          if [ -z "$KS_B64" ]; then
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "$KS_B64" | base64 --decode \
            > "$RUNNER_TEMP/surveyquant-release.jks"

          test -s "$RUNNER_TEMP/surveyquant-release.jks"

          echo \
            "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/SurveyQuant-v1.0.58-release.apk

          ls -lh \
            release/SurveyQuant-v1.0.58-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.58-release
          path: release/SurveyQuant-v1.0.58-release.apk
          if-no-files-found: error
