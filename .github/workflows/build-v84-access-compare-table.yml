name: Build SurveyQuant v1.0.84 - Access File + Comparison Table Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip"
      - "SurveyQuant_v1.0.84_ACCESS_COMPARE_TABLE_PATCH.zip"
      - ".github/workflows/build-v84-access-compare-table.yml"

permissions:
  contents: read

env:
  SOURCE_ZIP: SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip
  PATCH_ZIP: SurveyQuant_v1.0.84_ACCESS_COMPARE_TABLE_PATCH.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source and patch
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_ZIP" || { echo "ERROR: missing $SOURCE_ZIP"; exit 1; }
          test -s "$PATCH_ZIP" || { echo "ERROR: missing $PATCH_ZIP"; exit 1; }
          unzip -t "$PATCH_ZIP"

      - name: Extract source and small patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$PATCH_ZIP" -d "$RUNNER_TEMP/sq-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"
          test -n "$PROJECT" || { echo "ERROR: app/build.gradle not found in source ZIP"; exit 1; }
          test -n "$PATCH_INDEX" || { echo "ERROR: index.html not found in patch ZIP"; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Apply only v84 HTML additions
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$PROJECT_DIR/app/src/main/assets"
          test -d "$ASSETS" || { echo "ERROR: Android assets folder not found"; exit 1; }
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"
          cp "$PATCH_INDEX" "$ASSETS/index.html"
          # Fixed-string checks avoid grep interpreting JavaScript brackets as regex.
          grep -Fq 'async function readLocalFileArrayBuffer(file){' "$ASSETS/index.html"
          grep -Fq 'compareLevelTypeBefore' "$ASSETS/index.html"
          grep -Fq 'compareLevelTypeAfter' "$ASSETS/index.html"
          grep -Fq "statRows('LAYER 1 / BEFORE'" "$ASSETS/index.html"
          grep -Fq "statRows('LAYER 2 / AFTER'" "$ASSETS/index.html"
          grep -Fq 'DIFFERENCE OF STANDALONE NETS' "$ASSETS/index.html"
          grep -Fq 'const originalEntities=(originalCad.entities||[]).filter(Boolean)' "$ASSETS/index.html"

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          node - "$INDEX" "$RUNNER_TEMP/inline.js" <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const re = /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          const scripts = [];
          let m;
          while ((m = re.exec(html)) !== null) scripts.push(m[1]);
          if (!scripts.length) throw new Error('No inline JavaScript found');
          fs.writeFileSync(process.argv[3], scripts.join('\n'));
          NODE
          node --check "$RUNNER_TEMP/inline.js"

      - name: Set version 1.0.84
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          sed -E -i "0,/versionCode[[:space:]]+[0-9]+/s//versionCode 84/" "$BUILD_FILE"
          sed -E -i "0,/versionName[[:space:]]+['\"][^'\"]+['\"]/s//versionName '1.0.84'/" "$BUILD_FILE"
          grep -Fq "versionName '1.0.84'" "$BUILD_FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing secret SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing secret SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing secret SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing secret SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.keystore"
          {
            echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.keystore"
            echo "SURVEYQUANT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SURVEYQUANT_KEY_ALIAS=$KEY_ALIAS"
            echo "SURVEYQUANT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Collect APK only
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"
          test -n "$APK" || { echo "ERROR: release APK not found"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/SurveyQuant_v1.0.84_ACCESS_COMPARE_TABLE_FIX.apk"

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.84-ACCESS-COMPARE-TABLE-FIX
          path: release/SurveyQuant_v1.0.84_ACCESS_COMPARE_TABLE_FIX.apk
          if-no-files-found: error
