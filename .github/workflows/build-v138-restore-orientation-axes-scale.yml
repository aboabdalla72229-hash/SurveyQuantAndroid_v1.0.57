                    console.log('PASS V138: two-point solver calculates translation, rotation and valid unconstrained scale.');
                    console.log('PASS V138: labelled LINE and XLINE grid intersections are detected; viewport/text scale is no longer fixed.');

                    class TestBlob {
                      constructor(parts = [], options = {}) {
