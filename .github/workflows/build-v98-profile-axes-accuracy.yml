name: Build SurveyQuant v1.0.98 - Accurate Levels and Axis Intersections

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
      - "SurveyQuant_v1.0.98_PROFILE_ACCURACY_AXIS_INTERSECTIONS_PATCH.zip"
      - ".github/workflows/build-v98-profile-axes-accuracy.yml"

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip
  PATCH_NAME: SurveyQuant_v1.0.98_PROFILE_ACCURACY_AXIS_INTERSECTIONS_PATCH.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract v1.0.93 source and apply the targeted patch
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_NAME" || { echo "ERROR: Missing source ZIP: $SOURCE_NAME"; exit 1; }
          test -s "$PATCH_NAME" || { echo "ERROR: Missing patch ZIP: $PATCH_NAME"; exit 1; }
          rm -rf "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$PATCH_NAME" -d "$RUNNER_TEMP/sq-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"
          test -n "$PROJECT" && test -d "$PROJECT" || { echo "ERROR: Android project not found inside source ZIP."; exit 1; }
          test -n "$PATCH_INDEX" && test -s "$PATCH_INDEX" || { echo "ERROR: Patched index.html is missing."; exit 1; }
          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/build.gradle"
          test -s "$PROJECT/app/src/main/AndroidManifest.xml"
          mkdir -p "$PROJECT/app/src/main/assets"
          cp "$PATCH_INDEX" "$PROJECT/app/src/main/assets/index.html"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Targeted HTML patch applied to v1.0.93 base source."

      - name: Verify features, settings and version markers
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          python3 - "$INDEX" "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re
          import sys
          index = Path(sys.argv[1]).read_text(encoding="utf-8")
          gradle = Path(sys.argv[2]).read_text(encoding="utf-8")
          required = [
              "function sqApi",
              "function sqDeviceId()",
              "async function sqInitAccess",
              "kashier/create-session",
              "function profileTargetCurves",
              "function buildProfileOutputEntities",
              "function sqCompareSurfaceTriangles",
              "function axisCandidates",
              "function orientationIntersections",
              "function transformOriginalDxfPreservingDetails",
              "function buildProfileDXFWithOriginal",
              "surveyquant_background.png",
              'id="project1Card"',
              'id="profileCard"',
              'id="orientationCard"',
          ]
          missing = [needle for needle in required if needle not in index]
          if missing:
              raise SystemExit("ERROR: Required app features missing: " + ", ".join(missing))
          if "const SQ_APP_VERSION_CODE = 98;" not in index:
              raise SystemExit("ERROR: Runtime app-version marker is not 98.")
          if not re.search(r"\bversionCode\s+93\b", gradle) or not re.search(r"\bversionName\s+['\"]1\.0\.93['\"]", gradle):
              raise SystemExit("ERROR: Expected v1.0.93 source baseline before version bump.")
          print("Profile, two-layer quantities, orientation, payment gate and original project cards verified.")
          PY
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png"
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_background.png"
          cmp -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png" || { echo "ERROR: Existing app-logo assets differ."; exit 1; }

      - name: Set app version to 1.0.98
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")
          text, code_edits = re.subn(r"(\bversionCode\s+)93\b", r"\g<1>98", text, count=1)
          text, name_edits = re.subn(r"(\bversionName\s+)(['\"])1\.0\.93\2", "\\g<1>'1.0.98'", text, count=1)
          if code_edits != 1 or name_edits != 1:
              raise SystemExit(f"ERROR: Version update failed (versionCode={code_edits}, versionName={name_edits}).")
          p.write_text(text, encoding="utf-8")
          PY
          grep -Eq 'versionCode[[:space:]]+98([^0-9]|$)' "$PROJECT_DIR/app/build.gradle"
          grep -Eq "versionName[[:space:]]+['\"]1\.0\.98['\"]" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'const SQ_APP_VERSION_CODE = 98;' "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re
          import sys
          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("ERROR: No inline scripts found.")
          Path(sys.argv[2]).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: Secret SURVEYQUANT_KEY_ALIAS is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEY_PASSWORD is missing."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease --stacktrace
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: Release APK was not generated."; find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true; exit 1; }
          mkdir -p "$RUNNER_TEMP/sq-release"
          cp "$APK" "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.98_PROFILE_ACCURACY_AXES.apk"
          sha256sum "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.98_PROFILE_ACCURACY_AXES.apk" > "$RUNNER_TEMP/sq-release/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/sq-release/SHA256SUMS.txt"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.98-PROFILE-ACCURACY-AXIS-INTERSECTIONS
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.98_PROFILE_ACCURACY_AXES.apk
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
