name: Build SurveyQuant v1.0.190 Orientation + PDF + Projection Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v190-orientation-pdf-projection-fix.yml"
      - "SurveyQuant_v1.0.190_ORIENTATION_PDF_PROJECTION_FIX_PATCH*.zip"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful v188 signed base APK workflow run ID"
        required: true
        type: string
        default: "41892461366"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v190-orientation-pdf-projection-fix
  cancel-in-progress: false

jobs:
  build_v190:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41892461366' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install independent DXF audit and PDF fixture dependencies
        run: python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 reportlab==4.4.4 pillow==11.3.0

      - name: Extract and validate v190 source patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="SurveyQuant_v1.0.190_ORIENTATION_PDF_PROJECTION_FIX_PATCH.zip"
          PATCH_ZIP=""
          for candidate in "$EXPECTED" "SurveyQuant_v1.0.190_ORIENTATION_PDF_PROJECTION_FIX_PATCH-1.zip" "SurveyQuant_v1.0.190_ORIENTATION_PDF_PROJECTION_FIX_PATCH-2.zip"; do
            if [ -s "$candidate" ] && unzip -tq "$candidate" >/dev/null 2>&1 \
              && unzip -Z1 "$candidate" | grep -Fxq 'index.html' \
              && unzip -Z1 "$candidate" | grep -Fxq 'SurveyQuant_v1.0.190_PACKAGE_FREE_APK.py' \
              && unzip -Z1 "$candidate" | grep -Fxq 'SurveyQuant_v1.0.190_TARGETED_REGRESSION_TEST.js'; then
              PATCH_ZIP="$candidate"; break
            fi
          done
          if [ -z "$PATCH_ZIP" ]; then
            echo "::error::No valid v190 source patch found in repository root."
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f (%s bytes)\n' | sort
            exit 1
          fi
          echo "PASS: selected validated source archive: $PATCH_ZIP"
          KIT="$RUNNER_TEMP/v190-kit"; rm -rf "$KIT"; mkdir -p "$KIT"
          unzip -q "$PATCH_ZIP" -d "$KIT"
          for f in index.html SurveyQuant_v1.0.177_CAD_ENGINE.js SurveyQuant_v1.0.189_PROJECTION_IO.js SurveyQuant_v1.0.190_PACKAGE_FREE_APK.py SurveyQuant_v1.0.190_TARGETED_REGRESSION_TEST.js SurveyQuant_v1.0.190_PDF_CLIP_INTEGRATION_TEST.js V190_EOCLIP_REAL_FIXTURE.pdf SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_FIXTURE.py SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_TEST.js SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_AUDIT.py SurveyQuant_v1.0.188_ISOLATION_SAVE_TEST.js SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js SurveyQuant_v1.0.177_APP_PROJECT_TEST.js SurveyQuant_v1.0.177_POINT_PARSER_TEST.js SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js SurveyQuant_v1.0.187_REGRESSION_TEST.js SurveyQuant_v1.0.187_PDF_ONLY_TEST.js SurveyQuant_v1.0.189_PROJECTION_FORMAT_TEST.js V177_VECTOR_TEST.pdf pdfjs-v3.11.174.min.js pdfjs-worker-v3.11.174.min.js; do
            test -s "$KIT/$f" || { echo "ERROR: source patch missing $f"; exit 1; }
          done
          cp "$KIT/pdfjs-worker-v3.11.174.min.js" "$KIT/pdf.worker.js"
          echo "V190_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Create mixed-entity CAD regression fixture
        shell: bash
        run: |
          set -euo pipefail
          cd "$V190_KIT"
          python3 SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_FIXTURE.py

      - name: Create vector-fill and raster PDF regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd "$V190_KIT"
          python3 - <<'PY'
          from reportlab.pdfgen import canvas
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('.')
          c=canvas.Canvas(str(p/'V187_FILLED_VECTOR_FIXTURE.pdf'),pagesize=(300,220),pageCompression=0)
          c.setStrokeColorRGB(0.12,0.24,0.76);c.setLineWidth(1.4)
          c.setFillColorRGB(0.82,0.18,0.10);c.rect(25,35,120,95,stroke=1,fill=1)
          c.setFillColorRGB(0.04,0.12,0.50);c.setFont('Helvetica',16);c.drawString(30,165,'V190 VECTOR FILL TEST')
          c.showPage();c.save()
          im=Image.new('RGB',(40,30),'white');d=ImageDraw.Draw(im);d.rectangle((3,3,35,25),fill=(220,30,30))
          im.save(p/'V187_RASTER_FIXTURE.png')
          c=canvas.Canvas(str(p/'V187_RASTER_FIXTURE.pdf'),pagesize=(300,220),pageCompression=0)
          c.drawImage(str(p/'V187_RASTER_FIXTURE.png'),25,35,width=240,height=150);c.showPage();c.save()
          (p/'V187_RASTER_FIXTURE.png').unlink()
          print('PASS: generated vector-fill PDF and embedded-raster PDF fixtures')
          PY

      - name: Run app, session, four-pair projection, orientation, CAD and PDF tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$V190_KIT"
          node --check SurveyQuant_v1.0.177_CAD_ENGINE.js
          node --check SurveyQuant_v1.0.189_PROJECTION_IO.js
          node --check SurveyQuant_v1.0.189_PROJECTION_FORMAT_TEST.js
          node --check SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_TEST.js
          node --check SurveyQuant_v1.0.188_ISOLATION_SAVE_TEST.js
          node --check SurveyQuant_v1.0.187_REGRESSION_TEST.js
          node --check SurveyQuant_v1.0.187_PDF_ONLY_TEST.js
          node --check SurveyQuant_v1.0.190_TARGETED_REGRESSION_TEST.js
          node --check SurveyQuant_v1.0.190_PDF_CLIP_INTEGRATION_TEST.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script id="sq176-cad-engine">')
          a=s.index('>',a)+1
          b=s.index('</script>',a)
          Path('/tmp/sq189-embedded-engine.js').write_text(s[a:b],encoding='utf-8')
          print('PASS: extracted embedded application CAD engine')
          PY
          node --check /tmp/sq189-embedded-engine.js
          node SurveyQuant_v1.0.188_ISOLATION_SAVE_TEST.js . | tee V190_ISOLATION_SAVE_TEST.txt
          node SurveyQuant_v1.0.177_APP_PROJECT_TEST.js index.html | tee V190_PROJECT_TEST.txt
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html | tee V190_POINT_TEST.txt
          node SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js index.html | tee V190_ANDROID_BYTES_TEST.txt
          node SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js | tee V190_CAD_ENGINE_TEST.txt
          node SurveyQuant_v1.0.189_PROJECTION_FORMAT_TEST.js . | tee V190_PROJECTION_FORMAT_TEST.txt
          node SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js | tee V190_ORIENTATION_BASE_TEST.txt
          node SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_TEST.js . | tee V190_ORIENTATION_FIDELITY_TEST.txt
          python3 SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_AUDIT.py | tee V190_ORIENTATION_FIDELITY_AUDIT.txt
          node SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js pdfjs-v3.11.174.min.js pdf.worker.js V177_VECTOR_TEST.pdf V190_VECTOR_PDF_TEST.dxf | tee V190_PDF_VECTOR_TEST.txt
          node SurveyQuant_v1.0.187_REGRESSION_TEST.js . | tee V190_V187_REGRESSION_TEST.txt
          node SurveyQuant_v1.0.187_PDF_ONLY_TEST.js . | tee V190_PDF_ONLY_TEST.txt
          node SurveyQuant_v1.0.190_TARGETED_REGRESSION_TEST.js | tee V190_TARGETED_REGRESSION_TEST.txt
          node SurveyQuant_v1.0.190_PDF_CLIP_INTEGRATION_TEST.js . | tee V190_PDF_CLIP_INTEGRATION_TEST.txt

      - name: Independent DXF audit after merge, orientation and PDF conversion
        shell: bash
        run: |
          set -euo pipefail
          cd "$V190_KIT"
          python3 - <<'PY'
          import ezdxf,json
          from pathlib import Path
          names=['V188_ORIENTATION_FIDELITY_FIXTURE.dxf','V188_ORIENTATION_FIDELITY_OUTPUT.dxf','V190_VECTOR_PDF_TEST.dxf','V190_EOCLIP_REAL_TEST.dxf','V187_FILLED_VECTOR_TEST.dxf']
          names += [f'V190_PAIR_{s}_{t}.dxf' for s in ('DXF','DWG') for t in ('DXF','DWG')]
          reports=[]
          for name in names:
              p=Path(name)
              if not p.is_file() or p.stat().st_size<256: raise SystemExit(f'missing or too-small DXF: {name}')
              doc=ezdxf.readfile(p);audit=doc.audit();types={}
              for e in doc.modelspace():
                  typ=e.dxftype();types[typ]=types.get(typ,0)+1
              if audit.errors or audit.fixes: raise SystemExit(f'{name}: audit errors={len(audit.errors)}, fixes={len(audit.fixes)}')
              if any(t in types for t in ('IMAGE','IMAGEDEF')): raise SystemExit(f'raster entity embedded in {name}')
              reports.append({'file':name,'version':doc.dxfversion,'entities':types,'audit_errors':len(audit.errors),'audit_fixes':len(audit.fixes)})
          Path('V190_FINAL_DXF_AUDIT.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          PY

      - name: Download successful signed v188 base APK
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v188-base"
          mkdir -p "$BASE"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.188-ORIENTATION-PDF-SAVE-FIX" --dir "$BASE"
          APK="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.188_FREE_ORIENTATION_PDF_SAVE_FIX.apk' -print -quit)"
          test -s "$APK" || { echo "ERROR: signed v188 APK missing in source run $SOURCE_RUN_ID"; find "$BASE" -type f; exit 1; }
          echo "V188_BASE_APK=$APK" >> "$GITHUB_ENV"

      - name: Inject tested web app and bump version to v1.0.190
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v190-release"
          mkdir -p "$OUT"
          python3 "$V190_KIT/SurveyQuant_v1.0.190_PACKAGE_FREE_APK.py" \
            --apk-input "$V188_BASE_APK" \
            --apk-output "$OUT/SurveyQuant_v1.0.190_UNSIGNED.apk" \
            --html-to-inject "$V190_KIT/index.html"
          test -s "$OUT/SurveyQuant_v1.0.190_UNSIGNED.apk"
          unzip -t "$OUT/SurveyQuant_v1.0.190_UNSIGNED.apk" | tail -2
          echo "V190_RELEASE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Sign and verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V190_RELEASE_DIR/SurveyQuant_v1.0.190_ALIGNED.apk"
          FINAL="$V190_RELEASE_DIR/SurveyQuant_v1.0.190_FREE_CAD_PROJECTION_DXF_DWG_PDF.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V190_RELEASE_DIR/SurveyQuant_v1.0.190_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -F "versionCode='190' versionName='1.0.190'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V190_RELEASE_DIR/SurveyQuant_v1.0.190_UNSIGNED.apk"

      - name: Package source, checksums and test evidence
        shell: bash
        run: |
          set -euo pipefail
          (cd "$V190_KIT" && zip -qr "$V190_RELEASE_DIR/SurveyQuant_v1.0.190_PROJECTION_OUTPUT_DWG_PDF_SAVE_SOURCE_PATCH.zip" . \
            -x 'V187_*.txt' 'V187_*.json' 'V187_*.dxf' 'V187_FILLED_VECTOR_FIXTURE.pdf' 'V187_RASTER_FIXTURE.pdf' \
               'V188_*.txt' 'V188_*.json' 'V188_*.dxf' \
               'V190_*.txt' 'V190_*.json' 'V190_*.dxf' 'V187_FILLED_VECTOR_FIXTURE.pdf' 'V187_RASTER_FIXTURE.pdf' 'V187_RASTER_FIXTURE.png' 'pdf.worker.js')
          unzip -t "$V190_RELEASE_DIR/SurveyQuant_v1.0.190_PROJECTION_OUTPUT_DWG_PDF_SAVE_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V190_RELEASE_DIR/SurveyQuant_v1.0.190_FREE_CAD_PROJECTION_DXF_DWG_PDF.apk" "$V190_RELEASE_DIR/SurveyQuant_v1.0.190_PROJECTION_OUTPUT_DWG_PDF_SAVE_SOURCE_PATCH.zip" "$V190_KIT"/*.dxf > "$V190_RELEASE_DIR/SHA256SUMS.txt"
          cp "$V190_KIT/README_V190_AR.md" "$V190_RELEASE_DIR/README_V190_AR.md"
          cat "$V190_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed APK, source, audit and test evidence
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.190-CAD-PROJECTION-DWG-PDF
          path: |
            ${{ runner.temp }}/v190-release/SurveyQuant_v1.0.190_FREE_CAD_PROJECTION_DXF_DWG_PDF.apk
            ${{ runner.temp }}/v190-release/SurveyQuant_v1.0.190_PROJECTION_OUTPUT_DWG_PDF_SAVE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v190-release/README_V190_AR.md
            ${{ runner.temp }}/v190-release/SHA256SUMS.txt
            ${{ runner.temp }}/v190-kit/V190_*.txt
            ${{ runner.temp }}/v190-kit/V190_*.json
            ${{ runner.temp }}/v190-kit/V190_*.dxf
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.0.190 as the latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.190
          name: SurveyQuant v1.0.190 - CAD Projection DXF/DWG Output and PDF Save Fix
          body_path: ${{ runner.temp }}/v190-release/README_V190_AR.md
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            ${{ runner.temp }}/v190-release/SurveyQuant_v1.0.190_FREE_CAD_PROJECTION_DXF_DWG_PDF.apk
            ${{ runner.temp }}/v190-release/SurveyQuant_v1.0.190_PROJECTION_OUTPUT_DWG_PDF_SAVE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v190-release/SHA256SUMS.txt
