name: Build SurveyQuant v1.0.90 - DXF Preservation Validation Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.90_FROM_V67_DXF_VALIDATION_FIX.zip"
      - ".github/workflows/build-v90-from-v67-dxf-validation-fix.yml"

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.90_FROM_V67_DXF_VALIDATION_FIX.zip

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract v90 source
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_NAME" || { echo "ERROR: Missing source ZIP: $SOURCE_NAME"; exit 1; }
          rm -rf "$RUNNER_TEMP/sq-source"
          mkdir -p "$RUNNER_TEMP/sq-source"
          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$PROJECT" || { echo "ERROR: Android project not found in source ZIP"; exit 1; }
          test -s "$PROJECT/app/src/main/assets/index.html"
          test -s "$PROJECT/app/src/main/assets/surveyquant_logo.png"
          test -s "$PROJECT/app/src/main/assets/surveyquant_background.png"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "Missing secret SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "Missing secret SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "Missing secret SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "Missing secret SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.jks"
          test -s "$RUNNER_TEMP/surveyquant-release.jks"
          echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.jks" >> "$GITHUB_ENV"

      - name: Validate DXF fix and branding
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 90" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.0.90'" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'function inspectPreservedReferenceDXF' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Fq 'mergeProjectionDxfPreservingReference' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Fq 'model.rawDXFBytes=bytes.slice()' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Fq "activeProjectId==='project1Card'" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Fq 'surveyquant_background.png' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Fq 'surveyquant_logo.png' "$PROJECT_DIR/app/src/main/assets/index.html"
          cmp -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png"
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          import pathlib, re, sys
          html = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          pathlib.Path(sys.argv[2]).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: APK was not produced"; exit 1; }
          mkdir -p "$PROJECT_DIR/release"
          cp "$APK" "$PROJECT_DIR/release/SurveyQuant-v1.0.90-dxf-validation-fix.apk"
          sha256sum "$PROJECT_DIR/release/SurveyQuant-v1.0.90-dxf-validation-fix.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.90-dxf-validation-fix
          path: ${{ env.PROJECT_DIR }}/release/SurveyQuant-v1.0.90-dxf-validation-fix.apk
          if-no-files-found: error
