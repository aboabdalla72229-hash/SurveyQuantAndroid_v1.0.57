name: Build SurveyQuant v1.0.133 - Fresh Session + Responsive CAD

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v133-fresh-session-performance.yml"
      - "SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_PATCH.zip"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Checkout pinned LibreDWG-Web source
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-web
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate and unpack known-good base and session patch kits
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-yaml unzip zip

          BASE_KIT="SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.zip"
          PATCH_KIT="SurveyQuant_v1.0.129_SELECT_DELETE_UNDO_REDO_PATCH.zip"
          V130_KIT="SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_PATCH.zip"
          V131_KIT="SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.zip"
          V133_KIT="SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_PATCH.zip"
          for f in "$BASE_KIT" "$PATCH_KIT" "$V130_KIT" "$V131_KIT" "$V133_KIT"; do
            test -s "$f" || { echo "ERROR: Required kit missing: $f"; exit 1; }
            unzip -t "$f"
          done

          KIT_DIR="$RUNNER_TEMP/sq-v126-kit"
          PATCH_DIR="$RUNNER_TEMP/sq-v129-patch"
          V130_DIR="$RUNNER_TEMP/sq-v130-patch"
          V131_DIR="$RUNNER_TEMP/sq-v131-patch"
          V133_DIR="$RUNNER_TEMP/sq-v133-patch"
          rm -rf "$KIT_DIR" "$PATCH_DIR" "$V130_DIR" "$V131_DIR" "$V133_DIR"
          mkdir -p "$KIT_DIR" "$PATCH_DIR" "$V130_DIR" "$V131_DIR" "$V133_DIR"
          unzip -q "$BASE_KIT" -d "$KIT_DIR"
          unzip -q "$PATCH_KIT" -d "$PATCH_DIR"
          unzip -q "$V130_KIT" -d "$V130_DIR"
          unzip -q "$V131_KIT" -d "$V131_DIR"
          unzip -q "$V133_KIT" -d "$V133_DIR"

          test -s "$KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_APPLY_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_IMPORT_BRIDGE.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.128_APPLY_CAD_ZOOM_DWG_PATCH.py"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.129_APPLY_DELETE_UNDO_REDO_PATCH.py"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.129_DELETE_UNDO_REDO_TEST.js"
          test -s "$V130_DIR/SurveyQuant_v1.0.130_APPLY_DWG_AXIS_MULTISELECT_PATCH.py"
          test -s "$V130_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"
          test -s "$V131_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.py"
          test -s "$V131_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_TEST.js"
          test -s "$V133_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_PATCH.py"
          test -s "$V133_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_TEST.js"
          test -s "$V133_DIR/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_PATCH.py"
          test -s "$V133_DIR/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_TEST.js"

          {
            echo "V126_KIT_DIR=$KIT_DIR"
            echo "V128_V129_PATCH_DIR=$PATCH_DIR"
            echo "V129_PATCH_DIR=$PATCH_DIR"
            echo "V130_PATCH_DIR=$V130_DIR"
            echo "V130_PATCHER=$V130_DIR/SurveyQuant_v1.0.130_APPLY_DWG_AXIS_MULTISELECT_PATCH.py"
            echo "V130_TEST=$V130_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"
            echo "V131_PATCH_DIR=$V131_DIR"
            echo "V131_PATCHER=$V131_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.py"
            echo "V131_TEST=$V131_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_TEST.js"
            echo "V132_PATCHER=$V133_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_PATCH.py"
            echo "V132_TEST=$V133_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_TEST.js"
            echo "V133_PATCH_DIR=$V133_DIR"
            echo "V133_PATCHER=$V133_DIR/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_PATCH.py"
            echo "V133_TEST=$V133_DIR/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_TEST.js"
            echo "V117_PATCHER=$KIT_DIR/SurveyQuant_v1.0.117_APPLY_PATCH.py"
            echo "V117_BRIDGE=$KIT_DIR/SurveyQuant_v1.0.117_DWG_IMPORT_BRIDGE.js"
            echo "V117_TEST=$KIT_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js"
            echo "V126_PATCHER=$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py"
            echo "V126_TEST=$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js"
          } >> "$GITHUB_ENV"

      - name: Build the validated V126 base with original V117 orientation behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          python3 "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk"
          test -s "$RUNNER_TEMP/sq-release/source-patch/index.html"

      - name: Apply CAD fixes and V133 fresh-session/performance policy
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="$RUNNER_TEMP/sq-release/source-patch"

          python3 "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.128_APPLY_CAD_ZOOM_DWG_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js" "$SRC_DIR/index.html"
          python3 "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.129_APPLY_DELETE_UNDO_REDO_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js" "$SRC_DIR/index.html"
          node "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.129_DELETE_UNDO_REDO_TEST.js" "$SRC_DIR/index.html"

          python3 "$V130_PATCHER" --html "$SRC_DIR/index.html"
          node "$V130_TEST" "$SRC_DIR/index.html"
          cp "$V130_PATCHER" "$SRC_DIR/SurveyQuant_v1.0.130_APPLY_DWG_AXIS_MULTISELECT_PATCH.py"
          cp "$V130_TEST" "$SRC_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js"

          python3 "$V131_PATCHER" --html "$SRC_DIR/index.html"
          node "$V131_TEST" "$SRC_DIR/index.html"
          cp "$V131_PATCHER" "$SRC_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.py"
          cp "$V131_TEST" "$SRC_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_TEST.js"

          python3 "$V132_PATCHER" --html "$SRC_DIR/index.html"
          node "$V132_TEST" "$SRC_DIR/index.html"
          node "$V130_TEST" "$SRC_DIR/index.html"
          cp "$V132_PATCHER" "$SRC_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_PATCH.py"
          cp "$V132_TEST" "$SRC_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_TEST.js"

          python3 -m py_compile "$V133_PATCHER"
          python3 "$V133_PATCHER" --html "$SRC_DIR/index.html"
          node "$V133_TEST" "$SRC_DIR/index.html"
          node "$V130_TEST" "$SRC_DIR/index.html"
          node "$V132_TEST" "$SRC_DIR/index.html"
          cp "$V133_PATCHER" "$SRC_DIR/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_PATCH.py"
          cp "$V133_TEST" "$SRC_DIR/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE_TEST.js"
          cp "$V133_PATCH_DIR/README_V133_AR.txt" "$SRC_DIR/README_V133_AR.txt"

          python3 - "$SRC_DIR/index.html" "$RUNNER_TEMP/sq-v133-inline-check" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          out=Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)
          class Parser(HTMLParser):
            def __init__(self): super().__init__();self.in_script=False;self.external=False;self.buf=[];self.items=[]
            def handle_starttag(self,tag,attrs):
              if tag.lower()=='script': self.in_script=True;self.external=any(k.lower()=='src' for k,v in attrs);self.buf=[]
            def handle_data(self,data):
              if self.in_script and not self.external:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag.lower()=='script' and self.in_script:
                if ''.join(self.buf).strip():self.items.append(''.join(self.buf))
                self.in_script=False;self.buf=[]
          p=Parser();p.feed(html)
          if len(p.items)<8: raise SystemExit(f'ERROR: expected at least 8 inline scripts, found {len(p.items)}')
          for i,body in enumerate(p.items): (out/f'{i:02d}.js').write_text(body,encoding='utf-8')
          print(f'Prepared {len(p.items)} inline scripts for node syntax validation.')
          PY
          for js in "$RUNNER_TEMP"/sq-v133-inline-check/*.js; do node --check "$js"; done

          RELEASE="$RUNNER_TEMP/sq-release"
          ZIP_SOURCE="$RELEASE/SurveyQuant_v1.0.133_FRESH_SESSION_SOURCE_PATCH.zip"
          (cd "$SRC_DIR" && zip -qr "$ZIP_SOURCE" .)
          unzip -t "$ZIP_SOURCE"
          echo "V133_SOURCE_PATCH=$ZIP_SOURCE" >> "$GITHUB_ENV"

      - name: Install the tested HTML and build actual Android version 1.0.133
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="$RUNNER_TEMP/sq-release/source-patch"
          PROJECT="${PROJECT_DIR:-}"
          if [ -z "$PROJECT" ] || [ ! -s "$PROJECT/app/build.gradle" ]; then
            PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          fi
          test -n "$PROJECT" && test -s "$PROJECT/app/build.gradle" || { echo "ERROR: Android project/app/build.gradle was not found after V126 base build."; exit 1; }
          test -s "$PROJECT/app/src/main/assets/index.html" || { echo "ERROR: Android WebView asset index.html is missing."; exit 1; }
          cp "$SRC_DIR/index.html" "$PROJECT/app/src/main/assets/index.html"

          python3 - "$PROJECT/app/build.gradle" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s,nc=re.subn(r'(\bversionCode\s*=?\s*)\d+',r'\g<1>133',s,count=1)
          s,nn=re.subn(r'(\bversionName\s*=?\s*[\'"])[^\'"]+([\'"])',r'\g<1>1.0.133\2',s,count=1)
          if nc!=1 or nn!=1: raise SystemExit(f'ERROR: expected one Gradle versionCode/name, found code={nc}, name={nn}.')
          if not re.search(r'\bversionCode\s*=?\s*133\b',s) or not re.search(r'\bversionName\s*=?\s*[\'"]1\.0\.133[\'"]',s): raise SystemExit('ERROR: Gradle version verification failed.')
          p.write_text(s,encoding='utf-8')
          print('PASS: Gradle versionCode=133 and versionName=1.0.133')
          PY

          grep -Fq 'const SQ_APP_VERSION_CODE = 133;' "$PROJECT/app/src/main/assets/index.html"
          cd "$PROJECT"
          gradle --no-daemon clean assembleRelease --stacktrace
          APK="$PROJECT/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: v1.0.133 release APK was not generated."; find "$PROJECT/app/build/outputs" -type f 2>/dev/null || true; exit 1; }

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "ERROR: Android SDK path is unavailable."; exit 1; }
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "$BUILD_TOOLS" && test -x "$BUILD_TOOLS/apksigner" || { echo "ERROR: apksigner was not found."; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          unzip -p "$APK" assets/index.html > "$RUNNER_TEMP/sq-v133-final-index.html"
          grep -Fq 'SURVEYQUANT_V133_EPHEMERAL_SESSION_PERFORMANCE' "$RUNNER_TEMP/sq-v133-final-index.html"
          grep -Fq 'const SQ_APP_VERSION_CODE = 133;' "$RUNNER_TEMP/sq-v133-final-index.html"
          node "$V133_TEST" "$RUNNER_TEMP/sq-v133-final-index.html"
          node "$V132_TEST" "$RUNNER_TEMP/sq-v133-final-index.html"
          node "$V130_TEST" "$RUNNER_TEMP/sq-v133-final-index.html"

          RELEASE="$RUNNER_TEMP/sq-release"
          cp "$APK" "$RELEASE/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE.apk"
          printf 'PASS: Gradle-built, signed versionCode 133 / versionName 1.0.133. V133 storage/session and redraw tests, plus V130/V132 CAD regressions, passed. Original CAD-preservation workflow and orientation modules were carried forward.\n' > "$RELEASE/V133_BUILD_RESULT.txt"
          sha256sum "$RELEASE/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE.apk" "$V133_SOURCE_PATCH" > "$RELEASE/SHA256SUMS.txt"
          cat "$RELEASE/SHA256SUMS.txt"

      - name: Upload v1.0.133 APK and source patch
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.133-Fresh-Session-Responsive-CAD
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.133_FRESH_SESSION_PERFORMANCE.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.133_FRESH_SESSION_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V133_BUILD_RESULT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics even if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v133-DIAGNOSTICS-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/STORM_CONVERSION_REPORT.md
            ${{ runner.temp }}/sq-storm-output/**
            ${{ runner.temp }}/sq-v133-final-index.html
          if-no-files-found: warn
          retention-days: 14
