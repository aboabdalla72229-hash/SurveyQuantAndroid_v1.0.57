name: Build SurveyQuant v1.0.150 - Session + SPLINE + DWG Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V149 signed APK and source artifact run ID"
        required: true
        type: string
        default: "40183711443"
  push:
    paths:
      - ".github/workflows/build-v150-session-spline-dwg-fix.yml"
      - "SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_PATCH_KIT.zip"

permissions:
  actions: read
  contents: read

jobs:
  build_v150:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40183711443' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Check out workflow and patch kit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned DXF reference oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ezdxf==1.4.4"
          python - <<'PY'
          import ezdxf
          assert ezdxf.__version__ == "1.4.4", ezdxf.__version__
          print("PASS: ezdxf 1.4.4 reference oracle is installed.")
          PY

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android build tools configured."

      - name: Download V149 APK/source and unpack V150 patch kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_PATCH_KIT.zip"
          test -s "$KIT" || { echo "ERROR: Upload SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_PATCH_KIT.zip to repository root."; exit 1; }
          unzip -t "$KIT"
          KIT_DIR="$RUNNER_TEMP/v150-kit"
          BASE_DIR="$RUNNER_TEMP/v150-base"
          SRC_DIR="$RUNNER_TEMP/v150-source"
          RELEASE_DIR="$RUNNER_TEMP/sq-release"
          rm -rf "$KIT_DIR" "$BASE_DIR" "$SRC_DIR" "$RELEASE_DIR"
          mkdir -p "$KIT_DIR" "$BASE_DIR" "$SRC_DIR" "$RELEASE_DIR"
          unzip -q "$KIT" -d "$KIT_DIR"
          for f in \
            SurveyQuant_v1.0.150_APPLY_SESSION_SPLINE_DWG_FIX.py \
            SurveyQuant_v1.0.150_WCS_PREVIEW_AXIS_TEST.js \
            SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_TEST.js \
            SurveyQuant_v1.0.150_RUN_REGRESSION_TESTS.py \
            SurveyQuant_v1.0.150_PACKAGE_APK.py \
            V130_REFERENCE_INDEX.html \
            README_V150_AR.txt; do
            test -s "$KIT_DIR/$f" || { echo "ERROR: required V150 kit file missing: $f"; exit 1; }
          done
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.149-WCS-PREVIEW-AXIS-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.149_WCS_PREVIEW_AXIS_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.149_WCS_PREVIEW_AXIS_FIX_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: signed V149 APK missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V149 source patch missing from run $SOURCE_RUN_ID."; exit 1; }
          unzip -t "$BASE_PATCH"
          unzip -q "$BASE_PATCH" -d "$SRC_DIR"
          test -s "$SRC_DIR/index.html" || { echo "ERROR: V149 source patch did not contain index.html."; exit 1; }
          test -s "$SRC_DIR/libredwg-writer/wasm/libredwg-web.wasm" || { echo "ERROR: base local DWG WASM runtime missing."; exit 1; }
          test -s "$SRC_DIR/libredwg-writer/wasm/libredwg-web.js" || { echo "ERROR: base local DWG JS runtime missing."; exit 1; }
          for f in \
            SurveyQuant_v1.0.148_REGRESSION_TEST.js \
            SurveyQuant_v1.0.148_STABILITY_TEST.js \
            SurveyQuant_v1.0.148_ORIENTATION_PRECISION_TEST.js \
            SurveyQuant_v1.0.148_ALIGNMENT_SAFETY_TEST.js \
            SurveyQuant_v1.0.148_MLEADER_ALIGNMENT_TEST.js \
            SurveyQuant_v1.0.148_3D_OCS_AXIS_TEST.js \
            SurveyQuant_v1.0.148_ALIGNMENT_DXF_DWG_REGRESSION_TEST.js \
            SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js; do
            test -s "$SRC_DIR/$f" || { echo "ERROR: required inherited regression test missing: $f"; exit 1; }
          done
          {
            echo "V150_KIT_DIR=$KIT_DIR"
            echo "V150_BASE_APK=$BASE_APK"
            echo "V150_SOURCE_DIR=$SRC_DIR"
            echo "V150_RELEASE_DIR=$RELEASE_DIR"
          } >> "$GITHUB_ENV"

      - name: Apply V150 session/SPLINE/DWG fixes and run all regression suites
        shell: bash
        run: |
          set -euo pipefail
          K="$V150_KIT_DIR"
          S="$V150_SOURCE_DIR"
          R="$V150_RELEASE_DIR"
          FINAL_HTML="$S/index_v150.html"
          python -m py_compile \
            "$K/SurveyQuant_v1.0.150_APPLY_SESSION_SPLINE_DWG_FIX.py" \
            "$K/SurveyQuant_v1.0.150_PACKAGE_APK.py" \
            "$K/SurveyQuant_v1.0.150_RUN_REGRESSION_TESTS.py"
          node --check "$K/SurveyQuant_v1.0.150_WCS_PREVIEW_AXIS_TEST.js"
          node --check "$K/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_TEST.js"
          python3 "$K/SurveyQuant_v1.0.150_APPLY_SESSION_SPLINE_DWG_FIX.py" \
            --input-html "$S/index.html" \
            --output-html "$FINAL_HTML" \
            --report "$R/V150_PATCH_REPORT.md"
          node "$K/SurveyQuant_v1.0.150_WCS_PREVIEW_AXIS_TEST.js" "$FINAL_HTML"
          node "$K/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_TEST.js" "$FINAL_HTML"
          python3 "$K/SurveyQuant_v1.0.150_RUN_REGRESSION_TESTS.py" \
            --source-dir "$S" \
            --html "$FINAL_HTML" \
            --reference-html "$K/V130_REFERENCE_INDEX.html" \
            --test-dir "$RUNNER_TEMP/v150-regression-tests"
          node --check "$S/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$FINAL_HTML" "$RUNNER_TEMP/v150-inline-js-check" <<'PY'
          import pathlib, re, subprocess, sys
          html_path, out_dir = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          out_dir.mkdir(parents=True, exist_ok=True)
          html=html_path.read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I)
          count=0
          for i,(attrs,body) in enumerate(scripts):
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/ld\+json|importmap)["\']',attrs,re.I): continue
              p=out_dir/f'script_{i}.js';p.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True);count+=1
          if count<8: raise SystemExit(f'Expected at least 8 inline JS blocks, found {count}')
          print(f'PASS V150: {count} inline JavaScript blocks parse.')
          PY
          grep -q 'const SQ_APP_VERSION_CODE = 150;' "$FINAL_HTML"
          grep -q 'function resetOrientationState()' "$FINAL_HTML"
          grep -q 'function prepareSideForReplacement(side)' "$FINAL_HTML"
          grep -q 'window.parseFile = parseFile;' "$FINAL_HTML"
          grep -q 'height:34vh;min-height:200px;max-height:360px' "$FINAL_HTML"
          grep -q "const SQ_PREVIEW_OCS_TYPES = new Set(.*MTEXT" "$FINAL_HTML"
          grep -q "const needsFallbackPreview=needsWcsPreview||needsSplinePreview;" "$FINAL_HTML"
          grep -q 'base.previewSplineFallback=needsSplinePreview;' "$FINAL_HTML"
          grep -q 'await LibreDwg.create(sqDwgWasmRuntimePath())' "$FINAL_HTML"
          if grep -q 'const SQ_APP_VERSION_CODE = 149;' "$FINAL_HTML"; then echo 'ERROR: V150 version constant remains.'; exit 1; fi
          cp "$FINAL_HTML" "$S/index.html"
          rm -f "$S/index_v150.html"
          cp "$K/SurveyQuant_v1.0.150_APPLY_SESSION_SPLINE_DWG_FIX.py" "$S/"
          cp "$K/SurveyQuant_v1.0.150_WCS_PREVIEW_AXIS_TEST.js" "$S/"
          cp "$K/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_TEST.js" "$S/"
          cp "$K/SurveyQuant_v1.0.150_RUN_REGRESSION_TESTS.py" "$S/"
          cp "$K/SurveyQuant_v1.0.150_PACKAGE_APK.py" "$S/"
          cp "$K/README_V150_AR.txt" "$S/"
          cat > "$R/V150_BUILD_RESULT.txt" <<'TXT'
          PASS V150 automated suite: true rational SPLINE sampling; fit-point/isolated-anchor fallback without invented chords; exact two-point similarity mapping from negative source coordinates to reference points; active OCS/WCS and nested INSERT preview; fresh session reset; failed and stale async loads cannot restore an old drawing; canonical shared DWG parser route and explicit errors; 8 inherited regression suites; 24k entity memory test; HATCH, axis-label, MULTILEADER and DXF entity-count/EOF checks; inline JavaScript syntax checks; signed APK manifest/signature verification. The user's original DWG was not supplied; file-specific field validation is still required.
          TXT
          rm -f "$R/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_SOURCE_PATCH.zip"
          (cd "$S" && zip -qr "$R/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_SOURCE_PATCH.zip" .)
          unzip -t "$R/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_SOURCE_PATCH.zip" | tail -2

      - name: Inject tested V150 HTML into V149 APK, sign, and verify
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V150_RELEASE_DIR/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_UNSIGNED.apk"
          ALIGNED="$V150_RELEASE_DIR/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_ALIGNED.apk"
          FINAL="$V150_RELEASE_DIR/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V150_KIT_DIR/SurveyQuant_v1.0.150_PACKAGE_APK.py" \
            --apk-input "$V150_BASE_APK" \
            --apk-output "$RAW" \
            --html-to-inject "$V150_SOURCE_DIR/index.html"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$STORE" \
            --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" \
            --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD \
            --key-pass env:SURVEYQUANT_KEY_PASSWORD \
            --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='150'.*versionName='1.0.150'"
          sha256sum "$FINAL" "$V150_RELEASE_DIR/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_SOURCE_PATCH.zip" > "$V150_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V150_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed V150 APK, tested source, and reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.150-SESSION-SPLINE-DWG-FIX
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V150_BUILD_RESULT.txt
            ${{ runner.temp }}/sq-release/V150_PATCH_REPORT.md
          if-no-files-found: error
          retention-days: 14
