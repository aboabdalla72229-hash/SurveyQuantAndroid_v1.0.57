name: Forensic Inspect SurveyQuant DWG DXF Projection (v133)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-v133-section-records.yml"

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Checkout pinned LibreDWG-Web source
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-web
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate and extract existing V126 to V132 patch tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-yaml unzip zip

          BASE_KIT="SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.zip"
          PATCH_KIT="SurveyQuant_v1.0.129_SELECT_DELETE_UNDO_REDO_PATCH.zip"
          V130_KIT="SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_PATCH.zip"
          V131_KIT="SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.zip"
          for f in "$BASE_KIT" "$PATCH_KIT" "$V130_KIT" "$V131_KIT"; do
            test -s "$f" || { echo "ERROR: Required kit missing: $f"; exit 1; }
            unzip -t "$f"
          done

          KIT_DIR="$RUNNER_TEMP/sq-v126-kit"
          PATCH_DIR="$RUNNER_TEMP/sq-v129-patch"
          V130_DIR="$RUNNER_TEMP/sq-v130-patch"
          V131_DIR="$RUNNER_TEMP/sq-v131-patch"
          V132_DIR="$RUNNER_TEMP/sq-v132-patch"
          mkdir -p "$KIT_DIR" "$PATCH_DIR" "$V130_DIR" "$V131_DIR" "$V132_DIR"
          unzip -q "$BASE_KIT" -d "$KIT_DIR"
          unzip -q "$PATCH_KIT" -d "$PATCH_DIR"
          unzip -q "$V130_KIT" -d "$V130_DIR"
          unzip -q "$V131_KIT" -d "$V131_DIR"

          # Decode the exact V132 patch kit embedded in the current production workflow.
          python3 - <<'PY'
          from pathlib import Path
          import re
          # The production workflow was renamed to this diagnostic workflow.
          # Retrieve its embedded V132 patch kit from the immutable pre-rename commit.
          import subprocess
          old_spec = '2752ea8d483f2b89f3b5a23bfae4b8687f54ebee:.github/workflows/build-v132-cad-original-view-preserve.yml'
          proc = subprocess.run(['git', 'show', old_spec], text=True, capture_output=True)
          if proc.returncode != 0 or not proc.stdout:
              raise SystemExit('Cannot retrieve the embedded V132 patch kit from the pinned production workflow commit: ' + proc.stderr[-1200:])
          lines = proc.stdout.splitlines()
          start = next((i for i, line in enumerate(lines) if "<<'V132_PATCH_KIT_BASE64'" in line), None)
          if start is None:
              raise SystemExit('Embedded V132 patch payload marker was not found.')
          payload = []
          for line in lines[start + 1:]:
              if line.strip() == 'V132_PATCH_KIT_BASE64':
                  break
              value = line.strip()
              if value:
                  payload.append(value)
          else:
              raise SystemExit('Embedded V132 patch payload terminator was not found.')
          import base64
          out = Path('/tmp/v132-kit.zip')
          out.write_bytes(base64.b64decode(''.join(payload), validate=True))
          print(f'Decoded exact V132 patch kit: {out.stat().st_size} bytes')
          PY
          unzip -t /tmp/v132-kit.zip
          unzip -q /tmp/v132-kit.zip -d "$V132_DIR"

          test -s "$KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.128_APPLY_CAD_ZOOM_DWG_PATCH.py"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.129_APPLY_DELETE_UNDO_REDO_PATCH.py"
          test -s "$V130_DIR/SurveyQuant_v1.0.130_APPLY_DWG_AXIS_MULTISELECT_PATCH.py"
          test -s "$V131_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.py"
          test -s "$V132_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_PATCH.py"
          test -s "$V132_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_TEST.js"

          {
            echo "V126_KIT_DIR=$KIT_DIR"
            echo "V128_V129_PATCH_DIR=$PATCH_DIR"
            echo "V130_PATCH_DIR=$V130_DIR"
            echo "V131_PATCH_DIR=$V131_DIR"
            echo "V132_PATCH_DIR=$V132_DIR"
          } >> "$GITHUB_ENV"

      - name: Rebuild the same V126 baseline used by production V132
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          python3 "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk"
          test -s "$RUNNER_TEMP/sq-release/source-patch/index.html"

      - name: Apply the exact V128 to V132 source patches and existing regression tests
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="$RUNNER_TEMP/sq-release/source-patch"
          python3 "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.128_APPLY_CAD_ZOOM_DWG_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js" "$SRC_DIR/index.html"
          python3 "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.129_APPLY_DELETE_UNDO_REDO_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.128_CAD_ZOOM_DWG_REGRESSION_TEST.js" "$SRC_DIR/index.html"
          node "$V128_V129_PATCH_DIR/SurveyQuant_v1.0.129_DELETE_UNDO_REDO_TEST.js" "$SRC_DIR/index.html"
          python3 "$V130_PATCH_DIR/SurveyQuant_v1.0.130_APPLY_DWG_AXIS_MULTISELECT_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V130_PATCH_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js" "$SRC_DIR/index.html"
          python3 "$V131_PATCH_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V131_PATCH_DIR/SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_TEST.js" "$SRC_DIR/index.html"
          python3 "$V132_PATCH_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V132_PATCH_DIR/SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_TEST.js" "$SRC_DIR/index.html"
          node "$V130_PATCH_DIR/SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_TEST.js" "$SRC_DIR/index.html"
          cp "$SRC_DIR/index.html" "$RUNNER_TEMP/surveyquant-v132-postpatch-index.html"

      - name: Capture exact undefined-variable and file-input contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          html = Path(os.environ['RUNNER_TEMP']) / 'surveyquant-v132-postpatch-index.html'
          s = html.read_text(encoding='utf-8', errors='replace')
          out = []
          out.append('SURVEYQUANT V132 POST-PATCH FORENSIC REPORT')
          out.append(f'HTML bytes: {len(s.encode("utf-8"))}')

          hits = list(re.finditer(r'(?<![\w$])sectionRecords(?![\w$])', s))
          decls = list(re.finditer(r'\b(?:const|let|var)\s+sectionRecords\b', s))
          out.append(f'sectionRecords references: {len(hits)}')
          out.append(f'sectionRecords declaration patterns: {len(decls)}')
          for i, m in enumerate(hits[:120], 1):
              a, b = max(0, m.start()-450), min(len(s), m.end()+550)
              context = re.sub(r'\s+', ' ', s[a:b])
              out.append(f'\n--- sectionRecords #{i} at offset {m.start()} ---\n{context}')

          out.append('\n=== FILE INPUT / ACCEPT ATTRIBUTE SNAPSHOT ===')
          found = {}
          patterns = [
              r'<input\b[^>]*>',
              r"""accept\s*[:=]\s*["'][^"']+["']""",
              r'(?:\.dwg|\.dxf|DWG|DXF|fileInput|handleFile|importFile|loadDrawing|projection|إسقاط)'
          ]
          for pat in patterns:
              for m in re.finditer(pat, s, re.I):
                  found[m.start()] = (pat, m.group(0))
          out.append(f'input/import matches: {len(found)}')
          for i, (pos, pair) in enumerate(sorted(found.items())[:180], 1):
              pat, val = pair
              a, b = max(0, pos-160), min(len(s), pos+len(val)+260)
              context = re.sub(r'\s+', ' ', s[a:b])[:850]
              out.append(f'\n--- input/import #{i} at offset {pos} [{pat}] ---\n{context}')

          # All contexts are written verbatim enough for line-level diagnosis, with no file bytes modified.
          report = Path('forensic-v133-sectionRecords.txt')
          report.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f'Report generated: {report} ({report.stat().st_size} bytes)')
          print('sectionRecords references:', len(hits), '| declaration patterns:', len(decls))
          for row in out[2:8]:
              print(row[:1000])
          PY

      - name: Upload forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v133-DWG-DXF-Forensic-Report
          path: forensic-v133-sectionRecords.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish forensic report to repository root
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensic-v133-sectionRecords.txt
          if git diff --cached --quiet; then
            echo "Forensic report is unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Add SurveyQuant DWG DXF projection forensic report"
          git push origin HEAD:main
