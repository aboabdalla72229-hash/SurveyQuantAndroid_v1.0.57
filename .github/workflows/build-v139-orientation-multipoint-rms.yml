name: Build SurveyQuant v1.0.139 - Robust Multi-point Orientation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V138 run with signed APK and source patch"
        required: true
        type: string
        default: "39929199343"
  push:
    paths:
      - ".github/workflows/build-v139-orientation-multipoint-rms.yml"

permissions:
  actions: write
  contents: read

jobs:
  build_v139:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '39929199343' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js regression runner
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager not found."; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android build-tools 35.0.0 are available."

      - name: Write the V139 orientation patcher and regression test
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v139-work"
          mkdir -p "$WORK"
          cat > "$WORK/apply_v139_orientation_patch.py" <<'PY'
          from pathlib import Path
          import re
          ROOT=Path(__file__).parent
          html_path=ROOT/'index.html'
          MULTI_SOLVER = r'''function sqOriSolveMultiple(pairs) {
            const valid=(pairs||[]).filter(m=>m&&m.source&&m.reference&&[m.source.x,m.source.y,m.reference.x,m.reference.y].every(v=>Number.isFinite(Number(v)))).map(m=>({key:String(m.key||''),source:{x:Number(m.source.x),y:Number(m.source.y)},reference:{x:Number(m.reference.x),y:Number(m.reference.y)}}));
            if(valid.length<2)throw new Error('يلزم تقاطعان مشتركان صالحان على الأقل لحساب التوجيه.');
            const extent=points=>{let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const p of points){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);}return Math.hypot(maxX-minX,maxY-minY);};
            const srcDiag=extent(valid.map(m=>m.source)),refDiag=extent(valid.map(m=>m.reference));
            if(!(srcDiag>0)||!(refDiag>0)||!Number.isFinite(srcDiag)||!Number.isFinite(refDiag))throw new Error('تقاطعات المحاور متطابقة أو غير صالحة هندسيًا؛ لا يمكن حساب المقياس.');
            const nearest=valid.map((m,i)=>{let d=Infinity;for(let j=0;j<valid.length;j++){if(i===j)continue;const q=valid[j].reference;d=Math.min(d,Math.hypot(m.reference.x-q.x,m.reference.y-q.y));}return d;}).filter(d=>Number.isFinite(d)&&d>0).sort((a,b)=>a-b);
            const typicalSpacing=nearest.length?nearest[Math.floor(nearest.length/2)]:refDiag;
            const tolerance=Math.max(1e-7,Math.min(refDiag*1e-7,typicalSpacing*1e-5));
            const fromPair=(m1,m2)=>{
              const p=m1.source,q=m2.source,r=m1.reference,z=m2.reference,dx=q.x-p.x,dy=q.y-p.y,ux=z.x-r.x,uy=z.y-r.y,den=dx*dx+dy*dy;
              if(!(den>Math.max(srcDiag*srcDiag*1e-24,1e-28)))return null;
              const aa=(dx*ux+dy*uy)/den,bb=(dx*uy-dy*ux)/den,scale=Math.hypot(aa,bb);
              if(!(scale>0)||!Number.isFinite(scale)||!Number.isFinite(aa)||!Number.isFinite(bb))return null;
              const angle=Math.atan2(bb,aa),tx=r.x-(aa*p.x-bb*p.y),ty=r.y-(bb*p.x+aa*p.y);
              return {scale,angle,angleDeg:angle*180/Math.PI,c:Math.cos(angle),s:Math.sin(angle),tx,ty,point:(x,y)=>({x:aa*x-bb*y+tx,y:bb*x+aa*y+ty}),vector:(x,y)=>({x:aa*x-bb*y,y:bb*x+aa*y})};
            };
            const sampleCount=Math.min(64,valid.length),sample=[];
            if(valid.length<=sampleCount){for(let i=0;i<valid.length;i++)sample.push(i);}
            else for(let i=0;i<sampleCount;i++)sample.push(Math.round(i*(valid.length-1)/(sampleCount-1)));
            let best=null;
            for(let i=0;i<sample.length;i++)for(let j=i+1;j<sample.length;j++){
              const candidate=fromPair(valid[sample[i]],valid[sample[j]]);if(!candidate)continue;
              const residuals=valid.map(m=>{const q=candidate.point(m.source.x,m.source.y);return Math.hypot(q.x-m.reference.x,q.y-m.reference.y);});
              const inliers=[];let sum=0;for(let k=0;k<residuals.length;k++)if(residuals[k]<=tolerance){inliers.push(k);sum+=residuals[k]*residuals[k];}
              if(!best||inliers.length>best.inliers.length||(inliers.length===best.inliers.length&&sum<best.sum))best={inliers,sum};
            }
            if(!best||best.inliers.length<2)throw new Error('لم تتفق تقاطعات المحاور على تحويل هندسي واحد. راجع تسميات المحاور أو حدد نقطتين يدويًا.');
            const fit=indices=>{
              let mx=0,my=0,mrx=0,mry=0;for(const i of indices){mx+=valid[i].source.x;my+=valid[i].source.y;mrx+=valid[i].reference.x;mry+=valid[i].reference.y;}const n=indices.length;mx/=n;my/=n;mrx/=n;mry/=n;
              let A=0,B=0,D=0;for(const i of indices){const x=valid[i].source.x-mx,y=valid[i].source.y-my,u=valid[i].reference.x-mrx,v=valid[i].reference.y-mry;A+=x*u+y*v;B+=x*v-y*u;D+=x*x+y*y;}
              if(!(D>Math.max(srcDiag*srcDiag*1e-24,1e-28)))throw new Error('النقاط المشتركة لا توفر امتدادًا هندسيًا كافيًا لضبط الدوران والمقياس.');
              const aa=A/D,bb=B/D,scale=Math.hypot(aa,bb);if(!(scale>0)||!Number.isFinite(scale)||!Number.isFinite(aa)||!Number.isFinite(bb))throw new Error('تعذر حساب مقياس موجب وصالح من نقاط المحاور.');
              const angle=Math.atan2(bb,aa),tx=mrx-(aa*mx-bb*my),ty=mry-(bb*mx+aa*my);
              return {scale,angle,angleDeg:angle*180/Math.PI,c:Math.cos(angle),s:Math.sin(angle),tx,ty,point:(x,y)=>({x:aa*x-bb*y+tx,y:bb*x+aa*y+ty}),vector:(x,y)=>({x:aa*x-bb*y,y:bb*x+aa*y})};
            };
            let inliers=best.inliers,transform=null;
            for(let pass=0;pass<4;pass++){
              transform=fit(inliers);const next=[];
              for(let i=0;i<valid.length;i++){const q=transform.point(valid[i].source.x,valid[i].source.y);if(Math.hypot(q.x-valid[i].reference.x,q.y-valid[i].reference.y)<=tolerance)next.push(i);}
              if(next.length<2)break;const same=next.length===inliers.length&&next.every((v,i)=>v===inliers[i]);inliers=next;if(same)break;
            }
            transform=fit(inliers);
            const residuals=valid.map(m=>{const q=transform.point(m.source.x,m.source.y),error=Math.hypot(q.x-m.reference.x,q.y-m.reference.y);return {key:m.key,error,inlier:error<=tolerance};});
            inliers=residuals.map((r,i)=>r.inlier?i:-1).filter(i=>i>=0);
            if(valid.length>=3&&inliers.length<Math.max(3,Math.ceil(valid.length*0.6)))throw new Error('فشل التحقق متعدد النقاط: المتوافق '+inliers.length+' من '+valid.length+' تقاطعًا فقط. لن نصدر تحويلًا غير موثوق؛ صحح تسميات المحاور أو اختر نقطتين متناظرتين يدويًا.');
            if(inliers.length<2)throw new Error('فشل التحقق من تقاطعات المحاور.');
            const good=residuals.filter(r=>r.inlier),squared=good.reduce((sum,r)=>sum+r.error*r.error,0),rms=Math.sqrt(squared/good.length),maxResidual=Math.max(...good.map(r=>r.error));
            return {...transform,inlierCount:inliers.length,matchedCount:valid.length,excludedCount:valid.length-inliers.length,rms,maxResidual,tolerance,residuals};
          }'''
          solver=MULTI_SOLVER
          s=html_path.read_text(encoding='utf-8')
          def once(old,new,label):
           global s
           c=s.count(old)
           if c!=1: raise SystemExit(f'{label}: expected one match, got {c}')
           s=s.replace(old,new,1)
          old_calc="function calculation(){if(!state.target||!state.reference)throw new Error('افتح اللوحة غير الموجّهة واللوحة المرجعية أولًا.');if(!state.targetPoints[0]||!state.targetPoints[1])throw new Error('حدد النقطتين 1 و2 في اللوحة غير الموجّهة.');if(!state.referencePoints[0]||!state.referencePoints[1])throw new Error('حدد النقطتين 1 و2 في اللوحة المرجعية، بالترتيب نفسه.');return solve(state.targetPoints[0],state.targetPoints[1],state.referencePoints[0],state.referencePoints[1]);}"
          new_calc="function calculation(){if(!state.target||!state.reference)throw new Error('افتح اللوحة غير الموجّهة واللوحة المرجعية أولًا.');if(Array.isArray(state.axisMatches)&&state.axisMatches.length>=2)return sqOriSolveMultiple(state.axisMatches);if(!state.targetPoints[0]||!state.targetPoints[1])throw new Error('حدد النقطتين 1 و2 في اللوحة غير الموجّهة.');if(!state.referencePoints[0]||!state.referencePoints[1])throw new Error('حدد النقطتين 1 و2 في اللوحة المرجعية، بالترتيب نفسه.');return solve(state.targetPoints[0],state.targetPoints[1],state.referencePoints[0],state.referencePoints[1]);}"
          once(old_calc,solver+'\n'+new_calc,'active calculation')
          # Report only residuals that passed the robust fit; rejected matches stay visible in the diagnostics.
          pattern=re.compile(r"  const errors=state\.axisMatches\.map\(m=>\{const q=t\.point\(m\.source\.x,m\.source\.y\);return \{key:m\.key,value:Math\.hypot\(q\.x-m\.reference\.x,q\.y-m\.reference\.y\)\};\}\);\n  const rms=.*?\n  const max=.*?\n  showScreen\('target'\);\n  status\('تمت قراءة المحاور آليًا: .*?\n  return \{matched,t,rms,max\};",re.S)
          new_status="""  const good=(t.residuals||[]).filter(e=>e.inlier),rms=t.rms??Math.sqrt(good.reduce((sum,e)=>sum+e.error*e.error,0)/Math.max(1,good.length)),max=t.maxResidual??Math.max(0,...good.map(e=>e.error));
            showScreen('target');
            status('تمت قراءة المحاور: '+matched.matches.length+' تقاطعًا. حل متعدد النقاط استخدم '+(t.inlierCount||matched.matches.length)+'/'+(t.matchedCount||matched.matches.length)+' تقاطعًا متوافقًا'+(t.excludedCount?' واستبعد '+t.excludedCount+' مطابقة شاذة':'')+'. معامل المقياس ×'+t.scale.toPrecision(12)+' | الدوران '+t.angleDeg.toFixed(10)+'° | الإزاحة X '+t.tx.toPrecision(12)+' ، Y '+t.ty.toPrecision(12)+' | RMS '+rms.toPrecision(10)+' | أقصى انحراف متوافق '+max.toPrecision(10)+' بوحدات الرسم. راجع نتيجة التحقق قبل الإخراج.',false);
            return {matched,t,rms,max};"""
          s,n=pattern.subn(new_status,s,count=1)
          if n!=1: raise SystemExit(f'axis status block: expected one match, got {n}')
          # The preview must display the same diagnostics as export, not silently claim a two-point-only review.
          review_pattern=re.compile(r"function review\(\)\{try\{const t=calculation\(\);.*?\}catch\(e\)\{status\(e\.message,true\);return null;\}\}")
          new_review="function review(){try{const t=calculation();let diagnostic='';if(Array.isArray(t.residuals)&&t.residuals.length){const good=t.residuals.filter(e=>e.inlier),rms=t.rms??Math.sqrt(good.reduce((s,e)=>s+e.error*e.error,0)/Math.max(1,good.length)),mx=t.maxResidual??Math.max(0,...good.map(e=>e.error));diagnostic=' | تقاطعات متوافقة '+good.length+'/'+t.residuals.length+' | RMS '+rms.toPrecision(10)+' | أقصى انحراف متوافق '+mx.toPrecision(10)+' | مستبعد '+(t.excludedCount||0);}status('المعاينة جاهزة: معامل المقياس ×'+t.scale.toPrecision(12)+' | الدوران '+t.angleDeg.toFixed(10)+'° | الإزاحة X '+t.tx.toPrecision(12)+' ، Y '+t.ty.toPrecision(12)+' | X=Easting وY=Northing دون تبديل.'+diagnostic);return t;}catch(e){status(e.message,true);return null;}}"
          s,n=review_pattern.subn(new_review,s,count=1)
          if n!=1: raise SystemExit(f'preview review: expected one match, got {n}')
          # The hand-edited point-table values invalidate the automatic fit and fall back to exactly the entered pairs.
          if "const pts=side==='target'?state.targetPoints:state.referencePoints;state.axisMatches=[];pts[i]={...(pts[i]||{}),x,y,kind:'إحداثيات معدلة يدويًا'};const v=state.views[side];" not in s:
           once("const pts=side==='target'?state.targetPoints:state.referencePoints;pts[i]={...(pts[i]||{}),x,y,kind:'إحداثيات معدلة يدويًا'};const v=state.views[side];","const pts=side==='target'?state.targetPoints:state.referencePoints;state.axisMatches=[];pts[i]={...(pts[i]||{}),x,y,kind:'إحداثيات معدلة يدويًا'};const v=state.views[side];",'clear cached auto-fit after manual edits')
          # XLINE/RAY code 11/21 is a direction vector, not a second endpoint. Do not fabricate a base-to-vector segment for selection/highlighting.
          once(" if(t==='LINE'){add(pointAt(rec,10));add(pointAt(rec,11));if(pts.length>=2)segments.push({a:pts[0],b:pts[1]});return {pts,segments};}"," if(t==='XLINE'||t==='RAY'){const base=pointAt(rec,10);if(base)add(base);return {pts,segments};}\n if(t==='LINE'){add(pointAt(rec,10));add(pointAt(rec,11));if(pts.length>=2)segments.push({a:pts[0],b:pts[1]});return {pts,segments};}",'avoid false segment from infinite line direction')
          # Postconditions.
          for n in ["function sqOriSolveMultiple(pairs)","return sqOriSolveMultiple(state.axisMatches)","state.axisMatches=[];pts[i]={","if(t==='XLINE'||t==='RAY'){const base=pointAt(rec,10)","تقاطعات متوافقة"]:
           if n not in s: raise SystemExit('postcondition failed: '+n)
          html_path.write_text(s,encoding='utf-8')
          print('PASS V139: active multi-point fit + outlier rejection + RMS report + manual reset + XLINE/RAY entity-picking fix')
          print('HTML bytes:',html_path.stat().st_size)
          PY
          cat > "$WORK/test_v139.js" <<'JS'
          'use strict';
          const fs = require('node:fs');
          const vm = require('node:vm');
          const htmlPath = process.argv[2] || '/mnt/data/v139source/index.html';
          const html = fs.readFileSync(htmlPath,'utf8');
          const match = html.match(/function sqOriSolveMultiple\(pairs\) \{[\s\S]*?\n\}/);
          if (!match) throw new Error('solver missing');
          const ctx = { Math, Number, Error, Array };
          vm.createContext(ctx);
          vm.runInContext(match[0] + ';this.__solve=sqOriSolveMultiple;',ctx);
          const solve = ctx.__solve;
          const transform=(x,y)=>({x:-100-2*y,y:300+2*x});
          const points=[[0,0],[10,0],[0,10],[10,10],[20,15]].map(([x,y],i)=>({key:'P'+i,source:{x,y},reference:transform(x,y)}));
          const r=solve(points);
          for(const [k,want] of [['scale',2],['angleDeg',90],['tx',-100],['ty',300]]) if(Math.abs(r[k]-want)>1e-8)throw new Error(k+' mismatch '+r[k]);
          if(r.inlierCount!==5||r.excludedCount!==0||r.rms>1e-8)throw new Error('clean fit residual validation failed '+JSON.stringify({inliers:r.inlierCount,excluded:r.excludedCount,rms:r.rms}));
          const outlier=solve(points.concat([{key:'BAD',source:{x:30,y:20},reference:{x:-1140,y:1360}}]));
          if(outlier.inlierCount!==5||outlier.excludedCount!==1)throw new Error('outlier was not rejected '+JSON.stringify({inliers:outlier.inlierCount,excluded:outlier.excludedCount}));
          const q=outlier.point(20,15);if(Math.hypot(q.x-transform(20,15).x,q.y-transform(20,15).y)>1e-8)throw new Error('fit distorted by outlier');
          // Reject poor correspondence sets rather than outputting an arbitrary transformation.
          let rejected=false;try{solve(points.concat([{key:'BAD1',source:{x:30,y:20},reference:{x:8000,y:3000}},{key:'BAD2',source:{x:40,y:15},reference:{x:-3400,y:-9400}},{key:'BAD3',source:{x:50,y:9},reference:{x:10000,y:-500}},{key:'BAD4',source:{x:60,y:4},reference:{x:-18000,y:11000}}]));}catch(e){rejected=/فشل التحقق متعدد النقاط|لم تتفق تقاطعات/.test(e.message);}
          if(!rejected)throw new Error('inconsistent matching set should be rejected');
          if(!html.includes('return sqOriSolveMultiple(state.axisMatches)'))throw new Error('active calculation is not using the multipoint solution');
          if(!html.includes("if(t==='XLINE'||t==='RAY'){const base=pointAt(rec,10);if(base)add(base);return {pts,segments};}"))throw new Error('XLINE/RAY false-segment guard missing');
          console.log('PASS: exact translation/rotation/scale with negative reference X');
          console.log('PASS: five consistent intersections yield negligible RMS');
          console.log('PASS: one outlier rejected without distorting fitted transform');
          console.log('PASS: inconsistent multi-point correspondences fail closed');
          console.log('PASS: active calculation uses multipoint solver and XLINE/RAY picker fix is present');
          JS
          python -m py_compile "$WORK/apply_v139_orientation_patch.py"
          node --check "$WORK/test_v139.js"
          echo "V139_WORK=$WORK" >> "$GITHUB_ENV"

      - name: Download the proven V138 signed APK and source patch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID" || { echo "ERROR: missing V138 source run id."; exit 1; }
          ROOT="$RUNNER_TEMP/v138-base"
          mkdir -p "$ROOT"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.138-ORIENTATION-RESTORED-AXES-SCALE" --dir "$ROOT"
          APK="$(find "$ROOT" -type f -name 'SurveyQuant_v1.0.138_ORIENTATION_RESTORED_AXES_SCALE.apk' -print -quit)"
          SOURCE_PATCH="$(find "$ROOT" -type f -name 'SurveyQuant_v1.0.138_ORIENTATION_RESTORED_SOURCE_PATCH.zip' -print -quit)"
          test -s "$APK" || { echo "ERROR: V138 signed APK not found in run $SOURCE_RUN_ID."; exit 1; }
          test -s "$SOURCE_PATCH" || { echo "ERROR: V138 source patch ZIP not found in run $SOURCE_RUN_ID."; exit 1; }
          mkdir -p "$RUNNER_TEMP/v139-source"
          unzip -t "$SOURCE_PATCH"
          unzip -q "$SOURCE_PATCH" -d "$RUNNER_TEMP/v139-source"
          cp "$V139_WORK/apply_v139_orientation_patch.py" "$RUNNER_TEMP/v139-source/"
          cp "$V139_WORK/test_v139.js" "$RUNNER_TEMP/v139-source/"
          echo "V138_APK=$APK" >> "$GITHUB_ENV"
          echo "V139_SOURCE_DIR=$RUNNER_TEMP/v139-source" >> "$GITHUB_ENV"
          echo "PASS: fetched the signed V138 APK and complete source bundle."

      - name: Apply V139 multi-point fit and run engineering regression checks
        shell: bash
        run: |
          set -euo pipefail
          python "$V139_SOURCE_DIR/apply_v139_orientation_patch.py"
          python - "$V139_SOURCE_DIR/index.html" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          old='const SQ_APP_VERSION_CODE = 138;'; new='const SQ_APP_VERSION_CODE = 139;'
          if s.count(old)!=1: raise SystemExit(f'ERROR: expected exactly one V138 app version constant, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          if p.read_text(encoding='utf-8').count(new)!=1: raise SystemExit('ERROR: embedded app version code is not 139')
          print('PASS: embedded app update gate advanced to versionCode 139.')
          PY
          node "$V139_SOURCE_DIR/test_v139.js" "$V139_SOURCE_DIR/index.html"
          python - "$V139_SOURCE_DIR/index.html" <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          assert text.count('const SQ_APP_VERSION_CODE = 139;')==1
          blocks=re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',text,re.I)
          with tempfile.TemporaryDirectory() as d:
              n=0
              for i,src in enumerate(blocks):
                  if not src.strip(): continue
                  f=Path(d)/f'{i}.js'; f.write_text(src,encoding='utf-8')
                  check=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if check.returncode: raise SystemExit(f'Inline JS syntax failure in block {i}: {check.stderr}')
                  n+=1
          print(f'PASS: all {n} inline JavaScript blocks pass node --check.')
          PY
          cat > "$V139_SOURCE_DIR/README_V139_AR.txt" <<'TXT'
          SurveyQuant v1.0.139 | إصلاح التوجيه متعدد نقاط المحاور
          
          التوجيه الآلي يحسب التحويل من تقاطعات المحاور المتوافقة بدل الاعتماد على أول نقطتين فقط. يستخدم مقياسًا موحدًا ودورانًا وإزاحة X/Y، ويستبعد المطابقات الشاذة ويعرض RMS وأقصى انحراف وعدد النقاط المستخدمة والمستبعدة. إذا لم تتفق نقاط التحقق بالقدر الكافي يرفض الحل الآلي بدل إخراج توجيه غير موثوق.
          
          يحافظ التوجيه على X=Easting وY=Northing. الإحداثي السالب ليس خطأ تلقائيًا، ولا يجري قلب المحاور لإخفائه. يعالج التصحيح أيضًا رسم/تحديد XLINE وRAY ككيانات ذات متجه اتجاه لا كقطعة خط مزيفة. تعديل الإحداثيات اليدوي يلغي نتائج الملاءمة الآلية القديمة.
          
          الاختبارات المنفذة: دوران 90 درجة، مقياس 2، الإزاحة حتى مع X مرجعي سالب، خمس تقاطعات متوافقة، استبعاد مطابقة شاذة، ورفض نقاط متضاربة؛ بالإضافة إلى فحص صياغة JavaScript.
          
          تنبيه: اختبارات الانحدار حسابية وليست اعتمادًا على ملفات تنفيذ فعلية. تحقق من RMS وأقصى انحراف على نسخة من لوحة حقيقية وبنقاط فحص مستقلة قبل استخدام المخرجات في التنفيذ المساحي.
          TXT
          cp "$V139_SOURCE_DIR/README_V139_AR.txt" "$RUNNER_TEMP/README_V139_AR.txt"
          (
            cd "$V139_SOURCE_DIR"
            zip -qr "$RUNNER_TEMP/SurveyQuant_v1.0.139_ORIENTATION_MULTIPOINT_PATCH.zip" .
          )
          unzip -t "$RUNNER_TEMP/SurveyQuant_v1.0.139_ORIENTATION_MULTIPOINT_PATCH.zip"
          echo "PASS: V139 source patch ZIP created and validated."

      - name: Package APK with V139 HTML and manifest version
        shell: bash
        run: |
          set -euo pipefail
          python - "$V138_APK" "$V139_SOURCE_DIR" "$RUNNER_TEMP/SurveyQuant_v1.0.139_UNSIGNED.apk" <<'PY'
          import copy, importlib.util, sys, zipfile
          from pathlib import Path
          src_apk=Path(sys.argv[1]); src_dir=Path(sys.argv[2]); out=Path(sys.argv[3])
          helper_path=src_dir/'SurveyQuant_v1.0.138_ORIENTATION_RESTORE_PATCH.py'
          if not helper_path.is_file(): raise SystemExit('ERROR: V138 binary-manifest helper missing from source bundle.')
          spec=importlib.util.spec_from_file_location('v138_manifest_helper',helper_path)
          helper=importlib.util.module_from_spec(spec); sys.modules[spec.name]=helper; spec.loader.exec_module(helper)
          helper.OLD_APP_VERSION_NAME='1.0.138'
          helper.TARGET_APP_VERSION_CODE=139
          helper.TARGET_APP_VERSION_NAME='1.0.139'
          html=(src_dir/'index.html').read_bytes()
          seen=set()
          with zipfile.ZipFile(src_apk,'r') as zin, zipfile.ZipFile(out,'w',allowZip64=True) as zout:
              names=zin.namelist()
              if names.count('assets/index.html')!=1 or names.count('AndroidManifest.xml')!=1: raise SystemExit('ERROR: V138 APK is missing unique HTML or AndroidManifest entries.')
              for info in zin.infolist():
                  name=info.filename
                  if name in seen: raise SystemExit('ERROR: duplicate APK ZIP entry: '+name)
                  seen.add(name)
                  upper=name.upper()
                  if upper.startswith('META-INF/') and (upper.endswith('.SF') or upper.endswith('.RSA') or upper.endswith('.DSA') or upper.endswith('.EC') or upper.endswith('MANIFEST.MF')): continue
                  data=zin.read(name)
                  if name=='assets/index.html': data=html
                  elif name=='AndroidManifest.xml': data=helper.patch_binary_manifest(data,version_code=139,version_name='1.0.139')
                  clone=copy.copy(info)
                  zout.writestr(clone,data)
          with zipfile.ZipFile(out,'r') as check:
              assert check.read('assets/index.html')==html
              assert 'assets/libredwg-writer/wasm/libredwg-web.wasm' in check.namelist()
              assert helper.patch_binary_manifest(check.read('AndroidManifest.xml'),version_code=139,version_name='1.0.139')
          print('PASS: APK payload updated without replacing the DWG/WASM assets or source drawing data.')
          PY
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/SurveyQuant_v1.0.139_UNSIGNED.apk" | grep -E "package: name=.*versionCode='139'.*versionName='1.0.139'"
          unzip -p "$RUNNER_TEMP/SurveyQuant_v1.0.139_UNSIGNED.apk" assets/index.html | grep -F 'const SQ_APP_VERSION_CODE = 139;' >/dev/null
          echo "PASS: unsigned APK has versionCode 139 and versionName 1.0.139."

      - name: Align and sign the V139 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: SURVEYQUANT_KEY_ALIAS is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEY_PASSWORD is empty."; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$RUNNER_TEMP/SurveyQuant_v1.0.139_ALIGNED.apk"
          FINAL="$RUNNER_TEMP/SurveyQuant_v1.0.139_ORIENTATION_MULTIPOINT.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/SurveyQuant_v1.0.139_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='139'.*versionName='1.0.139'"
          sha256sum "$FINAL" "$RUNNER_TEMP/SurveyQuant_v1.0.139_ORIENTATION_MULTIPOINT_PATCH.zip" > "$RUNNER_TEMP/SHA256SUMS_V139.txt"
          printf '%s\n' 'V139 PASS: build completed after multipoint orientation regression tests, APK manifest validation, zipalign, and apksigner verification. Real-world drawing validation is still required.' > "$RUNNER_TEMP/V139_BUILD_RESULT.txt"
          cat "$RUNNER_TEMP/SHA256SUMS_V139.txt"

      - name: Upload signed APK and source patch
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.139-ORIENTATION-MULTIPOINT-RMS
          path: |
            ${{ runner.temp }}/SurveyQuant_v1.0.139_ORIENTATION_MULTIPOINT.apk
            ${{ runner.temp }}/SurveyQuant_v1.0.139_ORIENTATION_MULTIPOINT_PATCH.zip
            ${{ runner.temp }}/README_V139_AR.txt
            ${{ runner.temp }}/V139_BUILD_RESULT.txt
            ${{ runner.temp }}/SHA256SUMS_V139.txt
          if-no-files-found: error
          retention-days: 14
