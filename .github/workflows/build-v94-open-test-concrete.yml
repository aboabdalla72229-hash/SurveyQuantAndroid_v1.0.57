      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract v1.0.93 source and existing protected patch
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_NAME" || { echo "ERROR: Missing $SOURCE_NAME in the repository root."; exit 1; }
          test -s "$BASE_PATCH_NAME" || { echo "ERROR: Missing $BASE_PATCH_NAME in the repository root."; exit 1; }
          test -s "$CONCRETE_PATCH_NAME" || { echo "ERROR: Built-in concrete patch was not prepared."; exit 1; }
          test -s "$OPEN_TEST_PATCH_NAME" || { echo "ERROR: Built-in open-test patch was not prepared."; exit 1; }
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-base-patch"
          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$BASE_PATCH_NAME" -d "$RUNNER_TEMP/sq-base-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-base-patch" -type f -name 'index.html' -print -quit)"
          test -n "$PROJECT" && test -d "$PROJECT" || { echo "ERROR: Android project not found in the v1.0.93 source ZIP."; exit 1; }
          test -n "$PATCH_INDEX" && test -s "$PATCH_INDEX" || { echo "ERROR: Existing v1.0.93 index.html patch not found."; exit 1; }
          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/build.gradle"
          test -s "$PROJECT/app/src/main/AndroidManifest.xml"
          mkdir -p "$PROJECT/app/src/main/assets"
          cp "$PATCH_INDEX" "$PROJECT/app/src/main/assets/index.html"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Base v1.0.93 patch applied."

      - name: Inject concrete-only additions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$CONCRETE_PATCH_NAME" <<'PY'
          from pathlib import Path
          import sys

          html_path = Path(sys.argv[1])
          patch_path = Path(sys.argv[2])
          html = html_path.read_text(encoding="utf-8")
          patch = patch_path.read_text(encoding="utf-8")

          required = [
              'id="concreteDxfInput"',
              'id="concreteMainLayer"',
              'id="concreteAdjustLayer"',
              'id="concreteResults"',
              'function parseDXF',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("ERROR: Expected concrete-project components are missing: " + ", ".join(missing))
          if "</body>" not in html:
              raise SystemExit("ERROR: Cannot safely insert concrete patch because </body> was not found.")
          if "SurveyQuant v1.0.94 additive concrete-quantity patch" in html:
              raise SystemExit("ERROR: Concrete patch already appears to be injected.")

          injection = "\n<script>\n" + patch + "\n</script>\n"
          html = html.replace("</body>", injection + "</body>", 1)
          html_path.write_text(html, encoding="utf-8")
          print("Concrete patch injected at the end of the app page; shared parser and other projects are unchanged.")
          PY

      - name: Enable temporary open-test mode (this APK only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$OPEN_TEST_PATCH_NAME" <<'PY'
          from pathlib import Path
          import sys
          html_path = Path(sys.argv[1])
          patch_path = Path(sys.argv[2])
          html = html_path.read_text(encoding="utf-8")
          patch = patch_path.read_text(encoding="utf-8")
          marker = "window.SURVEYQUANT_OPEN_TEST_MODE = true;"
          if marker in html:
              raise SystemExit("ERROR: Open-test mode already exists in index.html.")
          for item in ("function sqApi", "function checkSurveySubscription"):
              if item not in html:
                  raise SystemExit("ERROR: Missing expected subscription function: " + item)
          if "</body>" not in html:
              raise SystemExit("ERROR: </body> not found; refusing unsafe injection.")
          html = html.replace("</body>", "\n<script>\n" + patch + "\n</script>\n</body>", 1)
          html_path.write_text(html, encoding="utf-8")
          print("Open-test mode added to this app build only; backend settings were not changed.")
          PY

      - name: Verify current version and preserved app services
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Eq 'versionCode[[:space:]]+93([^0-9]|$)' "$GRADLE_FILE" || { echo "ERROR: Expected source versionCode 93 before bump."; exit 1; }
          grep -Eq "versionName[[:space:]]+['\"]1\\.0\\.93['\"]" "$GRADLE_FILE" || { echo "ERROR: Expected source versionName 1.0.93 before bump."; exit 1; }
          grep -Fq 'minimumVersionCode' "$INDEX" || { echo "ERROR: Forced-update check missing."; exit 1; }
          grep -Fq 'transformOriginalDxfPreservingDetails' "$INDEX" || { echo "ERROR: Existing DXF preservation function missing."; exit 1; }
          grep -Fq 'orientationIntersections' "$INDEX" || { echo "ERROR: Existing orientation features missing."; exit 1; }
          for card in project1Card orientationCard profileCard roadCard pipeCard landAreaCard dropFilesCard; do grep -Fq "id=\"$card\"" "$INDEX" || { echo "ERROR: Existing project card $card missing."; exit 1; }; done
          grep -Fq 'kashier/create-session' "$INDEX" || { echo "ERROR: Kashier session integration missing."; exit 1; }
          grep -Fq 'kashier/status' "$INDEX" || { echo "ERROR: Kashier status integration missing."; exit 1; }
          grep -Fq 'SURVEYQUANT_OPEN_TEST_MODE = true' "$INDEX" || { echo "ERROR: Open-test mode was not injected."; exit 1; }
          grep -Fq 'نسخة اختبار مفتوحة' "$INDEX" || { echo "ERROR: Open-test notice is missing."; exit 1; }
          grep -Fq 'sqConcreteTopLevel' "$INDEX" || { echo "ERROR: Top concrete input missing."; exit 1; }
          grep -Fq 'downloadConcrete3DDXF' "$INDEX" || { echo "ERROR: 3D DXF export missing."; exit 1; }
          grep -Fq 'dxfPolylineRecords' "$INDEX" || { echo "ERROR: DXF polyline closure recovery missing."; exit 1; }
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png"
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_background.png"
          cmp -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png" || { echo "ERROR: Logo assets differ."; exit 1; }
          echo "Version 93 base, payment integration, logo, background, concrete patch and open-test mode verified."

      - name: Set app version to 1.0.94 OPEN TEST
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s, n_code = re.subn(r'(?m)(\bversionCode\s+)93\b', r'\g<1>94', s, count=1)
          s, n_name = re.subn(r'(?m)(\bversionName\s+)(["\'])1\.0\.93\2', "\\g<1>'1.0.94'", s, count=1)
          if n_code != 1 or n_name != 1:
              raise SystemExit(f"ERROR: Could not safely bump version: versionCode edits={n_code}, versionName edits={n_name}")
          p.write_text(s, encoding="utf-8")
          print("Set versionCode=94 and versionName=1.0.94")
          PY
          grep -Eq 'versionCode[[:space:]]+94([^0-9]|$)' "$PROJECT_DIR/app/build.gradle"
          grep -Eq "versionName[[:space:]]+['\"]1\\.0\\.94['\"]" "$PROJECT_DIR/app/build.gradle"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re, sys
          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("ERROR: No inline scripts found.")
          Path(sys.argv[2]).write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD"
          test -n "$SURVEYQUANT_KEY_ALIAS"
          test -n "$SURVEYQUANT_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease --stacktrace
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: Release APK was not generated."; find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true; exit 1; }
          mkdir -p "$RUNNER_TEMP/sq-release"
          cp "$APK" "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.94_OPEN_TEST_CONCRETE_2D_3D.apk"
          sha256sum "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.94_OPEN_TEST_CONCRETE_2D_3D.apk"

      - name: Upload OPEN-TEST APK only (no source ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.94-OPEN-TEST-APK-ONLY
          path: ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.94_OPEN_TEST_CONCRETE_2D_3D.apk
          if-no-files-found: error
          retention-days: 14
