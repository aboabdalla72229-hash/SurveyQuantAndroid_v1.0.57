name: Build SurveyQuant v1.0.155 Native DWG Alignment

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V154 base APK/source artifact run ID"
        required: true
        type: string
        default: "40284521021"
  push:
    paths:
      - ".github/workflows/build-v155-alignment-native-dwg.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v155-alignment-native-dwg
  cancel-in-progress: false

jobs:
  build_v155:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40284521021' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install LibreDWG build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config zlib1g-dev libpcre2-dev libreadline-dev flex bison gettext perl git python3 zip unzip

      - name: Activate Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: "emsdk-cache"

      - name: Check the source kit, Alignment logic and HTML scripts
        shell: bash
        run: |
          set -euo pipefail
          KIT="$GITHUB_WORKSPACE/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_SOURCE_KIT.zip"
          test -s "$KIT" || { echo "ERROR: Upload SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_SOURCE_KIT.zip to the repository root first."; exit 1; }
          unzip -t "$KIT" | tail -2
          KIT_DIR="$RUNNER_TEMP/v155-kit"
          mkdir -p "$KIT_DIR"
          unzip -q "$KIT" -d "$KIT_DIR"
          HTML="$KIT_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG.html"
          SCRIPTS="$KIT_DIR/scripts"
          test -s "$HTML"
          bash -n "$SCRIPTS/SurveyQuant_v1.0.155_BUILD_LIBREDWG.sh"
          python3 "$SCRIPTS/SurveyQuant_v1.0.155_BUILD_SCRIPT_TEST.py"
          python3 -m py_compile "$SCRIPTS/SurveyQuant_v1.0.155_PACKAGE_APK.py"
          node --check "$SCRIPTS/SurveyQuant_v1.0.155_ALIGNMENT_CORE.js"
          node --check "$SCRIPTS/SurveyQuant_v1.0.155_ALIGNMENT_COMMAND.js"
          node --check "$SCRIPTS/SurveyQuant_v1.0.155_ALIGNMENT_TEST.js"
          node --check "$SCRIPTS/SurveyQuant_v1.0.155_DWG_CORPUS_TEST.mjs"
          SQ_V155_HTML="$HTML" node "$SCRIPTS/SurveyQuant_v1.0.155_ALIGNMENT_TEST.js"
          python3 - "$HTML" "$RUNNER_TEMP/v155-inline-js" <<'PY'
          import pathlib,re,subprocess,sys
          html_path,out_dir=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2])
          out_dir.mkdir(parents=True,exist_ok=True)
          html=html_path.read_text(encoding='utf-8')
          blocks=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I)
          checked=0
          for i,(attrs,body) in enumerate(blocks):
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/ld\+json|importmap)["\']',attrs,re.I):
                  continue
              f=out_dir/f'script_{i}.js'
              f.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
              checked+=1
          if checked<3: raise SystemExit(f'Expected >=3 executable inline JS blocks; got {checked}')
          print(f'PASS: {checked} inline JS blocks parse')
          PY
          echo "V155_KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"

      - name: Download successful V154 signed base APK and full source patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v154-base"
          SOURCE_DIR="$RUNNER_TEMP/v155-source"
          RELEASE_DIR="$RUNNER_TEMP/v155-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.154-ALIGNMENT-DWG-FIX-REMOVE-CONCRETE" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.154_ALIGNMENT_DWG_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.154_ALIGNMENT_DWG_FIX_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V154 base APK missing from workflow run $SOURCE_RUN_ID."; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V154 source patch missing from workflow run $SOURCE_RUN_ID."; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          cp "$V155_KIT_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG.html" "$SOURCE_DIR/index.html"
          cp "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_ALIGNMENT_CORE.js" "$SOURCE_DIR/"
          cp "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_ALIGNMENT_COMMAND.js" "$SOURCE_DIR/"
          cp "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_ALIGNMENT_TEST.js" "$SOURCE_DIR/"
          cp "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_DWG_CORPUS_TEST.mjs" "$SOURCE_DIR/"
          cp "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_BUILD_LIBREDWG.sh" "$SOURCE_DIR/"
          cp "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_BUILD_SCRIPT_TEST.py" "$SOURCE_DIR/"
          cp "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_PACKAGE_APK.py" "$SOURCE_DIR/"
          {
            echo "V155_BASE_APK=$BASE_APK"
            echo "V155_SOURCE_DIR=$SOURCE_DIR"
            echo "V155_RELEASE_DIR=$RELEASE_DIR"
          } >> "$GITHUB_ENV"
      - name: Build LibreDWG-Web v0.8.2 and test six actual DWG fixtures
        shell: bash
        run: |
          set -euo pipefail

          # Apply narrow TypeScript compatibility fixes to the exact upstream v0.8.2 sources.
          cat > "$RUNNER_TEMP/v155-patch-libredwg-ts.py" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def patch(relative_path, old, new):
              path = root / relative_path
              text = path.read_text(encoding="utf-8")
              if new and new in text:
                  print(f"PATCH ALREADY PRESENT: {relative_path}")
                  return
              if old not in text:
                  raise SystemExit(f"PATCH ERROR: expected source pattern missing in {relative_path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"PATCHED: {relative_path}")

          patch(
              "src/converter/converter.ts",
              "      // @ts-expect-error header variable name\n",
              ""
          )
          patch(
              "src/converter/entityConverter.ts",
              "    let rgbColor = undefined",
              "    let rgbColor: number | undefined = undefined"
          )
          patch(
              "src/libredwg.ts",
              "    const entities = []",
              "    const entities: Dwg_Object_Ptr[] = []"
          )
          patch(
              "src/libredwg.ts",
              "    const results = []\n    for (let i = 0; i < num_objects; i++) {\n      const obj = wasmInstance.dwg_get_object(data, i)\n      const tio = wasmInstance.dwg_object_to_object_tio(obj)",
              "    const results: Dwg_Object_Object_TIO_Ptr[] = []\n    for (let i = 0; i < num_objects; i++) {\n      const obj = wasmInstance.dwg_get_object(data, i)\n      const tio = wasmInstance.dwg_object_to_object_tio(obj)"
          )
          patch(
              "src/libredwg.ts",
              "    const results = []\n    for (let i = 0; i < num_objects; i++) {\n      const obj = wasmInstance.dwg_get_object(data, i)\n      const tio = wasmInstance.dwg_object_to_entity_tio(obj)",
              "    const results: Dwg_Object_Entity_TIO_Ptr[] = []\n    for (let i = 0; i < num_objects; i++) {\n      const obj = wasmInstance.dwg_get_object(data, i)\n      const tio = wasmInstance.dwg_object_to_entity_tio(obj)"
          )
          patch(
              "src/svg/svgConverter.ts",
              "    let result = null\n    switch (entity.type)",
              "    let result: BBoxAndElement | null = null\n    switch (entity.type)"
          )
          patch(
              "src/svg/svgConverter.ts",
              "    let modelSpace = null",
              "    let modelSpace: DwgBlockRecordTableEntry | null = null"
          )
          PY

          # Intercept pnpm's final TypeScript build, patch its working tree, then delegate normally.
          PATCH_BIN="$RUNNER_TEMP/v155-pnpm-wrapper"
          mkdir -p "$PATCH_BIN"
          cat > "$PATCH_BIN/pnpm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$PWD" == */bindings/javascript ]]; then
            for arg in "$@"; do
              if [[ "$arg" == "build" ]]; then
                python3 "$RUNNER_TEMP/v155-patch-libredwg-ts.py" "$PWD"
                break
              fi
            done
          fi
          exec corepack pnpm "$@"
          SH
          chmod +x "$PATCH_BIN/pnpm"
          export PATH="$PATCH_BIN:$PATH"

          chmod +x "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_BUILD_LIBREDWG.sh"
          bash "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_BUILD_LIBREDWG.sh" "$RUNNER_TEMP" "$V155_SOURCE_DIR"
          test -s "$V155_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$V155_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          grep -q "dwg_read_data" "$V155_SOURCE_DIR/libredwg-writer/dist/libredwg-web.js"
          grep -q "dwg_write_dxf" "$V155_SOURCE_DIR/libredwg-writer/dist/libredwg-web.js"
          test -s "$V155_SOURCE_DIR/libredwg-writer/BUILD_CONFIGURATION_V155.txt"
      - name: Recheck V155 Alignment and prepare honest validation report
        shell: bash
        run: |
          set -euo pipefail
          SQ_V155_HTML="$V155_SOURCE_DIR/index.html" node "$V155_SOURCE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_TEST.js"
          cat > "$V155_RELEASE_DIR/V155_NATIVE_DWG_ALIGNMENT_REPORT.md" <<'TXT'
          # SurveyQuant v1.0.155 native-DWG Alignment build report

          - A standalone two-point Alignment module replaces the old orientation modules.
          - The native DWG reader is used for the preview, entity selection, layer/axis reading and OSNAP data. The temporary DXF-conversion step is separate from preview. If conversion fails, file output is disabled instead of drawing/exporting a substitute or a partial board.
          - Alignment modifies numeric geometry fields inside the original converted DXF group-code records. It does not export the preview drawing. Block definitions receive the rotation/scale part of the similarity transform; INSERT anchors receive translation as well, while their own scales/rotations stay unchanged to avoid double-transforming block contents.
          - The rebuilt runtime must pass six checked-in LibreDWG DWG fixtures from AC1015, AC1018, AC1021, AC1024, AC1027 and AC1032: native database read, entity/layer checks, DWG-to-DXF output and DXF structure checks.
          - The APK build only completes when those tests pass. The DWG fixtures are regression tests, not a guarantee for every proprietary/custom DWG. No customer failure DWG was included in the request, and the workflow cannot claim to have tested that specific drawing.
          - DWG output is DXF because this application uses LibreDWG's DWG-to-DXF path and does not have a native DWG writer. Proprietary binary data or unsupported objects may not survive conversion byte-for-byte. Opaque entities that the Alignment transformer cannot safely modify are rejected rather than silently dropped or reconstructed.
          - No persistent storage of the opened/projected alignment session is introduced by the V155 Alignment module. Local session data is cleared on close/reset.
          TXT
          cat > "$V155_RELEASE_DIR/V155_BUILD_RESULT.txt" <<'TXT'
          Build release gate: passed only if the v0.8.2 WASM build, six DWG native-read/DXF conversion tests, V155 Alignment unit tests, inline-script checks, Android packaging, signing and APK verification all passed. This does not replace acceptance testing against the user's exact DWG file.
          TXT

      - name: Inject HTML and all three matching LibreDWG runtime files into APK
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V155_RELEASE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_UNSIGNED.apk"
          ALIGNED="$V155_RELEASE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_ALIGNED.apk"
          FINAL="$V155_RELEASE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V155_KIT_DIR/scripts/SurveyQuant_v1.0.155_PACKAGE_APK.py" \
            --apk-input "$V155_BASE_APK" \
            --apk-output "$RAW" \
            --html-to-inject "$V155_SOURCE_DIR/index.html" \
            --dwg-wasm-dir "$V155_SOURCE_DIR/libredwg-writer/wasm"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='155'.*versionName='1.0.155'"
          unzip -t "$FINAL" | tail -2

      - name: Package full source patch and upload verified build artifacts
        shell: bash
        run: |
          set -euo pipefail
          (cd "$V155_SOURCE_DIR" && zip -qr "$V155_RELEASE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_SOURCE_PATCH.zip" .)
          unzip -t "$V155_RELEASE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V155_RELEASE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG.apk" "$V155_RELEASE_DIR/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_SOURCE_PATCH.zip" > "$V155_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V155_RELEASE_DIR/SHA256SUMS.txt"
      - name: Upload signed APK, source patch and reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.155-ALIGNMENT-NATIVE-DWG
          path: |
            ${{ runner.temp }}/v155-release/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG.apk
            ${{ runner.temp }}/v155-release/SurveyQuant_v1.0.155_ALIGNMENT_NATIVE_DWG_SOURCE_PATCH.zip
            ${{ runner.temp }}/v155-release/SHA256SUMS.txt
            ${{ runner.temp }}/v155-release/V155_NATIVE_DWG_ALIGNMENT_REPORT.md
            ${{ runner.temp }}/v155-release/V155_BUILD_RESULT.txt
          if-no-files-found: error
          retention-days: 14
