name: Build SurveyQuant V62 XY FIXED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify V62 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE.zip"

          echo "========================================"
          echo "SurveyQuant V62 XY FIXED"
          echo "========================================"

          echo "Checking:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$PWD/$ZIP"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo ""
          echo "SOURCE ZIP FOUND:"
          ls -lh "$ZIP"

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "========================================"
          echo "EXTRACTED SOURCE"
          echo "========================================"

          find source -maxdepth 5 -type f -print | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SEARCHING FOR GRADLE PROJECT"
          echo "========================================"

          GRADLEW="$(find source -type f -name "gradlew" -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found."

            echo ""
            echo "Searching for Gradle settings:"
            find source -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -print || true

            echo ""
            echo "Searching for AndroidManifest:"
            find source -type f \
              -name "AndroidManifest.xml" \
              -print || true

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "========================================"
          echo "BUILDING V62"
          echo "========================================"

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -iname "*.apk" \
            -print \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/SurveyQuant_v1.0.62_XY_FIXED.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.62-XY-FIXED
          path: output/SurveyQuant_v1.0.62_XY_FIXED.apk
          if-no-files-found: error
