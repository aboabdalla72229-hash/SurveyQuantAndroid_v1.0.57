name: Build SurveyQuant v1.0.132 - CAD Original View + Strict Reference Preserve

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v132-cad-original-view-preserve.yml"
      - "SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.zip"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Checkout pinned LibreDWG-Web source
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-web
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate and unpack V126 base, V129, V130, V131, and V132 patch kits
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-yaml unzip zip

          BASE_KIT="SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.zip"
          PATCH_KIT="SurveyQuant_v1.0.129_SELECT_DELETE_UNDO_REDO_PATCH.zip"
          V130_KIT="SurveyQuant_v1.0.130_DWG_AXIS_MULTISELECT_PATCH.zip"
          V131_KIT="SurveyQuant_v1.0.131_ENGINEERING_CAD_PRESERVE_PATCH.zip"
          V132_KIT="SurveyQuant_v1.0.132_CAD_ORIGINAL_VIEW_PATCH.zip"
          # V132 kit is embedded in this workflow so it does not depend on a separate root upload.
          if [ ! -s "$V132_KIT" ]; then
            echo "V132 patch ZIP is absent from repository root; rebuilding it from the embedded payload."
            cat > "$RUNNER_TEMP/v132-patch-kit.b64" <<'V132_PATCH_KIT_BASE64'
