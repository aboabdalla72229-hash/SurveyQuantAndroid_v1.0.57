name: Build SurveyQuant v1.0.84 - Compare + Safe Projection DXF Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip"
      - "SurveyQuant_v1.0.84_COMPARE_DXF_PATCH.zip"
      - ".github/workflows/build-v84-compare-dxf-fix.yml"

permissions:
  contents: read

env:
  SOURCE_ZIP: SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip
  PATCH_ZIP: SurveyQuant_v1.0.84_COMPARE_DXF_PATCH.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE_ZIP" || { echo "ERROR: missing $SOURCE_ZIP"; exit 1; }
          test -s "$PATCH_ZIP" || { echo "ERROR: missing $PATCH_ZIP"; exit 1; }

      - name: Extract source and patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$PATCH_ZIP" -d "$RUNNER_TEMP/sq-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"
          test -n "$PROJECT" || exit 1
          test -n "$PATCH_INDEX" || exit 1
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Apply v84 fixed HTML and existing assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$PROJECT_DIR/app/src/main/assets"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"
          cp "$PATCH_INDEX" "$ASSETS/index.html"

          # Reuse the v84 visual assets from the existing exact-fixes patch when present.
          if [ -f "$RUNNER_TEMP/sq-patch/surveyquant_logo.png" ]; then cp "$RUNNER_TEMP/sq-patch/surveyquant_logo.png" "$ASSETS/surveyquant_logo.png"; fi
          if [ -f "$RUNNER_TEMP/sq-patch/surveyquant_background.png" ]; then cp "$RUNNER_TEMP/sq-patch/surveyquant_background.png" "$ASSETS/surveyquant_background.png"; fi

          grep -q "compareLevelTypeBefore" "$ASSETS/index.html"
          grep -q "compareLevelTypeAfter" "$ASSETS/index.html"
          grep -Fq "const originalEntities=(originalCad.entities||[]).filter(Boolean)" "$ASSETS/index.html"

      - name: Set version 1.0.84
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          sed -E -i "0,/versionCode[[:space:]]+[0-9]+/s//versionCode 84/" "$BUILD_FILE"
          sed -E -i "0,/versionName[[:space:]]+['\"][^'\"]+['\"]/s//versionName '1.0.84'/" "$BUILD_FILE"

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          node - "$INDEX" "$RUNNER_TEMP/inline.js" <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync(process.argv[2],'utf8');
          const re=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          let m,out=[];
          while((m=re.exec(h))) out.push(m[1]);
          if(!out.length) throw new Error('No inline JavaScript found');
          fs.writeFileSync(process.argv[3],out.join('\n'));
          NODE
          node --check "$RUNNER_TEMP/inline.js"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.keystore"
          {
            echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.keystore"
            echo "SURVEYQUANT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SURVEYQUANT_KEY_ALIAS=$KEY_ALIAS"
            echo "SURVEYQUANT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Collect release
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"
          test -n "$APK" || exit 1
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/SurveyQuant_v1.0.84_COMPARE_DXF_FIX.apk"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/release/SurveyQuantAndroid_v1.0.84_COMPARE_DXF_FIX_SOURCE.zip" sq-source

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.84-COMPARE-DXF-FIX
          path: |
            release/SurveyQuant_v1.0.84_COMPARE_DXF_FIX.apk
            release/SurveyQuantAndroid_v1.0.84_COMPARE_DXF_FIX_SOURCE.zip
          if-no-files-found: error
