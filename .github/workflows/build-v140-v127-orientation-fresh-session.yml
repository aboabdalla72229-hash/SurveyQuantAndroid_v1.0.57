            assert.equal(blurFallback.win.location.reloadCount,1,'blur/focus fallback must reload even if visibilitychange is missing');

            const picker=makeHarness({picker:true});
            picker.advance(1000); picker.fire('click',{target:{closest(){return {type:'file',matches(){return true;}};}}});
            picker.advance(100); picker.visibility('hidden');
            // Android can deliver input.change before it reports the WebView as visible again.
            picker.fire('change',{target:{type:'file',matches(){return true;}}});
            picker.advance(800); picker.visibility('visible');
            assert.equal(picker.win.location.reloadCount,0,'file chooser return must not reload even if change fires before visibilitychange');
            picker.advance(100); picker.visibility('hidden'); picker.advance(800); picker.visibility('visible');
