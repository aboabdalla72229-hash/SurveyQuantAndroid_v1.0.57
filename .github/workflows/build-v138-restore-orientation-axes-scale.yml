          def _read_len8(data: bytes, pos: int) -> tuple[int, int]:
              first = data[pos]
              if first & 0x80:
                  return (((first & 0x7F) << 8) | data[pos + 1]), pos + 2
              return first, pos + 1
          
          
          def _read_len16(data: bytes, pos: int) -> tuple[int, int]:
              first = struct.unpack_from("<H", data, pos)[0]
              if first & 0x8000:
                  second = struct.unpack_from("<H", data, pos + 2)[0]
                  return (((first & 0x7FFF) << 16) | second), pos + 4
              return first, pos + 2
          
          
          def _string_pool(data: bytes, chunk_start: int, chunk_size: int, header_size: int) -> tuple[list[str], list[tuple[int, int, bool]]]:
              if header_size < 28 or chunk_start + chunk_size > len(data):
                  raise ValueError("invalid Android binary XML string pool")
              string_count, _style_count, flags, strings_start, _styles_start = struct.unpack_from("<IIIII", data, chunk_start + 8)
              if string_count > 100_000:
                  raise ValueError("unreasonable Android XML string count")
              offsets_start = chunk_start + header_size
              strings_base = chunk_start + strings_start
              utf8 = bool(flags & 0x100)
              strings: list[str] = []
              spans: list[tuple[int, int, bool]] = []
              for index in range(string_count):
                  rel = struct.unpack_from("<I", data, offsets_start + index * 4)[0]
                  p = strings_base + rel
                  if utf8:
                      _u16_len, p = _read_len8(data, p)
                      byte_len, p = _read_len8(data, p)
                      begin = p
                      end = begin + byte_len
                      strings.append(data[begin:end].decode("utf-8", errors="strict"))
                      spans.append((begin, end, True))
                  else:
                      char_len, p = _read_len16(data, p)
                      begin = p
                      end = begin + char_len * 2
                      strings.append(data[begin:end].decode("utf-16le", errors="strict"))
                      spans.append((begin, end, False))
              return strings, spans
          
          
          def patch_binary_manifest(manifest: bytes, version_code: int = TARGET_APP_VERSION_CODE,
                                    version_name: str = TARGET_APP_VERSION_NAME) -> bytes:
              if len(manifest) < 8 or struct.unpack_from("<H", manifest, 0)[0] != 0x0003:
                  raise ValueError("AndroidManifest.xml is not Android binary XML")
              result = bytearray(manifest)
              pos = struct.unpack_from("<H", result, 2)[0]
              total_size = struct.unpack_from("<I", result, 4)[0]
              if total_size > len(result) or total_size < pos:
                  raise ValueError("invalid Android binary XML size")
              strings: list[str] | None = None
              spans: list[tuple[int, int, bool]] = []
              pool_info: tuple[int, int, int] | None = None
              chunks = []
              while pos < total_size:
                  if pos + 8 > total_size:
                      raise ValueError("truncated Android XML chunk header")
                  chunk_type, header_size, chunk_size = struct.unpack_from("<HHI", result, pos)
                  if chunk_size < header_size or pos + chunk_size > total_size:
                      raise ValueError("invalid Android XML chunk bounds")
                  chunks.append((pos, chunk_type, header_size, chunk_size))
                  if chunk_type == 0x0001:
                      strings, spans = _string_pool(bytes(result), pos, chunk_size, header_size)
                      pool_info = (pos, chunk_size, header_size)
                  pos += chunk_size
              if strings is None or pool_info is None:
                  raise ValueError("Android XML string pool not found")
          
              # versionName string is same length (1.0.126 -> 1.0.136), so pool offsets stay valid.
              old_names = [i for i, value in enumerate(strings) if value == OLD_APP_VERSION_NAME]
              if not old_names and version_name not in strings:
                  raise ValueError(f"Android manifest string pool has neither {OLD_APP_VERSION_NAME!r} nor {version_name!r}")
              for idx in old_names:
                  begin, end, is_utf8 = spans[idx]
                  encoded = version_name.encode("utf-8") if is_utf8 else version_name.encode("utf-16le")
                  if len(encoded) != end - begin:
                      raise ValueError("versionName replacement changes string-pool byte length")
                  result[begin:end] = encoded
                  strings[idx] = version_name
          
              # Locate the manifest root's android:versionCode typed value and replace its integer.
              version_fields = []
              for chunk_pos, chunk_type, header_size, chunk_size in chunks:
                  if chunk_type != 0x0102 or chunk_size < 36:
                      continue
                  node_name_idx = struct.unpack_from("<I", result, chunk_pos + 20)[0]
                  if node_name_idx >= len(strings) or strings[node_name_idx] != "manifest":
                      continue
                  attr_start = struct.unpack_from("<H", result, chunk_pos + 24)[0]
                  attr_size = struct.unpack_from("<H", result, chunk_pos + 26)[0]
                  attr_count = struct.unpack_from("<H", result, chunk_pos + 28)[0]
                  if attr_size < 20 or attr_count > 1024:
                      raise ValueError("invalid manifest attribute table")
                  first_attr = chunk_pos + 16 + attr_start
                  for n in range(attr_count):
                      at = first_attr + n * attr_size
                      name_idx = struct.unpack_from("<I", result, at + 4)[0]
                      if name_idx >= len(strings) or strings[name_idx] != "versionCode":
                          continue
                      value_size = struct.unpack_from("<H", result, at + 12)[0]
                      value_type = result[at + 15]
                      if value_size < 8 or value_type not in (0x10, 0x11):
                          raise ValueError("manifest versionCode is not a typed integer")
                      version_fields.append(at + 16)
              if len(version_fields) != 1:
                  raise ValueError(f"expected exactly one manifest versionCode field, found {len(version_fields)}")
              struct.pack_into("<I", result, version_fields[0], version_code)
              return bytes(result)
          
          
          def patch_apk(input_apk: Path, output_apk: Path) -> None:
              if not input_apk.is_file() or input_apk.stat().st_size == 0:
                  raise SystemExit("ERROR V138: input APK is missing or empty.")
              if input_apk.resolve() == output_apk.resolve():
                  raise SystemExit("ERROR V138: output APK must differ from input APK.")
              output_apk.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(input_apk, "r") as zin:
                  names = [info.filename for info in zin.infolist()]
                  if names.count("assets/index.html") != 1:
                      raise SystemExit("ERROR V138: input APK must contain exactly one assets/index.html.")
                  if names.count("AndroidManifest.xml") != 1:
                      raise SystemExit("ERROR V138: input APK must contain exactly one AndroidManifest.xml.")
                  seen = set()
                  with zipfile.ZipFile(output_apk, "w", allowZip64=True) as zout:
                      for info in zin.infolist():
                          name = info.filename
                          if name in seen:
                              raise SystemExit("ERROR V138: duplicate APK ZIP entry: " + name)
                          seen.add(name)
                          upper = name.upper()
                          if upper.startswith("META-INF/") and (
                              upper.endswith(".SF") or upper.endswith(".RSA") or upper.endswith(".DSA") or
                              upper.endswith(".EC") or upper.endswith("MANIFEST.MF")
                          ):
                              continue
                          data = zin.read(name)
                          if name == "assets/index.html":
                              html = data.decode("utf-8")
                              data = replace_bridge_function(html).encode("utf-8")
                          elif name == "assets/libredwg-writer/wasm/libredwg-web.js":
                              data = patch_wasm_loader(data)
                          elif name == "AndroidManifest.xml":
                              data = patch_binary_manifest(data)
                          clone = copy.copy(info)
                          # The destination zip must not retain the old APK's data descriptors or signatures.
                          zout.writestr(clone, data)
              with zipfile.ZipFile(output_apk, "r") as check:
                  html = check.read("assets/index.html").decode("utf-8")
                  manifest = check.read("AndroidManifest.xml")
                  if html.count(MARKER) != 1:
                      raise SystemExit("ERROR V138: APK output is missing the V138 HTML gate.")
                  patch_binary_manifest(manifest)  # validates the resulting manifest can be safely updated again
                  if "assets/libredwg-writer/wasm/libredwg-web.wasm" not in check.namelist():
                      raise SystemExit("ERROR V138: APK output lost the local DWG WebAssembly engine.")
                  wasm_js = check.read("assets/libredwg-writer/wasm/libredwg-web.js")
                  if WASM_PROMISE_OLD in wasm_js or wasm_js.count(WASM_PROMISE_FIXED) != 1:
                      raise SystemExit("ERROR V138: APK output lacks the corrected file:// WASM loader.")
              print("PASS V138: shared DWG picker gate patched in APK assets; package version raised to 1.0.138/138.")
              print("PASS V138: source DWG is not written over; app's local DWG/DXF engine and all unrelated assets are retained.")
          
          
          def _make_axml_test_fixture() -> bytes:
              """Build a small valid-enough binary XML manifest for the self-test."""
              strings = ["manifest", "versionCode", "versionName", OLD_APP_VERSION_NAME]
              enc_strings = []
              offsets = []
              for s in strings:
                  raw = s.encode("utf-8")
                  encoded = bytes([len(s), len(raw)]) + raw + b"\0"
                  offsets.append(sum(len(item) for item in enc_strings))
                  enc_strings.append(encoded)
              data_strings = b"".join(enc_strings)
              pool_header_size = 28
              offsets_bytes = b"".join(struct.pack("<I", off) for off in offsets)
              strings_start = pool_header_size + len(offsets_bytes)
              pool_size = strings_start + len(data_strings)
              pool = struct.pack("<HHI", 0x0001, pool_header_size, pool_size)
              pool += struct.pack("<IIIII", len(strings), 0, 0x100, strings_start, 0)
              pool += offsets_bytes + data_strings
          
              # Attributes follow the ResXMLTree_attrExt (20 bytes). Each attribute is 20 bytes.
              node_header = struct.pack("<HHIII", 0x0102, 16, 16 + 20 + 40, 1, 0xFFFFFFFF)
              attr_ext = struct.pack("<IIHHHHHH", 0xFFFFFFFF, 0, 20, 20, 2, 0, 0, 0)
              # Namespace, name index, rawValue index, typedValue.size, res0, type, data.
              attr_code = struct.pack("<IIIHBBI", 0xFFFFFFFF, 1, 0xFFFFFFFF, 8, 0, 0x10, 126)
              attr_name = struct.pack("<IIIHBBI", 0xFFFFFFFF, 2, 3, 8, 0, 0x03, 3)
              start_element = node_header + attr_ext + attr_code + attr_name
              end_element = struct.pack("<HHIIIII", 0x0103, 16, 24, 1, 0xFFFFFFFF, 0xFFFFFFFF, 0)  # element name index 0
              size = 8 + len(pool) + len(start_element) + len(end_element)
              xml_header = struct.pack("<HHI", 0x0003, 8, size)
              return xml_header + pool + start_element + end_element
          
          
          def self_test() -> None:
              wasm_fixture = b"prefix " + WASM_PROMISE_OLD + b'xhr.onload=()=>{if(xhr.status==200||xhr.status==0&&xhr.response){resolve(xhr.response)}reject(xhr.status)};xhr.onerror=reject;xhr.send(null)}) tail'
              wasm_fixed = patch_wasm_loader(wasm_fixture)
              if WASM_PROMISE_OLD in wasm_fixed or WASM_PROMISE_FIXED not in wasm_fixed:
                  raise SystemExit("FAIL V138 self-test: WASM file:// Promise argument order was not corrected.")
              if patch_wasm_loader(wasm_fixed) != wasm_fixed:
                  raise SystemExit("FAIL V138 self-test: WASM patch is not idempotent.")
              fixture = _make_axml_test_fixture()
              result = patch_binary_manifest(fixture)
              again = patch_binary_manifest(result)
              if len(fixture) != len(result) or len(result) != len(again):
                  raise SystemExit("FAIL V138 self-test: manifest patch changed binary XML length")
              # Root versionCode is the final typed data word in the first attribute.
              chunks = []
              pos = 8
              while pos < len(result):
                  typ, hdr, size = struct.unpack_from("<HHI", result, pos)
                  chunks.append((pos, typ, hdr, size))
                  pos += size
              strings_chunk = next(p for p, typ, _, _ in chunks if typ == 0x0001)
              strings, _spans = _string_pool(result, strings_chunk, struct.unpack_from("<I", result, strings_chunk + 4)[0], 28)
              if TARGET_APP_VERSION_NAME not in strings:
                  raise SystemExit("FAIL V138 self-test: versionName was not updated")
              code_chunk = next(p for p, typ, _, _ in chunks if typ == 0x0102)
              attr_start = struct.unpack_from("<H", result, code_chunk + 24)[0]
              attr0 = code_chunk + 16 + attr_start
              actual = struct.unpack_from("<I", result, attr0 + 16)[0]
              if actual != TARGET_APP_VERSION_CODE:
                  raise SystemExit(f"FAIL V138 self-test: versionCode={actual}, expected {TARGET_APP_VERSION_CODE}")
