name: Build SurveyQuant v1.0.58

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workflow source
        shell: bash
        run: |
          echo "=== CURRENT REPOSITORY ==="
          git remote -v

          echo "=== CURRENT COMMIT ==="
          git rev-parse HEAD

          echo "=== ZIP FILES IN REPOSITORY ==="
          find . -maxdepth 2 -type f -name "*.zip" -print

          echo "=== CHECK OLD v1.0.57 REFERENCES ==="
          if grep -R "SurveyQuantAndroid_v1.0.57_NEW_BASELINE" .github/workflows 2>/dev/null; then
            echo "ERROR: OLD v1.0.57 SOURCE REFERENCE FOUND"
            exit 1
          fi

          if grep -R "v1.0.57" .github/workflows 2>/dev/null; then
            echo "ERROR: OLD v1.0.57 REFERENCE FOUND IN WORKFLOW"
            exit 1
          fi

          echo "No old v1.0.57 source reference found."

      - name: Check repaired v1.0.58 source
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.58_PATCH4_REPAIRED_SOURCE.zip"

          echo "Checking:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: v1.0.58 source ZIP was not found."
            exit 1
          fi

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: v1.0.58 source ZIP is empty."
            exit 1
          fi

          echo "v1.0.58 source ZIP found successfully."

      - name: Prepare source
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.58_PATCH4_REPAIRED_SOURCE.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "=== EXTRACTED SOURCE ==="
          find extracted -maxdepth 4 -type f | head -200

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside v1.0.58 source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          rm -rf release
          mkdir -p release

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} release/ \;

          echo "=== GENERATED FILES ==="
          find release -type f -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.58
          path: release/*
          if-no-files-found: error
