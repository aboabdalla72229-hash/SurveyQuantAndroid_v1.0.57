name: Build SurveyQuant v1.0.95 - OPEN TEST Gate Fix Concrete 2D 3D

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip
  BASE_PATCH_NAME: SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF_PATCH.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FIX: Restore the embedded scripts from the historical workflow.
      # The old file is no longer present at its former current path.
      - name: Extract the built-in patches from the prior workflow revision
        shell: bash
        run: |
          set -euo pipefail

          PATCH_SOURCE_COMMIT="2b378008463968d5dedff0e21db03b7af0c3618d"
          PATCH_SOURCE_PATH=".github/workflows/.github/workflows/build-v94-open-test-concrete.yml"
          PATCH_SOURCE_FILE="$RUNNER_TEMP/build-v94-source.yml"

          git fetch --no-tags origin "$PATCH_SOURCE_COMMIT"

          git show \
            "$PATCH_SOURCE_COMMIT:$PATCH_SOURCE_PATH" \
            > "$PATCH_SOURCE_FILE"

          test -s "$PATCH_SOURCE_FILE" || {
            echo "ERROR: Could not restore the historical workflow containing the built-in patches."
            exit 1
          }

          python3 - "$PATCH_SOURCE_FILE" "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import base64
          import re
          import sys

          workflow_path = Path(sys.argv[1])
          out = Path(sys.argv[2])
          workflow = workflow_path.read_text(encoding="utf-8")

          for block, filename in (
              (
                  "concrete_patch",
                  "SurveyQuant_Concrete_Quantity_2D_3D_TOP_PATCH.js",
              ),
              (
                  "open_test_patch",
                  "SurveyQuant_OPEN_TEST_MODE.js",
              ),
          ):
              pattern = (
                  r'cat > "\$RUNNER_TEMP/'
                  + re.escape(block)
                  + r'\.b64" <<\'PATCH_B64\'\s*\n(.*?)\nPATCH_B64'
              )

              match = re.search(pattern, workflow, flags=re.S)

              if not match:
                  raise SystemExit(
                      "ERROR: Could not find built-in patch block: " + block
                  )

              encoded = "".join(match.group(1).split())

              try:
                  payload = base64.b64decode(encoded, validate=True)
              except Exception as exc:
                  raise SystemExit(
                      "ERROR: Invalid Base64 data in " + block + ": " + str(exc)
                  )

              target = out / filename
              target.write_bytes(payload)

              if not payload.strip():
                  raise SystemExit(
                      "ERROR: Extracted patch is empty: " + block
                  )

              print(
                  f"Extracted {block}: {target} ({len(payload)} bytes)"
              )
          PY

          node --check "$RUNNER_TEMP/SurveyQuant_Concrete_Quantity_2D_3D_TOP_PATCH.js"
          node --check "$RUNNER_TEMP/SurveyQuant_OPEN_TEST_MODE.js"

          echo "CONCRETE_PATCH_NAME=$RUNNER_TEMP/SurveyQuant_Concrete_Quantity_2D_3D_TOP_PATCH.js" >> "$GITHUB_ENV"
          echo "OPEN_TEST_PATCH_NAME=$RUNNER_TEMP/SurveyQuant_OPEN_TEST_MODE.js" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract v1.0.93 source and base drawing patch
        shell: bash
        run: |
          set -euo pipefail

          test -s "$SOURCE_NAME" || {
            echo "ERROR: Missing $SOURCE_NAME in repository root."
            exit 1
          }

          test -s "$BASE_PATCH_NAME" || {
            echo "ERROR: Missing $BASE_PATCH_NAME in repository root."
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-base-patch"

          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$BASE_PATCH_NAME" -d "$RUNNER_TEMP/sq-base-patch"

          PROJECT="$(
            find "$RUNNER_TEMP/sq-source" \
              -type f -path '*/app/build.gradle' \
              -print -quit |
            sed 's#/app/build.gradle$##'
          )"

          PATCH_INDEX="$(
            find "$RUNNER_TEMP/sq-base-patch" \
              -type f -name 'index.html' -print -quit
          )"

          test -n "$PROJECT" && test -d "$PROJECT" || {
            echo "ERROR: Android project was not found in the source ZIP."
            exit 1
          }

          test -n "$PATCH_INDEX" && test -s "$PATCH_INDEX" || {
            echo "ERROR: Base index.html patch was not found."
            exit 1
          }

          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/build.gradle"
          test -s "$PROJECT/app/src/main/AndroidManifest.xml"

          mkdir -p "$PROJECT/app/src/main/assets"

          cp "$PATCH_INDEX" "$PROJECT/app/src/main/assets/index.html"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Base v1.0.93 source and drawing-preservation patch loaded."

      - name: Inject existing concrete quantity additions
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$PROJECT_DIR/app/src/main/assets/index.html" \
            "$CONCRETE_PATCH_NAME" <<'PY'
          from pathlib import Path
          import sys

          html_path = Path(sys.argv[1])
          patch = Path(sys.argv[2]).read_text(encoding="utf-8")
          html = html_path.read_text(encoding="utf-8")

          required = [
              'id="concreteDxfInput"',
              'id="concreteMainLayer"',
              'id="concreteAdjustLayer"',
              'id="concreteResults"',
              'function parseDXF',
          ]

          missing = [item for item in required if item not in html]

          if missing:
              raise SystemExit(
                  "ERROR: Required concrete-project components missing: "
                  + ", ".join(missing)
              )

          if "SurveyQuant v1.0.94 additive concrete-quantity patch" in html:
              raise SystemExit(
                  "ERROR: Concrete patch already exists in the input page."
              )

          if "</body>" not in html:
              raise SystemExit(
                  "ERROR: </body> not found; refusing unsafe injection."
              )

          html = html.replace(
              "</body>",
              "\n<script>\n" + patch + "\n</script>\n</body>",
              1,
          )

          html_path.write_text(html, encoding="utf-8")
          print("Concrete quantity patch injected.")
          PY

      - name: Inject open-test notice and payment-page cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$PROJECT_DIR/app/src/main/assets/index.html" \
            "$OPEN_TEST_PATCH_NAME" <<'PY'
          from pathlib import Path
          import sys

          html_path = Path(sys.argv[1])
          patch = Path(sys.argv[2]).read_text(encoding="utf-8")
          html = html_path.read_text(encoding="utf-8")

          if "window.SURVEYQUANT_OPEN_TEST_MODE = true;" in html:
              raise SystemExit(
                  "ERROR: Open-test patch was already injected."
              )

          for marker in (
              "function sqApi",
              "async function sqInitAccess",
              "function sqShowGate",
              "function sqEnsureGate",
          ):
              if marker not in html:
                  raise SystemExit(
                      "ERROR: Expected access-gate entry not found: " + marker
                  )

          if "</body>" not in html:
              raise SystemExit(
                  "ERROR: </body> not found; refusing unsafe injection."
              )

          html = html.replace(
              "</body>",
              "\n<script>\n" + patch + "\n</script>\n</body>",
              1,
          )

          html_path.write_text(html, encoding="utf-8")
          print("Open-test notice injected.")
          PY

      - name: Fix the actual app access gate for this test APK only
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          html = p.read_text(encoding="utf-8")

          def replace_once(pattern, replacement, label):
              global html

              updated, count = re.subn(
                  pattern,
                  replacement,
                  html,
                  count=1,
                  flags=re.S,
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Could not safely patch {label}; matches={count}. "
                      "No APK will be built."
                  )

              html = updated

          replace_once(
              r'async\s+function\s+sqInitAccess\s*\(\s*\)\s*\{.*?\}\s*(?=async\s+function\s+checkSurveySubscription\s*\()',
              "async function sqInitAccess(){"
              "/* SURVEYQUANT_OPEN_TEST_GATE_BYPASS_V95 */"
              "try{"
              "sqGateChecking=false;"
              "sqGateMode='open';"
              "var g=document.getElementById('sqAccessGate');"
              "if(g)g.remove();"
              "sqGateOverlay=null;"
              "try{localStorage.setItem('sq_access_until','2099-12-31T23:59:59.000Z')}catch(e){};"
              "return {ok:true,testMode:true,trialActive:true,"
              "subscriptionActive:true,"
              "trialUntil:'2099-12-31T23:59:59.000Z',"
              "activeUntil:'2099-12-31T23:59:59.000Z'};"
              "}finally{sqGateChecking=false;}}\n",
              "sqInitAccess",
          )

          replace_once(
              r'function\s+sqEnsureGate\s*\(\s*\)\s*\{.*?\}\s*(?=function\s+sqShowGate\s*\()',
              "function sqEnsureGate(){"
              "/* SURVEYQUANT_OPEN_TEST_GATE_BYPASS_V95 */"
              "var g=document.getElementById('sqAccessGate');"
              "if(g)g.remove();"
              "sqGateOverlay=null;"
              "sqGateMode='open';"
              "return null;}\n",
              "sqEnsureGate",
          )

          replace_once(
              r'function\s+sqShowGate\s*\([^)]*\)\s*\{.*?\}\s*(?=function\s+sqHideGate\s*\()',
              "function sqShowGate(){"
              "/* SURVEYQUANT_OPEN_TEST_GATE_BYPASS_V95 */"
              "var g=document.getElementById('sqAccessGate');"
              "if(g)g.remove();"
              "sqGateOverlay=null;"
              "sqGateMode='open';}\n",
              "sqShowGate",
          )

          for marker in (
              "SURVEYQUANT_OPEN_TEST_GATE_BYPASS_V95",
              "window.SURVEYQUANT_OPEN_TEST_MODE = true;",
              "sqConcreteTopLevel",
              "downloadConcrete3DDXF",
              "dxfPolylineRecords",
          ):
              if marker not in html:
                  raise SystemExit(
                      "ERROR: Required test or concrete marker missing after "
                      "patch: " + marker
                  )

          p.write_text(html, encoding="utf-8")

          print(
              "Verified: startup access gate and overlay functions patched "
              "in this test APK only."
          )
          PY

      - name: Verify source version, preserved features and assets
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Eq 'versionCode[[:space:]]+93([^0-9]|$)' "$GRADLE_FILE" || {
            echo "ERROR: Expected versionCode 93 before version bump."
            exit 1
          }

          grep -Eq "versionName[[:space:]]+['\"]1\.0\.93['\"]" "$GRADLE_FILE" || {
            echo "ERROR: Expected versionName 1.0.93 before version bump."
            exit 1
          }

          grep -Fq 'minimumVersionCode' "$INDEX" || {
            echo "ERROR: Forced-update check missing."
            exit 1
          }

          grep -Fq 'transformOriginalDxfPreservingDetails' "$INDEX" || {
            echo "ERROR: DXF preservation function missing."
            exit 1
          }

          grep -Fq 'orientationIntersections' "$INDEX" || {
            echo "ERROR: Existing orientation feature missing."
            exit 1
          }

          for card in \
            project1Card orientationCard profileCard roadCard \
            pipeCard landAreaCard dropFilesCard
          do
            grep -Fq "id=\"$card\"" "$INDEX" || {
              echo "ERROR: Existing project card $card missing."
              exit 1
            }
          done

          grep -Fq 'kashier/create-session' "$INDEX" || {
            echo "ERROR: Kashier session integration missing."
            exit 1
          }

          grep -Fq 'kashier/status' "$INDEX" || {
            echo "ERROR: Kashier payment-status integration missing."
            exit 1
          }

          grep -Fq 'SURVEYQUANT_OPEN_TEST_GATE_BYPASS_V95' "$INDEX" || {
            echo "ERROR: Actual access-gate bypass not present."
            exit 1
          }

          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png"
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_background.png"

          cmp -s \
            "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" \
            "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png" || {
              echo "ERROR: Logo assets differ."
              exit 1
          }

          echo "Verified: source projects, payment integration, logo, background and test-only gate bypass."

      - name: Set app version to 1.0.95 OPEN TEST GATE FIX
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s, n_code = re.subn(
              r'(?m)(\bversionCode\s+)93\b',
              r'\g<1>95',
              s,
              count=1,
          )

          s, n_name = re.subn(
              r'(?m)(\bversionName\s+)(["\'])1\.0\.93\2',
              "\\g<1>'1.0.95'",
              s,
              count=1,
          )

          if n_code != 1 or n_name != 1:
              raise SystemExit(
                  f"ERROR: Could not safely set v1.0.95: "
                  f"versionCode edits={n_code}, versionName edits={n_name}"
              )

          p.write_text(s, encoding="utf-8")
          PY

          grep -Eq 'versionCode[[:space:]]+95([^0-9]|$)' "$PROJECT_DIR/app/build.gradle"

          grep -Eq "versionName[[:space:]]+['\"]1\.0\.95['\"]" "$PROJECT_DIR/app/build.gradle"

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 - \
            "$PROJECT_DIR/app/src/main/assets/index.html" \
            "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re
          import sys

          html = Path(sys.argv[1]).read_text(encoding="utf-8")

          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              html,
              re.S | re.I,
          )

          if not scripts:
              raise SystemExit("ERROR: No inline scripts found.")

          Path(sys.argv[2]).write_text("\n".join(scripts), encoding="utf-8")
          PY

          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}" || {
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD"
          test -n "$SURVEYQUANT_KEY_ALIAS"
          test -n "$SURVEYQUANT_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon clean assembleRelease --stacktrace

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "ERROR: Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/sq-release"

          cp "$APK" \
            "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.95_OPEN_TEST_CONCRETE_2D_3D_GATEFIX.apk"

          sha256sum \
            "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.95_OPEN_TEST_CONCRETE_2D_3D_GATEFIX.apk"

      - name: Upload OPEN-TEST APK only
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.95-OPEN-TEST-GATEFIX-APK-ONLY
          path: ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.95_OPEN_TEST_CONCRETE_2D_3D_GATEFIX.apk
          if-no-files-found: error
          retention-days: 14
