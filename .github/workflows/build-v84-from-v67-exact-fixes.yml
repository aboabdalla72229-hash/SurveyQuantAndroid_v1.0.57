           const nx=modelX2-step*.65,ny=fy2-step*1.15,na=step*.55;line('NORTH_ARROW',{x:nx,y:ny-na,z:0},{x:nx,y:ny+na,z:0},beforeCfg.lineAci);line('NORTH_ARROW',{x:nx,y:ny+na,z:0},{x:nx-step*.16,y:ny+na-step*.27,z:0},beforeCfg.lineAci);line('NORTH_ARROW',{x:nx,y:ny+na,z:0},{x:nx+step*.16,y:ny+na-step*.27,z:0},beforeCfg.lineAci);txt('NORTH_ARROW',nx-step*.12,ny+na+step*.18,step*.30,'N',beforeCfg.detailAci);
