name: Build SurveyQuant v1.0.188 Orientation PDF Save Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v188-orientation-pdf-save-fix.yml"
      - "SurveyQuant_v1.0.188_ORIENTATION_PDF_SAVE_FIX_SOURCE_PATCH.zip"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful v187 signed APK workflow run ID"
        required: true
        type: string
        default: "41815780850"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v188-orientation-pdf-save-fix
  cancel-in-progress: false

jobs:
  build_v188:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41815780850' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install independent DXF audit and PDF fixture dependencies
        run: python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 reportlab==4.4.4 pillow==11.3.0

      - name: Extract and validate v188 source patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_ZIP="SurveyQuant_v1.0.188_ORIENTATION_PDF_SAVE_FIX_SOURCE_PATCH.zip"
          test -s "$PATCH_ZIP" || { echo "ERROR: upload $PATCH_ZIP to repository root."; exit 1; }
          KIT="$RUNNER_TEMP/v188-kit"
          mkdir -p "$KIT"
          unzip -q "$PATCH_ZIP" -d "$KIT"
          for f in index.html SurveyQuant_v1.0.177_CAD_ENGINE.js SurveyQuant_v1.0.188_PACKAGE_FREE_APK.py SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_FIXTURE.py SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_TEST.js SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_AUDIT.py SurveyQuant_v1.0.188_ISOLATION_SAVE_TEST.js SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js SurveyQuant_v1.0.177_APP_PROJECT_TEST.js SurveyQuant_v1.0.177_POINT_PARSER_TEST.js SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js SurveyQuant_v1.0.187_REGRESSION_TEST.js SurveyQuant_v1.0.187_PDF_ONLY_TEST.js V177_VECTOR_TEST.pdf pdfjs-v3.11.174.min.js pdfjs-worker-v3.11.174.min.js; do
            test -s "$KIT/$f" || { echo "ERROR: source patch missing $f"; exit 1; }
          done
          cp "$KIT/pdfjs-worker-v3.11.174.min.js" "$KIT/pdf.worker.js"
          echo "V188_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Create mixed-entity CAD regression fixture
        shell: bash
        run: |
          set -euo pipefail
          cd "$V188_KIT"
          python3 SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_FIXTURE.py

      - name: Create vector-fill and raster PDF regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd "$V188_KIT"
          python3 - <<'PY'
          from reportlab.pdfgen import canvas
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('.')
          c=canvas.Canvas(str(p/'V187_FILLED_VECTOR_FIXTURE.pdf'),pagesize=(300,220),pageCompression=0)
          c.setStrokeColorRGB(0.12,0.24,0.76);c.setLineWidth(1.4)
          c.setFillColorRGB(0.82,0.18,0.10);c.rect(25,35,120,95,stroke=1,fill=1)
          c.setFillColorRGB(0.04,0.12,0.50);c.setFont('Helvetica',16);c.drawString(30,165,'V188 VECTOR FILL TEST')
          c.showPage();c.save()
          im=Image.new('RGB',(40,30),'white');d=ImageDraw.Draw(im);d.rectangle((3,3,35,25),fill=(220,30,30))
          im.save(p/'V188_RASTER_FIXTURE.png')
          c=canvas.Canvas(str(p/'V187_RASTER_FIXTURE.pdf'),pagesize=(300,220),pageCompression=0)
          c.drawImage(str(p/'V188_RASTER_FIXTURE.png'),25,35,width=240,height=150);c.showPage();c.save()
          (p/'V188_RASTER_FIXTURE.png').unlink()
          print('PASS: generated vector-fill PDF and embedded-raster PDF fixtures')
          PY

      - name: Run app, isolation, orientation, CAD and PDF tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$V188_KIT"
          node --check SurveyQuant_v1.0.177_CAD_ENGINE.js
          node --check SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_TEST.js
          node --check SurveyQuant_v1.0.188_ISOLATION_SAVE_TEST.js
          node --check SurveyQuant_v1.0.187_REGRESSION_TEST.js
          node --check SurveyQuant_v1.0.187_PDF_ONLY_TEST.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script id="sq176-cad-engine">')
          a=s.index('>',a)+1
          b=s.index('</script>',a)
          Path('/tmp/sq188-embedded-engine.js').write_text(s[a:b],encoding='utf-8')
          print('PASS: extracted embedded application CAD engine')
          PY
          node --check /tmp/sq188-embedded-engine.js
          node SurveyQuant_v1.0.188_ISOLATION_SAVE_TEST.js . | tee V188_ISOLATION_SAVE_TEST.txt
          node SurveyQuant_v1.0.177_APP_PROJECT_TEST.js index.html | tee V188_PROJECT_TEST.txt
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html | tee V188_POINT_TEST.txt
          node SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js index.html | tee V188_ANDROID_BYTES_TEST.txt
          node SurveyQuant_v1.0.177_CAD_ENGINE_TEST.js | tee V188_CAD_ENGINE_TEST.txt
          node SurveyQuant_v1.0.177_ORIENTATION_BOARD_FILE_TEST.js | tee V188_ORIENTATION_BASE_TEST.txt
          node SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_TEST.js . | tee V188_ORIENTATION_FIDELITY_TEST.txt
          python3 SurveyQuant_v1.0.188_ORIENTATION_FIDELITY_AUDIT.py | tee V188_ORIENTATION_FIDELITY_AUDIT.txt
          node SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js pdfjs-v3.11.174.min.js pdf.worker.js V177_VECTOR_TEST.pdf V188_VECTOR_PDF_TEST.dxf | tee V188_PDF_VECTOR_TEST.txt
          node SurveyQuant_v1.0.187_REGRESSION_TEST.js . | tee V188_V187_REGRESSION_TEST.txt
          node SurveyQuant_v1.0.187_PDF_ONLY_TEST.js . | tee V188_PDF_ONLY_TEST.txt

      - name: Independent DXF audit after orientation and PDF conversion
        shell: bash
        run: |
          set -euo pipefail
          cd "$V188_KIT"
          python3 - <<'PY'
          import ezdxf,json
          from pathlib import Path
          reports=[]
          for name in ('V188_ORIENTATION_FIDELITY_FIXTURE.dxf','V188_ORIENTATION_FIDELITY_OUTPUT.dxf','V188_VECTOR_PDF_TEST.dxf'):
              p=Path(name)
              if not p.is_file() or p.stat().st_size<256: raise SystemExit(f'missing or too-small DXF: {name}')
              doc=ezdxf.readfile(p);audit=doc.audit();types={}
              for e in doc.modelspace(): types[e.dxftype()]=types.get(e.dxftype(),0)+1
              if audit.errors or audit.fixes: raise SystemExit(f'{name}: audit errors={len(audit.errors)}, fixes={len(audit.fixes)}')
              if any(t in types for t in ('IMAGE','IMAGEDEF')): raise SystemExit(f'raster entity embedded in {name}')
              reports.append({'file':name,'version':doc.dxfversion,'entities':types,'audit_errors':len(audit.errors),'audit_fixes':len(audit.fixes)})
          Path('V188_FINAL_DXF_AUDIT.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          PY

      - name: Download successful signed v187 base APK
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v187-base"
          mkdir -p "$BASE"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.187-CLEAN-SESSION-PDF-DXF" --dir "$BASE"
          APK="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.187_FREE_CLEAN_SESSION_PDF_DXF.apk' -print -quit)"
          test -s "$APK" || { echo "ERROR: signed v187 APK missing in source run $SOURCE_RUN_ID"; find "$BASE" -type f; exit 1; }
          echo "V187_BASE_APK=$APK" >> "$GITHUB_ENV"

      - name: Inject tested web app and bump version to v1.0.188
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v188-release"
          mkdir -p "$OUT"
          python3 "$V188_KIT/SurveyQuant_v1.0.188_PACKAGE_FREE_APK.py" \
            --apk-input "$V187_BASE_APK" \
            --apk-output "$OUT/SurveyQuant_v1.0.188_UNSIGNED.apk" \
            --html-to-inject "$V188_KIT/index.html"
          test -s "$OUT/SurveyQuant_v1.0.188_UNSIGNED.apk"
          unzip -t "$OUT/SurveyQuant_v1.0.188_UNSIGNED.apk" | tail -2
          echo "V188_RELEASE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Sign and verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V188_RELEASE_DIR/SurveyQuant_v1.0.188_ALIGNED.apk"
          FINAL="$V188_RELEASE_DIR/SurveyQuant_v1.0.188_FREE_ORIENTATION_PDF_SAVE_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V188_RELEASE_DIR/SurveyQuant_v1.0.188_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -F "versionCode='188' versionName='1.0.188'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V188_RELEASE_DIR/SurveyQuant_v1.0.188_UNSIGNED.apk"

      - name: Package source, checksums and test evidence
        shell: bash
        run: |
          set -euo pipefail
          (cd "$V188_KIT" && zip -qr "$V188_RELEASE_DIR/SurveyQuant_v1.0.188_ORIENTATION_PDF_SAVE_FIX_SOURCE_PATCH.zip" . \
            -x 'V187_*.txt' 'V187_*.json' 'V187_*.dxf' 'V187_FILLED_VECTOR_FIXTURE.pdf' 'V187_RASTER_FIXTURE.pdf' \
               'V188_*.txt' 'V188_*.json' 'V188_*.dxf' 'V188_RASTER_FIXTURE.png' 'pdf.worker.js')
          unzip -t "$V188_RELEASE_DIR/SurveyQuant_v1.0.188_ORIENTATION_PDF_SAVE_FIX_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V188_RELEASE_DIR/SurveyQuant_v1.0.188_FREE_ORIENTATION_PDF_SAVE_FIX.apk" "$V188_RELEASE_DIR/SurveyQuant_v1.0.188_ORIENTATION_PDF_SAVE_FIX_SOURCE_PATCH.zip" "$V188_KIT"/V188_*.dxf > "$V188_RELEASE_DIR/SHA256SUMS.txt"
          cp "$V188_KIT/README_V188_AR.md" "$V188_RELEASE_DIR/README_V188_AR.md"
          cat "$V188_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed APK, source, audit and test evidence
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.188-ORIENTATION-PDF-SAVE-FIX
          path: |
            ${{ runner.temp }}/v188-release/SurveyQuant_v1.0.188_FREE_ORIENTATION_PDF_SAVE_FIX.apk
            ${{ runner.temp }}/v188-release/SurveyQuant_v1.0.188_ORIENTATION_PDF_SAVE_FIX_SOURCE_PATCH.zip
            ${{ runner.temp }}/v188-release/README_V188_AR.md
            ${{ runner.temp }}/v188-release/SHA256SUMS.txt
            ${{ runner.temp }}/v188-kit/V188_*.txt
            ${{ runner.temp }}/v188-kit/V188_*.json
            ${{ runner.temp }}/v188-kit/V188_*.dxf
          if-no-files-found: error
          retention-days: 30
