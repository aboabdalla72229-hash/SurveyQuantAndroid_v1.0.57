name: Build SurveyQuant v1.0.115 - STORM DWG Writer + OSNAP + Nonblocking Export (Library-only WASM build)

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuant_v1.0.115_ORIENTATION_FINAL_PATCH_PACKAGE.zip"
      - ".github/workflows/build-v115-orientation-storm.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout LibreDWG-Web v0.7.14 source
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-web
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Emscripten for writer-enabled LibreDWG
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Install LibreDWG build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gettext zlib1g-dev libpcre2-dev flex bison texinfo python3-dev zip unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages and archive tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -y
          sudo apt-get install -y unzip zip

      - name: Unpack v115 patch bundle and the two original STORM DWG test files
        shell: bash
        run: |
          set -euo pipefail
          PATCH_ARCHIVE="SurveyQuant_v1.0.115_ORIENTATION_FINAL_PATCH_PACKAGE.zip"
          test -s "$PATCH_ARCHIVE" || { echo "ERROR: Upload the v115 patch ZIP to the repository root first."; exit 1; }
          PATCH_DIR="$RUNNER_TEMP/sq-v115-package"
          STORM_DIR="$RUNNER_TEMP/sq-storm-input"
          STORM_OUTPUT_DIR="$RUNNER_TEMP/sq-storm-output"
          mkdir -p "$PATCH_DIR" "$STORM_DIR" "$STORM_OUTPUT_DIR"
          unzip -q "$PATCH_ARCHIVE" -d "$PATCH_DIR"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.115_APPLY_PATCH.py"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.115_ORIENTATION_TOOLS_MODULE.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.115_ORIENTATION_FINAL_TEST.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.115_TEST_STORM_DWG.mjs"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.115_TEST_STORM_TRANSFORM.mjs"
          test -s "$PATCH_DIR/STORM.zip" || { echo "ERROR: The real STORM.zip source boards are missing from the patch package."; exit 1; }
          unzip -q "$PATCH_DIR/STORM.zip" -d "$STORM_DIR"
          DWG_COUNT="$(find "$STORM_DIR" -type f -iname '*.dwg' | wc -l)"
          test "$DWG_COUNT" -eq 2 || { echo "ERROR: Expected the two original STORM DWGs, found $DWG_COUNT."; find "$STORM_DIR" -type f -print; exit 1; }
          echo "V115_PACKAGE_DIR=$PATCH_DIR" >> "$GITHUB_ENV"
          echo "V115_PATCHER=$PATCH_DIR/SurveyQuant_v1.0.115_APPLY_PATCH.py" >> "$GITHUB_ENV"
          echo "V115_MODULE=$PATCH_DIR/SurveyQuant_v1.0.115_ORIENTATION_TOOLS_MODULE.js" >> "$GITHUB_ENV"
          echo "V115_TEST=$PATCH_DIR/SurveyQuant_v1.0.115_ORIENTATION_FINAL_TEST.js" >> "$GITHUB_ENV"
          echo "STORM_TEST_MODULE=$PATCH_DIR/SurveyQuant_v1.0.115_TEST_STORM_DWG.mjs" >> "$GITHUB_ENV"
          echo "STORM_TRANSFORM_TEST=$PATCH_DIR/SurveyQuant_v1.0.115_TEST_STORM_TRANSFORM.mjs" >> "$GITHUB_ENV"
          echo "STORM_INPUT_DIR=$STORM_DIR" >> "$GITHUB_ENV"
          echo "STORM_OUTPUT_DIR=$STORM_OUTPUT_DIR" >> "$GITHUB_ENV"
          echo "STORM_REPORT=$RUNNER_TEMP/STORM_CONVERSION_REPORT.md" >> "$GITHUB_ENV"
          echo "STORM_OUTPUT_ZIP=$RUNNER_TEMP/STORM_CONVERTED_DXF.zip" >> "$GITHUB_ENV"

      - name: Build LibreDWG-Web with DXF writing enabled
        shell: bash
        run: |
          set -euo pipefail
          LIBREDWG_DIR="$GITHUB_WORKSPACE/external/libredwg-web"
          test -s "$LIBREDWG_DIR/configure.ac" || { echo "ERROR: Pinned LibreDWG source was not checked out."; exit 1; }
          cd "$LIBREDWG_DIR"
          ./autogen.sh
          cd bindings/javascript
          node <<'NODE'
          const fs=require('node:fs');
          const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));
          const key='build:prepare';const before=j.scripts[key];
          if(!before)throw new Error('LibreDWG build:prepare script missing');
          j.scripts[key]=before.replace(/\s--disable-write\b/g,'').replace(/\s--disable-dxf\b/g,'');
          if(/--disable-write\b|--disable-dxf\b/.test(j.scripts[key]))throw new Error('Failed to enable DXF writing in LibreDWG build flags');
          // Build only the LibreDWG library objects needed by the JS/WASM binding.
          // The default top-level `make` also builds CLI programs (not needed here),
          // including dwgread.wasm, which can fail in Emscripten with "too many locals".
          const objKey='build:obj'; const objBefore=j.scripts[objKey];
          if(!objBefore)throw new Error('LibreDWG build:obj script missing');
          const objAfter=objBefore.replace(/emmake\s+make(?=\s|$)/, 'emmake make -C src');
          if(objAfter===objBefore && !/emmake\s+make\s+-C\s+src/.test(objBefore))throw new Error('Could not restrict LibreDWG object build to src/');
          j.scripts[objKey]=objAfter;
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          console.log('Writer-enabled configure command:',j.scripts[key]);
          console.log('Library-only object build command:',j.scripts[objKey]);
          NODE
          pnpm install --frozen-lockfile
          pnpm build:prepare
          # Only compile src/ and src/codepages. Do not build programs/dwgread.wasm.
          pnpm build:obj
          test -s ../../build-wasm/src/out_dxf.o || { echo "ERROR: DXF writer object out_dxf.o was not compiled."; exit 1; }
          test -s ../../build-wasm/src/encode.o || { echo "ERROR: DWG/DXF write support object encode.o was not compiled."; exit 1; }
          pnpm build:wasm
          pnpm copy
          pnpm build
          test -s dist/libredwg-web.js
          test -s wasm/libredwg-web.js
          test -s wasm/libredwg-web.wasm
          echo "LIBREDWG_DIR=$LIBREDWG_DIR/bindings/javascript" >> "$GITHUB_ENV"

      - name: Convert and verify both actual STORM DWG files using the writer-enabled engine
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          node "$STORM_TEST_MODULE" "$LIBREDWG_DIR" "$STORM_INPUT_DIR" "$STORM_OUTPUT_DIR" "$STORM_REPORT"
          test -s "$STORM_REPORT"
          test "$(find "$STORM_OUTPUT_DIR" -type f -iname '*.dxf' | wc -l)" -eq 2
          (cd "$STORM_OUTPUT_DIR" && zip -q "$STORM_OUTPUT_ZIP" ./*.dxf)
          test -s "$STORM_OUTPUT_ZIP"

      - name: Publish tested writer-enabled engine in this repository for the Android WebView
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE"
          LIBROOT="$GITHUB_WORKSPACE/external/libredwg-web"
          DEST="$REPO/libredwg-writer"
          git -C "$REPO" config user.name "github-actions[bot]"
          git -C "$REPO" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$REPO" fetch origin main
          git -C "$REPO" rebase origin/main
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$LIBROOT/bindings/javascript/dist" "$DEST/dist"
          cp -a "$LIBROOT/bindings/javascript/wasm" "$DEST/wasm"
          cp "$LIBROOT/README.md" "$DEST/README_UPSTREAM.md"
          for f in LICENSE COPYING COPYING.LESSER; do if [ -s "$LIBROOT/$f" ]; then cp "$LIBROOT/$f" "$DEST/$f"; fi; done
          cat > "$DEST/BUILD_CONFIGURATION.txt" <<'TXT'
          Built from mlightcad/libredwg-web tag v0.7.14.
          The corresponding source is included in libredwg-web-v0.7.14-source.zip.
          The only build-configuration change is removing --disable-write (and --disable-dxf if present) from bindings/javascript/package.json -> scripts.build:prepare so dwg_write_dxf is linked into the WebAssembly module.
          Upstream project license: GPL-3.0. Please review README_UPSTREAM.md and the included upstream license file.
          TXT
          SOURCE_ZIP="$DEST/libredwg-web-v0.7.14-source.zip"
          (cd "$LIBROOT" && zip -qr "$SOURCE_ZIP" . -x '.git/*' 'bindings/javascript/node_modules/*' 'bindings/javascript/dist/*' 'bindings/javascript/wasm/*' 'bindings/javascript/src/libredwg-web.js' 'build-wasm/*' 'examples/dist/*' 'examples/wasm/*')
          git -C "$REPO" add -f libredwg-writer
          if ! git -C "$REPO" diff --cached --quiet; then
            git -C "$REPO" commit -m "Add STORM-tested writer-enabled LibreDWG WebAssembly engine"
            git -C "$REPO" push origin HEAD:main
          fi
          WRITER_SHA="$(git -C "$REPO" rev-parse HEAD)"
          echo "WRITER_SHA=$WRITER_SHA" >> "$GITHUB_ENV"
          echo "Writer engine commit: $WRITER_SHA"

      - name: Unpack source, previous patches, v113 preserve layer, and v115 orientation tools and STORM test
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_NAME="SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
          BASE_PATCH_NAME="SurveyQuant_v1.0.104_DXF_READ_PROJECTION_RESTORE_PATCH.zip"
          MENU_PACKAGE="SurveyQuant_v1.0.106_ORIENTATION_HOME_MENU_PATCH_PACKAGE.zip"
          AXIS_PACKAGE="SurveyQuant_v1.0.107_ORIENTATION_AXIS_READER_PATCH_PACKAGE.zip"
          MANUAL_PACKAGE="SurveyQuant_v1.0.109_ORIENTATION_ZOOM_OSNAP_ID_PATCH_PACKAGE.zip"
          REFERENCE_PACKAGE="SurveyQuant_v1.0.111_DXF_RECOVERY_DELETE_PICK_PATCH_PACKAGE.zip"
          FAITHFUL_PACKAGE="SurveyQuant_v1.0.112_DXF_FAITHFUL_RECOVERY_PATCH_PACKAGE.zip"
          PRESERVE_PACKAGE="SurveyQuant_v1.0.113_CAD_PRESERVE_PATCH_PACKAGE.zip"
          for f in "$SOURCE_NAME" "$BASE_PATCH_NAME" "$MENU_PACKAGE" "$AXIS_PACKAGE" "$MANUAL_PACKAGE" "$REFERENCE_PACKAGE" "$FAITHFUL_PACKAGE" "$PRESERVE_PACKAGE"; do
            test -s "$f" || { echo "ERROR: Required source/patch archive missing: $f"; exit 1; }
          done
          rm -rf "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-base-patch" "$RUNNER_TEMP/sq-menu-patch" "$RUNNER_TEMP/sq-axis-patch" "$RUNNER_TEMP/sq-manual-patch" "$RUNNER_TEMP/sq-reference-patch" "$RUNNER_TEMP/sq-faithful-patch" "$RUNNER_TEMP/sq-preserve-patch"
          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-base-patch" "$RUNNER_TEMP/sq-menu-patch" "$RUNNER_TEMP/sq-axis-patch" "$RUNNER_TEMP/sq-manual-patch" "$RUNNER_TEMP/sq-reference-patch" "$RUNNER_TEMP/sq-faithful-patch" "$RUNNER_TEMP/sq-preserve-patch"
          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$BASE_PATCH_NAME" -d "$RUNNER_TEMP/sq-base-patch"
          unzip -q "$MENU_PACKAGE" -d "$RUNNER_TEMP/sq-menu-patch"
          unzip -q "$AXIS_PACKAGE" -d "$RUNNER_TEMP/sq-axis-patch"
          unzip -q "$MANUAL_PACKAGE" -d "$RUNNER_TEMP/sq-manual-patch"
          unzip -q "$REFERENCE_PACKAGE" -d "$RUNNER_TEMP/sq-reference-patch"
          unzip -q "$FAITHFUL_PACKAGE" -d "$RUNNER_TEMP/sq-faithful-patch"
          unzip -q "$PRESERVE_PACKAGE" -d "$RUNNER_TEMP/sq-preserve-patch"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-base-patch" -type f -name 'index.html' -print -quit)"
          MODULE_JS="$(find "$RUNNER_TEMP/sq-menu-patch" -type f -name 'SurveyQuant_v1.0.106_ORIENTATION_HOME_MENU_MODULE.js' -print -quit)"
          TEST_JS="$(find "$RUNNER_TEMP/sq-menu-patch" -type f -name 'SurveyQuant_v1.0.106_ORIENTATION_HOME_MENU_TEST.js' -print -quit)"
          AXIS_MODULE="$(find "$RUNNER_TEMP/sq-axis-patch" -type f -name 'SurveyQuant_v1.0.107_ORIENTATION_AXIS_READER_PATCH.js' -print -quit)"
          AXIS_TEST="$(find "$RUNNER_TEMP/sq-axis-patch" -type f -name 'SurveyQuant_v1.0.107_ORIENTATION_AXIS_READER_TEST.js' -print -quit)"
          MANUAL_MODULE="$(find "$RUNNER_TEMP/sq-manual-patch" -type f -name 'SurveyQuant_v1.0.109_ORIENTATION_ZOOM_OSNAP_ID_MODULE.js' -print -quit)"
          MANUAL_TEST="$(find "$RUNNER_TEMP/sq-manual-patch" -type f -name 'SurveyQuant_v1.0.109_ORIENTATION_ZOOM_OSNAP_ID_TEST.js' -print -quit)"
          REFERENCE_MODULE="$(find "$RUNNER_TEMP/sq-reference-patch" -type f -name 'SurveyQuant_v1.0.111_DXF_RECOVERY_DELETE_PICK_MODULE.js' -print -quit)"
          REFERENCE_TEST="$(find "$RUNNER_TEMP/sq-reference-patch" -type f -name 'SurveyQuant_v1.0.111_DXF_RECOVERY_DELETE_PICK_TEST.js' -print -quit)"
          FAITHFUL_MODULE="$(find "$RUNNER_TEMP/sq-faithful-patch" -type f -name 'SurveyQuant_v1.0.112_DXF_FAITHFUL_RECOVERY_MODULE.js' -print -quit)"
          FAITHFUL_TEST="$(find "$RUNNER_TEMP/sq-faithful-patch" -type f -name 'SurveyQuant_v1.0.112_DXF_FAITHFUL_RECOVERY_TEST.js' -print -quit)"
          PRESERVE_MODULE="$(find "$RUNNER_TEMP/sq-preserve-patch" -type f -name 'SurveyQuant_v1.0.113_CAD_PRESERVE_MODULE.js' -print -quit)"
          PRESERVE_TEST="$(find "$RUNNER_TEMP/sq-preserve-patch" -type f -name 'SurveyQuant_v1.0.113_CAD_PRESERVE_TEST.js' -print -quit)"
          DXF_TEST="$(find "$RUNNER_TEMP/sq-base-patch" -type f -name 'dxf-parser-restoration-test.js' -print -quit)"
          test -n "$PROJECT" && test -d "$PROJECT" || { echo "ERROR: Android project not found in source ZIP."; exit 1; }
          for f in "$PATCH_INDEX" "$MODULE_JS" "$TEST_JS" "$AXIS_MODULE" "$AXIS_TEST" "$MANUAL_MODULE" "$MANUAL_TEST" "$REFERENCE_MODULE" "$REFERENCE_TEST" "$FAITHFUL_MODULE" "$FAITHFUL_TEST" "$PRESERVE_MODULE" "$PRESERVE_TEST" "$V115_MODULE" "$V115_TEST" "$V115_PATCHER" "$STORM_REPORT" "$DXF_TEST"; do
            test -s "$f" || { echo "ERROR: Required source/module/test missing: $f"; exit 1; }
          done
          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/build.gradle"
          test -s "$PROJECT/app/src/main/AndroidManifest.xml"
          mkdir -p "$PROJECT/app/src/main/assets"
          python3 "$V115_PATCHER" "$PATCH_INDEX" "$AXIS_MODULE" "$REFERENCE_MODULE" "$PRESERVE_MODULE" "$WRITER_SHA"
          cp "$PATCH_INDEX" "$PROJECT/app/src/main/assets/index.html"
          python3 - "$PROJECT/app/src/main/assets/index.html" "$MODULE_JS" "$AXIS_MODULE" "$MANUAL_MODULE" "$REFERENCE_MODULE" "$FAITHFUL_MODULE" "$PRESERVE_MODULE" "$V115_MODULE" <<'PY'
          from pathlib import Path
          import sys
          html_path,module_path,axis_path,manual_path,reference_path,faithful_path,preserve_path,v115_path=map(Path,sys.argv[1:])
          html=html_path.read_text(encoding='utf-8')
          module=module_path.read_text(encoding='utf-8')
          axis=axis_path.read_text(encoding='utf-8')
          manual=manual_path.read_text(encoding='utf-8')
          reference=reference_path.read_text(encoding='utf-8')
          # The v115 source patch already exposes the final v111 state/API.
          faithful=faithful_path.read_text(encoding='utf-8')
          preserve=preserve_path.read_text(encoding='utf-8')
          v115=v115_path.read_text(encoding='utf-8')
          marker='<script id="sq-orientation-module">'
          axis_marker='<script id="sq-orientation-axis-reader-module">'
          manual_marker='<script id="sq-orientation-manual-points-module">'
          reference_marker='<script id="sq-orientation-reference-board-module">'
          faithful_marker='<script id="sq-orientation-dxf-faithful-recovery-module">'
          preserve_marker='<script id="sq-orientation-cad-preserve-module">'
          v115_marker='<script id="sq-orientation-v115-tools-module">'
          if any(x in html for x in (marker,axis_marker,manual_marker,reference_marker,faithful_marker,preserve_marker,v115_marker)):
            raise SystemExit('ERROR: Orientation scripts are already injected in baseline HTML.')
          if '</body>' not in html:
            raise SystemExit('ERROR: Could not locate body end in index.html.')
          injected=(marker+'\n'+module+'\n</script>\n'+axis_marker+'\n'+axis+'\n</script>\n'+manual_marker+'\n'+manual+'\n</script>\n'+reference_marker+'\n'+reference+'\n</script>\n'+faithful_marker+'\n'+faithful+'\n</script>\n'+preserve_marker+'\n'+preserve+'\n</script>\n'+v115_marker+'\n'+v115+'\n</script>\n</body>')
          html=html.replace('</body>',injected,1)
          import re
          html,n=re.subn(r'const SQ_APP_VERSION_CODE = \d+;', 'const SQ_APP_VERSION_CODE = 115;', html, count=1)
          if n != 1 or 'const SQ_APP_VERSION_CODE = 115;' not in html:
            raise SystemExit('ERROR: Failed to set HTML app version code to 115.')
          html_path.write_text(html,encoding='utf-8')
          PY
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "INDEX_PATH=$PROJECT/app/src/main/assets/index.html" >> "$GITHUB_ENV"
          echo "PATCH_INDEX=$PATCH_INDEX" >> "$GITHUB_ENV"
          echo "MODULE_JS=$MODULE_JS" >> "$GITHUB_ENV"
          echo "TEST_JS=$TEST_JS" >> "$GITHUB_ENV"
          echo "AXIS_MODULE=$AXIS_MODULE" >> "$GITHUB_ENV"
          echo "AXIS_TEST=$AXIS_TEST" >> "$GITHUB_ENV"
          echo "MANUAL_MODULE=$MANUAL_MODULE" >> "$GITHUB_ENV"
          echo "MANUAL_TEST=$MANUAL_TEST" >> "$GITHUB_ENV"
          echo "REFERENCE_MODULE=$REFERENCE_MODULE" >> "$GITHUB_ENV"
          echo "REFERENCE_TEST=$REFERENCE_TEST" >> "$GITHUB_ENV"
          echo "FAITHFUL_MODULE=$FAITHFUL_MODULE" >> "$GITHUB_ENV"
          echo "FAITHFUL_TEST=$FAITHFUL_TEST" >> "$GITHUB_ENV"
          echo "PRESERVE_MODULE=$PRESERVE_MODULE" >> "$GITHUB_ENV"
          echo "PRESERVE_TEST=$PRESERVE_TEST" >> "$GITHUB_ENV"
          echo "V115_MODULE=$V115_MODULE" >> "$GITHUB_ENV"
          echo "V115_TEST=$V115_TEST" >> "$GITHUB_ENV"
          echo "V115_PATCHER=$V115_PATCHER" >> "$GITHUB_ENV"
          echo "DXF_TEST=$DXF_TEST" >> "$GITHUB_ENV"

      - name: Verify original projects and CAD orientation integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$INDEX_PATH" "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import sys
          index=Path(sys.argv[1]).read_text(encoding='utf-8')
          gradle=Path(sys.argv[2]).read_text(encoding='utf-8')
          required=[
            'function parseDXF(text){',
            'function mergeProjectionDxfPreservingReference(rawBytes, additions)',
            'async function dropFilesMerge(){',
            'id="project1Card"','id="profileCard"','id="roadCard"','id="dropFilesCard"','id="paymentCard"',
            'const SQ_APP_VERSION_CODE = 115;',
            'id="sq-orientation-module"','id="sq-orientation-axis-reader-module"','id="sq-orientation-manual-points-module"','id="sq-orientation-reference-board-module"','id="sq-orientation-dxf-faithful-recovery-module"','id="sq-orientation-cad-preserve-module"','id="sq-orientation-v115-tools-module"',
            'window.__sqOrientation113API','normalizeBlankPairLines','v115Diagnostics','window.__sqOrientation115Tools','SQ_WRITER_ENGINE_URL','sq110ReadAxesBtn','sq110TZoomRange','sq110TSnapMode',
            "card.id = 'sqOrientationCard'",'sqOrientationMenuButton',
            "window.openProjectPage('sqOrientationCard')",'window.sqOpenOrientationProject',
            'sqOriReadAxesBtn','function sqOriDetectIntersections(model)',
            'sq108Canvas','sq108P1X','sq108P2Y','window.safeDownloadFile(result.bytes','sq109IdPoint','sq109CopyId','sq109ToolMode','pointerdown','pointermove','pointerup',"gestureMode==='pinch'",'findNearestIntersection','zoomTransformAt','pinchZoom','تقاطع تلقائي (OSNAP)',
            'sq110TargetCanvas','sq110ReferenceCanvas','sq110T1X','sq110R1X','sq110ToReference','sq110Export','sq110Delete','sq110UndoDelete','function universalTransformBytes(input,t)','window.__sqOrientation111API',
            'async function sqOriConvertTargetToDxf(targetFile, loaderOverride)','lib.dwg_write_dxf(bytes.buffer)','window.parseFile(file)',
          ]
          missing=[x for x in required if x not in index]
          if missing: raise SystemExit('ERROR: Missing required baseline or orientation functionality: '+', '.join(missing))
          if 'function openProjectPage(id)' not in index or "classList.add('active-project')" not in index:
            raise SystemExit('ERROR: Existing project navigation cannot activate orientation card.')
          if 'project-card{display:none' not in index.replace(' ',''):
            raise SystemExit('ERROR: Existing project-card visibility rule changed unexpectedly.')
          if not gradle: raise SystemExit('ERROR: Gradle configuration is empty.')
          print('PASS: baseline projects plus v106-v115 orientation modules integrated.')
          PY
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png"
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_background.png"
          cmp -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png" || { echo "ERROR: Logo assets differ."; exit 1; }

      - name: Set Android release version to 1.0.115
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          s,nc=re.subn(r'(?m)(\bversionCode\s+)\d+\b',r'\g<1>115',s,count=1)
          s,nn=re.subn(r"(?m)(\bversionName\s+)([\"'])\d+\.\d+\.\d+\2",r"\g<1>'1.0.115'",s,count=1)
          if nc!=1 or nn!=1: raise SystemExit(f'ERROR: Version edits failed (code={nc}, name={nn}).')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Eq 'versionCode[[:space:]]+115([^0-9]|$)' "$PROJECT_DIR/app/build.gradle"
          grep -Eq "versionName[[:space:]]+['\"]1\.0\.115['\"]" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'const SQ_APP_VERSION_CODE = 115;' "$INDEX_PATH"

      - name: Run JavaScript and CAD-preservation regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check "$MODULE_JS"
          node "$TEST_JS" "$MODULE_JS"
          node --check "$AXIS_MODULE"
          node "$AXIS_TEST" "$AXIS_MODULE"
          node --check "$MANUAL_MODULE"
          node "$MANUAL_TEST" "$MANUAL_MODULE" "$MODULE_JS"
          node --check "$REFERENCE_MODULE"
          node "$REFERENCE_TEST" "$MODULE_JS" "$MANUAL_MODULE" "$REFERENCE_MODULE"
          node --check "$FAITHFUL_MODULE"
          node "$FAITHFUL_TEST" "$MODULE_JS" "$MANUAL_MODULE" "$REFERENCE_MODULE" "$FAITHFUL_MODULE"
          # Keep the legacy v104 parser regression fixture version-pinned without touching the v115 app assets.
          cp "$PATCH_INDEX" "$RUNNER_TEMP/dxf-parser-restoration-test.html"
          python3 - "$RUNNER_TEMP/dxf-parser-restoration-test.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'const SQ_APP_VERSION_CODE = \d+;', 'const SQ_APP_VERSION_CODE = 104;', s, count=1)
          if n!=1: raise SystemExit('ERROR: Could not create the isolated v104 DXF regression fixture.')
          p.write_text(s,encoding='utf-8')
          PY
          node "$DXF_TEST" "$RUNNER_TEMP/dxf-parser-restoration-test.html"
          node --check "$PRESERVE_MODULE"
          echo "The old v113 hard-veto test is intentionally replaced by the v115 nonblocking-export test."
          node --check "$V115_MODULE"
          node "$V115_TEST" "$REFERENCE_MODULE" "$PRESERVE_MODULE" "$V115_MODULE" "$INDEX_PATH"
          node --check "$STORM_TRANSFORM_TEST"
          node "$STORM_TRANSFORM_TEST" "$REFERENCE_MODULE" "$MANUAL_MODULE" "$FAITHFUL_MODULE" "$PRESERVE_MODULE" "$STORM_OUTPUT_DIR" "$STORM_OUTPUT_DIR" "$STORM_REPORT"
          rm -f "$STORM_OUTPUT_ZIP"
          (cd "$STORM_OUTPUT_DIR" && zip -q "$STORM_OUTPUT_ZIP" ./*.dxf)
          test -s "$STORM_OUTPUT_ZIP"
          python3 - "$INDEX_PATH" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re,sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          if not scripts: raise SystemExit('ERROR: No inline JavaScript found.')
          Path(sys.argv[2]).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_BASE64 is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: Secret SURVEYQUANT_KEY_ALIAS is missing."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: Secret SURVEYQUANT_KEY_PASSWORD is missing."; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed APK and source patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease --stacktrace
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "ERROR: Release APK was not generated."; find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true; exit 1; }
          RELEASE="$RUNNER_TEMP/sq-release"
          mkdir -p "$RELEASE/source-patch"
          cp "$APK" "$RELEASE/SurveyQuant_v1.0.115_ORIENTATION_STORM_FIX.apk"
          cp "$INDEX_PATH" "$RELEASE/source-patch/index.html"
          cp "$MODULE_JS" "$RELEASE/source-patch/SurveyQuant_v1.0.106_ORIENTATION_HOME_MENU_MODULE.js"
          cp "$TEST_JS" "$RELEASE/source-patch/SurveyQuant_v1.0.106_ORIENTATION_HOME_MENU_TEST.js"
          cp "$AXIS_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.107_ORIENTATION_AXIS_READER_PATCH.js"
          cp "$AXIS_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.107_ORIENTATION_AXIS_READER_TEST.js"
          cp "$MANUAL_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.109_ORIENTATION_ZOOM_OSNAP_ID_MODULE.js"
          cp "$MANUAL_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.109_ORIENTATION_ZOOM_OSNAP_ID_TEST.js"
          cp "$REFERENCE_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.111_DXF_RECOVERY_DELETE_PICK_MODULE.js"
          cp "$REFERENCE_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.111_DXF_RECOVERY_DELETE_PICK_TEST.js"
          cp "$FAITHFUL_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.112_DXF_FAITHFUL_RECOVERY_MODULE.js"
          cp "$FAITHFUL_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.112_DXF_FAITHFUL_RECOVERY_TEST.js"
          cp "$PRESERVE_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.113_CAD_PRESERVE_MODULE.js"
          cp "$PRESERVE_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.113_CAD_PRESERVE_TEST.js"
          cp "$V115_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.115_ORIENTATION_TOOLS_MODULE.js"
          cp "$V115_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.115_ORIENTATION_FINAL_TEST.js"
          cp "$V115_PATCHER" "$RELEASE/source-patch/SurveyQuant_v1.0.115_APPLY_PATCH.py"
          cp "$STORM_TEST_MODULE" "$RELEASE/source-patch/SurveyQuant_v1.0.115_TEST_STORM_DWG.mjs"
          cp "$STORM_TRANSFORM_TEST" "$RELEASE/source-patch/SurveyQuant_v1.0.115_TEST_STORM_TRANSFORM.mjs"
          cp "$STORM_REPORT" "$RELEASE/source-patch/STORM_CONVERSION_REPORT.md"
          cp "$STORM_OUTPUT_ZIP" "$RELEASE/STORM_CONVERTED_DXF.zip"
          cp "$DXF_TEST" "$RELEASE/source-patch/dxf-parser-restoration-test.js"
          cat > "$RELEASE/source-patch/README_AR.txt" <<'TXT'
          SurveyQuant v1.0.115 - إصلاح توجيه STORM
          - تم تضمين ملفي STORM DWG الأصليين في اختبار البناء الفعلي. يفشل البناء إذا لم يتم تحويل الاثنين أو إذا فشل اختبار التحويل الهندسي الفعلي على ناتج كل ملف.
          - تم بناء LibreDWG-Web v0.7.14 مع إزالة --disable-write من build:prepare؛ المكتبة الافتراضية المنشورة من دون هذا الخيار لا تربط كتابة DWG/DXF رغم وجود اسم دالة الكتابة في واجهة JavaScript.
          - يظل الناتج DXF جديدًا والملف الأصلي لا يُكتب فوقه. يحتفظ محول DWG بحدود ما يستطيع LibreDWG تمثيله في DXF، لذلك يُراجع تقرير تحويل STORM الناتج مع CAD للتأكد من الكائنات الوكيلة/المتخصصة.
          - فحص الحفاظ أصبح تشخيصيًا فقط ولا يمنع التنزيل؛ أخطاء التحويل الفعلية فقط تُعرض للمستخدم. أصلحنا كذلك تحويل رؤوس POLYLINE التقليدي، وأضفنا تكبيرًا حتى 5000x وطرق OSNAP للتقاطع والرأس والمنتصف والأقرب والعمود والنقرة الحرة وإدخال إحداثيات يدوي.
          - يختبر البناء ملفي STORM الفعليين ولا يعتمد على اختبار هندسي اصطناعي وحده.
          TXT
          (cd "$RELEASE/source-patch" && zip -qr "$RELEASE/SurveyQuant_v1.0.115_ORIENTATION_STORM_SOURCE_PATCH.zip" .)
          sha256sum "$RELEASE/SurveyQuant_v1.0.115_ORIENTATION_STORM_FIX.apk" "$RELEASE/SurveyQuant_v1.0.115_ORIENTATION_STORM_SOURCE_PATCH.zip" "$RELEASE/STORM_CONVERTED_DXF.zip" > "$RELEASE/SHA256SUMS.txt"
          cat "$RELEASE/SHA256SUMS.txt"
          echo "RELEASE_DIR=$RELEASE" >> "$GITHUB_ENV"

      - name: Upload APK and source patch
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.115-ORIENTATION-STORM-FIX
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.115_ORIENTATION_STORM_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.115_ORIENTATION_STORM_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/STORM_CONVERTED_DXF.zip
            ${{ runner.temp }}/sq-release/source-patch/STORM_CONVERSION_REPORT.md
          if-no-files-found: error
          retention-days: 14


      - name: Upload STORM conversion diagnostics even if the real-file test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.115-STORM-DIAGNOSTICS-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/STORM_CONVERSION_REPORT.md
            ${{ runner.temp }}/sq-storm-output/**
          if-no-files-found: warn
          retention-days: 14
