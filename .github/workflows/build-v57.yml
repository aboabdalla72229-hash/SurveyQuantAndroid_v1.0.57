name: Build SurveyQuant v1.0.57 PATCH4

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip"
      - ".github/workflows/build-v57.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -s SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip || {
            echo "ERROR: Source ZIP not found"
            exit 1
          }

          echo "Source ZIP found successfully."

      - name: Extract source
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            SurveyQuantAndroid_v1.0.57_PATCH4_UPDATE.zip \
            -d extracted

          echo "Source extracted successfully."

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is empty or missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD is empty or missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: SURVEYQUANT_KEY_ALIAS is empty or missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: SURVEYQUANT_KEY_PASSWORD is empty or missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/surveyquant-ci.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Keystore prepared successfully."

      - name: Verify signing configuration
        run: |
          echo "Checking signing configuration..."

          test -f "$SURVEYQUANT_KEYSTORE_FILE" || {
            echo "ERROR: SURVEYQUANT_KEYSTORE_FILE does not exist."
            exit 1
          }

          echo "Keystore file exists."
          echo "Keystore path configured."

      - name: Build APK
        run: |
          echo "Building SurveyQuant v1.0.57 PATCH4..."

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} output/ \;

          echo "Generated APK files:"
          ls -lah output

          if ! ls output/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Generate SHA256
        run: |
          cd output

          sha256sum *.apk > SHA256SUMS.txt

          echo "SHA256:"
          cat SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57-PATCH4-APK
          path: output/
          if-no-files-found: error
