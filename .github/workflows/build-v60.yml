name: Build SurveyQuant v1.0.60

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract v1.0.60 source
        shell: bash
        run: |
          set -e

          ZIP="SurveyQuantAndroid_v1.0.60_REPAIRED_SOURCE.zip"

          test -f "$ZIP"

          rm -rf source
          mkdir -p source

          unzip -q "$ZIP" -d source

          echo "Source extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find source -type f -path '*/app/build.gradle' -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found inside source ZIP"
            echo "Files found:"
            find source -type f | head -n 200
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$(dirname "$APP_GRADLE")")

          test -f "$PROJECT_ROOT/gradlew"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_ROOT/app/src/main/assets/index.html"

          echo "ANDROID_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"
          echo "Gradle file: $APP_GRADLE"

      - name: Verify version 1.0.60
        shell: bash
        run: |
          set -e

          grep -n "versionCode" "$ANDROID_APP_GRADLE"
          grep -n "versionName" "$ANDROID_APP_GRADLE"

          grep -qE 'versionCode[[:space:]]+60' "$ANDROID_APP_GRADLE"

          grep -qE "versionName[[:space:]]+['\"]1\.0\.60['\"]" "$ANDROID_APP_GRADLE"

          echo "Version 1.0.60 verified."

      - name: Check four signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "All four signing secrets are available."

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE
