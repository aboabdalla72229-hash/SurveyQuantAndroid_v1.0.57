
name: Build SurveyQuant v1.0.93 - Orientation Axes + Preserve DXF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"
      - "SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF_PATCH.zip"
      - ".github/workflows/build-v93-orientation-axes-preserve.yml"

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip
  PATCH_NAME: SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF_PATCH.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract source and apply patch
        shell: bash
        run: |
          set -euo pipefail

          test -s "$SOURCE_NAME" || {
            echo "ERROR: Missing source ZIP: $SOURCE_NAME"
            exit 1
          }

          test -s "$PATCH_NAME" || {
            echo "ERROR: Missing patch ZIP: $PATCH_NAME"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/sq-source" "$RUNNER_TEMP/sq-patch"

          unzip -q "$SOURCE_NAME" -d "$RUNNER_TEMP/sq-source"
          unzip -q "$PATCH_NAME" -d "$RUNNER_TEMP/sq-patch"

          PROJECT="$(find "$RUNNER_TEMP/sq-source" \
            -type f -path '*/app/build.gradle' -print -quit \
            | sed 's#/app/build.gradle$##')"

          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" \
            -type f -name 'index.html' -print -quit)"

          test -n "$PROJECT" && test -d "$PROJECT" || {
            echo "ERROR: Android project not found."
            exit 1
          }

          test -n "$PATCH_INDEX" && test -s "$PATCH_INDEX" || {
            echo "ERROR: Patch index.html not found."
            exit 1
          }

          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/build.gradle"
          test -s "$PROJECT/app/src/main/AndroidManifest.xml"
          test -d "$PROJECT/app/src/main/assets"

          cp "$PATCH_INDEX" "$PROJECT/app/src/main/assets/index.html"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Patch applied successfully."

      - name: Verify version and required assets
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -Eq 'versionCode[[:space:]]+93([^0-9]|$)' "$GRADLE_FILE" || {
            echo "ERROR: versionCode 93 not found."
            exit 1
          }

          grep -Eq "versionName[[:space:]]+['\"]1\\.0\\.93['\"]" "$GRADLE_FILE" || {
            echo "ERROR: versionName 1.0.93 not found."
            exit 1
          }

          grep -Fq 'minimumVersionCode' "$INDEX"
          grep -Fq 'kashier/create-session' "$INDEX"
          grep -Fq 'kashier/status' "$INDEX"
          grep -Fq 'انتهت فترة الاستخدام المجاني لمدة 3 أيام' "$INDEX"

          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png"
          test -s "$PROJECT_DIR/app/src/main/assets/surveyquant_background.png"

          cmp -s \
            "$PROJECT_DIR/app/src/main/assets/surveyquant_logo.png" \
            "$PROJECT_DIR/app/src/main/res/drawable-nodpi/surveyquant_app_logo.png" || {
            echo "ERROR: Logo assets do not match."
            exit 1
          }

          echo "Version and assets verified."

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" \
            "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          from pathlib import Path
          import re
          import sys

          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              html,
              re.S | re.I
          )

          if not scripts:
              raise SystemExit("ERROR: No inline JavaScript found.")

          Path(sys.argv[2]).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )
          PY

          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}" || {
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is missing."
            exit 1
          }

          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD"
          test -n "$SURVEYQUANT_KEY_ALIAS"
          test -n "$SURVEYQUANT_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/surveyquant-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease --stacktrace

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "ERROR: Release APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/sq-release"

          cp "$APK" \
            "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF.apk"

          sha256sum \
            "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF.apk"

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.93-APK-ONLY
          path: ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.93_ORIENTATION_AXES_PRESERVE_DXF.apk
          if-no-files-found: error
          retention-days: 14
