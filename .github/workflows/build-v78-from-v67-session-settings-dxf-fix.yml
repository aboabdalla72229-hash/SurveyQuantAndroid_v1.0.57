name: Build SurveyQuant v1.0.77 - Exact User Logo

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.77_FROM_V67_EXACT_USER_LOGO.zip"
      - ".github/workflows/build-v77-from-v67-exact-user-logo.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="SurveyQuantAndroid_v1.0.77_FROM_V67_EXACT_USER_LOGO.zip"
          test -f "$ZIP"
          rm -rf extracted source
          mkdir -p extracted source
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR="$(find extracted -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 5 -type f | sort | head -200
            exit 1
          fi
          cp -R "$PROJECT_DIR/." source/
          echo "Project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing
        shell: bash
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          echo "$KS_B64" | base64 --decode > "$GITHUB_WORKSPACE/surveyquant-release.keystore"
          echo "SURVEYQUANT_KEYSTORE_FILE=$GITHUB_WORKSPACE/surveyquant-release.keystore" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SURVEYQUANT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: source
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find source -type f -name '*.apk' -path '*/outputs/apk/release/*' -print -quit)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/SurveyQuant-v1.0.77-exact-user-logo-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.77-exact-user-logo-release
          path: output/SurveyQuant-v1.0.77-exact-user-logo-release.apk
          if-no-files-found: error
