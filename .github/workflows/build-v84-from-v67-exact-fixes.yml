           for(let x=Math.floor(minx/step)*step;x<=maxx+1e-9;x+=step){line('GRID',{x,y:miny,z:0},{x,y:maxy,z:0},gs.gridAci);txt('GRID',x,miny-step*.28,Math.max(.12,span*.0015),x.toFixed(2),0,gs.gridAci);}
