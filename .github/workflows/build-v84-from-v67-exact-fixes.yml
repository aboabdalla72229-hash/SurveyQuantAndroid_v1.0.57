           const contours=stitchContours(contourSegs);for(const c of contours){const major=Math.abs((c.z/ci)-Math.round(c.z/ci))<1e-8;ent.push({type:'POLYLINE3D',layer:major?'MAJOR_CONTOURS':'CONTOURS',color:gs.contourAci,vertices:c.points,closed:false});if(c.points.length>1){const mid=c.points[Math.floor(c.points.length/2)];txt('CONTOUR_LABELS',mid.x,mid.y,Math.max(.14,span*.0017),Number(c.z).toFixed(2),0,gs.detailAci);}}
