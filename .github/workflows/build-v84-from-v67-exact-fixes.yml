           const x1=dividerX+step*.32,x2=fx2-step*.32,rowH=Math.max(step*.52,span*.018),top=fy2-step*1.65;for(let i=0;i<=rows.length;i++)line('TABLE',{x:x1,y:top-i*rowH,z:0},{x:x2,y:top-i*rowH,z:0},7);line('TABLE',{x:x1,y:top,z:0},{x:x1,y:top-rows.length*rowH,z:0},7);line('TABLE',{x:x2,y:top,z:0},{x:x2,y:top-rows.length*rowH,z:0},7);rows.forEach((r,i)=>txt('TABLE',x1+step*.18,top-(i+.68)*rowH,Math.max(.12,rowH*.34),r[0]+' : '+r[1],0,gs.textAci));
           const by=fy1+step*.42;line('FRAME',{x:fx1,y:by,z:0},{x:fx2,y:by,z:0},7);txt('TITLE',fx1+step*.35,fy1+step*.18,Math.max(.12,step*.24),'DRAWING GENERATED BY SURVEYQUANT',0,gs.textAci);
           return{entities:ent,points};
          }
