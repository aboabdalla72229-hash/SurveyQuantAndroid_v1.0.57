            assert.equal(normal.values.get('surveyquant.projectOutputSettings.v2')?.includes('#123456'),true,'output settings must survive session reset');
            assert.equal(normal.values.get('sq_device_id'),'SQ-device-preserved','device identity must survive session reset');
            assert.equal(normal.values.has('sq_access_until'),true,'access/payment state must survive session reset');
            assert.equal(normal.session.cleared,1,'sessionStorage must be cleared on startup');
            normal.advance(1000); normal.visibility('hidden'); normal.advance(2000); normal.visibility('visible');
            assert.equal(normal.win.location.reloadCount,1,'returning from background must reload WebView to drop in-memory drawings');

            const blurFallback=makeHarness();
            blurFallback.advance(1000);
