          V134_PATCH_B64
          base64 --decode "$RUNNER_TEMP/v134_patch.b64" > "$EMBEDDED_V134"
          ACTUAL_V134_SHA256="$(sha256sum "$EMBEDDED_V134" | awk '{print $1}')"
          test "$ACTUAL_V134_SHA256" = "$EXPECTED_V134_SHA256" || { echo "ERROR: embedded V134 patch checksum mismatch."; exit 1; }
          if ! test -s "$V134_KIT" || ! cmp -s "$EMBEDDED_V134" "$V134_KIT"; then
            cp "$EMBEDDED_V134" "$V134_KIT"
            echo "Recovered exact V134 patch ZIP from embedded workflow data."
          fi
          for f in "$BASE_KIT" "$PATCH_KIT" "$V130_KIT" "$V131_KIT" "$V134_KIT"; do
            test -s "$f" || { echo "ERROR: required build kit missing: $f"; exit 1; }
