name: Build SurveyQuant v1.0.57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found: $SOURCE_ZIP"
            exit 1
          fi

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP is empty."
            exit 1
          fi

          echo "Source ZIP found: $SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip" \
            -d extracted

          echo "Source extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."

            echo "Available Gradle files:"
            find extracted -type f \
              \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "Building from:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found in project directory."
            find "$PROJECT_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          rm -rf release
          mkdir -p release

          find "$PROJECT_DIR" -type f -name "*.apk" -exec cp {} release/ \;
          find "$PROJECT_DIR" -type f -name "*.aab" -exec cp {} release/ \;

          echo "Generated files:"
          find release -type f -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57
          path: release/*
          if-no-files-found: error
