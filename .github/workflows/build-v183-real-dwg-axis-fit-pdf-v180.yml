name: Build SurveyQuant v1.0.183 Real CAD Axis Fit + PDF V180

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V181 signed APK artifact run ID"
        required: true
        type: string
        default: "41589895573"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v183-real-dwg-axis-fit-pdf-v180.yml"
      - "SurveyQuant_v1.0.183_FIX_KIT.zip"
      - "SurveyQuant_v1.0.183_GITHUB_UPLOAD_BUNDLE.zip"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v183-real-cad-axis-fit-pdf-v180
  cancel-in-progress: false

jobs:
  build_v183:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41589895573' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract V183 fix kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_ARCHIVE=""
          BUNDLE_DIR="$RUNNER_TEMP/v183-upload-bundle"
          if [ -s SurveyQuant_v1.0.183_FIX_KIT.zip ]; then
            KIT_ARCHIVE="$GITHUB_WORKSPACE/SurveyQuant_v1.0.183_FIX_KIT.zip"
            echo "Using standalone V183 FIX_KIT."
          elif [ -s SurveyQuant_v1.0.183_GITHUB_UPLOAD_BUNDLE.zip ]; then
            rm -rf "$BUNDLE_DIR" && mkdir -p "$BUNDLE_DIR"
            unzip -q SurveyQuant_v1.0.183_GITHUB_UPLOAD_BUNDLE.zip -d "$BUNDLE_DIR"
            KIT_ARCHIVE="$(find "$BUNDLE_DIR" -type f -name 'SurveyQuant_v1.0.183_FIX_KIT.zip' -print -quit)"
            test -n "$KIT_ARCHIVE" && test -s "$KIT_ARCHIVE" || { echo "ERROR: upload bundle does not contain SurveyQuant_v1.0.183_FIX_KIT.zip"; exit 1; }
            echo "Extracted V183 FIX_KIT from upload bundle."
          else
            echo "ERROR: upload SurveyQuant_v1.0.183_FIX_KIT.zip OR SurveyQuant_v1.0.183_GITHUB_UPLOAD_BUNDLE.zip in repository root"
            exit 1
          fi
          KIT="$RUNNER_TEMP/v183-kit"
          rm -rf "$KIT" && mkdir -p "$KIT"
          unzip -q "$KIT_ARCHIVE" -d "$KIT"
          for f in index.html SurveyQuant_v1.0.183_CAD_ENGINE.js SurveyQuant_v1.0.183_PACKAGE_FREE_APK.py test_v183_engine_regression.js test_v183_pdf_v180_output.py SurveyQuant_v1.0.177_POINT_PARSER_TEST.js SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js README_V183_AR.md V183_TEST_REPORT_AR.txt; do
            test -s "$KIT/$f" || { echo "ERROR: missing $f in V183 kit"; exit 1; }
          done
          echo "V183_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Download successful V181 signed base APK
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v181-base"
          OUT="$RUNNER_TEMP/v183-release"
          SRC="$RUNNER_TEMP/v183-source"
          rm -rf "$BASE" "$OUT" "$SRC"
          mkdir -p "$BASE" "$OUT" "$SRC"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.181-FREE-LOCAL-FRAME-OLE-PDF-DUAL-CAD" --dir "$BASE"
          APK="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.181_FREE_ANDROID_LOCAL_FRAME_PDF_DUAL_CAD.apk' -print -quit)"
          test -s "$APK" || { echo "ERROR: signed V181 base APK was not found in run $SOURCE_RUN_ID"; exit 1; }
          echo "V183_BASE_APK=$APK" >> "$GITHUB_ENV"
          echo "V183_RELEASE_DIR=$OUT" >> "$GITHUB_ENV"
          echo "V183_SOURCE_DIR=$SRC" >> "$GITHUB_ENV"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 playwright reportlab==4.4.9 pillow
          python3 -m playwright install --with-deps chromium

      - name: Run V183 engine, parser, and PDF V180 regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$V183_KIT"
          node test_v183_engine_regression.js | tee "$V183_RELEASE_DIR/V183_ENGINE_TEST_LOG.txt"
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js index.html
          python3 test_v183_pdf_v180_output.py | tee "$V183_RELEASE_DIR/V183_PDF_V180_TEST_LOG.txt"
          for f in V183_MIXED_V180_COMPAT.dxf V183_RASTER_V180_COMPAT.dxf V183_VECTOR_V180_COMPAT.dxf; do
            test -s "$f" && cp "$f" "$V183_RELEASE_DIR/"
          done

      - name: Package V183 APK from signed V181 base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V183_KIT/SurveyQuant_v1.0.183_PACKAGE_FREE_APK.py" \
            --apk-input "$V183_BASE_APK" \
            --apk-output "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_UNSIGNED.apk" \
            --html-to-inject "$V183_KIT/index.html"
          test -s "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_UNSIGNED.apk"
          unzip -t "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_UNSIGNED.apk" | tail -2

      - name: Sign and verify V183 APK with existing release key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_ALIGNED.apk"
          FINAL="$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_ANDROID_REAL_CAD_AXIS_FIT_PDF_V180.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -F "versionCode='183' versionName='1.0.183'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_UNSIGNED.apk"

      - name: Build V183 source patch and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$V183_KIT/." "$V183_SOURCE_DIR/"
          cp "$V183_KIT/README_V183_AR.md" "$V183_RELEASE_DIR/README_V183_AR.md"
          cp "$V183_KIT/V183_TEST_REPORT_AR.txt" "$V183_RELEASE_DIR/V183_TEST_REPORT_AR.txt"
          (cd "$V183_SOURCE_DIR" && zip -qr "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_ANDROID_REAL_CAD_AXIS_FIT_PDF_V180.apk" "$V183_RELEASE_DIR/SurveyQuant_v1.0.183_FREE_SOURCE_PATCH.zip" "$V183_RELEASE_DIR"/*.dxf > "$V183_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V183_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed V183 APK, source, logs, and CAD test outputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.183-FREE-REAL-CAD-AXIS-FIT-PDF-V180
          path: |
            ${{ runner.temp }}/v183-release/SurveyQuant_v1.0.183_FREE_ANDROID_REAL_CAD_AXIS_FIT_PDF_V180.apk
            ${{ runner.temp }}/v183-release/SurveyQuant_v1.0.183_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v183-release/README_V183_AR.md
            ${{ runner.temp }}/v183-release/V183_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v183-release/V183_ENGINE_TEST_LOG.txt
            ${{ runner.temp }}/v183-release/V183_PDF_V180_TEST_LOG.txt
            ${{ runner.temp }}/v183-release/SHA256SUMS.txt
            ${{ runner.temp }}/v183-release/*.dxf
          if-no-files-found: error
          retention-days: 30
