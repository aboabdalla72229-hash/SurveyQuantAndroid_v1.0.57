name: Build SurveyQuant v1.0.62

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract EXACT v1.0.62 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/SurveyQuantAndroid_v1.0.62_XY_ALL_FORMATS_COMPARE_NAMING_FIX.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Required v1.0.62 ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          echo "========================================"
          echo "USING EXACT SOURCE ZIP:"
          echo "$ZIP"
          echo "========================================"

          rm -rf "$GITHUB_WORKSPACE/source"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"

          PROJECT_DIR="$GITHUB_WORKSPACE/source/SurveyQuantAndroid_v1.0.62_XY_FIXED_SOURCE"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::Expected v1.0.62 project was not found."
            find "$GITHUB_WORKSPACE/source" -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Root build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "========================================"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "gradlew is missing."
            echo "Generating wrapper for this exact source..."

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          test -f gradlew

          echo "Gradle wrapper ready."

      - name: Prepare release keystore
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SURVEYQUANT_KEYSTORE_BASE64" ]; then
            echo "::error::SURVEYQUANT_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/surveyquant-release.keystore"

          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          {
            echo "SURVEYQUANT_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "SURVEYQUANT_KEYSTORE_PASSWORD=$SURVEYQUANT_KEYSTORE_PASSWORD"
            echo "SURVEYQUANT_KEY_ALIAS=$SURVEYQUANT_KEY_ALIAS"
            echo "SURVEYQUANT_KEY_PASSWORD=$SURVEYQUANT_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build EXACT v1.0.62 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "========================================"
          echo "APK GENERATED:"
          echo "$APK"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.62-XY-ALL-FORMATS-COMPARE-NAMING-FIX
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
