name: Build SurveyQuant v1.0.153 - Alignment From Scratch

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V150 signed APK and full source artifact run ID"
        required: true
        type: string
        default: "40189448694"
  push:
    paths:
      - ".github/workflows/build-v153-alignment-zoom-osnap-preserve.yml"
      - "SurveyQuant_v1.0.153_ALIGNMENT_PATCH_KIT.zip"

permissions:
  actions: read
  contents: read

jobs:
  rebuild_alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40189448694' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Check out rebuild inputs
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Unpack self-contained Alignment patch kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_DIR="$RUNNER_TEMP/v153-kit"
          test -s "$GITHUB_WORKSPACE/SurveyQuant_v1.0.153_ALIGNMENT_PATCH_KIT.zip" || { echo "ERROR: upload SurveyQuant_v1.0.153_ALIGNMENT_PATCH_KIT.zip to repository root."; exit 1; }
          unzip -t "$GITHUB_WORKSPACE/SurveyQuant_v1.0.153_ALIGNMENT_PATCH_KIT.zip"
          rm -rf "$KIT_DIR"; mkdir -p "$KIT_DIR"
          unzip -q "$GITHUB_WORKSPACE/SurveyQuant_v1.0.153_ALIGNMENT_PATCH_KIT.zip" -d "$KIT_DIR"
          echo "V153_KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android build tools configured."

      - name: Download V150 app shell and full source snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v150-base"
          SOURCE_DIR="$RUNNER_TEMP/v153-source"
          RELEASE_DIR="$RUNNER_TEMP/sq-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.150-SESSION-SPLINE-DWG-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.150_SESSION_SPLINE_DWG_FIX_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: signed V150 base APK missing from run $SOURCE_RUN_ID."; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V150 source snapshot missing from run $SOURCE_RUN_ID."; exit 1; }
          unzip -t "$BASE_PATCH"
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          {
            echo "V153_BASE_APK=$BASE_APK"
            echo "V153_SOURCE_DIR=$SOURCE_DIR"
            echo "V153_RELEASE_DIR=$RELEASE_DIR"
          } >> "$GITHUB_ENV"

      - name: Replace every legacy orientation module and install fresh Alignment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$V153_KIT_DIR/SurveyQuant_v1.0.153_REBUILD_ALIGNMENT_FROM_SCRATCH.py" "$V153_KIT_DIR/SurveyQuant_v1.0.153_PACKAGE_APK.py"
          node --check "$V153_KIT_DIR/SurveyQuant_v1.0.153_ALIGNMENT_CORE.js"
          node --check "$V153_KIT_DIR/SurveyQuant_v1.0.153_ALIGNMENT_COMMAND.js"
          node --check "$V153_KIT_DIR/SurveyQuant_v1.0.153_ALIGNMENT_TEST.js"
          node "$V153_KIT_DIR/SurveyQuant_v1.0.153_ALIGNMENT_TEST.js"
          python3 "$V153_KIT_DIR/SurveyQuant_v1.0.153_REBUILD_ALIGNMENT_FROM_SCRATCH.py" \
            --input-html "$V153_SOURCE_DIR/index.html" \
            --core-js "$V153_KIT_DIR/SurveyQuant_v1.0.153_ALIGNMENT_CORE.js" \
            --command-js "$V153_KIT_DIR/SurveyQuant_v1.0.153_ALIGNMENT_COMMAND.js" \
            --output-html "$V153_SOURCE_DIR/index_v153.html" \
            --report "$V153_RELEASE_DIR/V153_ALIGNMENT_REBUILD_REPORT.md"
          mv "$V153_SOURCE_DIR/index_v153.html" "$V153_SOURCE_DIR/index.html"
          grep -q 'const SQ_APP_VERSION_CODE = 153;' "$V153_SOURCE_DIR/index.html"
          grep -q 'id="sq153-alignment-core"' "$V153_SOURCE_DIR/index.html"
          grep -q 'id="sq153-alignment-command"' "$V153_SOURCE_DIR/index.html"
          ! grep -q 'id="sq-orientation-module"' "$V153_SOURCE_DIR/index.html"
          ! grep -q 'id="sq-orientation-reference-board-module"' "$V153_SOURCE_DIR/index.html"
          ! grep -q 'id="sq-orientation-cad-preserve-module"' "$V153_SOURCE_DIR/index.html"
          ! grep -q 'id="sq-orientation-dxf-faithful-recovery-module"' "$V153_SOURCE_DIR/index.html"
          python3 - "$V153_SOURCE_DIR/index.html" "$RUNNER_TEMP/v153-inline-check" <<'PY'
          import pathlib,re,subprocess,sys
          html_path,out_dir=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2]);out_dir.mkdir(parents=True,exist_ok=True)
          html=html_path.read_text(encoding='utf-8'); blocks=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I); checked=0
          for i,(attrs,body) in enumerate(blocks):
              if not body.strip() or re.search(r'type\s*=\s*["\'](?:application/json|application/ld\+json|importmap)["\']',attrs,re.I): continue
              f=out_dir/f'script_{i}.js';f.write_text(body,encoding='utf-8');subprocess.run(['node','--check',str(f)],check=True);checked+=1
          if checked < 3: raise SystemExit(f'Expected at least 3 executable inline JS blocks, got {checked}')
          print(f'PASS: {checked} inline JavaScript blocks parse.')
          PY
          cp "$V153_KIT_DIR"/SurveyQuant_v1.0.153_ALIGNMENT_CORE.js "$V153_SOURCE_DIR/"
          cp "$V153_KIT_DIR"/SurveyQuant_v1.0.153_ALIGNMENT_COMMAND.js "$V153_SOURCE_DIR/"
          cp "$V153_KIT_DIR"/SurveyQuant_v1.0.153_ALIGNMENT_TEST.js "$V153_SOURCE_DIR/"
          cp "$V153_KIT_DIR"/SurveyQuant_v1.0.153_REBUILD_ALIGNMENT_FROM_SCRATCH.py "$V153_SOURCE_DIR/"
          cp "$V153_KIT_DIR"/SurveyQuant_v1.0.153_PACKAGE_APK.py "$V153_SOURCE_DIR/"
          cp "$V153_RELEASE_DIR/V153_ALIGNMENT_REBUILD_REPORT.md" "$V153_SOURCE_DIR/"
          cat > "$V153_RELEASE_DIR/V153_BUILD_RESULT.txt" <<'TXT'
          V153 REBUILT THE ALIGNMENT FEATURE: V153 adds 100,000,000x max zoom, 2.5x/5x zoom controls, cursor-anchored mouse-wheel zoom, pinch zoom, and optional intersection OSNAP with priority snap. Alignment writes coordinate transforms into original DXF group-code records instead of rebuilding CAD entities. Automated geometry, intersection, retained-layer/handle/XData and JavaScript syntax tests passed. DWG is read through LibreDWG and output as DXF. Unsupported opaque entities fail closed. Real customer DWG/DXF validation is still required.
          TXT
          (cd "$V153_SOURCE_DIR" && zip -qr "$V153_RELEASE_DIR/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH_SOURCE_PATCH.zip" .)
          unzip -t "$V153_RELEASE_DIR/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH_SOURCE_PATCH.zip" | tail -2

      - name: Inject rebuilt HTML into APK and set v153 manifest
        shell: bash
        run: |
          set -euo pipefail
          RAW="$V153_RELEASE_DIR/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH_UNSIGNED.apk"
          ALIGNED="$V153_RELEASE_DIR/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH_ALIGNED.apk"
          FINAL="$V153_RELEASE_DIR/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          python3 "$V153_KIT_DIR/SurveyQuant_v1.0.153_PACKAGE_APK.py" --apk-input "$V153_BASE_APK" --apk-output "$RAW" --html-to-inject "$V153_SOURCE_DIR/index.html"
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS secret"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='153'.*versionName='1.0.153'"
          sha256sum "$FINAL" "$V153_RELEASE_DIR/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH_SOURCE_PATCH.zip" > "$V153_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V153_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload v153 APK and full source patch
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.153-ALIGNMENT-FROM-SCRATCH
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.153_ALIGNMENT_FROM_SCRATCH_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V153_ALIGNMENT_REBUILD_REPORT.md
            ${{ runner.temp }}/sq-release/V153_BUILD_RESULT.txt
          if-no-files-found: error
          retention-days: 14
