name: Build SurveyQuant v1.0.60

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect repository
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la

          echo "===== FILES ====="
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "gradlew" -o -name "AndroidManifest.xml" -o -name "index.html" \) -print | sort

      - name: Find Android project
        run: |
          APP_GRADLE=$(find . -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "Found: $APP_GRADLE"

          PROJECT_ROOT=$(dirname "$(dirname "$APP_GRADLE")")

          echo "ANDROID_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"

      - name: Check version
        run: |
          echo "===== VERSION ====="

          grep -n "versionCode" "$ANDROID_APP_GRADLE" || true
          grep -n "versionName" "$ANDROID_APP_GRADLE" || true

          grep -qE "versionCode[[:space:]]+60" "$ANDROID_APP_GRADLE"
          grep -qE "versionName[[:space:]]+['\"]1\.0\.60['\"]" "$ANDROID_APP_GRADLE"

          echo "Version 1.0.60 OK"

      - name: Check four secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "All 4 secrets are available"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > surveyquant-ci.jks
          test -s surveyquant-ci.jks
          echo "Keystore OK"

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/surveyquant-ci.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Find APK
        run: |
          echo "===== APK ====="
          find "$ANDROID_PROJECT_ROOT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.60-release
          path: ${{ env.ANDROID_PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
