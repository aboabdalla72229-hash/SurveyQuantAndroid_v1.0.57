           for(const p of points){for(const e of pointMarkerEntities(p,ps.symbol,ps.size)){e.layer='SURVEY_POINT_STYLE';e.color=ps.color;ent.push(e);}const h=ps.labelSize;if(ps.showId)txt('POINT_LABELS',p.e+h*.7,p.n+h*.7,h,String(p.id||'P'),0,ps.detailColor);if(ps.showElevation)txt('POINT_LABELS',p.e+h*.7,p.n-h*1.25,h*.82,Number(p.z).toFixed(3),0,ps.detailColor);}
