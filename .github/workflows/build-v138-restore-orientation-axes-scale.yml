name: Build SurveyQuant v1.0.138 - Restore Orientation Axes, Scale and Fit

on:
  push:
    paths:
      - ".github/workflows/build-v138-restore-orientation-axes-scale.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V136 base run ID. The run contains the signed APK and source patch: 39920564869."
        required: true
        type: string
        default: "39920564869"
  workflow_run:
    workflows:
      - "Build SurveyQuant v1.0.136 - Universal DWG for Every Drawing Project"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  patch_and_sign:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.source_run_id != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
    steps:
      - name: Check out repository for provenance and output metadata
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js regression runner
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "ERROR: Android SDK directory not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager was not found beneath $SDK_ROOT/cmdline-tools."; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          if [ -d "$SDK_ROOT/platform-tools" ]; then echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"; fi
          echo "Using preinstalled Android SDK at $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Install Android build tools without deprecated setup-android action
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "ERROR: sdkmanager was not found beneath $SDK_ROOT/cmdline-tools."; exit 1; }
          # Accept SDK licenses; the legacy SDK-tools package is no longer in the current package index.
          # Disable pipefail only for this pipeline so 'yes' closing on EOF cannot mask sdkmanager's status.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          echo "PASS: Android SDK configured; build-tools 35.0.0 has zipalign, apksigner, and aapt."

      - name: Write V138 orientation restoration, automatic axes, scale and WASM regression tests
        shell: bash
        run: |
          set -euo pipefail
          PATCHER="$RUNNER_TEMP/SurveyQuant_v1.0.138_ORIENTATION_RESTORE_PATCH.py"
          TESTER="$RUNNER_TEMP/SurveyQuant_v1.0.138_ORIENTATION_REGRESSION_TEST.js"
          cat > "$PATCHER" <<'PY'
          #!/usr/bin/env python3
          """V138: detect CAD-board inputs across existing and dynamically-created projects.
          
          Patches only the shared V117/V126 DWG picker gate in HTML, or the same asset in an APK.
          The gate expands accepted file types and leaves selected DWG files to the app's existing
          native project handler. It neither rewrites the source DWG nor redraws/replaces entities.
          The orientation project's independent temporary conversion behavior remains untouched.
          """
          from __future__ import annotations
          
          import argparse
          import copy
          import re
          import struct
          import sys
          import zipfile
          from pathlib import Path
          
          BRIDGE_ID = "sq-v117-universal-dwg-bridge"
          MARKER = "SQ_V138_UNIVERSAL_CAD_INPUT_GATE"
          TARGET_APP_VERSION_CODE = 138
          TARGET_APP_VERSION_NAME = "1.0.138"
          OLD_APP_VERSION_NAME = "1.0.136"
          
          NEW_FUNCTION = r'''  function isCadInput(input) {
              /* SQ_V138_UNIVERSAL_CAD_INPUT_GATE
                 Detect CAD-board inputs from file type, control identity, and nearby project labels.
                 This includes file controls created after startup by separate project screens. */
              if (!input || String(input.tagName || '').toLowerCase() !== 'input' ||
                  String(input.type || '').toLowerCase() !== 'file') return false;
          
              var id = String(input.id || '');
              var name = String(input.name || '');
              if (NON_CAD_DATA_IDS.has(id)) return false;
              if (CAD_INPUT_IDS.has(id)) return true;
          
              var accept = String(input.accept || '').split(',').map(function (item) {
                return item.trim().toLowerCase();
              }).filter(Boolean);
              var explicitCad = accept.some(function (item) {
                return item === '.dwg' || item === '.dxf' ||
                  item === 'application/dwg' || item === 'application/x-dwg' ||
                  item === 'application/dxf' || item === 'application/x-dxf' ||
                  item === 'application/acad' || item === 'application/x-acad' ||
                  item === 'image/vnd.dwg';
              });
              if (explicitCad) return true;
          
              var hints = [id, name, input.title || '', input.placeholder || ''];
              if (typeof input.getAttribute === 'function') {
                ['aria-label', 'data-project', 'data-role', 'data-import-kind', 'title', 'placeholder'].forEach(function (key) {
                  var value = input.getAttribute(key);
                  if (value) hints.push(value);
                });
              }
              try {
                Array.prototype.slice.call(input.labels || []).forEach(function (label) {
                  if (label && label.textContent) hints.push(label.textContent);
                });
              } catch (_) {}
              try {
                var node = input.parentElement;
                for (var depth = 0; node && depth < 4; depth++, node = node.parentElement) {
                  if (node.textContent) hints.push(String(node.textContent).slice(0, 320));
                  if (node.tagName && String(node.tagName).toLowerCase() === 'body') break;
                }
              } catch (_) {}
          
              var context = hints.join(' ').toLowerCase().replace(/\s+/g, ' ');
              var mediaOrPointType = accept.some(function (item) {
                return /^(?:\.sdr|\.pnt|\.pt|\.csv|\.txt|\.dat|\.pdf|\.png|\.jpe?g|\.webp|\.bmp|\.gif|\.heic|\.tiff?|\.xlsx?|\.ods|\.json|\.kml|\.kmz|\.gpx|text\/plain|text\/csv|application\/pdf|image\/)/i.test(item);
              });
              var hasGenericType = accept.some(function (item) {
                return item === '*/*' || item === 'application/octet-stream';
              });
              var pointOrMediaHint = /(?:\b(?:point[\s_-]*list|point[\s_-]*file|survey[\s_-]*points|file[\s_-]*to[\s_-]*dxf|clean[\s_-]*files|clean[\s_-]*points|image|photo|picture|raster|pdf|spreadsheet|excel)\b)|(?:قائمة\s*نقاط|نقاط\s*(?:المساحة|الرفع|الإحداثيات)|ملف\s*نقاط|تنظيف\s*الملفات|صورة|صور|ملف\s*PDF)/i.test(context);
              if (pointOrMediaHint || (mediaOrPointType && !hasGenericType)) return false;
          
              var strongCadHint = /(?:\b(?:cad|dwg|dxf|drawing|board|blueprint|plan|projection|overlay|merge|orientation|section|concrete|quantity|grading|reference[\s_-]*board|target[\s_-]*board|source[\s_-]*board|import[\s_-]*drawing)\b)|(?:لوح|لوحة|رسم|اسقاط|إسقاط|توجيه|دمج|حصر|خرسانة|كميات|قطاع|القطاع|مرجع\s*اللوح|لوحة\s*المرجع|لوحة\s*الهدف|لوحة\s*المصدر)/i.test(context);
              if (strongCadHint) return true;
          
              /* Generic */
              return false;
            }'''
          
          
          def restore_orientation_features(html: str) -> str:
              result = html
              def one(old: str, new: str, label: str, allow_existing: bool = False) -> None:
                  nonlocal result
                  if allow_existing and result.count(new) == 1 and old not in result:
                      return
                  count = result.count(old)
                  if count != 1:
                      raise SystemExit(f"ERROR V138 orientation: {label}: expected one source match, got {count}.")
                  result = result.replace(old, new, 1)

              # Export the original raw DXF parser from the app's private IIFE for the axis-reader module.
              parser_api = 'window.sqExtractDxfAxisEntities = sqExtractDxfAxisEntities;'
              if parser_api not in result:
                  one('window.__sqOrientTest = {solve:sqOriSolve, transformBytes:sqOriTransformBytes};',
                      parser_api + '\nwindow.__sqOrientTest = {solve:sqOriSolve, transformBytes:sqOriTransformBytes};',
                      'expose original DXF raw parser')

              # Restore mathematically valid scale range without arbitrary 1e-9..1e9 cutoffs.
              one("if (dRef < 1e-9 || dSrc < 1e-9) throw new Error('النقطتان في كل لوحة يجب أن تكونا مختلفتين.');",
                  "if (!(dRef > 0) || !(dSrc > 0) || !Number.isFinite(dRef) || !Number.isFinite(dSrc)) throw new Error('النقطتان في كل لوحة يجب أن تكونا مختلفتين وصالحتين حسابيًا.');",
                  'legacy distance guard')
              one("  if (!Number.isFinite(scale) || scale < 1e-9 || scale > 1e9) {\n    throw new Error('معامل المقياس غير منطقي. راجع وحدات وإحداثيات النقطتين.');\n  }",
                  "  if (!Number.isFinite(scale) || scale <= 0) {\n    throw new Error('تعذر حساب معامل مقياس موجب وصالح من النقطتين.');\n  }",
                  'legacy scale guard')
              one("if(dS<1e-8||dR<1e-8)throw new Error('النقطتان 1 و2 في كل لوحة يجب أن تكونا مختلفتين.');",
                  "if(!(dS>0)||!(dR>0)||!Number.isFinite(dS)||!Number.isFinite(dR))throw new Error('النقطتان 1 و2 في كل لوحة يجب أن تكونا مختلفتين وصالحتين حسابيًا.');",
                  'active board-pair distance guard')
              one("if(!Number.isFinite(scale)||scale<1e-9||scale>1e9)throw new Error('المقياس المحسوب غير منطقي. تحقق من ترتيب النقاط ووحدات اللوحتين.');",
                  "if(!Number.isFinite(scale)||scale<=0)throw new Error('تعذر حساب مقياس موجب وصالح من النقطتين المتناظرتين.');",
                  'active board-pair scale guard')

              # Text renders at actual drawing height times current viewport scale and zoom.
              one("const fitTextSize=Math.min(10,Math.max(6,Math.abs(Number(t.height)||2.5)*(m.scale/Math.max(0.001,zoom))*0.8));ctx.font=(Math.max(1.15,fitTextSize/Math.sqrt(Math.max(1,zoom))))+'px sans-serif';",
                  "const textScreenHeight=Math.abs(Number(t.height)||2.5)*m.scale*0.8;ctx.font=(Math.max(0.75,Math.min(96,textScreenHeight)))+'px sans-serif';",
                  'legacy text screen scale')
              one("const st=styleOf(v,t),fitTextSize=Math.min(10,Math.max(6,Math.abs(Number(t.height)||2.5)*m.base*0.8)),size=Math.max(1.15,fitTextSize/Math.sqrt(Math.max(1,Number(v.zoom)||1)));",
                  "const st=styleOf(v,t),size=Math.max(0.75,Math.min(96,Math.abs(Number(t.height)||2.5)*m.scale*0.8));",
                  'active orientation text screen scale')
              old_canvas='height:230px;min-height:230px;max-height:230px'
              if result.count(old_canvas) != 2:
                  raise SystemExit(f"ERROR V138 orientation: expected two fixed 230px canvases, got {result.count(old_canvas)}.")
              result=result.replace(old_canvas,'height:430px;min-height:320px;max-height:520px')

              # Keep XLINE/RAY from inflating geometry bounds to a fixed 100000-unit extent; include them in axis detection.
              one('const segments=[],labels=[],seenSeg=new Set();',
                  'const segments=[],labels=[],infiniteLines=[],seenSeg=new Set();',
                  'collect infinite-axis geometry')
              old_entity = "else if(type==='XLINE'||type==='RAY'){\n      const a=e.basePoint||e.position, v=e.directionVector;\n      if(a&&v){const k=type==='RAY'?100000:100000;pushSeg({x:a.x-v.x*k,y:a.y-v.y*k},{x:a.x+v.x*k,y:a.y+v.y*k},layer,type);}\n    }"
              new_entity = "else if(type==='XLINE'||type==='RAY'){\n      const a=e.basePoint||e.position, v=e.directionVector;\n      if(a&&v&&[a.x,a.y,v.x,v.y].every(q=>Number.isFinite(Number(q)))&&Math.hypot(Number(v.x),Number(v.y))>1e-12)infiniteLines.push({basePoint:{x:Number(a.x),y:Number(a.y)},directionVector:{x:Number(v.x),y:Number(v.y)},layer,type});\n    }"
              one(old_entity,new_entity,'capture XLINE/RAY from parsed entities')
              old_raw = "else if(type==='XLINE'||type==='RAY'){\n          const a=e.basePoint,v=e.directionVector;\n          if(a&&v)pushSeg({x:a.x-v.x*100000,y:a.y-v.y*100000},{x:a.x+v.x*100000,y:a.y+v.y*100000},layer,type);\n        }"
              new_raw = "else if(type==='XLINE'||type==='RAY'){\n          const a=e.basePoint,v=e.directionVector;\n          if(a&&v&&[a.x,a.y,v.x,v.y].every(q=>Number.isFinite(Number(q)))&&Math.hypot(Number(v.x),Number(v.y))>1e-12)infiniteLines.push({basePoint:{x:Number(a.x),y:Number(a.y)},directionVector:{x:Number(v.x),y:Number(v.y)},layer,type});\n        }"
              one(old_raw,new_raw,'capture raw XLINE/RAY from CAD records')
              infinite_block = """  // Extend infinite axes to this board's geometry bounds, not a hard-coded 100000-unit extent.\n  if(infiniteLines.length){\n    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,maxTextHeight=0;\n    const see=p=>{if(!p)return;const x=Number(p.x),y=Number(p.y);if(!Number.isFinite(x)||!Number.isFinite(y))return;minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);};\n    for(const seg of segments){see(seg.a);see(seg.b);}\n    for(const label of labels){see(label);maxTextHeight=Math.max(maxTextHeight,Number(label.height)||0);}\n    const boundsDiag=Math.hypot(maxX-minX,maxY-minY);\n    const extent=Math.max(Number.isFinite(boundsDiag)&&boundsDiag>0?boundsDiag*2:1000,maxTextHeight*20,1);\n    for(const item of infiniteLines){const p=item.basePoint,v=item.directionVector,mag=Math.hypot(v.x,v.y);if(!(mag>1e-12))continue;const dx=v.x/mag*extent,dy=v.y/mag*extent;if(item.type==='RAY')pushSeg(p,{x:p.x+dx,y:p.y+dy},item.layer,'RAY');else pushSeg({x:p.x-dx,y:p.y-dy},{x:p.x+dx,y:p.y+dy},item.layer,'XLINE');}\n  }\n"""
              one('  // Remove duplicate text anchors (normal parser + raw record fallback).',
                  infinite_block+'  // Remove duplicate text anchors (normal parser + raw record fallback).',
                  'extend infinite axes using board-relative length')

              # Common grid bubble labels (AS, Z1, AXIS12, Arabic-Indic digits) are valid axis names.
              label_re = re.compile(r"function sqOriLabelText\(entity\) \{[\s\S]*?\n\}")
              labels=list(label_re.finditer(result))
              if len(labels)!=1:
                  raise SystemExit(f"ERROR V138 orientation: expected one axis label normalizer, got {len(labels)}.")
              label_function = r'''function sqOriLabelText(entity) {
            let t=String(entity && (entity.text??entity.string??entity.value??entity.content??entity.textString??'')||'');
            try { t=t.normalize('NFKC'); } catch (_) {}
            t=t.replace(/\\P/gi,' ').replace(/\{[^;]*;/g,' ').replace(/[{}]/g,' ').replace(/%%[dpc]/gi,' ').trim();
            t=t.replace(/[٠-٩]/g,ch=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(ch)));
            if(!t || t.length>16) return '';
            t=t.replace(/[\s._-]+/g,'').toUpperCase();
            // Permit engineering grid names such as AS, Z1, AXIS12, 1A; exclude notes and dimensions.
            if(t.length>12) return '';
            return /^[A-Z\u0600-\u06FF]{1,8}\d{0,4}$/.test(t) || /^\d{1,4}[A-Z\u0600-\u06FF]{1,6}$/.test(t) ? t : '';
          }'''
              m=labels[0]
              result=result[:m.start()]+label_function+result[m.end():]
              one('const minLength=Math.max(diag*0.075,medianHeight*4,1e-7);',
                  'const minLength=Math.max(diag*0.02,medianHeight*3,1e-7);',
                  'axis candidate line threshold')
              one(".filter(l=>l.len>=minLength&&l.type!=='RAY'&&l.type!=='XLINE');",
                  ".filter(l=>l.len>=minLength);",
                  'include XLINE/RAY as intersection candidates')
              old_label_assignment = """      const endDistance=Math.min(Math.hypot(t.x-line.a.x,t.y-line.a.y),Math.hypot(t.x-line.b.x,t.y-line.b.y));\n      if(perp>tol||endDistance>Math.max(tol,line.len*0.16))continue;\n      const beyond=(u < -1e-4 || u > 1.0001);\n      const nearEnd=Math.min(Math.abs(u),Math.abs(1-u));\n      const score=perp/tol+endDistance/tol+(beyond?0:1.5+nearEnd*3);\n"""
              new_label_assignment = """      const endDistance=Math.min(Math.hypot(t.x-line.a.x,t.y-line.a.y),Math.hypot(t.x-line.b.x,t.y-line.b.y));\n      const infinite=line.type==='XLINE'||line.type==='RAY';\n      if(perp>tol||(!infinite&&endDistance>Math.max(tol,line.len*0.16)))continue;\n      if(line.type==='RAY'&&u<0)continue;\n      const beyond=(u < -1e-4 || u > 1.0001);\n      const nearEnd=Math.min(Math.abs(u),Math.abs(1-u));\n      const score=perp/tol+(infinite?Math.min(0.9,Math.abs(u-(line.type==='RAY'?0.75:0.5))*0.25):endDistance/tol+(beyond?0:1.5+nearEnd*3));\n"""
              one(old_label_assignment,new_label_assignment,'attach grid bubble labels to infinite axes')
              one('if(d<Math.PI*70/180||d>Math.PI*110/180)continue;',
                  'if(d<Math.PI*20/180||d>Math.PI*160/180)continue;',
                  'axis-family skew angle allowance')

              # The previous installer attached to a legacy dialog whose HTML is replaced by the live two-board UI.
              step2='id="sq110Step2" class="sqori-preview" type="button">2) اللوحة المرجعية</button></div><div id="sq110TargetScreen">'
              step2new='id="sq110Step2" class="sqori-preview" type="button">2) اللوحة المرجعية</button><button id="sq110ReadAxesBtn" class="sqori-preview" type="button">🧭 قراءة المحاور تلقائيًا</button></div><div id="sq110TargetScreen">'
              one(step2,step2new,'active orientation auto-axis button')

              axis_function = r'''function readAxesForOrientation(){
           try{
            if(!state.target||!state.reference)throw new Error('اختر وافتح اللوحة غير الموجّهة واللوحة المرجعية أولًا.');
            const axisAPI=window.__sqOriAxisAutoTest;
            if(!axisAPI||typeof axisAPI.matchIntersections!=='function')throw new Error('قارئ المحاور غير متصل بواجهة التوجيه. أغلق المشروع وافتحه مرة أخرى بعد التحديث.');
            if(typeof window.sqExtractDxfAxisEntities!=='function')throw new Error('قارئ سجلات DXF الخام غير متصل، لذلك لا يمكن فحص محاور اللوحتين.');
            const decode=bytes=>new TextDecoder('windows-1252',{fatal:false}).decode(bytes);
            const sourceModel={source:'DXF',entities:[],rawDXF:decode(state.target.bytes)};
            const referenceModel={source:'DXF',entities:[],rawDXF:decode(state.reference.bytes)};
            const matched=axisAPI.matchIntersections(referenceModel,sourceModel);
            if(!matched.best||!matched.matches||matched.matches.length<2){
             const rs=matched.ref||{},ss=matched.src||{};
             throw new Error('لم أجد تقاطعين مشتركين مسمّيين بين اللوحتين. التقاطعات المرجعية: '+(rs.intersections?.size||0)+'، غير الموجهة: '+(ss.intersections?.size||0)+'، التطابقات: '+(matched.matches?.length||0)+'. راجع أسماء المحاور قرب نهايات الشبكة، أو اختر نقطتين يدويًا باستخدام OSNAP/ID Point.');
            }
            const a=matched.best.first,b=matched.best.second;
            state.targetPoints=[a.source,b.source].map((p,i)=>({x:p.x,y:p.y,kind:'تقاطع محور آلي '+(i+1)+' '+(i===0?a.key:b.key)}));
            state.referencePoints=[a.reference,b.reference].map((p,i)=>({x:p.x,y:p.y,kind:'تقاطع محور مرجعي '+(i+1)+' '+(i===0?a.key:b.key)}));
            state.axisMatches=matched.matches.map(m=>({key:m.key,source:{x:m.source.x,y:m.source.y},reference:{x:m.reference.x,y:m.reference.y}}));
            state.active.target=0;state.active.reference=0;state.idPoint={target:null,reference:null};
            fillReadouts();if(state.views.target)draw(state.views.target);if(state.views.reference)draw(state.views.reference);
            const t=calculation();
            const errors=state.axisMatches.map(m=>{const q=t.point(m.source.x,m.source.y);return {key:m.key,value:Math.hypot(q.x-m.reference.x,q.y-m.reference.y)};});
            const rms=Math.sqrt(errors.reduce((sum,e)=>sum+e.value*e.value,0)/Math.max(1,errors.length));
            const max=errors.reduce((best,e)=>Math.max(best,e.value),0);
            showScreen('target');
