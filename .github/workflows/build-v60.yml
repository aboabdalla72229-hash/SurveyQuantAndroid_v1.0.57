name: Build SurveyQuant v1.0.60

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: |
          set -e

          unzip -q SurveyQuantAndroid_v1.0.60_REPAIRED_SOURCE.zip -d source

          echo "Source extracted:"
          find source -maxdepth 6 -type f | sort

      - name: Find Gradle project
        run: |
          set -e

          ROOT=$(find source -name gradlew -type f -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$ROOT"

      - name: Find Android app
        run: |
          set -e

          APP=$(find "$PROJECT_ROOT" -type f \
            -name AndroidManifest.xml \
            -path "*/src/main/AndroidManifest.xml" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            find "$PROJECT_ROOT" -type f | sort
            exit 1
          fi

          APP=$(dirname "$(dirname "$(dirname "$APP")")")

          echo "APP_DIR=$APP" >> "$GITHUB_ENV"

          echo "App directory:"
          echo "$APP"

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Four signing secrets are available."

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE" | base64 --decode > surveyquant-ci.jks

          test -s surveyquant-ci.jks

      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          STORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/surveyquant-ci.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_ROOT" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/release/*" \
            -print -quit)

          if [
