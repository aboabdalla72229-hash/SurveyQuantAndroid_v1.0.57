name: Build SurveyQuant v1.0.84 from V83 - Access File + Compare Table Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip"
      - "SurveyQuantAndroid_v1.0.83_V67_PROJECTION_SETTINGS_COMPARE_FIX.zip"
      - "SurveyQuant_v1.0.84_V83_ACCESS_COMPARE_TABLE_PATCH.zip"
      - ".github/workflows/build-v84-from-v83-access-compare-table.yml"

permissions:
  contents: read

env:
  ANDROID_SHELL_ZIP: SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX.zip
  V83_SOURCE_ZIP: SurveyQuantAndroid_v1.0.83_V67_PROJECTION_SETTINGS_COMPARE_FIX.zip
  PATCH_ZIP: SurveyQuant_v1.0.84_V83_ACCESS_COMPARE_TABLE_PATCH.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact source and patch files
        shell: bash
        run: |
          set -euo pipefail
          for f in "$ANDROID_SHELL_ZIP" "$V83_SOURCE_ZIP" "$PATCH_ZIP"; do
            test -s "$f" || { echo "ERROR: missing or empty repository file: $f"; exit 1; }
          done
          unzip -t "$ANDROID_SHELL_ZIP"
          unzip -t "$V83_SOURCE_ZIP"
          unzip -t "$PATCH_ZIP"

      - name: Extract Android shell, V83 source, and focused patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sq-shell" "$RUNNER_TEMP/sq-v83" "$RUNNER_TEMP/sq-patch"
          mkdir -p "$RUNNER_TEMP/sq-shell" "$RUNNER_TEMP/sq-v83" "$RUNNER_TEMP/sq-patch"
          unzip -q "$ANDROID_SHELL_ZIP" -d "$RUNNER_TEMP/sq-shell"
          unzip -q "$V83_SOURCE_ZIP" -d "$RUNNER_TEMP/sq-v83"
          unzip -q "$PATCH_ZIP" -d "$RUNNER_TEMP/sq-patch"

          PROJECT="$(find "$RUNNER_TEMP/sq-shell" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          V83_INDEX="$(find "$RUNNER_TEMP/sq-v83" -type f -name 'index-v67-patched.html' -print -quit)"
          V83_BG="$(find "$RUNNER_TEMP/sq-v83" -type f -name 'surveyquant_background.png' -print -quit)"
          V83_LOGO="$(find "$RUNNER_TEMP/sq-v83" -type f -name 'surveyquant_logo.png' -print -quit)"
          PATCH_INDEX="$(find "$RUNNER_TEMP/sq-patch" -type f -name 'index.html' -print -quit)"

          test -n "$PROJECT" || { echo "ERROR: Android app/build.gradle not found in shell ZIP"; exit 1; }
          test -n "$V83_INDEX" || { echo "ERROR: V83 index-v67-patched.html not found"; exit 1; }
          test -n "$V83_BG" || { echo "ERROR: original V83 background image not found"; exit 1; }
          test -n "$V83_LOGO" || { echo "ERROR: original V83 logo image not found"; exit 1; }
          test -n "$PATCH_INDEX" || { echo "ERROR: patched index.html not found in patch ZIP"; exit 1; }

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "V83_INDEX=$V83_INDEX" >> "$GITHUB_ENV"
          echo "V83_BG=$V83_BG" >> "$GITHUB_ENV"
          echo "V83_LOGO=$V83_LOGO" >> "$GITHUB_ENV"
          echo "PATCH_INDEX=$PATCH_INDEX" >> "$GITHUB_ENV"

      - name: Apply V83 page and only the two requested fixes
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$PROJECT_DIR/app/src/main/assets"
          test -d "$ASSETS" || { echo "ERROR: Android assets directory not found"; exit 1; }

          # Start from the original V83 page and its original assets.
          cp "$V83_INDEX" "$ASSETS/index.html"
          cp "$V83_BG" "$ASSETS/surveyquant_background.png"
          cp "$V83_LOGO" "$ASSETS/surveyquant_logo.png"

          # Overlay the focused V83-derived patch (index.html only).
          cp "$PATCH_INDEX" "$ASSETS/index.html"

          grep -Fq "readLocalFileArrayBuffer" "$ASSETS/index.html"
          grep -Fq "LAYER 1 / BEFORE" "$ASSETS/index.html"
          grep -Fq "LAYER 2 / AFTER" "$ASSETS/index.html"
          grep -Fq "DIFFERENCE OF STANDALONE NETS" "$ASSETS/index.html"
          grep -Fq "COMPARISON CUT" "$ASSETS/index.html"
          grep -Fq "COMPARISON FILL" "$ASSETS/index.html"

          echo "Applied source: V83 HTML + focused fixes"
          ls -lh "$ASSETS/index.html" "$ASSETS/surveyquant_background.png" "$ASSETS/surveyquant_logo.png"

      - name: Validate embedded JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const re = /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          const scripts = [];
          let match;
          while ((match = re.exec(html)) !== null) scripts.push(match[1]);
          if (!scripts.length) throw new Error('No inline JavaScript found in V83 page');
          fs.writeFileSync(process.argv[3], scripts.join('\n'));
          console.log(`Validated ${scripts.length} inline script block(s).`);
          NODE
          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Set app version to 1.0.84
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          test -s "$BUILD_FILE" || { echo "ERROR: app/build.gradle not found"; exit 1; }
          grep -q 'versionCode' "$BUILD_FILE"
          grep -q 'versionName' "$BUILD_FILE"
          sed -E -i "0,/versionCode[[:space:]]+[0-9]+/s//versionCode 84/" "$BUILD_FILE"
          sed -E -i "0,/versionName[[:space:]]+['\"][^'\"]+['\"]/s//versionName '1.0.84'/" "$BUILD_FILE"
          grep -q "versionCode 84" "$BUILD_FILE"
          grep -q "versionName '1.0.84'" "$BUILD_FILE"
          grep -nE 'versionCode|versionName' "$BUILD_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD is empty"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: SURVEYQUANT_KEY_ALIAS is empty"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEY_PASSWORD is empty"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.keystore"
          test -s "$RUNNER_TEMP/surveyquant-release.keystore"
          {
            echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.keystore"
            echo "SURVEYQUANT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SURVEYQUANT_KEY_ALIAS=$KEY_ALIAS"
            echo "SURVEYQUANT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"
          test -n "$APK" || { echo "ERROR: release APK was not produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/SurveyQuant_v1.0.84_V83_ACCESS_COMPARE_TABLE_FIX.apk"
          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.84-V83-ACCESS-COMPARE-TABLE-FIX
          path: release/SurveyQuant_v1.0.84_V83_ACCESS_COMPARE_TABLE_FIX.apk
          if-no-files-found: error
