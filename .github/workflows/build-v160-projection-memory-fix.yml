name: Build SurveyQuant v1.0.160 Projection Memory Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V159 Universal Fast DWG artifact run ID"
        required: true
        type: string
        default: "40514133976"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v160-projection-memory-fix.yml"
      - "SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py"
      - "SurveyQuant_v1.0.160_PROJECTION_TEST.js"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v160-projection-memory-fix
  cancel-in-progress: false

jobs:
  build_v160:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40514133976' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download successful V159 APK and source bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v159-base"
          SOURCE_DIR="$RUNNER_TEMP/v160-source"
          RELEASE_DIR="$RUNNER_TEMP/v160-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.159-FREE-UNIVERSAL-FAST-DWG" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.159_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.159_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V159 APK missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V159 source patch missing from run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V160_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V160_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V160_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Patch shared fast DWG reader and validate source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py" --html "$V160_SOURCE_DIR/index.html"
          python3 "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py" --html "$V160_SOURCE_DIR/index.html" --check-only
          node "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_TEST.js" "$V160_SOURCE_DIR/index.html"
          cp "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py" "$V160_SOURCE_DIR/"
          cp "$GITHUB_WORKSPACE/SurveyQuant_v1.0.160_PROJECTION_TEST.js" "$V160_SOURCE_DIR/"
          python3 -m py_compile "$V160_SOURCE_DIR/SurveyQuant_v1.0.160_PROJECTION_MEMORY_FIX.py"
          node --check "$V160_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$V160_SOURCE_DIR/index.html" "$RUNNER_TEMP/surveyquant-inline-check.js" <<'PY'
          from pathlib import Path
          import re,sys
          html=Path(sys.argv[1]).read_text(encoding="utf-8")
          scripts=re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>",html,re.I)
          if not scripts: raise SystemExit("No inline scripts found in patched index.html")
          Path(sys.argv[2]).write_text("\n;\n".join(scripts),encoding="utf-8")
          print(f"Found {len(scripts)} inline script blocks for JavaScript syntax verification")
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline-check.js"

      - name: Prepare V160 package builder from verified V159 package builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$V160_SOURCE_DIR/SurveyQuant_v1.0.159_PACKAGE_FREE_APK.py" "$V160_SOURCE_DIR/SurveyQuant_v1.0.160_PACKAGE_FREE_APK.py" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text(encoding="utf-8")
          pairs=[
            ("OLD_NAME = '1.0.158'","OLD_NAME = '1.0.159'"),
            ("NEW_NAME = '1.0.159'","NEW_NAME = '1.0.160'"),
            ("NEW_CODE = 159","NEW_CODE = 160"),
          ]
          for old,new in pairs:
              if src.count(old)!=1: raise SystemExit(f"Missing or duplicate package version marker: {old}")
              src=src.replace(old,new,1)
          src=src.replace("V159","V160")
          src=src.replace("1.0.156/156","1.0.160/160")
          src=src.replace("bump APK version to 1.0.156","bump APK version to 1.0.160")
          Path(sys.argv[2]).write_text(src,encoding="utf-8")
          PY
          python3 -m py_compile "$V160_SOURCE_DIR/SurveyQuant_v1.0.160_PACKAGE_FREE_APK.py"

      - name: Package V160 APK with shared fast DWG reader
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V160_SOURCE_DIR/SurveyQuant_v1.0.160_PACKAGE_FREE_APK.py" \
            --apk-input "$V160_BASE_APK" \
            --apk-output "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_UNSIGNED.apk" \
            --html-to-inject "$V160_SOURCE_DIR/index.html"
          test -s "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_UNSIGNED.apk"
          python3 - "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_UNSIGNED.apk" "$V160_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js" <<'PY'
          from pathlib import Path
          import copy,sys,zipfile
          apk=Path(sys.argv[1]); fixed=Path(sys.argv[2]).read_bytes(); temp=apk.with_suffix(".patched.apk")
          target="assets/libredwg-writer/wasm/libredwg-web.js"
          removed=[]
          with zipfile.ZipFile(apk,"r") as zin:
              names=[x.filename for x in zin.infolist()]
              if names.count(target)!=1: raise SystemExit(f"Expected one {target}; found {names.count(target)}")
              has_arm64=any(n.startswith("lib/arm64-v8a/") for n in names)
              has_armv7=any(n.startswith("lib/armeabi-v7a/") for n in names)
              if not has_arm64: raise SystemExit("Refusing phone APK: arm64-v8a native libraries are missing")
              with zipfile.ZipFile(temp,"w",allowZip64=True) as zout:
                  for info in zin.infolist():
                      if info.filename.startswith(("lib/x86/","lib/x86_64/")):
                          removed.append(info.filename); continue
                      zout.writestr(copy.copy(info),fixed if info.filename==target else zin.read(info.filename))
          if removed:
              print(f"INFO: removed {len(removed)} optional x86/x86_64 native files")
          else:
              print("INFO: APK has no x86/x86_64 native libraries; no optional files to remove")
          temp.replace(apk)
          with zipfile.ZipFile(apk,"r") as z:
              names=set(z.namelist())
              if any(n.startswith(("lib/x86/","lib/x86_64/")) for n in names): raise SystemExit("x86 libraries remain")
              if not any(n.startswith("lib/arm64-v8a/") for n in names): raise SystemExit("ARM64 libraries missing after ABI trim")
              if has_armv7 and not any(n.startswith("lib/armeabi-v7a/") for n in names): raise SystemExit("ARMv7 libraries unexpectedly removed")
              embedded=z.read(target)
              if embedded!=fixed: raise SystemExit("Embedded DWG WASM loader differs from corrected V160 runtime")
              if b'new Promise((reject,resolve)=>{var xhr=new XMLHttpRequest;xhr.open("GET",url,true)' in embedded: raise SystemExit("Inverted WASM Promise remains in APK")
              if b'new Promise((resolve,reject)=>{var xhr=new XMLHttpRequest;xhr.open("GET",url,true)' not in embedded: raise SystemExit("Corrected WASM Promise missing from APK")
          print(f"PASS: corrected WebAssembly loader embedded; removed {len(removed)} x86/x86_64 native files")
          PY

      - name: Sign and verify V160 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_ALIGNED.apk"
          FINAL="$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_ANDROID_WEBVIEW_WASM_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='160'.*versionName='1.0.160'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_UNSIGNED.apk"

      - name: Package source, report, and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$V160_SOURCE_DIR/SurveyQuant_v1.0.159_PACKAGE_FREE_APK.py"
          rm -rf "$V160_SOURCE_DIR/__pycache__"
          cat > "$V160_SOURCE_DIR/README_V160_PROJECTION_MEMORY_FIX_AR.md" <<'TXT'
          # SurveyQuant v1.0.160: إصلاح بطء قراءة اللوحات والخروج أثناء الإسقاط
          - قراءة لوحة المصدر بخيارات خفيفة وتجنب التحويل غير الضروري إلى DXF عندما تكفي عناصر DWG الأصلية.
          - عدم الاحتفاظ بنسخ النصوص والبايتات والبيانات الهندسية الجانبية التي لا يحتاجها الإسقاط.
          - فحص DXF تدريجيًا دون إنشاء مصفوفات كبيرة لكل سطر وزوج مجموعات.
          - دمج إضافات DXF في مصفوفة إخراج واحدة، مع الحفاظ على بيانات اللوحة المرجعية قدر الإمكان دون إعادة رسمها.
          - اختبارات Syntax ودمج DXF حديث وقديم وCRLF اجتازت محليًا. ما زال اختبار لوحتين DWG فعليتين على الهاتف مطلوبًا.
          TXT
          (cd "$V160_SOURCE_DIR" && zip -qr "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_SOURCE_PATCH.zip" | tail -2
          printf '%s\n' '# SurveyQuant v1.0.160 Projection Memory Fix' '- Streams projection DXF scanning and builds the merged output with one byte allocation.' '- Avoids unnecessary source-DWG conversion and redundant temporary geometry/text buffers.' '- Keeps the reference DXF bytes except for the intended additions.' '- Regression fixture tests passed locally; real DWG testing on the target device is still required.' > "$V160_RELEASE_DIR/V160_CHANGELOG_EN.txt"
          cp "$V160_SOURCE_DIR/README_V160_PROJECTION_MEMORY_FIX_AR.md" "$V160_RELEASE_DIR/V160_CHANGELOG_AR.md"
          sha256sum "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_ANDROID_WEBVIEW_WASM_FIX.apk" "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_SOURCE_PATCH.zip" > "$V160_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V160_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload verified V160 APK and patch
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.160-FREE-PROJECTION-MEMORY-FIX
          path: |
            ${{ runner.temp }}/v160-release/SurveyQuant_v1.0.160_FREE_ANDROID_WEBVIEW_WASM_FIX.apk
            ${{ runner.temp }}/v160-release/SurveyQuant_v1.0.160_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v160-release/V160_CHANGELOG_AR.md
            ${{ runner.temp }}/v160-release/V160_CHANGELOG_EN.txt
            ${{ runner.temp }}/v160-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish V160 release
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.160 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.160 \
              "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_ANDROID_WEBVIEW_WASM_FIX.apk" \
              "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_SOURCE_PATCH.zip" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.160 \
              "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_ANDROID_WEBVIEW_WASM_FIX.apk" \
              "$V160_RELEASE_DIR/SurveyQuant_v1.0.160_FREE_SOURCE_PATCH.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SurveyQuant v1.0.160 - Projection Memory Fix" \
              --notes-file "$V160_RELEASE_DIR/V160_CHANGELOG_AR.md"
          fi
          echo "Release page: https://github.com/$GITHUB_REPOSITORY/releases/tag/v1.0.160"
