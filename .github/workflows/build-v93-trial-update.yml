name: SurveyQuant v1.0.93 Trial and Forced Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate project and source archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="SurveyQuantAndroid_v1.0.67_XY_FINAL_FIX"
          SOURCE_NAME="SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Project directory not found: $PROJECT_DIR"
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

          if [ ! -f "$SOURCE_NAME" ]; then
            echo "ERROR: Source ZIP not found: $SOURCE_NAME"
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_NAME=$SOURCE_NAME" >> "$GITHUB_ENV"

      - name: Verify source and app version
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          echo "Checking Gradle version configuration..."

          grep -R -nE \
            "versionCode[[:space:]]+93|versionName[[:space:]]+['\"]1\.0\.93['\"]" \
            app build.gradle app/build.gradle 2>/dev/null || true

          echo "Checking source files..."
          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        env:
          SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
          SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
          SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
          SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          chmod +x gradlew

          if [ -z "${SURVEYQUANT_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${SURVEYQUANT_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${SURVEYQUANT_KEY_ALIAS:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${SURVEYQUANT_KEY_PASSWORD:-}" ]; then
            echo "ERROR: SURVEYQUANT_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.jks"

          test -s "$RUNNER_TEMP/surveyquant-release.jks" || {
            echo "ERROR: Decoded keystore is empty."
            exit 1
          }

          export ORG_GRADLE_PROJECT_SURVEYQUANT_KEYSTORE_FILE="$RUNNER_TEMP/surveyquant-release.jks"
          export ORG_GRADLE_PROJECT_SURVEYQUANT_KEYSTORE_PASSWORD="$SURVEYQUANT_KEYSTORE_PASSWORD"
          export ORG_GRADLE_PROJECT_SURVEYQUANT_KEY_ALIAS="$SURVEYQUANT_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_SURVEYQUANT_KEY_PASSWORD="$SURVEYQUANT_KEY_PASSWORD"

          ./gradlew --no-daemon clean assembleRelease

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/sq-release"
          cp "$APK_PATH" "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.93.apk"

          test -s "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.93.apk"

      - name: Copy source archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sq-release"

          cp "$GITHUB_WORKSPACE/$SOURCE_NAME" \
            "$RUNNER_TEMP/sq-release/SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"

          test -s "$RUNNER_TEMP/sq-release/SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip"

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.93-Release
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.93.apk
            ${{ runner.temp }}/sq-release/SurveyQuantAndroid_v1.0.93_TRIAL_UPDATE_SOURCE.zip
          if-no-files-found: error
          retention-days: 14
