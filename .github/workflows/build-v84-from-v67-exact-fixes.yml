              text=text[:start]+new_block+text[end:]
          
              cmp_start=text.find("function buildComparisonBoardModel(a,b,st){")
              cmp_end=text.find("\nasync function compareQuantLayers",cmp_start)
              if cmp_start<0 or cmp_end<0: raise SystemExit("PATCH ERROR: compare board block")
              cmp_block = '''
          function buildComparisonBoardModel(a,b,st){
           const beforeCfg=sqLayerCfg(activeProjectId,'before'),afterCfg=sqLayerCfg(activeProjectId,'after'),before=surfacePointsFromModel(a),after=surfacePointsFromModel(b),all=before.concat(after);
           if(all.length<3)throw new Error('لا توجد نقاط كافية لإنشاء لوحة المقارنة.');
           const xs=all.map(p=>p.e),ys=all.map(p=>p.n),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),span=Math.max(maxx-minx,maxy-miny)||1,ci=Math.max(.01,Number(document.getElementById('contourInterval')?.value)||1),step=Math.max(ci,span/12),margin=step*.9,panelW=Math.max(step*7,span*.30),gap=step*1.25,fx1=minx-margin,fy1=miny-margin,modelX2=maxx+margin,fy2=maxy+margin,fx2=modelX2+gap+panelW,dividerX=modelX2+gap*.5;
