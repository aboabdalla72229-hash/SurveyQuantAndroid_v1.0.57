name: Build SurveyQuant v1.0.127 - CAD Text Shrinks With Board Zoom

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v127-text-shrinks-as-zoom.yml"
      - "SurveyQuant_v1.0.127_TEXT_SHRINKS_AS_ZOOM_DWG_ALL_PROJECTS_PATCH.zip"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Checkout pinned LibreDWG-Web source
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-web
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install tools and unpack known-good V126 base kit plus V127 text-scale fix
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-yaml unzip zip

          BASE_KIT="SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.zip"
          PATCH_KIT="SurveyQuant_v1.0.127_TEXT_SHRINKS_AS_ZOOM_DWG_ALL_PROJECTS_PATCH.zip"
          test -s "$BASE_KIT" || { echo "ERROR: expected existing base kit is missing: $BASE_KIT"; exit 1; }
          test -s "$PATCH_KIT" || { echo "ERROR: V127 patch kit is missing: $PATCH_KIT"; exit 1; }
          unzip -t "$BASE_KIT"
          unzip -t "$PATCH_KIT"

          KIT_DIR="$RUNNER_TEMP/sq-v126-kit"
          PATCH_DIR="$RUNNER_TEMP/sq-v127-patch"
          rm -rf "$KIT_DIR" "$PATCH_DIR"
          mkdir -p "$KIT_DIR" "$PATCH_DIR"
          unzip -q "$BASE_KIT" -d "$KIT_DIR"
          unzip -q "$PATCH_KIT" -d "$PATCH_DIR"

          test -s "$KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_APPLY_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_IMPORT_BRIDGE.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.127_APPLY_TEXT_ZOOM_PATCH.py"
          test -s "$PATCH_DIR/SurveyQuant_v1.0.127_TEXT_ZOOM_REGRESSION_TEST.js"

          echo "V126_KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "V127_PATCH_DIR=$PATCH_DIR" >> "$GITHUB_ENV"

      - name: Build known-good V126 base with original V117 orientation and all-project DWG support
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          python3 "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk"
          test -s "$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_SOURCE_PATCH.zip"
          test -s "$RUNNER_TEMP/sq-release/source-patch/index.html"

      - name: Apply proportional small CAD text and verify zoom/DWG invariants
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="$RUNNER_TEMP/sq-release/source-patch"
          BASE_APK="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk"
          SOURCE_PATCH="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.127_DWG_TEXT_SHRINKS_AS_ZOOM_SOURCE_PATCH.zip"

          python3 "$V127_PATCH_DIR/SurveyQuant_v1.0.127_APPLY_TEXT_ZOOM_PATCH.py" --html "$SRC_DIR/index.html"
          node "$V127_PATCH_DIR/SurveyQuant_v1.0.127_TEXT_ZOOM_REGRESSION_TEST.js" "$SRC_DIR/index.html"

          # Keep the source package's original V117 test entry point aligned with the corrected renderer.
          cp "$V127_PATCH_DIR/SurveyQuant_v1.0.127_DWG_TEXT_SCALE_COMPAT_TEST.js" "$SRC_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js"
          cp "$V127_PATCH_DIR/SurveyQuant_v1.0.127_TEXT_ZOOM_REGRESSION_TEST.js" "$SRC_DIR/SurveyQuant_v1.0.127_TEXT_ZOOM_REGRESSION_TEST.js"
          cp "$V127_PATCH_DIR/SurveyQuant_v1.0.127_APPLY_TEXT_ZOOM_PATCH.py" "$SRC_DIR/SurveyQuant_v1.0.127_APPLY_TEXT_ZOOM_PATCH.py"
          cp "$V127_PATCH_DIR/README_V127_AR.txt" "$SRC_DIR/README_V127_AR.txt"

          rm -f "$SOURCE_PATCH"
          (cd "$SRC_DIR" && zip -qr "$SOURCE_PATCH" .)
          unzip -t "$SOURCE_PATCH"

      - name: Patch APK preview HTML, align and re-sign the release APK
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk"
          RAW_APK="$RUNNER_TEMP/sq-release/v127-patched-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/sq-release/v127-aligned.apk"
          FINAL_APK="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.127_TEXT_SHRINKS_AS_ZOOM_DWG_ALL_PROJECTS_FIX.apk"
          STORE="$RUNNER_TEMP/surveyquant-release.jks"

          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: SURVEYQUANT_KEYSTORE_BASE64 secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEYSTORE_PASSWORD secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: SURVEYQUANT_KEY_ALIAS secret is empty."; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: SURVEYQUANT_KEY_PASSWORD secret is empty."; exit 1; }

          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          python3 "$V127_PATCH_DIR/SurveyQuant_v1.0.127_APPLY_TEXT_ZOOM_PATCH.py" --apk "$BASE_APK" --output "$RAW_APK"
          unzip -p "$RAW_APK" assets/index.html > "$RUNNER_TEMP/sq-release/apk-index.html"
          node "$V127_PATCH_DIR/SurveyQuant_v1.0.127_TEXT_ZOOM_REGRESSION_TEST.js" "$RUNNER_TEMP/sq-release/apk-index.html"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "ERROR: Android SDK path is unavailable."; exit 1; }
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/zipalign" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            yes | sdkmanager --licenses >/dev/null
            sdkmanager "build-tools;35.0.0" >/dev/null
            BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          fi
          test -x "$BUILD_TOOLS/zipalign" || { echo "ERROR: zipalign is not installed."; exit 1; }
          test -x "$BUILD_TOOLS/apksigner" || { echo "ERROR: apksigner is not installed."; exit 1; }

          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$STORE" \
            --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" \
            --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD \
            --key-pass env:SURVEYQUANT_KEY_PASSWORD \
            --out "$FINAL_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL_APK"

          SOURCE_PATCH="$RUNNER_TEMP/sq-release/SurveyQuant_v1.0.127_DWG_TEXT_SHRINKS_AS_ZOOM_SOURCE_PATCH.zip"
          sha256sum "$FINAL_APK" "$SOURCE_PATCH" > "$RUNNER_TEMP/sq-release/SHA256SUMS.txt"
          printf 'V127 text zoom patch validated and APK re-signed.\n' > "$RUNNER_TEMP/sq-release/V127_BUILD_RESULT.txt"
          cat "$RUNNER_TEMP/sq-release/SHA256SUMS.txt"

      - name: Upload v1.0.127 APK, source patch and checksums
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.127-TEXT-SHRINKS-AS-ZOOM-DWG-ALL-PROJECTS
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.127_TEXT_SHRINKS_AS_ZOOM_DWG_ALL_PROJECTS_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.127_DWG_TEXT_SHRINKS_AS_ZOOM_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/V127_BUILD_RESULT.txt
            ${{ runner.temp }}/sq-release/STORM_CONVERTED_DXF.zip
            ${{ runner.temp }}/sq-release/source-patch/STORM_CONVERSION_REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload STORM diagnostics if build or validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.127-DIAGNOSTICS-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/STORM_CONVERSION_REPORT.md
            ${{ runner.temp }}/sq-storm-output/**
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
