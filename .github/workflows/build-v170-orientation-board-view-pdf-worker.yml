name: Build SurveyQuant v1.0.170 Orientation Board Viewport, Per-board Snap and PDF Worker Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V164 base APK + source artifact run ID"
        required: true
        type: string
        default: "41046602097"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v170-orientation-board-view-pdf-worker.yml"
      - "SurveyQuant_v1.0.170_UPLOAD_BUNDLE*.zip"
      - "SurveyQuant_v1.0.170_FREE_SOURCE_PATCH*.zip"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v170-orientation-board-view-pdf-worker
  cancel-in-progress: false

jobs:
  build_v170:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41046602097' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V170 source patch or optional upload bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          KIT="$RUNNER_TEMP/v170-kit"
          EXTRACT_DIR="$RUNNER_TEMP/v170-input"
          rm -rf "$KIT" "$EXTRACT_DIR"
          mkdir -p "$KIT" "$EXTRACT_DIR"
          mapfile -d '' PATCHES < <(find "$ROOT" -type f -iname 'SurveyQuant_v1.0.170_FREE_SOURCE_PATCH*.zip' -size +0c -print0 | sort -z)
          mapfile -d '' BUNDLES < <(find "$ROOT" -type f -iname 'SurveyQuant_v1.0.170_UPLOAD_BUNDLE*.zip' -size +0c -print0 | sort -z)
          mapfile -d '' KITS < <(find "$ROOT" -type f -iname 'SurveyQuant_v1.0.170_FIX_KIT*.zip' -size +0c -print0 | sort -z)
          if [ "${#BUNDLES[@]}" -gt 0 ]; then
            unzip -t "${BUNDLES[0]}" | tail -2
            unzip -q "${BUNDLES[0]}" -d "$EXTRACT_DIR/bundle"
            mapfile -d '' INNER < <(find "$EXTRACT_DIR/bundle" -type f -iname 'SurveyQuant_v1.0.170_FIX_KIT*.zip' -size +0c -print0 | sort -z)
            mapfile -d '' INNER_PATCHES < <(find "$EXTRACT_DIR/bundle" -type f -iname 'SurveyQuant_v1.0.170_FREE_SOURCE_PATCH*.zip' -size +0c -print0 | sort -z)
            if [ "${#INNER[@]}" -gt 0 ]; then KIT_ZIP="${INNER[0]}"
            elif [ "${#INNER_PATCHES[@]}" -gt 0 ]; then KIT_ZIP="${INNER_PATCHES[0]}"
            elif [ "${#PATCHES[@]}" -gt 0 ]; then KIT_ZIP="${PATCHES[0]}"
            else echo "ERROR: bundle contains no fix kit/source patch"; exit 1; fi
          elif [ "${#PATCHES[@]}" -gt 0 ]; then KIT_ZIP="${PATCHES[0]}"
          elif [ "${#KITS[@]}" -gt 0 ]; then KIT_ZIP="${KITS[0]}"
          else
            echo "ERROR: V170 source patch is not in the GitHub checkout."
            echo "Upload SurveyQuant_v1.0.170_FREE_SOURCE_PATCH.zip to repository root and commit it."
            find "$ROOT" -type f -iname '*170*' -printf '%P (%s bytes)\n' | sort || true
            exit 1
          fi
          unzip -t "$KIT_ZIP" | tail -2
          unzip -q "$KIT_ZIP" -d "$KIT"
          for required in \
            SurveyQuant_v1.0.166_PATCH.py SurveyQuant_v1.0.166_CAD_ENGINE.js \
            SurveyQuant_v1.0.167_PATCH.py SurveyQuant_v1.0.167_CAD_ENGINE.js \
            SurveyQuant_v1.0.168_PATCH.py SurveyQuant_v1.0.168_CAD_ENGINE.js \
            SurveyQuant_v1.0.168_CAD_ENGINE_TEST.js SurveyQuant_v1.0.168_APP_REGRESSION_TEST.js \
            SurveyQuant_v1.0.169_PATCH.py SurveyQuant_v1.0.169_CAD_ENGINE.js \
            SurveyQuant_v1.0.169_REGRESSION_TEST.js SurveyQuant_v1.0.169_APP_REGRESSION_TEST.js \
            SurveyQuant_v1.0.170_PATCH.py SurveyQuant_v1.0.170_CAD_ENGINE.js \
            SurveyQuant_v1.0.170_REGRESSION_TEST.js SurveyQuant_v1.0.170_APP_REGRESSION_TEST.js \
            SurveyQuant_v1.0.170_DWG_WASM_BINARY_TEST.js SurveyQuant_v1.0.170_OLE_DXF_TEST.py \
            SurveyQuant_v1.0.170_PACKAGE_FREE_APK.py README_V170_AR.md V170_TEST_REPORT_AR.txt \
            THIRD_PARTY_NOTICES.md; do
            test -s "$KIT/$required" || { echo "ERROR: Required V170 kit member missing: $required"; exit 1; }
          done
          echo "V170_KIT=$KIT" >> "$GITHUB_ENV"
          echo "PASS: V170 FREE_SOURCE_PATCH accepted; upload bundle is optional."

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DXF validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ezdxf pillow

      - name: Prepare V170 PDF raster tile fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$V170_KIT" <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import sys
          kit=Path(sys.argv[1]); names=[kit/f"V170_TEST_TILE_{i}.jpg" for i in range(4)]
          if not all(p.is_file() and p.stat().st_size for p in names):
              page=Image.new("RGB",(3200,2264),(248,248,245)); d=ImageDraw.Draw(page)
              for x in range(0,3200,100): d.line((x,0,x,2264),fill=(222,226,228),width=2)
              for y in range(0,2264,100): d.line((0,y,3200,y),fill=(222,226,228),width=2)
              d.rectangle((70,70,3130,2194),outline=(20,35,50),width=8)
              d.line((100,300,3100,300),fill=(20,90,160),width=7)
              d.line((300,100,300,2150),fill=(170,35,35),width=7)
              d.text((130,120),"V170 SINGLE-DXF OLE RASTER REGRESSION",fill=(10,20,30))
              for i,p in enumerate(names):
                  x=(i%2)*1600; y=(i//2)*1132; page.crop((x,y,x+1600,y+1132)).save(p,"JPEG",quality=86,optimize=True)
          for p in names:
              with Image.open(p) as im:
                  if im.size!=(1600,1132): raise SystemExit(f"Wrong tile size {p}: {im.size}")
          print("PASS: four V170 PDF tiles are 1600x1132")
          PY

      - name: Download successful V164 Android runtime and source patch for V170
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v164-base"
          SOURCE_DIR="$RUNNER_TEMP/v170-source"
          RELEASE_DIR="$RUNNER_TEMP/v170-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "SurveyQuant-v1.0.164-FREE-OUTPUT-SAVE-AXIS-LABELS-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.164_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.164_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V164 signed APK missing from source run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V164 source patch missing from source run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V170_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V170_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V170_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Inject V166 through V170 into the V164 Android application
        shell: bash
        run: |
          set -euo pipefail
          for v in 166 167 168 169; do
            python3 "$V170_KIT/SurveyQuant_v1.0.${v}_PATCH.py" --html "$V170_SOURCE_DIR/index.html" --engine "$V170_KIT/SurveyQuant_v1.0.${v}_CAD_ENGINE.js"
          done
          python3 "$V170_KIT/SurveyQuant_v1.0.169_PATCH.py" --html "$V170_SOURCE_DIR/index.html" --engine "$V170_KIT/SurveyQuant_v1.0.169_CAD_ENGINE.js" --check-only
          python3 "$V170_KIT/SurveyQuant_v1.0.170_PATCH.py" --html "$V170_SOURCE_DIR/index.html" --engine "$V170_KIT/SurveyQuant_v1.0.170_CAD_ENGINE.js"
          python3 "$V170_KIT/SurveyQuant_v1.0.170_PATCH.py" --html "$V170_SOURCE_DIR/index.html" --engine "$V170_KIT/SurveyQuant_v1.0.170_CAD_ENGINE.js" --check-only

      - name: Test V170 orientation viewport, per-board snap, PDF and WASM
        shell: bash
        run: |
          set -euo pipefail
          node "$V170_KIT/SurveyQuant_v1.0.170_REGRESSION_TEST.js" \
            "$V170_KIT/V170_TEST_TILE_0.jpg" "$V170_KIT/V170_TEST_TILE_1.jpg" \
            "$V170_KIT/V170_TEST_TILE_2.jpg" "$V170_KIT/V170_TEST_TILE_3.jpg" \
            "$RUNNER_TEMP/SurveyQuant_v1.0.170_PDF_SINGLE_DXF_TEST.dxf"
          python3 "$V170_KIT/SurveyQuant_v1.0.170_OLE_DXF_TEST.py" \
            "$RUNNER_TEMP/SurveyQuant_v1.0.170_PDF_SINGLE_DXF_TEST.dxf" \
            --report "$V170_RELEASE_DIR/V170_PDF_SINGLE_DXF_AUDIT.json"
          node "$V170_KIT/SurveyQuant_v1.0.170_APP_REGRESSION_TEST.js" \
            "$V170_SOURCE_DIR/index.html" "$V170_KIT/SurveyQuant_v1.0.170_CAD_ENGINE.js"
          node "$V170_KIT/SurveyQuant_v1.0.168_CAD_ENGINE_TEST.js"
          node "$V170_SOURCE_DIR/SurveyQuant_v1.0.164_DOWNLOAD_TEST.js" "$V170_SOURCE_DIR/index.html"
          node "$V170_SOURCE_DIR/SurveyQuant_v1.0.163_DWG_OVERLAY_PIPELINE_TEST.js" "$V170_SOURCE_DIR/index.html"
          node "$V170_SOURCE_DIR/SurveyQuant_v1.0.163_PDF_WORKER_BOOTSTRAP_TEST.js" "$V170_SOURCE_DIR/index.html"
          node "$V170_KIT/SurveyQuant_v1.0.170_DWG_WASM_BINARY_TEST.js" \
            "$V170_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js" \
            "$V170_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm" \
            "$V170_SOURCE_DIR/libredwg-writer/dist/libredwg-web.js"

      - name: Syntax and inline application JavaScript checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "$V170_KIT/SurveyQuant_v1.0.166_PATCH.py" "$V170_KIT/SurveyQuant_v1.0.167_PATCH.py" \
            "$V170_KIT/SurveyQuant_v1.0.168_PATCH.py" "$V170_KIT/SurveyQuant_v1.0.169_PATCH.py" \
            "$V170_KIT/SurveyQuant_v1.0.170_PATCH.py" "$V170_KIT/SurveyQuant_v1.0.170_OLE_DXF_TEST.py" \
            "$V170_KIT/SurveyQuant_v1.0.170_PACKAGE_FREE_APK.py"
          for js in \
            "$V170_KIT/SurveyQuant_v1.0.166_CAD_ENGINE.js" "$V170_KIT/SurveyQuant_v1.0.167_CAD_ENGINE.js" \
            "$V170_KIT/SurveyQuant_v1.0.168_CAD_ENGINE.js" "$V170_KIT/SurveyQuant_v1.0.169_CAD_ENGINE.js" \
            "$V170_KIT/SurveyQuant_v1.0.170_CAD_ENGINE.js" "$V170_KIT/SurveyQuant_v1.0.170_REGRESSION_TEST.js" \
            "$V170_KIT/SurveyQuant_v1.0.170_APP_REGRESSION_TEST.js" "$V170_KIT/SurveyQuant_v1.0.170_DWG_WASM_BINARY_TEST.js" \
            "$V170_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"; do node --check "$js"; done
          INLINE_DIR="$RUNNER_TEMP/v170-inline-check"; rm -rf "$INLINE_DIR"; mkdir -p "$INLINE_DIR"
          python3 - "$V170_SOURCE_DIR/index.html" "$INLINE_DIR" <<'PY'
          from pathlib import Path
          import re,sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8'); out=Path(sys.argv[2]); count=0
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',html,re.I)):
              attrs,body=m.group(1),m.group(2); typ=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              if not body.strip() or (typ and typ.group(1).lower() not in ('text/javascript','application/javascript','module')): continue
              (out/f'inline-{i}.js').write_text(body,encoding='utf-8'); count+=1
          if not count: raise SystemExit('No executable inline JavaScript was found')
          print(f'PASS: extracted {count} executable inline scripts')
          PY
          for js in "$INLINE_DIR"/*.js; do node --check "$js"; done
          echo "PASS: V170 syntax, inline script, app, DWG WASM and PDF DXF checks."

      - name: Prepare V170 complete source patch
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            SurveyQuant_v1.0.166_CAD_ENGINE.js SurveyQuant_v1.0.166_PATCH.py \
            SurveyQuant_v1.0.167_CAD_ENGINE.js SurveyQuant_v1.0.167_PATCH.py \
            SurveyQuant_v1.0.168_CAD_ENGINE.js SurveyQuant_v1.0.168_PATCH.py \
            SurveyQuant_v1.0.168_CAD_ENGINE_TEST.js SurveyQuant_v1.0.168_APP_REGRESSION_TEST.js \
            SurveyQuant_v1.0.169_CAD_ENGINE.js SurveyQuant_v1.0.169_PATCH.py \
            SurveyQuant_v1.0.170_CAD_ENGINE.js SurveyQuant_v1.0.170_PATCH.py \
            SurveyQuant_v1.0.170_REGRESSION_TEST.js SurveyQuant_v1.0.170_APP_REGRESSION_TEST.js \
            SurveyQuant_v1.0.170_DWG_WASM_BINARY_TEST.js SurveyQuant_v1.0.170_OLE_DXF_TEST.py \
            SurveyQuant_v1.0.170_PACKAGE_FREE_APK.py README_V170_AR.md V170_TEST_REPORT_AR.txt THIRD_PARTY_NOTICES.md; do
            cp "$V170_KIT/$f" "$V170_SOURCE_DIR/"
          done
          for i in 0 1 2 3; do cp "$V170_KIT/V170_TEST_TILE_${i}.jpg" "$V170_SOURCE_DIR/"; done
          rm -rf "$V170_SOURCE_DIR/__pycache__"
          (cd "$V170_SOURCE_DIR" && zip -qr "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_SOURCE_PATCH.zip" | tail -2

      - name: Package V170 APK from the verified V164 Android base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V170_KIT/SurveyQuant_v1.0.170_PACKAGE_FREE_APK.py" \
            --apk-input "$V170_BASE_APK" \
            --apk-output "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_UNSIGNED.apk" \
            --html-to-inject "$V170_SOURCE_DIR/index.html" \
            --wasm-loader "$V170_SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          python3 - "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_UNSIGNED.apk" <<'PY'
          import sys,zipfile
          from pathlib import Path
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              names=z.namelist(); html=z.read('assets/index.html')
              markers=(b'sq164-cad-output-axis-fix',b'sq166-readonly-source-and-exact-pdf-raster',b'sq167-dwg-orientation-view-transform',b'sq168-pdf-access-axis-points-explicit-snap-fix',b'sq169-orientation-save-block-axis-content-identity-single-dxf-ole',b'sq170-orientation-canvas-zoom-per-board-picks-snap-wasm-binary-pdf-worker-ole-reader',b'id="sq163-cad-engine"',b'id="sq163-pdfjs-worker"',b'id="sq162-wasm-binary"')
              for m in markers:
                  if m not in html: raise SystemExit('V170 APK missing marker: '+m.decode())
              for abi in ('lib/x86/','lib/x86_64/'):
                  if any(n.startswith(abi) for n in names): raise SystemExit('Unexpected x86 payload '+abi)
              if not any(n.startswith('lib/arm64-v8a/') for n in names): raise SystemExit('ARM64 runtime missing')
          print('PASS V170 APK package: V170 UI, PDF worker, embedded WASM, and ARM64 runtime verified.')
          PY

      - name: Sign, align, and verify final Android APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_ALIGNED.apk"
          FINAL="$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_ANDROID_ORIENTATION_VIEW_PDF_WORKER.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='170'.*versionName='1.0.170'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_UNSIGNED.apk"

      - name: Include V170 PDF-to-DXF test drawing, report and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/SurveyQuant_v1.0.170_PDF_SINGLE_DXF_TEST.dxf" "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_PDF_SINGLE_DXF_TEST.dxf"
          cp "$V170_KIT/README_V170_AR.md" "$V170_RELEASE_DIR/README_V170_AR.md"
          cp "$V170_KIT/V170_TEST_REPORT_AR.txt" "$V170_RELEASE_DIR/V170_TEST_REPORT_AR.txt"
          cp "$V170_KIT/THIRD_PARTY_NOTICES.md" "$V170_RELEASE_DIR/THIRD_PARTY_NOTICES.md"
          sha256sum "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_ANDROID_ORIENTATION_VIEW_PDF_WORKER.apk" \
            "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_FREE_SOURCE_PATCH.zip" \
            "$V170_RELEASE_DIR/SurveyQuant_v1.0.170_PDF_SINGLE_DXF_TEST.dxf" > "$V170_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V170_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload verified V170 APK, source patch, and test DXF
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.170-FREE-ORIENTATION-BOARD-VIEWPORT-PDF-WORKER
          path: |
            ${{ runner.temp }}/v170-release/SurveyQuant_v1.0.170_FREE_ANDROID_ORIENTATION_VIEW_PDF_WORKER.apk
            ${{ runner.temp }}/v170-release/SurveyQuant_v1.0.170_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v170-release/SurveyQuant_v1.0.170_PDF_SINGLE_DXF_TEST.dxf
            ${{ runner.temp }}/v170-release/V170_PDF_SINGLE_DXF_AUDIT.json
            ${{ runner.temp }}/v170-release/README_V170_AR.md
            ${{ runner.temp }}/v170-release/V170_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v170-release/THIRD_PARTY_NOTICES.md
            ${{ runner.temp }}/v170-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
