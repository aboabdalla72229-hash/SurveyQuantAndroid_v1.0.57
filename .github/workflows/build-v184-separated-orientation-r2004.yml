name: Build SurveyQuant v1.0.184 Separate Orientation + Valid R2004 PDF DXF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v184-separated-orientation-r2004.yml"
      - "SurveyQuant_v1.0.184_FIX_BUNDLE.zip"
      - "SurveyQuant_v1.0.184_SOURCE_PATCH.zip"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful V183 signed APK workflow run ID"
        required: true
        type: string
        default: "41614253243"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v184-separated-orientation-r2004
  cancel-in-progress: false

jobs:
  build_v184:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '41614253243' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DXF template dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4

      - name: Extract V184 repair bundle or uploaded source patch
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR="$RUNNER_TEMP/v184-archive"
          PAYLOAD="$RUNNER_TEMP/v184-payload"
          KIT="$RUNNER_TEMP/v184-kit"
          mkdir -p "$ARCHIVE_DIR" "$PAYLOAD" "$KIT"

          if [ -s SurveyQuant_v1.0.184_FIX_BUNDLE.zip ]; then
            echo "Using V184 repair bundle"
            unzip -q SurveyQuant_v1.0.184_FIX_BUNDLE.zip -d "$ARCHIVE_DIR"
          elif [ -s SurveyQuant_v1.0.184_SOURCE_PATCH.zip ]; then
            echo "Using uploaded V184 source patch"
            unzip -q SurveyQuant_v1.0.184_SOURCE_PATCH.zip -d "$ARCHIVE_DIR"
          else
            echo "ERROR: V184 input archive is missing. Expected FIX_BUNDLE.zip or SOURCE_PATCH.zip."
            exit 1
          fi

          FIX_SCRIPT="$(find "$ARCHIVE_DIR" -type f -name 'SurveyQuant_v1.0.184_FIX.py' -print -quit)"
          PACKAGE_SCRIPT="$(find "$ARCHIVE_DIR" -type f -name 'SurveyQuant_v1.0.184_PACKAGE_FREE_APK.py' -print -quit)"

          if [ -n "$FIX_SCRIPT" ]; then
            echo "Repair script found; applying it to the known V183 source kit"
            test -s SurveyQuant_v1.0.183_FIX_KIT.zip || {
              echo "ERROR: SurveyQuant_v1.0.183_FIX_KIT.zip is missing"
              exit 1
            }
            unzip -q SurveyQuant_v1.0.183_FIX_KIT.zip -d "$KIT"
            PAYLOAD="$(dirname "$FIX_SCRIPT")"
            for f in SurveyQuant_v1.0.184_PACKAGE_FREE_APK.py test_v184_engine_regression.js test_v184_orientation.py test_v184_pdf_r2004_output.py SurveyQuant_v1.0.177_POINT_PARSER_TEST.js SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js source_v184.dxf target_v184.dxf README_V184_AR.md; do
              src="$(find "$ARCHIVE_DIR" -type f -name "$f" -print -quit)"
              test -n "$src" || {
                echo "ERROR: V184 repair archive is missing $f"
                exit 1
              }
              cp "$src" "$KIT/"
            done
            python3 "$FIX_SCRIPT" --kit "$KIT"

          elif [ -n "$PACKAGE_SCRIPT" ]; then
            echo "Prepared V184 source kit found; using it directly"
            KIT_ROOT="$(dirname "$PACKAGE_SCRIPT")"
            cp -a "$KIT_ROOT/." "$KIT/"
            for f in index.html SurveyQuant_v1.0.184_PACKAGE_FREE_APK.py test_v184_engine_regression.js test_v184_orientation.py test_v184_pdf_r2004_output.py SurveyQuant_v1.0.177_POINT_PARSER_TEST.js SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js source_v184.dxf target_v184.dxf README_V184_AR.md; do
              if [ ! -s "$KIT/$f" ]; then
                src="$(find "$ARCHIVE_DIR" -type f -name "$f" -print -quit)"
                test -n "$src" || {
                  echo "ERROR: V184 source patch is incomplete; missing $f"
                  echo "Archive files:"
                  find "$ARCHIVE_DIR" -maxdepth 5 -type f | sort | head -200
                  exit 1
                }
                cp "$src" "$KIT/"
              fi
            done
          else
            echo "ERROR: V184 archive contains neither the repair script nor the APK packaging script."
            echo "Archive files:"
            find "$ARCHIVE_DIR" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          for f in index.html SurveyQuant_v1.0.184_PACKAGE_FREE_APK.py test_v184_engine_regression.js test_v184_orientation.py test_v184_pdf_r2004_output.py SurveyQuant_v1.0.177_POINT_PARSER_TEST.js SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js source_v184.dxf target_v184.dxf README_V184_AR.md; do
            test -s "$KIT/$f" || { echo "ERROR: final V184 kit is missing $f"; exit 1; }
          done
          echo "V184_KIT=$KIT" >> "$GITHUB_ENV"
          echo "V184_PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"

      - name: Install CAD and browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 playwright reportlab==4.4.9 pillow
          python3 -m playwright install --with-deps chromium

      - name: Run orientation, DXF, PDF and parser regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$V184_KIT"
          node test_v184_engine_regression.js | tee V184_ENGINE_TEST_LOG.txt
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html | tee V184_POINT_PARSER_TEST_LOG.txt
          node SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js index.html | tee V184_ANDROID_BYTES_TEST_LOG.txt
          python3 test_v184_orientation.py | tee V184_ORIENTATION_TEST_LOG.json
          python3 test_v184_pdf_r2004_output.py | tee V184_PDF_TEST_LOG.json
          python3 - <<'PY'
          from pathlib import Path
          import ezdxf, ezdxf.recover, json
          root=Path('.')
          files=[root/'V184_ORIENTED_RESULT.dxf',root/'V184_MIXED_R2004.dxf',root/'V184_RASTER_R2004.dxf',root/'V184_VECTOR_R2004.dxf']
          report=[]
          for path in files:
              doc,_=ezdxf.recover.readfile(path)
              audit=doc.audit()
              if doc.dxfversion!='AC1018' or audit.errors or audit.fixes:
                  raise SystemExit(f'Invalid CAD output: {path.name}; version={doc.dxfversion}; errors={len(audit.errors)}; fixes={len(audit.fixes)}')
              report.append({'file':path.name,'bytes':path.stat().st_size,'version':doc.dxfversion,'entities':len(doc.modelspace()),'audit_errors':len(audit.errors),'audit_fixes':len(audit.fixes)})
          (root/'V184_DXF_AUDIT_LOG.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Download signed V183 base APK
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/v183-base"
          OUT="$RUNNER_TEMP/v184-release"
          mkdir -p "$BASE" "$OUT"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.183-FREE-REAL-CAD-AXIS-FIT-PDF-V180" --dir "$BASE"
          APK="$(find "$BASE" -type f -name 'SurveyQuant_v1.0.183_FREE_ANDROID_REAL_CAD_AXIS_FIT_PDF_V180.apk' -print -quit)"
          test -s "$APK" || { echo "ERROR: signed V183 base APK missing from run $SOURCE_RUN_ID"; exit 1; }
          echo "V184_BASE_APK=$APK" >> "$GITHUB_ENV"
          echo "V184_RELEASE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Package v1.0.184 APK with separated orientation and R2004 DXF engine
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V184_KIT/SurveyQuant_v1.0.184_PACKAGE_FREE_APK.py" \
            --apk-input "$V184_BASE_APK" \
            --apk-output "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_UNSIGNED.apk" \
            --html-to-inject "$V184_KIT/index.html"
          test -s "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_UNSIGNED.apk"
          unzip -t "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_UNSIGNED.apk" | tail -2

      - name: Sign and verify v1.0.184 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V184_RELEASE_DIR/SurveyQuant_v1.0.184_ALIGNED.apk"
          FINAL="$V184_RELEASE_DIR/SurveyQuant_v1.0.184_FREE_ANDROID_SEPARATE_ORIENTATION_R2004_PDF_DXF.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -F "versionCode='184' versionName='1.0.184'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_UNSIGNED.apk"

      - name: Build source patch and checksums
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/v184-source"
          mkdir -p "$SOURCE"
          cp -a "$V184_KIT/." "$SOURCE/"
          (cd "$SOURCE" && zip -qr "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_FREE_SOURCE_PATCH.zip" | tail -2
          sha256sum "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_FREE_ANDROID_SEPARATE_ORIENTATION_R2004_PDF_DXF.apk" "$V184_RELEASE_DIR/SurveyQuant_v1.0.184_FREE_SOURCE_PATCH.zip" "$V184_KIT"/*.dxf > "$V184_RELEASE_DIR/SHA256SUMS.txt"
          cp "$V184_KIT/README_V184_AR.md" "$V184_RELEASE_DIR/README_V184_AR.md"
          cat "$V184_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed APK, source, tests and verified DXF files
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.184-FREE-SEPARATE-ORIENTATION-R2004-PDF-DXF
          path: |
            ${{ runner.temp }}/v184-release/SurveyQuant_v1.0.184_FREE_ANDROID_SEPARATE_ORIENTATION_R2004_PDF_DXF.apk
            ${{ runner.temp }}/v184-release/SurveyQuant_v1.0.184_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v184-release/README_V184_AR.md
            ${{ runner.temp }}/v184-release/SHA256SUMS.txt
            ${{ runner.temp }}/v184-kit/V184_*_TEST_LOG.*
            ${{ runner.temp }}/v184-kit/V184_DXF_AUDIT_LOG.json
            ${{ runner.temp }}/v184-kit/V184_*.dxf
          if-no-files-found: error
          retention-days: 30
