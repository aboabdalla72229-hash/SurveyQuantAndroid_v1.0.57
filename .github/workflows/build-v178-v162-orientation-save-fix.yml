name: Build SurveyQuant v1.0.178 V162 Orientation and Android Save Fix

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful original V162 APK and source artifact run ID"
        required: true
        type: string
        default: "40919113310"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v178-v162-orientation-save-fix.yml"
      - "SurveyQuant_v1.0.178_FIX_KIT.zip"

permissions:
  actions: read
  contents: write

concurrency:
  group: surveyquant-v178-v162-orientation-save-fix
  cancel-in-progress: false

jobs:
  build_v178:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40919113310' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract and validate V178 repair kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_ZIP="$GITHUB_WORKSPACE/SurveyQuant_v1.0.178_FIX_KIT.zip"
          test -s "$KIT_ZIP" || { echo "ERROR: Upload SurveyQuant_v1.0.178_FIX_KIT.zip to the repository root"; exit 1; }
          KIT="$RUNNER_TEMP/sq178-kit"
          rm -rf "$KIT" && mkdir -p "$KIT"
          unzip -q "$KIT_ZIP" -d "$KIT"
          for f in \
            SurveyQuant_v1.0.176_PATCH.py \
            SurveyQuant_v1.0.176_CAD_ENGINE.js \
            SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.177_CAD_ENGINE.js \
            SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            SurveyQuant_v1.0.177_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.177_IMAGETRACER.js \
            SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V177_VECTOR_TEST.pdf \
            SurveyQuant_v1.0.178_PATCH.py \
            SurveyQuant_v1.0.178_CAD_ENGINE.js \
            README_V178_AR.md \
            SurveyQuant_v1.0.178_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.178_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_BOARD_FILE_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_SAVE_UI_TEST.py; do
            test -s "$KIT/$f" || { echo "ERROR: Missing kit file $f"; exit 1; }
          done
          echo "SQ178_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the exact original V162 base APK and source
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v162-base"
          SOURCE_DIR="$RUNNER_TEMP/v178-source"
          RELEASE_DIR="$RUNNER_TEMP/v178-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.162-FREE-DWG-WASM-PROJECTION-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V162 APK missing from run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V162 source patch missing from run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V178_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V178_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V178_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Apply V176 CAD and PDF baseline repair to clean V162 source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ178_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V178_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ178_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ178_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt"
          python3 "$SQ178_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V178_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ178_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ178_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt" --check-only

      - name: Apply V177 file-byte snapshot and canvas provenance baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ178_KIT/SurveyQuant_v1.0.177_PATCH.py" \
            --html "$V178_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.177_CAD_ENGINE.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt"
          python3 "$SQ178_KIT/SurveyQuant_v1.0.177_PATCH.py" \
            --html "$V178_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.177_CAD_ENGINE.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt" --check-only
          for f in \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.177_CAD_ENGINE.js \
            SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            SurveyQuant_v1.0.177_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.177_IMAGETRACER.js \
            SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V177_VECTOR_TEST.pdf; do
            cp "$SQ178_KIT/$f" "$V178_SOURCE_DIR/"
          done

      - name: Apply V178 point provenance and native Android save correction
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ178_KIT/SurveyQuant_v1.0.178_PATCH.py" \
            --html "$V178_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.178_CAD_ENGINE.js"
          python3 "$SQ178_KIT/SurveyQuant_v1.0.178_PATCH.py" \
            --html "$V178_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.178_CAD_ENGINE.js" --check-only
          for f in \
            SurveyQuant_v1.0.178_PATCH.py \
            SurveyQuant_v1.0.178_CAD_ENGINE.js \
            README_V178_AR.md \
            SurveyQuant_v1.0.178_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.178_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_BOARD_FILE_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_SAVE_UI_TEST.py; do
            cp "$SQ178_KIT/$f" "$V178_SOURCE_DIR/"
          done

      - name: Run point, DWG, orientation UI, save, merge and PDF regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$V178_SOURCE_DIR"
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 playwright
          python3 -m playwright install --with-deps chromium
          python3 -m py_compile \
            "$SQ178_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            "$V178_SOURCE_DIR/SurveyQuant_v1.0.177_PATCH.py" \
            "$V178_SOURCE_DIR/SurveyQuant_v1.0.178_PATCH.py" \
            "$V178_SOURCE_DIR/SurveyQuant_v1.0.178_PACKAGE_FREE_APK.py" \
            "$V178_SOURCE_DIR/SurveyQuant_v1.0.178_ORIENTATION_SAVE_UI_TEST.py"
          node --check SurveyQuant_v1.0.178_CAD_ENGINE.js
          node --check SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js
          node --check SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js
          node --check libredwg-writer/wasm/libredwg-web.js
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js index.html
          python3 - "$RUNNER_TEMP" <<'PYFIXTURES'
          import ezdxf,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          for name,block,layer,offset in [('target','TARGET_SYMBOL','TARGET_LAYER',0),('source','SOURCE_SYMBOL','SOURCE_LAYER',100)]:
              doc=ezdxf.new('R12');msp=doc.modelspace();doc.layers.new(layer)
              blk=doc.blocks.new(block,base_point=(0,0))
              blk.add_line((0,0),(5,5),dxfattribs={'layer':layer})
              blk.add_text(block,height=1,dxfattribs={'layer':layer}).set_placement((0,2))
              msp.add_blockref(block,(offset,offset),dxfattribs={'layer':layer})
              msp.add_polyline2d([(offset,offset),(offset+10,offset)],dxfattribs={'layer':layer})
              msp.add_text(name.upper(),height=2,dxfattribs={'layer':layer}).set_placement((offset,offset+5))
              doc.saveas(root/f'v178_{name}_blocks.dxf')
          PYFIXTURES
          node SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            "$RUNNER_TEMP/v178_target_blocks.dxf" "$RUNNER_TEMP/v178_source_blocks.dxf" \
            "$V178_RELEASE_DIR/V178_MERGED_BLOCKS_TEST.dxf"
          node SurveyQuant_v1.0.178_CAD_ENGINE_TEST.js \
            "$V178_RELEASE_DIR/V178_MERGED_BOARDS_TEST.dxf" \
            "$V178_RELEASE_DIR/V178_ORIENTED_BOARD_TEST.dxf"
          node SurveyQuant_v1.0.178_ORIENTATION_BOARD_FILE_TEST.js \
            "$V178_RELEASE_DIR/V178_ORIENTATION_BOARD_FILE_TEST.dxf"
          node SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            pdfjs-v3.11.174.min.js pdfjs-worker-v3.11.174.min.js V177_VECTOR_TEST.pdf \
            "$V178_RELEASE_DIR/V178_PDF_VECTOR_TEST_OUT.dxf"
          node SurveyQuant_v1.0.177_APP_PROJECT_TEST.js index.html
          node SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            libredwg-writer/wasm/libredwg-web.js libredwg-writer/wasm/libredwg-web.wasm
          python3 SurveyQuant_v1.0.178_ORIENTATION_SAVE_UI_TEST.py \
            --engine SurveyQuant_v1.0.178_CAD_ENGINE.js \
            --output "$V178_RELEASE_DIR/V178_UI_ORIENTED_TEST.dxf"
          python3 - "$V178_RELEASE_DIR" <<'PYAUDIT'
          import ezdxf,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          specs={
            'V178_MERGED_BOARDS_TEST.dxf':('two-board DXF merge',2,0),
            'V178_MERGED_BLOCKS_TEST.dxf':('block/INSERT/layer preservation',2,2),
            'V178_ORIENTED_BOARD_TEST.dxf':('orientation transform',1,0),
            'V178_ORIENTATION_BOARD_FILE_TEST.dxf':('large-coordinate distinct boards',1,0),
            'V178_PDF_VECTOR_TEST_OUT.dxf':('PDF vector conversion regression',1,0),
            'V178_UI_ORIENTED_TEST.dxf':('browser UI and Android save bridge',1,0),
          }
          for filename,(kind,min_poly,min_text) in specs.items():
              path=root/filename
              if not path.is_file() or path.stat().st_size<100: raise SystemExit(f'Missing or empty {filename}')
              doc=ezdxf.readfile(path); msp=doc.modelspace()
              polys=len(msp.query('POLYLINE')); texts=len(msp.query('TEXT'))
              images=len(msp.query('IMAGE'))+len(msp.query('IMAGEDEF'))
              if doc.dxfversion!='AC1009' or polys<min_poly or texts<min_text or images:
                  raise SystemExit(f'{filename}: invalid DXF: version={doc.dxfversion}, POLYLINE={polys}, TEXT={texts}, IMAGE/IMAGEDEF={images}')
              if filename=='V178_UI_ORIENTED_TEST.dxf':
                  pts=[(round(v.dxf.location.x,6),round(v.dxf.location.y,6)) for p in msp.query('POLYLINE') for v in p.vertices]
                  expected=[(1000.0,2000.0),(1000.0,2020.0),(980.0,2020.0),(980.0,2000.0)]
                  if pts!=expected: raise SystemExit(f'UI save did not transform source vertices to target coordinates: {pts}')
              audit=doc.audit()
              if audit.errors or audit.fixes: raise SystemExit(f'{filename}: audit failed: errors={len(audit.errors)}, fixes={len(audit.fixes)}')
              roundtrip=root/(path.stem+'_ROUNDTRIP.dxf');doc.saveas(roundtrip)
              reopened=ezdxf.readfile(roundtrip);again=reopened.audit()
              if again.errors or again.fixes: raise SystemExit(f'{filename}: save/reopen audit failed')
              print(f'PASS {kind}: entities={len(msp)}, POLYLINE={polys}, TEXT={texts}, audit=0, roundtrip=0')
          PYAUDIT

      - name: Package unsigned V178 APK from exact original V162 base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V178_SOURCE_DIR/SurveyQuant_v1.0.178_PACKAGE_FREE_APK.py" \
            --apk-input "$V178_BASE_APK" \
            --apk-output "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_UNSIGNED.apk" \
            --html-to-inject "$V178_SOURCE_DIR/index.html"
          test -s "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_UNSIGNED.apk"
          unzip -t "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_UNSIGNED.apk" | tail -2

      - name: Sign and verify V178 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_ALIGNED.apk"
          FINAL="$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_ANDROID_ORIENTATION_SAVE_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='178'.*versionName='1.0.178'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_UNSIGNED.apk"

      - name: Write V178 report, source patch and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "$SQ178_KIT/README_V178_KIT_AR.md" "$V178_SOURCE_DIR/README_V178_KIT_AR.md"
          cp "$SQ178_KIT/V178_TEST_REPORT_AR.txt" "$V178_RELEASE_DIR/V178_TEST_REPORT_AR.txt"
          cp "$V178_SOURCE_DIR/README_V178_AR.md" "$V178_RELEASE_DIR/README_V178_AR.md"
          rm -rf "$V178_SOURCE_DIR/__pycache__"
          (cd "$V178_SOURCE_DIR" && zip -qr "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_SOURCE_PATCH.zip" | tail -2
          sha256sum \
            "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_ANDROID_ORIENTATION_SAVE_FIX.apk" \
            "$V178_RELEASE_DIR/SurveyQuant_v1.0.178_FREE_SOURCE_PATCH.zip" \
            "$V178_RELEASE_DIR/V178_MERGED_BOARDS_TEST.dxf" \
            "$V178_RELEASE_DIR/V178_MERGED_BLOCKS_TEST.dxf" \
            "$V178_RELEASE_DIR/V178_ORIENTED_BOARD_TEST.dxf" \
            "$V178_RELEASE_DIR/V178_ORIENTATION_BOARD_FILE_TEST.dxf" \
            "$V178_RELEASE_DIR/V178_PDF_VECTOR_TEST_OUT.dxf" \
            "$V178_RELEASE_DIR/V178_UI_ORIENTED_TEST.dxf" > "$V178_RELEASE_DIR/SHA256SUMS.txt"
          cat "$V178_RELEASE_DIR/SHA256SUMS.txt"

      - name: Upload signed V178 APK, source patch and CAD test outputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.178-FREE-ORIENTATION-SAVE-FIX
          path: |
            ${{ runner.temp }}/v178-release/SurveyQuant_v1.0.178_FREE_ANDROID_ORIENTATION_SAVE_FIX.apk
            ${{ runner.temp }}/v178-release/SurveyQuant_v1.0.178_FREE_SOURCE_PATCH.zip
            ${{ runner.temp }}/v178-release/README_V178_AR.md
            ${{ runner.temp }}/v178-release/V178_TEST_REPORT_AR.txt
            ${{ runner.temp }}/v178-release/SHA256SUMS.txt
            ${{ runner.temp }}/v178-release/V178_ORIENTATION_BOARD_FILE_TEST.dxf
            ${{ runner.temp }}/v178-release/V178_UI_ORIENTED_TEST.dxf
          if-no-files-found: error
          retention-days: 30
