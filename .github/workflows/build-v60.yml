name: Build SurveyQuant v1.0.60

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source
        run: |
          set -e

          ZIP="SurveyQuantAndroid_v1.0.60_REPAIRED_SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found"
            ls -la
            exit 1
          fi

          rm -rf source
          mkdir -p source

          unzip -q "$ZIP" -d source

          echo "===== EXTRACTED FILES ====="
          find source -maxdepth 8 -type f | sort
          echo "==========================="

      - name: Find Android project
