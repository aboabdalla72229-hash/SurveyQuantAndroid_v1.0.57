name: Build SurveyQuant v1.0.179 Two-Board Reset, PDF Walls and Save Names

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful original V162 Android WebView and DWG runtime build run ID
        required: true
        type: string
        default: "40919113310"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v179-two-board-reset-pdf-wall-save-name.yml"
      - "SurveyQuant_v1.0.179_FIX_KIT.zip"

permissions:
  actions: read
  contents: read

concurrency:
  group: surveyquant-v179-two-board-reset-pdf-wall-save-name
  cancel-in-progress: false

jobs:
  build_v179:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || '40919113310' }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract and validate the V179 repair kit
        shell: bash
        run: |
          set -euo pipefail
          KIT_ZIP="$GITHUB_WORKSPACE/SurveyQuant_v1.0.179_FIX_KIT.zip"
          test -s "$KIT_ZIP" || { echo "ERROR: Upload SurveyQuant_v1.0.179_FIX_KIT.zip to repository root"; exit 1; }
          KIT="$RUNNER_TEMP/sq179-kit"
          rm -rf "$KIT" && mkdir -p "$KIT"
          unzip -q "$KIT_ZIP" -d "$KIT"
          for f in \
            SurveyQuant_v1.0.179_PATCH.py \
            SurveyQuant_v1.0.179_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.179_MAKE_PDF_TEST.py \
            SurveyQuant_v1.0.179_PDF_ARCH_TEST.js \
            SurveyQuant_v1.0.179_ORIENTATION_UI_TEST.py \
            SurveyQuant_v1.0.179_PDF_UI_TEST.py \
            README_V179_AR.md \
            V179_TEST_REPORT_AR.txt; do
            test -s "$KIT/$f" || { echo "ERROR: Missing kit file $f"; exit 1; }
          done
          echo "SQ179_KIT=$KIT" >> "$GITHUB_ENV"

      - name: Extract the existing V178 baseline repair kit
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_ZIP="$GITHUB_WORKSPACE/SurveyQuant_v1.0.178_FIX_KIT.zip"
          test -s "$BASELINE_ZIP" || { echo "ERROR: Existing V178 baseline kit is missing from repository root"; exit 1; }
          BASELINE_KIT="$RUNNER_TEMP/sq178-kit"
          rm -rf "$BASELINE_KIT" && mkdir -p "$BASELINE_KIT"
          unzip -q "$BASELINE_ZIP" -d "$BASELINE_KIT"
          for f in \
            SurveyQuant_v1.0.176_PATCH.py \
            SurveyQuant_v1.0.176_CAD_ENGINE.js \
            SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.177_CAD_ENGINE.js \
            SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            SurveyQuant_v1.0.177_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.177_IMAGETRACER.js \
            SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V177_VECTOR_TEST.pdf \
            SurveyQuant_v1.0.178_PATCH.py \
            SurveyQuant_v1.0.178_CAD_ENGINE.js \
            SurveyQuant_v1.0.178_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.178_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_BOARD_FILE_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_SAVE_UI_TEST.py; do
            test -s "$BASELINE_KIT/$f" || { echo "ERROR: V178 baseline kit missing $f"; exit 1; }
          done
          echo "SQ178_KIT=$BASELINE_KIT" >> "$GITHUB_ENV"

      - name: Download the exact V162 base APK and source patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/v162-base"
          SOURCE_DIR="$RUNNER_TEMP/v179-source"
          RELEASE_DIR="$RUNNER_TEMP/v179-release"
          rm -rf "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$BASE_DIR" "$SOURCE_DIR" "$RELEASE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "SurveyQuant-v1.0.162-FREE-DWG-WASM-PROJECTION-FIX" --dir "$BASE_DIR"
          BASE_APK="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_ANDROID_WEBVIEW_WASM_FIX.apk' -print -quit)"
          BASE_PATCH="$(find "$BASE_DIR" -type f -name 'SurveyQuant_v1.0.162_FREE_SOURCE_PATCH.zip' -print -quit)"
          test -s "$BASE_APK" || { echo "ERROR: V162 APK missing in run $SOURCE_RUN_ID"; exit 1; }
          test -s "$BASE_PATCH" || { echo "ERROR: V162 source patch missing in run $SOURCE_RUN_ID"; exit 1; }
          unzip -t "$BASE_PATCH" | tail -2
          unzip -q "$BASE_PATCH" -d "$SOURCE_DIR"
          test -s "$SOURCE_DIR/index.html"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.js"
          test -s "$SOURCE_DIR/libredwg-writer/wasm/libredwg-web.wasm"
          echo "V179_BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "V179_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "V179_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ezdxf==1.4.4 playwright reportlab==4.4.9
          python3 -m playwright install --with-deps chromium

      - name: Apply the V176 native PDF and CAD baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ178_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ178_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ178_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt"
          python3 "$SQ178_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.176_CAD_ENGINE.js" \
            --pdfjs "$SQ178_KIT/pdfjs-v3.11.174.min.js" \
            --pdf-worker "$SQ178_KIT/pdfjs-worker-v3.11.174.min.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.176_DROP_FILES_MERGE.js.txt" --check-only

      - name: Apply the V177 byte snapshot, parser and preservation baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ178_KIT/SurveyQuant_v1.0.177_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.177_CAD_ENGINE.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt"
          python3 "$SQ178_KIT/SurveyQuant_v1.0.177_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.177_CAD_ENGINE.js" \
            --drop-files-merge "$SQ178_KIT/SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt" --check-only
          for f in \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.177_CAD_ENGINE.js \
            SurveyQuant_v1.0.177_DROP_FILES_MERGE.js.txt \
            SurveyQuant_v1.0.177_POINT_PARSER_TEST.js \
            SurveyQuant_v1.0.177_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            SurveyQuant_v1.0.177_APP_PROJECT_TEST.js \
            SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            SurveyQuant_v1.0.177_IMAGETRACER.js \
            SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            pdfjs-v3.11.174.min.js \
            pdfjs-worker-v3.11.174.min.js \
            V177_VECTOR_TEST.pdf; do
            cp "$SQ178_KIT/$f" "$V179_SOURCE_DIR/"
          done

      - name: Apply the V178 orientation provenance and Android save baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ178_KIT/SurveyQuant_v1.0.178_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.178_CAD_ENGINE.js"
          python3 "$SQ178_KIT/SurveyQuant_v1.0.178_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$SQ178_KIT/SurveyQuant_v1.0.178_CAD_ENGINE.js" --check-only
          for f in \
            SurveyQuant_v1.0.178_PATCH.py \
            SurveyQuant_v1.0.178_CAD_ENGINE.js \
            README_V178_AR.md \
            SurveyQuant_v1.0.178_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.178_CAD_ENGINE_TEST.js \
            SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_BOARD_FILE_TEST.js \
            SurveyQuant_v1.0.178_ORIENTATION_SAVE_UI_TEST.py; do
            cp "$SQ178_KIT/$f" "$V179_SOURCE_DIR/"
          done

      - name: Apply V179 two-board reset, PDF stroke and named output fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SQ179_KIT/SurveyQuant_v1.0.179_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$V179_SOURCE_DIR/SurveyQuant_v1.0.178_CAD_ENGINE.js"
          python3 "$SQ179_KIT/SurveyQuant_v1.0.179_PATCH.py" \
            --html "$V179_SOURCE_DIR/index.html" \
            --engine "$V179_SOURCE_DIR/SurveyQuant_v1.0.178_CAD_ENGINE.js" --check-only
          cp "$SQ179_KIT/SurveyQuant_v1.0.179_PATCH.py" "$V179_SOURCE_DIR/"
          cp "$SQ179_KIT/SurveyQuant_v1.0.179_PACKAGE_FREE_APK.py" "$V179_SOURCE_DIR/"
          cp "$SQ179_KIT/README_V179_AR.md" "$V179_SOURCE_DIR/"
          cp "$SQ179_KIT/V179_TEST_REPORT_AR.txt" "$V179_SOURCE_DIR/"
          cp "$SQ179_KIT/SurveyQuant_v1.0.179_MAKE_PDF_TEST.py" "$V179_SOURCE_DIR/"
          cp "$SQ179_KIT/SurveyQuant_v1.0.179_PDF_ARCH_TEST.js" "$V179_SOURCE_DIR/"
          cp "$SQ179_KIT/SurveyQuant_v1.0.179_ORIENTATION_UI_TEST.py" "$V179_SOURCE_DIR/"
          cp "$SQ179_KIT/SurveyQuant_v1.0.179_PDF_UI_TEST.py" "$V179_SOURCE_DIR/"

      - name: Run point, DWG, CAD merge, orientation and PDF regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$V179_SOURCE_DIR"
          python3 -m py_compile \
            "$SQ178_KIT/SurveyQuant_v1.0.176_PATCH.py" \
            SurveyQuant_v1.0.177_PATCH.py \
            SurveyQuant_v1.0.178_PATCH.py \
            SurveyQuant_v1.0.179_PATCH.py \
            SurveyQuant_v1.0.179_PACKAGE_FREE_APK.py \
            SurveyQuant_v1.0.179_MAKE_PDF_TEST.py \
            SurveyQuant_v1.0.179_ORIENTATION_UI_TEST.py \
            SurveyQuant_v1.0.179_PDF_UI_TEST.py
          node --check SurveyQuant_v1.0.178_CAD_ENGINE.js
          node --check SurveyQuant_v1.0.179_PDF_ARCH_TEST.js
          node --check SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js
          node --check SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js
          node --check libredwg-writer/wasm/libredwg-web.js
          node SurveyQuant_v1.0.177_POINT_PARSER_TEST.js index.html
          node SurveyQuant_v1.0.178_ANDROID_FILE_BYTES_TEST.js index.html
          python3 - "$RUNNER_TEMP" <<'PYFIXTURES'
          import ezdxf,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          for name,block,layer,offset in [('target','TARGET_SYMBOL','TARGET_LAYER',0),('source','SOURCE_SYMBOL','SOURCE_LAYER',100)]:
              doc=ezdxf.new('R12');msp=doc.modelspace();doc.layers.new(layer)
              blk=doc.blocks.new(block,base_point=(0,0));blk.add_line((0,0),(5,5),dxfattribs={'layer':layer})
              blk.add_text(block,height=1,dxfattribs={'layer':layer}).set_placement((0,2))
              msp.add_blockref(block,(offset,offset),dxfattribs={'layer':layer})
              msp.add_polyline2d([(offset,offset),(offset+10,offset)],dxfattribs={'layer':layer})
              msp.add_text(name.upper(),height=2,dxfattribs={'layer':layer}).set_placement((offset,offset+5))
              doc.saveas(root/f'v179_{name}_blocks.dxf')
          PYFIXTURES
          node SurveyQuant_v1.0.177_BLOCK_PRESERVATION_TEST.js \
            "$RUNNER_TEMP/v179_target_blocks.dxf" "$RUNNER_TEMP/v179_source_blocks.dxf" \
            "$V179_RELEASE_DIR/V179_MERGED_BLOCKS_TEST.dxf"
          node SurveyQuant_v1.0.178_CAD_ENGINE_TEST.js \
            "$V179_RELEASE_DIR/V179_MERGED_BOARDS_TEST.dxf" \
            "$V179_RELEASE_DIR/V179_ORIENTED_BOARD_TEST.dxf"
          node SurveyQuant_v1.0.178_ORIENTATION_BOARD_FILE_TEST.js \
            "$V179_RELEASE_DIR/V179_ORIENTATION_BOARD_FILE_TEST.dxf"
          node SurveyQuant_v1.0.177_PDF_VECTOR_DXF_TEST.js \
            pdfjs-v3.11.174.min.js pdfjs-worker-v3.11.174.min.js V177_VECTOR_TEST.pdf \
            "$V179_RELEASE_DIR/V177_PDF_VECTOR_TEST_OUT.dxf"
          node SurveyQuant_v1.0.177_APP_PROJECT_TEST.js index.html
          node SurveyQuant_v1.0.162_DWG_WASM_SMOKE_TEST.js \
            libredwg-writer/wasm/libredwg-web.js libredwg-writer/wasm/libredwg-web.wasm
          python3 SurveyQuant_v1.0.178_ORIENTATION_SAVE_UI_TEST.py \
            --engine SurveyQuant_v1.0.178_CAD_ENGINE.js \
            --output "$V179_RELEASE_DIR/V178_UI_ORIENTED_TEST.dxf"
          python3 SurveyQuant_v1.0.179_MAKE_PDF_TEST.py
          node SurveyQuant_v1.0.179_PDF_ARCH_TEST.js \
            pdfjs-v3.11.174.min.js pdfjs-worker-v3.11.174.min.js \
            V179_ARCHITECTURAL_TEST.pdf "$V179_RELEASE_DIR/V179_ARCHITECTURAL_TEST.dxf"
          python3 SurveyQuant_v1.0.179_ORIENTATION_UI_TEST.py \
            --engine SurveyQuant_v1.0.178_CAD_ENGINE.js \
            --output "$V179_RELEASE_DIR/V179_UI_ORIENTED_TEST.dxf"
          python3 SurveyQuant_v1.0.179_PDF_UI_TEST.py \
            --engine SurveyQuant_v1.0.178_CAD_ENGINE.js \
            --pdfjs pdfjs-v3.11.174.min.js \
            --worker pdfjs-worker-v3.11.174.min.js \
            --pdf V179_ARCHITECTURAL_TEST.pdf \
            --output "$V179_RELEASE_DIR/V179_PDF_UI_OUTPUT.dxf"
          python3 - "$V179_RELEASE_DIR" <<'PYAUDIT'
          import ezdxf,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          specs={
            'V179_MERGED_BOARDS_TEST.dxf':(2,0),
            'V179_MERGED_BLOCKS_TEST.dxf':(2,2),
            'V179_ORIENTED_BOARD_TEST.dxf':(1,0),
            'V179_ORIENTATION_BOARD_FILE_TEST.dxf':(1,0),
            'V177_PDF_VECTOR_TEST_OUT.dxf':(1,1),
            'V178_UI_ORIENTED_TEST.dxf':(1,0),
            'V179_ARCHITECTURAL_TEST.dxf':(5,2),
            'V179_UI_ORIENTED_TEST.dxf':(1,0),
            'V179_PDF_UI_OUTPUT.dxf':(5,2),
          }
          for filename,(min_poly,min_text) in specs.items():
              path=root/filename
              if not path.is_file() or path.stat().st_size<100:raise SystemExit(f'Missing/empty {filename}')
              doc=ezdxf.readfile(path);msp=doc.modelspace()
              if len(msp.query('POLYLINE'))<min_poly or len(msp.query('TEXT'))<min_text:raise SystemExit(f'{filename}: entity count mismatch')
              if len(msp.query('IMAGE'))+len(msp.query('IMAGEDEF')):raise SystemExit(f'{filename}: raster IMAGE detected')
              if filename=='V179_UI_ORIENTED_TEST.dxf':
                  pts=[(round(v.dxf.location.x,6),round(v.dxf.location.y,6)) for pl in msp.query('POLYLINE') for v in pl.vertices]
                  expected=[(2000.0,3000.0),(2000.0,3020.0),(1980.0,3020.0),(1980.0,3000.0)]
                  if pts!=expected:raise SystemExit(f'V179 orientation coordinates mismatch: {pts}')
              if filename in ('V179_ARCHITECTURAL_TEST.dxf','V179_PDF_UI_OUTPUT.dxf'):
                  for layer in ('SQ_PDF_007','SQ_PDF_TEXT'):
                      if layer not in doc.layers or doc.layers.get(layer).dxf.color!=7:raise SystemExit(f'{filename}: missing ACI 7 layer {layer}')
              audit=doc.audit()
              if audit.errors or audit.fixes:raise SystemExit(f'{filename}: audit errors={len(audit.errors)} fixes={len(audit.fixes)}')
              roundtrip=root/(path.stem+'_ROUNDTRIP.dxf');doc.saveas(roundtrip)
              again=ezdxf.readfile(roundtrip).audit()
              if again.errors or again.fixes:raise SystemExit(f'{filename}: roundtrip audit failed')
              print(f'PASS {filename}: POLYLINE={len(msp.query("POLYLINE"))}, TEXT={len(msp.query("TEXT"))}, audit=0, roundtrip=0')
          PYAUDIT

      - name: Package unsigned V179 APK from original V162 base
        shell: bash
        run: |
          set -euo pipefail
          python3 "$V179_SOURCE_DIR/SurveyQuant_v1.0.179_PACKAGE_FREE_APK.py" \
            --apk-input "$V179_BASE_APK" \
            --apk-output "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_UNSIGNED.apk" \
            --html-to-inject "$V179_SOURCE_DIR/index.html"
          test -s "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_UNSIGNED.apk"
          unzip -t "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_UNSIGNED.apk" | tail -2

      - name: Sign and verify V179 APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SURVEYQUANT_KEYSTORE_BASE64" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "ERROR: missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "ERROR: missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;35.0.0" >/dev/null
          STORE="$RUNNER_TEMP/surveyquant-release.jks"
          ALIGNED="$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_ALIGNED.apk"
          FINAL="$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_ANDROID_ORIENTATION_PDF_FIX.apk"
          printf '%s' "$SURVEYQUANT_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -p 4 "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_UNSIGNED.apk" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$STORE" --ks-key-alias "$SURVEYQUANT_KEY_ALIAS" --ks-pass env:SURVEYQUANT_KEYSTORE_PASSWORD --key-pass env:SURVEYQUANT_KEY_PASSWORD --out "$FINAL" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$FINAL"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$FINAL" | grep -E "package: name=.*versionCode='179'.*versionName='1.0.179'"
          unzip -t "$FINAL" | tail -2
          rm -f "$ALIGNED" "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_UNSIGNED.apk"

      - name: Write V179 report, source patch and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "$V179_SOURCE_DIR/README_V179_AR.md" "$V179_RELEASE_DIR/README_V179_AR.md"
          cp "$V179_SOURCE_DIR/V179_TEST_REPORT_AR.txt" "$V179_RELEASE_DIR/V179_TEST_REPORT_AR.txt"
          rm -rf "$V179_SOURCE_DIR/__pycache__"
          (cd "$V179_SOURCE_DIR" && zip -qr "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_SOURCE_PATCH.zip" .)
          unzip -t "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_SOURCE_PATCH.zip" | tail -2
          sha256sum \
            "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_ANDROID_ORIENTATION_PDF_FIX.apk" \
            "$V179_RELEASE_DIR/SurveyQuant_v1.0.179_FREE_SOURCE_PATCH.zip" \
            "$V179_RELEASE_DIR/V179_MERGED_BOARDS_TEST.dxf" \
            "$V179_RELEASE_DIR/V179_MERGED_BLOCKS_TEST.dxf" \
            "$V179_RELEASE_DIR/V179_ORIENTED_BOARD_TEST.dxf" \
            "$V179_RELEASE_DIR/V179_ORIENTATION_BOARD_FILE_TEST.dxf" \
            "$V179_RELEASE_DIR/V179_ARCHITECTURAL_TEST.dxf" \
