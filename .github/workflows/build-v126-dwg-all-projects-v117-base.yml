name: Build SurveyQuant v1.0.126 - All CAD Projects Accept DWG (V117 Orientation Preserved)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v126-dwg-all-projects-v117-base.yml"
      - "SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.zip"
      - "SurveyQuant_v1.0.115_ORIENTATION_FINAL_PATCH_PACKAGE.zip"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}
      SURVEYQUANT_KEYSTORE_BASE64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Checkout pinned LibreDWG-Web source
        uses: actions/checkout@v4
        with:
          repository: mlightcad/libredwg-web
          ref: v0.7.14
          path: external/libredwg-web
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install runner dependencies and unpack the V126 fix kit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-yaml unzip zip
          ARCHIVE="SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.zip"
          test -s "$ARCHIVE" || { echo "ERROR: V126 fix ZIP is missing from the repository root."; exit 1; }
          unzip -t "$ARCHIVE"
          KIT_DIR="$RUNNER_TEMP/sq-v126-kit"
          rm -rf "$KIT_DIR"
          mkdir -p "$KIT_DIR"
          unzip -q "$ARCHIVE" -d "$KIT_DIR"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_APPLY_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_IMPORT_BRIDGE.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py"
          test -s "$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js"
          echo "V126_KIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          echo "V117_PATCHER=$KIT_DIR/SurveyQuant_v1.0.117_APPLY_PATCH.py" >> "$GITHUB_ENV"
          echo "V117_BRIDGE=$KIT_DIR/SurveyQuant_v1.0.117_DWG_IMPORT_BRIDGE.js" >> "$GITHUB_ENV"
          echo "V117_TEST=$KIT_DIR/SurveyQuant_v1.0.117_DWG_TEXT_SCALE_TEST.js" >> "$GITHUB_ENV"
          echo "V126_PATCHER=$KIT_DIR/SurveyQuant_v1.0.126_DWG_IMPORT_PATCH.py" >> "$GITHUB_ENV"
          echo "V126_TEST=$KIT_DIR/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_TEST.js" >> "$GITHUB_ENV"

      - name: Run the historical V116 CAD builder with V117 orientation behavior and V126 all-project DWG import fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"
          python3 "$V126_KIT_DIR/SurveyQuant_v1.0.126_RUN_RECIPE.py"

      - name: Upload V126 APK with V117 orientation behavior, source patch and CAD diagnostics
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SurveyQuant-v1.0.126-DWG-ALL-PROJECTS-V117-BASE-FIX
          path: |
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_FIX.apk
            ${{ runner.temp }}/sq-release/SurveyQuant_v1.0.126_DWG_ALL_PROJECTS_V117_BASE_SOURCE_PATCH.zip
            ${{ runner.temp }}/sq-release/SHA256SUMS.txt
            ${{ runner.temp }}/sq-release/STORM_CONVERTED_DXF.zip
            ${{ runner.temp }}/sq-release/source-patch/STORM_CONVERSION_REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload STORM diagnostics if a real-file validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.126-STORM-DIAGNOSTICS-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/STORM_CONVERSION_REPORT.md
            ${{ runner.temp }}/sq-storm-output/**
          if-no-files-found: warn
          retention-days: 14
