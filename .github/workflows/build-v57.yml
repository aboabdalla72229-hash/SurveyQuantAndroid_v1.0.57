name: Build SurveyQuant v1.0.57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check source ZIP
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          if [ ! -s "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP is empty."
            exit 1
          fi

          echo "Source ZIP found:"
          echo "$SOURCE_ZIP"


      - name: Extract source
        shell: bash
        run: |
          SOURCE_ZIP="SurveyQuantAndroid_v1.0.57_NEW_BASELINE.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Source extracted successfully."

          echo "=== EXTRACTED FILES ==="
          find extracted -maxdepth 4 -type f | head -200


      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."

            echo "Available Gradle files:"
            find extracted -type f \
              \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt


      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "Building from:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "=== PROJECT FILES ==="
          ls -la

          echo "=== GENERATE GRADLE WRAPPER ==="
          gradle wrapper --gradle-version 8.6

          chmod +x gradlew

          echo "=== GRADLE VERSION ==="
          ./gradlew --version

          echo "=== BUILD APK ==="
          ./gradlew clean assembleDebug --stacktrace


      - name: Collect APK
        shell: bash
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          rm -rf release
          mkdir -p release

          echo "Searching for APK files..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} release/ \;

          echo "Searching for AAB files..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.aab" \
            -exec cp {} release/ \;

          echo "=== GENERATED FILES ==="

          find release -type f -ls

          if [ -z "$(find release -type f -print -quit)" ]; then
            echo "ERROR: No APK or AAB was generated."
            exit 1
          fi


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.57
          path: release/*
          if-no-files-found: error
