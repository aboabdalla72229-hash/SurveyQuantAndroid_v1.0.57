name: Build SurveyQuant v1.0.62

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 3 -type f \
            -name 'SurveyQuantAndroid_v1.0.62_XY_ALL_FORMATS_COMPARE_NAMING_FIX.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP not found in repository."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          WRAPPER="$(find source -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew not found in extracted source."
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi

          chmod +x "$WRAPPER"
          echo "GRADLEW=$WRAPPER" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          "$GITHUB_WORKSPACE/$GRADLEW" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.62-debug
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
