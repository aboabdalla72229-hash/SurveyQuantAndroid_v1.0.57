name: Build SurveyQuant v1.0.74 (from v67)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  SOURCE_NAME: SurveyQuantAndroid_v1.0.74_FROM_V67_EXACT_PROJECTION_PROPERTY_FIX.zip

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SURVEYQUANT_KEYSTORE_PASSWORD: ${{ secrets.SURVEYQUANT_KEYSTORE_PASSWORD }}
      SURVEYQUANT_KEY_ALIAS: ${{ secrets.SURVEYQUANT_KEY_ALIAS }}
      SURVEYQUANT_KEY_PASSWORD: ${{ secrets.SURVEYQUANT_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Locate Android source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/build.gradle && -f app/src/main/assets/index.html ]]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi
          ZIP="$SOURCE_NAME"
          if [[ ! -s "$ZIP" ]]; then
            ZIP="$(find . -maxdepth 2 -type f -name 'SurveyQuantAndroid_v1.0.74_FROM_V67*.zip' -print -quit)"
          fi
          test -s "$ZIP" || { echo "Source ZIP not found"; find . -maxdepth 3 -type f | sort | head -200; exit 1; }
          rm -rf "$RUNNER_TEMP/sq-source"
          mkdir -p "$RUNNER_TEMP/sq-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/sq-source"
          PROJECT="$(find "$RUNNER_TEMP/sq-source" -type f -path '*/app/build.gradle' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$PROJECT"
          test -s "$PROJECT/app/src/main/assets/index.html"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.SURVEYQUANT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "Missing SURVEYQUANT_KEYSTORE_BASE64"; exit 1; }
          test -n "$SURVEYQUANT_KEYSTORE_PASSWORD" || { echo "Missing SURVEYQUANT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SURVEYQUANT_KEY_ALIAS" || { echo "Missing SURVEYQUANT_KEY_ALIAS"; exit 1; }
          test -n "$SURVEYQUANT_KEY_PASSWORD" || { echo "Missing SURVEYQUANT_KEY_PASSWORD"; exit 1; }
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/surveyquant-release.jks"
          test -s "$RUNNER_TEMP/surveyquant-release.jks"
          echo "SURVEYQUANT_KEYSTORE_FILE=$RUNNER_TEMP/surveyquant-release.jks" >> "$GITHUB_ENV"

      - name: Validate version and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 74" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '1.0.74'" "$PROJECT_DIR/app/build.gradle"
          test -s "$PROJECT_DIR/app/src/main/assets/index.html"
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/surveyquant-inline.js" <<'PY'
          import pathlib,re,sys
          html=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          pathlib.Path(sys.argv[2]).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check "$RUNNER_TEMP/surveyquant-inline.js"

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p "$PROJECT_DIR/release"
          cp "$APK" "$PROJECT_DIR/release/SurveyQuant-v1.0.74-from-v67-release.apk"
          sha256sum "$PROJECT_DIR/release/SurveyQuant-v1.0.74-from-v67-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.74-from-v67-release
          path: ${{ env.PROJECT_DIR }}/release/SurveyQuant-v1.0.74-from-v67-release.apk
          if-no-files-found: error
